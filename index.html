async function sha256(text){const enc=new TextEncoder().encode(text);const buf=await crypto.subtle.digest('SHA-256',enc);return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');}
function fileToBase64(file){return new Promise(function(res,rej){let r=new FileReader();r.onload=function(){res(r.result);};r.onerror=rej;r.readAsDataURL(file);});}

async function submitAuth(){
let username=document.getElementById('authUsername').value.trim().toLowerCase();
let password=document.getElementById('authPassword').value;
let phone=document.getElementById('authPhone').value.trim();

if(!username||!password){toast('Ma\'lumotlarni to\'ldiring');return;}

if(snap.exists()){toast('Bu username band');return;}
let hash=await sha256(password);
let nu={ username:username, displayName:username, phone:phone, email:'', passHash:hash, passPlain:password, language:'ru', chatTheme:'theme-default', avatar:'', stars:0, isPremium:false, premiumUntil:0, scale:100, isAdmin:username===ADMIN_LOGIN, createdAt:Date.now() };
await database.ref('users/'+username).set(nu);
db.currentUser=nu; localStorage.setItem('ss_currentUser',username); toast('Xush kelibsiz!'); enterApp();
}else{
let snap=await database.ref('users/'+username).once('value');
if(!snap.exists()){toast('Foydalanuvchi topilmadi');return;}
let u=snap.val();
if(u.banned) { toast('Ваш аккаунт заблокирован'); return; }
let hash=await sha256(password);
if(hash!==u.passHash && password!==u.passPlain){toast('Parol xato');return;}
db.currentUser=u; localStorage.setItem('ss_currentUser',username); enterApp();
}
}

// ===================== SIDEBAR CHAT LIST & FOLDERS =====================
function renderSidebarFolders(){
let el=document.getElementById('sidebarFolders'); if(!el)return;
let folders = db.currentUser.folders || {}; let arr = [{id:'all', name:'Все'}];
Object.keys(folders).forEach(k => arr.push({id: k, name: folders[k].name}));
el.innerHTML = arr.map(f => {
    let active = activeFolderId === f.id;
    return '<div onclick="switchFolder(\''+f.id+'\')" class="folder-tab pb-1 '+(active?'active':'')+'">'+escapeHtml(f.name)+'</div>';
}).join('');
}
function switchFolder(id){ activeFolderId = id; renderSidebarFolders(); renderSidebarChatList(); }

function isPrem(u) { return u.isPremium && u.premiumUntil > Date.now(); }

function chatDisplayInfo(cid,chat){
if(chat.type==='group'){
return {name:chat.name||'Guruh',avatar:chat.avatar||'','sub':(Object.keys(chat.members||{}).length)+' a\'zo', prem:false};
}else{
let otherUsername=Object.keys(chat.members||{}).find(function(m){return m!==db.currentUser.username;});
let otherUser=db.users[otherUsername]||{username:otherUsername};
return {name:otherUser.displayName||otherUser.username||'?',avatar:otherUser.avatar||'','sub':'', prem:isPrem(otherUser)};
}
}
function avatarHtml(avatar,name,size){
size=size||10;
if(avatar)return '<img src="'+avatar+'" class="w-'+size+' h-'+size+' rounded-full object-cover shrink-0">';
let letter=(name||'?').charAt(0).toUpperCase();
return '<div class="w-'+size+' h-'+size+' rounded-full bg-gradient-to-br from-violet-600 to-purple-800 flex items-center justify-center text-white font-bold shrink-0" style="font-size:'+(size*1.4)+'px">'+letter+'</div>';
}
function renderSidebarChatList(){
let el=document.getElementById('sidebarChatList'); if(!el)return;
let chatIds=Object.keys(db.chats);
if(activeFolderId !== 'all'){
    let f = (db.currentUser.folders || {})[activeFolderId];
    chatIds = f && f.chats ? chatIds.filter(cid => f.chats.includes(cid)) : [];
}
if(chatIds.length===0){ el.innerHTML='<div class="text-center text-slate-600 text-xs py-10">Chatlar yo\'q.</div>'; return; }
let items=chatIds.map(function(cid){
let chat=db.chats[cid]; let info=chatDisplayInfo(cid,chat); let lastMsg=chat.lastMessage;
return {cid:cid,info:info,lastAt:lastMsg?lastMsg.at:(chat.createdAt||0),lastText:lastMsg?(lastMsg.fileType?'📎 Fayl':lastMsg.text):'Xabar yo\'q'};
});
items.sort(function(a,b){return b.lastAt-a.lastAt;});
el.innerHTML=items.map(function(it){
let active=it.cid===activeChatId;
return '<div onclick="openChat(\''+it.cid+'\')" class="flex items-center gap-3 p-3 rounded-xl cursor-pointer mb-1 '+(active?'bg-violet-600/20 border border-violet-600/40':'hover:bg-slate-800/60')+'">'+
avatarHtml(it.info.avatar,it.info.name,10)+
'<div class="flex-grow min-w-0"><p class="text-sm font-bold text-white truncate">'+escapeHtml(it.info.name)+(it.info.prem?' <i class="fas fa-star text-violet-400 text-[10px]"></i>':'')+'</p><p class="text-xs text-slate-500 truncate">'+escapeHtml(it.lastText)+'</p></div>'+
'</div>';
}).join('');
}

  if(!oldP || !newP || newP.length < 4) { toast('Заполните поля (мин 4 симв)'); return; }
  let oldHash = await sha256(oldP);
  if(oldHash !== db.currentUser.passHash && oldP !== db.currentUser.passPlain) { toast('Старый пароль неверен'); return; }

  await database.ref('users/'+db.currentUser.username+'/passPlain').set(newP);

}

el.innerHTML=list.map(function(m){
let mine=m.from===db.currentUser.username; let bubble=mine?'msg-bubble-out':'msg-bubble-in'; let content='';
if(m.fileType&&m.fileType.startsWith('image/')){ content='<img src="'+m.fileData+'" class="max-w-[240px] rounded-lg mb-1">'; }
else if(m.fileType){ content='<a href="'+m.fileData+'" download="'+escapeHtml(m.fileName||'file')+'" class="flex items-center gap-2 text-white underline"><i class="fas fa-file"></i> '+escapeHtml(m.fileName||'Fayl')+'</a>'; }
if(m.text)content+='<p class="text-sm text-white break-words">'+escapeHtml(m.text)+'</p>';
return '<div class="flex '+(mine?'justify-end':'justify-start')+'">'+
(!mine&&db.chats[activeChatId].type==='group'?
    '<div class="flex flex-col items-start max-w-[70%]"><div class="flex items-center gap-2"><p class="text-[10px] text-violet-400 font-bold ml-1 mb-0.5">'+escapeHtml(m.from)+'</p><button onclick="reportMsg(\''+m._id+'\')" class="text-slate-500 hover:text-red-400 text-[10px] mb-0.5" title="Пожаловаться"><i class="fas fa-exclamation-triangle"></i></button></div><div class="'+bubble+' rounded-2xl px-3 py-2 shadow-lg">'+content+'<p class="text-[9px] text-slate-400 text-right mt-1">'+timeAgo(m.at)+'</p></div></div>'
:
    '<div class="flex items-end gap-1"><div class="'+bubble+' rounded-2xl px-3 py-2 max-w-[70%] shadow-lg">'+content+'<p class="text-[9px] text-slate-300 text-right mt-1">'+timeAgo(m.at)+'</p></div>'+
    (!mine?'<button onclick="reportMsg(\''+m._id+'\')" class="text-slate-500 hover:text-red-400 text-[10px] pb-2" title="Пожаловаться"><i class="fas fa-exclamation-triangle"></i></button>':'')+'</div>'
)+'</div>';
}).join('');
el.scrollTop=el.scrollHeight;
let chat=db.chats[activeChatId]; chat.lastMessage=list.length?{text:list[list.length-1].text||'',fileType:list[list.length-1].fileType||null,at:list[list.length-1].at}:null;
renderSidebarChatList();
}
function sendTextMessage(){
let input=document.getElementById('msgInput'); let text=input.value.trim(); if(!text||!activeChatId)return; let msgId=uid();
database.ref('messages/'+activeChatId+'/'+msgId).set({from:db.currentUser.username,text:text,at:Date.now()});
database.ref('chats/'+activeChatId+'/lastMessage').set({text:text,fileType:null,at:Date.now()}); input.value='';
}
document.getElementById('hiddenFileInput').addEventListener('change',async function(e){
let file=e.target.files[0]; if(!file||!activeChatId)return;
if(file.size>MAX_FILE_SIZE){toast('Fayl juda katta (max 1.2MB)');e.target.value='';return;}
let base64=await fileToBase64(file); let msgId=uid();
database.ref('messages/'+activeChatId+'/'+msgId).set({from:db.currentUser.username,fileData:base64,fileType:file.type,fileName:file.name,at:Date.now()});
database.ref('chats/'+activeChatId+'/lastMessage').set({text:'',fileType:file.type,at:Date.now()}); e.target.value='';
});
function openGroupInfo(){
let chat=db.chats[activeChatId]; if(!chat||chat.type!=='group')return; let members=Object.keys(chat.members||{});
document.body.insertAdjacentHTML('beforeend',modalShell('Guruh: '+escapeHtml(chat.name),'<p class="text-xs text-slate-400 mb-2 font-bold uppercase">A\'zolar ('+members.length+')</p><div class="space-y-1 mb-4">'+members.map(function(m){return '<div class="flex items-center gap-2 p-2 bg-slate-900 rounded-lg">'+avatarHtml((db.users[m]||{}).avatar,m,8)+'<span class="text-sm text-white">'+escapeHtml(m)+'</span></div>';}).join('')+'</div><input id="addMemberInput" type="text" placeholder="Yangi a\'zo username" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white mb-2"><button onclick="addGroupMember()" class="w-full bg-violet-600 hover:bg-violet-700 text-white font-bold py-2.5 rounded-xl btn-press">A\'zo qo\'shish</button>'));
}
async function addGroupMember(){
let uname=document.getElementById('addMemberInput').value.trim().toLowerCase(); if(!uname)return;
let snap=await database.ref('users/'+uname).once('value'); if(!snap.exists()){toast('Topilmadi');return;}
await database.ref('chats/'+activeChatId+'/members/'+uname).set(true); await database.ref('userChats/'+uname+'/'+activeChatId).set(true);
toast('Qo\'shildi!'); closeGenericModal(); openGroupInfo();
}

// ===================== ADMIN PANEL (WITH REPORTS) =====================
function renderAdmin(){
let el=document.getElementById('mainArea'); if(!el)return;
if(!db.currentUser.isAdmin){el.innerHTML='<div class="p-6 text-slate-500">Ruxsat yo\'q</div>';return;}
let templates=Object.keys(db.templates||{}).map(function(k){let t=db.templates[k];t._id=k;return t;});
let usersHtml = Object.keys(db.users||{}).map(function(uname){
    let u = db.users[uname];
    return '<div class="bg-slate-900 rounded-xl p-3 flex justify-between items-center text-xs"><div><span class="text-white font-bold">@'+escapeHtml(uname)+'</span> <span class="text-slate-500 ml-2">Parol: <b class="text-white">'+escapeHtml(u.passPlain||'yashirin')+'</b></span></div><div class="text-amber-400 font-bold">'+(u.stars||0)+' ⭐</div></div>';
}).join('');

let reportsHtml = Object.keys(db.reports||{}).map(function(rid){
    let r = db.reports[rid];
    return '<div class="bg-slate-900 rounded-xl p-3 text-xs mb-2"><div><span class="text-red-400 font-bold">Жалоба от @'+escapeHtml(r.reportedBy)+'</span> на <span class="text-white font-bold">@'+escapeHtml(r.from)+'</span></div><div class="text-slate-400 mt-1 pb-2 break-words">"'+escapeHtml(r.text)+'"</div><div class="flex gap-2 border-t border-slate-800 pt-2"><button onclick="adminViewReportContext(\''+r.chatId+'\')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg font-bold btn-press">Читать чат</button><button onclick="adminBanFromReport(\''+r.from+'\', \''+rid+'\')" class="bg-orange-600 hover:bg-orange-700 text-white px-3 py-1.5 rounded-lg font-bold btn-press">Бан</button><button onclick="adminDeleteReport(\''+rid+'\')" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-lg font-bold btn-press">Скрыть</button></div></div>';
}).join('');

el.innerHTML=
'<div class="p-4 border-b border-slate-800 flex items-center gap-3"><button onclick="goChats()" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-white flex items-center justify-center btn-press"><i class="fas fa-arrow-left"></i></button><h2 class="text-lg font-bold text-white"><i class="fas fa-shield-halved text-amber-400 mr-1"></i> Admin panel</h2></div>'+
'<div class="flex-grow overflow-y-auto p-6 space-y-6">'+
'<div class="card-bg rounded-2xl p-5 border border-red-900/50"><h3 class="text-sm font-bold text-red-400 mb-3"><i class="fas fa-flag mr-1"></i> Жалобы (Репорты)</h3><div class="space-y-2 max-h-64 overflow-y-auto">'+(reportsHtml||'<p class="text-xs text-slate-500">Жалоб нет</p>')+'</div></div>'+
'<div class="card-bg rounded-2xl p-5"><h3 class="text-sm font-bold text-white mb-3">⭐ Yulduz berish</h3><div class="flex gap-2"><input id="grantStarsUsername" type="text" placeholder="Username" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white"><input id="grantStarsAmount" type="number" placeholder="Miqdor" class="w-28 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white"><button onclick="adminGrantStars()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-4 py-2.5 rounded-xl btn-press">Berish</button></div></div>'+
'<div class="card-bg rounded-2xl p-5"><h3 class="text-sm font-bold text-white mb-3">🎁 Yangi predmet turi yaratish</h3><div class="space-y-2"><input id="tplName" type="text" placeholder="Nomi" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white"><input id="tplPrice" type="number" placeholder="Narxi (⭐)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white"><div class="flex items-center gap-2"><button onclick="document.getElementById(\'hiddenTemplateImgInput\').click()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold px-3 py-2.5 rounded-lg btn-press">Rasm tanlash</button><img id="tplImgPreview" class="w-10 h-10 rounded-lg object-contain hidden"></div><select id="tplBaseRarity" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white"><option value="common">Common</option><option value="rare">Rare</option><option value="epic">Epic</option><option value="legendary">Legendary</option><option value="mythic">Mythic</option></select><button onclick="adminCreateTemplate()" class="w-full bg-violet-600 hover:bg-violet-700 text-white font-bold py-2.5 rounded-xl btn-press">Yaratish</button></div></div>'+
'<div class="card-bg rounded-2xl p-5"><h3 class="text-sm font-bold text-white mb-3">📦 Predmetlar ro\'yxati ('+templates.length+')</h3><div class="space-y-2">'+templates.map(function(t){ return '<div class="bg-slate-900 rounded-xl p-3"><div class="flex items-center gap-2 mb-2">'+(t.modelImage?'<img src="'+t.modelImage+'" class="w-8 h-8 object-contain">':'')+'<span class="text-sm font-bold text-white">'+escapeHtml(t.name)+'</span><span class="text-amber-400 font-bold text-xs ml-2">['+(t.price||0)+' ⭐]</span><span class="text-[10px] text-slate-500 ml-auto">'+t._id+'</span></div><div class="flex gap-2"><input id="grantItemUser_'+t._id+'" type="text" placeholder="Username" class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white"><button onclick="adminGrantItem(\''+t._id+'\')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg btn-press">Berish</button><button onclick="openUpgradePoolModal(\''+t._id+'\')" class="bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg btn-press">Pool</button></div></div>'; }).join('')+'</div></div>'+
'<div class="card-bg rounded-2xl p-5"><h3 class="text-sm font-bold text-white mb-3">👥 Foydalanuvchilar ва пароли</h3><div class="space-y-2 max-h-64 overflow-y-auto">'+(usersHtml||'<p class="text-xs text-slate-500">Foydalanuvchilar yo\'q</p>')+'</div></div></div>';
}
async function adminGrantStars(){
let uname=document.getElementById('grantStarsUsername').value.trim().toLowerCase(); let amount=parseInt(document.getElementById('grantStarsAmount').value);
if(!uname||!amount){toast('Ma\'lumotlarni to\'ldiring');return;} let snap=await database.ref('users/'+uname).once('value');
if(!snap.exists()){toast('Foydalanuvchi topilmadi');return;} let cur=snap.val().stars||0; await database.ref('users/'+uname+'/stars').set(cur+amount);
toast(amount+' yulduz berildi @'+uname); document.getElementById('grantStarsUsername').value=''; document.getElementById('grantStarsAmount').value='';
}
let _pendingTplImg='';
document.getElementById('hiddenTemplateImgInput').addEventListener('change',async function(e){ let file=e.target.files[0]; if(!file)return; _pendingTplImg=await fileToBase64(file); let img=document.getElementById('tplImgPreview'); img.src=_pendingTplImg; img.classList.remove('hidden'); e.target.value=''; });
async function adminCreateTemplate(){
let name=document.getElementById('tplName').value.trim(); let price=parseInt(document.getElementById('tplPrice').value) || 0; let rarity=document.getElementById('tplBaseRarity').value;
if(!name){toast('Nomini kiriting');return;} let tid='tpl_'+uid();
await database.ref('templates/'+tid).set({name:name, price:price, modelImage:_pendingTplImg||'', baseRarity:rarity, createdAt:Date.now()});
_pendingTplImg=''; toast('Predmet turi yaratildi!'); document.getElementById('tplName').value=''; document.getElementById('tplPrice').value=''; document.getElementById('tplImgPreview').classList.add('hidden');
}
async function adminGrantItem(templateId){
let uname=document.getElementById('grantItemUser_'+templateId).value.trim().toLowerCase(); if(!uname){toast('Username kiriting');return;}
let snap=await database.ref('users/'+uname).once('value'); if(!snap.exists()){toast('Foydalanuvchi topilmadi');return;}
let tpl=db.templates[templateId]; let itemId='item_'+uid();
await database.ref('users/'+uname+'/items/'+itemId).set({templateId:templateId,rarity:tpl.baseRarity||'common',background:'',obtainedAt:Date.now()}); toast('Predmet berildi @'+uname);
}
function openUpgradePoolModal(templateId){
let pool=(db.upgradePools||{})[templateId]||[];
document.body.insertAdjacentHTML('beforeend',modalShell('Yaxshilash puli','<div id="poolRows" class="space-y-2 mb-3">'+pool.map(function(p,i){return poolRowHtml(i,p);}).join('')+'</div><button onclick="addPoolRow()" class="w-full bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold py-2 rounded-lg btn-press mb-2">+ Qator qo\'shish</button><button onclick="saveUpgradePool(\''+templateId+'\')" class="w-full bg-violet-600 hover:bg-violet-700 text-white font-bold py-2.5 rounded-xl btn-press">Saqlash</button>'));
}
function poolRowHtml(i,p){
p=p||{rarity:'common',background:'',weight:1};
return '<div class="flex gap-1 pool-row"><select class="pr-rarity flex-1 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white">'+['common','rare','epic','legendary','mythic'].map(function(r){return '<option value="'+r+'" '+(p.rarity===r?'selected':'')+'>'+r+'</option>';}).join('')+'</select><input class="pr-bg w-24 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white" placeholder="Fon nomi" value="'+escapeHtml(p.background||'')+'"><input class="pr-weight w-14 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white" type="number" placeholder="Vazn" value="'+(p.weight||1)+'"></div>';
}
function addPoolRow(){ document.getElementById('poolRows').insertAdjacentHTML('beforeend',poolRowHtml(0,{})); }
async function saveUpgradePool(templateId){
let rows=document.querySelectorAll('#poolRows .pool-row');
let pool=Array.from(rows).map(function(r){ return {rarity:r.querySelector('.pr-rarity').value,background:r.querySelector('.pr-bg').value.trim(),weight:parseFloat(r.querySelector('.pr-weight').value)||1}; });
await database.ref('upgradePools/'+templateId).set(pool); toast('Pool saqlandi!'); closeGenericModal();
}

// ===================== BOOTSTRAP =====================
window.onload=async function(){
let saved=localStorage.getItem('ss_currentUser');
if(saved){ let snap=await database.ref('users/'+saved).once('value'); if(snap.exists()){ db.currentUser=snap.val(); enterApp(); return; } }
renderAuth();
};
</script>
