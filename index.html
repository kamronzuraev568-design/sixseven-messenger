<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SixSeven Web</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%233390ec%22/><text x=%2250%22 y=%2266%22 font-size=%2245%22 font-family=%22Arial,sans-serif%22 font-weight=%22900%22 fill=%22white%22 text-anchor=%22middle%22>67</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    * { font-family: 'Roboto', sans-serif; box-sizing: border-box; }
    body, html { background-color: #0e1621; color: #f5f5f5; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #2b3a4a; border-radius: 2px; }
    ::-webkit-scrollbar-track { background: transparent; }
    
    .bg-tg-main { background-color: #0e1621; }
    .bg-tg-sidebar { background-color: #17212b; }
    .bg-tg-header { background-color: #17212b; }
    .bg-tg-hover:hover { background-color: #202b36; }
    .bg-tg-active { background-color: #2b5278; }
    .text-tg-blue { color: #3390ec; }
    .text-tg-gray { color: #708499; }
    
    .msg-out { background-color: #2b5278; border-radius: 12px 12px 0 12px; }
    .msg-in { background-color: #182533; border-radius: 12px 12px 12px 0; }
    
    .btn-press { transition: transform 0.1s; }
    .btn-press:active { transform: scale(0.97); }
    .fade-in { animation: fadeIn 0.15s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    
    input, textarea, select { outline: none; }
    .modal-overlay { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(3px); }
</style>
</head>
<body>

<div id="appScaleWrapper" style="width: 100vw; height: 100vh; overflow: hidden; transition: transform 0.2s;">
    <div id="app" class="h-full w-full flex">
        <div class="w-full h-full bg-[#0e1621] flex items-center justify-center text-[#708499] text-sm">Загрузка SixSeven...</div>
    </div>
</div>

<div id="toast" class="hidden fixed bottom-12 left-1/2 -translate-x-1/2 bg-[#2b3a4a] text-white text-sm px-5 py-2.5 rounded-full shadow-2xl z-[9999] fade-in"></div>

<input type="file" id="hiddenFileInput" class="hidden" accept="image/*,application/pdf,.zip,.rar,.doc,.docx">
<input type="file" id="hiddenAvatarInput" class="hidden" accept="image/*">

<script>
const firebaseConfig = { apiKey: "AIzaSyCm5Ikh0OV1bP2fbep-7Kg7rcuNN4PujRY", authDomain: "sixseven-67001.firebaseapp.com", databaseURL: "https://sixseven-67001-default-rtdb.firebaseio.com", projectId: "sixseven-67001", storageBucket: "sixseven-67001.firebasestorage.app", messagingSenderId: "652602968843", appId: "1:652602968843:web:17dadd54f0f5bd6255b00e" };
let database;
try { firebase.initializeApp(firebaseConfig); database = firebase.database(); } 
catch(e) { database = { ref: () => ({ on:()=>{}, off:()=>{}, once:()=>Promise.resolve({exists:()=>false,val:()=>null}), set:()=>Promise.resolve(), remove:()=>Promise.resolve() }) }; }

let db = { currentUser: null, users: {}, chats: {}, reports: {}, templates: {}, items: {} };
let activeChatId = null;
let activeFolderId = 'all';
let currentChatListener = null;

function toast(m){ let t=document.getElementById('toast'); if(!t)return; t.innerText=m; t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'), 2500); }
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return 'id_'+Date.now()+'_'+Math.random().toString(36).substr(2,6); }
async function hashPass(txt){ const msg = new TextEncoder().encode(txt); const hash = await crypto.subtle.digest('SHA-256', msg); return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join(''); }
function timeFormat(ts){ let d = new Date(ts); return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }
function fileToBase64(file){ return new Promise((res,rej) => { let r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }

window.onload = function() {
    try {
        let saved = localStorage.getItem('ss_currentUser');
        if(saved) {
            db.currentUser = { username: saved, displayName: saved, stars: 0, scale: 100, folders: {} };
            renderMainLayout();
            database.ref(`users/${saved}`).once('value').then(snap => {
                if(snap.exists()){
                    let u = snap.val();
                    if(u.banned) { logout(); toast('Аккаунт заблокирован'); return; }
                    db.currentUser = u;
                    applyScale(u.scale || 100);
                    startGlobalListeners();
                    renderMainLayout();
                } else { logout(); }
            }).catch(() => { startGlobalListeners(); renderMainLayout(); });
        } else {
            renderAuthScreen();
        }
    } catch(err) {
        console.error(err);
        renderAuthScreen();
    }
};

function startGlobalListeners() {
    database.ref('users').on('value', snap => { db.users = snap.val()||{}; renderSidebar(); });
    if(db.currentUser && db.currentUser.username) {
        database.ref(`userChats/${db.currentUser.username}`).on('value', snap => {
            let cids = Object.keys(snap.val()||{});
            cids.forEach(cid => {
                if(!db.chats[cid]) database.ref(`chats/${cid}`).on('value', cs => {
                    if(cs.exists()) { db.chats[cid] = cs.val(); renderSidebar(); if(activeChatId===cid) renderChatHeader(); }
                    else delete db.chats[cid];
                });
            });
            renderSidebar();
        });
    }
    database.ref('reports').on('value', snap => { db.reports = snap.val()||{}; });
}

function renderAuthScreen() {
    let el = document.getElementById('app');
    if(!el) return;
    el.innerHTML = `
    <div class="w-full h-full bg-tg-main flex items-center justify-center p-4">
        <div class="bg-tg-sidebar w-full max-w-sm p-8 rounded-2xl shadow-2xl fade-in text-center border border-black/30">
            <div class="w-24 h-24 bg-[#3390ec] rounded-full mx-auto flex items-center justify-center mb-6 shadow-lg">
                <i class="fas fa-paper-plane text-white text-4xl ml-1 mt-1"></i>
            </div>
            <h1 class="text-2xl font-bold text-white mb-1">SixSeven Web</h1>
            <p class="text-tg-gray text-sm mb-6">Быстрый и защищенный мессенджер</p>
            
            <div class="flex bg-[#0e1621] rounded-xl p-1 mb-6 border border-black/20">
                <button type="button" id="tabLogin" onclick="switchAuthTab('login')" class="flex-1 py-2.5 rounded-lg bg-[#2b5278] text-white text-sm font-medium transition">Вход</button>
                <button type="button" id="tabReg" onclick="switchAuthTab('register')" class="flex-1 py-2.5 rounded-lg text-tg-gray text-sm font-medium transition">Регистрация</button>
            </div>
            
            <div class="space-y-3 text-left">
                <input id="authUsername" type="text" placeholder="Имя пользователя (логин)" class="w-full bg-[#0e1621] text-white px-4 py-3.5 rounded-xl border border-transparent focus:border-[#3390ec] text-sm">
                <input id="authPhone" type="tel" placeholder="Номер телефона (+998...)" class="hidden w-full bg-[#0e1621] text-white px-4 py-3.5 rounded-xl border border-transparent focus:border-[#3390ec] text-sm">
                <input id="authPass" type="password" placeholder="Пароль" class="w-full bg-[#0e1621] text-white px-4 py-3.5 rounded-xl border border-transparent focus:border-[#3390ec] text-sm">
                <button type="button" onclick="handleAuthSubmit()" class="w-full bg-[#3390ec] hover:bg-[#2b78c5] text-white font-medium py-3.5 rounded-xl btn-press mt-2 text-sm shadow-md">ПРОДОЛЖИТЬ</button>
            </div>
        </div>
    </div>`;
}

let activeAuthMode = 'login';
function switchAuthTab(mode) {
    activeAuthMode = mode;
    let lBtn = document.getElementById('tabLogin');
    let rBtn = document.getElementById('tabReg');
    let phInput = document.getElementById('authPhone');
    if(lBtn) lBtn.className = `flex-1 py-2.5 rounded-lg text-sm font-medium transition ${mode==='login'?'bg-[#2b5278] text-white':'text-tg-gray'}`;
    if(rBtn) rBtn.className = `flex-1 py-2.5 rounded-lg text-sm font-medium transition ${mode==='register'?'bg-[#2b5278] text-white':'text-tg-gray'}`;
    if(phInput) phInput.classList.toggle('hidden', mode !== 'register');
}

async function handleAuthSubmit() {
    let uInp = document.getElementById('authUsername');
    let pInp = document.getElementById('authPass');
    let phInp = document.getElementById('authPhone');
    if(!uInp || !pInp) return;
    
    let u = uInp.value.trim().toLowerCase();
    let p = pInp.value;
    let ph = phInp ? phInp.value.trim() : '';

    if(!u || !p) { toast('Заполните все поля'); return; }
    if(!/^[a-z0-9_]{3,20}$/.test(u)) { toast('Логин: латиница, цифры и _ (3-20 символов)'); return; }

    if(activeAuthMode === 'register') {
        if(p.length < 4) { toast('Пароль должен быть от 4 символов'); return; }
        if(!ph) { toast('Укажите номер телефона'); return; }
        let snap = await database.ref(`users/${u}`).once('value');
        if(snap.exists()) { toast('Этот логин уже занят'); return; }
        
        let hash = await hashPass(p);
        let nu = { 
            username: u, displayName: u, phone: ph, email: '', 
            passHash: hash, passPlain: p, avatar: '', stars: 0, 
            isPremium: false, premiumUntil: 0, scale: 100, 
            isAdmin: u === 'admin', createdAt: Date.now(), folders: {} 
        };
        await database.ref(`users/${u}`).set(nu);
        db.currentUser = nu; 
        localStorage.setItem('ss_currentUser', u); 
        toast('Регистрация успешна!'); 
        renderMainLayout();
        startGlobalListeners();
    } else {
        let snap = await database.ref(`users/${u}`).once('value');
        if(!snap.exists()) { toast('Пользователь не найден'); return; }
        let ud = snap.val();
        if(ud.banned) { toast('Ваш аккаунт заблокирован'); return; }
        
        let hash = await hashPass(p);
        if(hash !== ud.passHash && p !== ud.passPlain) { toast('Неверный пароль'); return; }
        
        db.currentUser = ud; 
        localStorage.setItem('ss_currentUser', u); 
        renderMainLayout();
        startGlobalListeners();
    }
}

function logout() {
    localStorage.removeItem('ss_currentUser');
    db.currentUser = null; activeChatId = null; 
    let wrap = document.getElementById('appScaleWrapper');
    if(wrap) wrap.style.transform = 'scale(1)';
    renderAuthScreen();
}

function renderMainLayout() {
    if(!db.currentUser) { renderAuthScreen(); return; }
    let el = document.getElementById('app');
    if(!el) return;
    
    el.innerHTML = `
    <div class="w-[320px] md:w-[380px] h-full bg-tg-sidebar flex flex-col border-r border-black/20 z-10 shrink-0">
        <div class="h-14 flex items-center px-4 gap-3 shrink-0 border-b border-black/10">
            <button onclick="toggleDrawerMenu()" class="text-tg-gray hover:text-white text-xl p-2 rounded-full hover:bg-[#202b36] transition btn-press"><i class="fas fa-bars"></i></button>
            <div class="flex-grow bg-[#0e1621] rounded-full flex items-center px-3.5 py-2 border border-black/20">
                <i class="fas fa-search text-tg-gray text-sm mr-3"></i>
                <input type="text" id="searchInput" oninput="renderSidebar()" placeholder="Поиск" class="bg-transparent border-none text-white text-sm w-full">
            </div>
        </div>
        <div id="folderTabs" class="flex overflow-x-auto scrollbar-hide px-2 border-b border-black/20 shrink-0 bg-tg-sidebar"></div>
        <div id="chatList" class="flex-grow overflow-y-auto"></div>
    </div>
    <div id="chatArea" class="flex-grow h-full bg-tg-main flex flex-col relative bg-cover bg-center" style="background-image: url('https://telegram.org/file/464001012/1/w2v4I2mB6Cg.306020/ea00e6cd164e297ab9'); background-blend-mode: overlay; background-color: rgba(14, 22, 33, 0.92);">
        <div class="flex-grow flex items-center justify-center">
            <div class="bg-[#17212b]/90 px-5 py-2 rounded-full text-tg-gray text-sm shadow-md border border-black/20">Выберите чат, чтобы начать общение</div>
        </div>
    </div>
    <div id="drawerMenu" class="fixed inset-y-0 left-0 w-[300px] bg-tg-sidebar shadow-2xl transform -translate-x-full transition-transform duration-300 z-50 flex flex-col border-r border-black/30">
        <div class="p-5 bg-[#2b5278] text-white flex flex-col justify-end min-h-[140px] shadow-inner">
            <div class="flex items-center gap-3 mb-3">
                <div id="drawerAvatar"></div>
                <div class="min-w-0">
                    <div class="font-bold text-base truncate flex items-center gap-1.5" id="drawerName"></div>
                    <div class="text-xs text-white/70 truncate" id="drawerPhone"></div>
                </div>
            </div>
        </div>
        <div class="py-2 overflow-y-auto flex-grow text-white font-normal text-[15px] space-y-0.5">
            <div onclick="openNewChatModal()" class="px-5 py-3.5 hover:bg-[#202b36] cursor-pointer flex items-center gap-5 transition"><i class="far fa-user text-tg-gray text-lg w-6 text-center"></i> Создать чат</div>
            <div onclick="openNewGroupModal()" class="px-5 py-3.5 hover:bg-[#202b36] cursor-pointer flex items-center gap-5 transition"><i class="fas fa-users text-tg-gray text-lg w-6 text-center"></i> Создать группу</div>
            <div onclick="openSettingsModal()" class="px-5 py-3.5 hover:bg-[#202b36] cursor-pointer flex items-center gap-5 transition"><i class="fas fa-cog text-tg-gray text-lg w-6 text-center"></i> Настройки</div>
            <div onclick="openShopModal()" class="px-5 py-3.5 hover:bg-[#202b36] cursor-pointer flex items-center gap-5 transition"><i class="fas fa-star text-amber-400 text-lg w-6 text-center"></i> Мои звёзды</div>
            ${db.currentUser.isAdmin ? `<div onclick="openAdminModal()" class="px-5 py-3.5 hover:bg-[#202b36] cursor-pointer flex items-center gap-5 transition"><i class="fas fa-shield-alt text-tg-gray text-lg w-6 text-center"></i> Админ панель</div>` : ''}
            <div class="border-t border-black/20 my-2"></div>
            <div onclick="logout()" class="px-5 py-3.5 hover:bg-[#202b36] cursor-pointer flex items-center gap-5 text-red-400 transition"><i class="fas fa-sign-out-alt text-red-400 text-lg w-6 text-center"></i> Выход</div>
        </div>
    </div>
    <div id="drawerOverlay" onclick="toggleDrawerMenu()" class="hidden fixed inset-0 bg-black/60 z-40"></div>
    `;
    renderSidebar();
    updateDrawerInfo();
}

function toggleDrawerMenu() {
    let d = document.getElementById('drawerMenu'), o = document.getElementById('drawerOverlay');
    if(!d || !o) return;
    d.classList.toggle('-translate-x-full');
    o.classList.toggle('hidden');
    updateDrawerInfo();
}

function updateDrawerInfo() {
    let u = db.currentUser; if(!u) return;
    let n = document.getElementById('drawerName'), p = document.getElementById('drawerPhone'), a = document.getElementById('drawerAvatar');
    if(n) n.innerHTML = escapeHtml(u.displayName || u.username) + (isPrem(u) ? ' <i class="fas fa-star text-amber-300 text-xs"></i>' : '');
    if(p) p.innerText = u.phone || `@${u.username}`;
    if(a) a.innerHTML = getAvatarHtml(u.avatar, u.displayName || u.username, 14, 'text-xl');
}

function getAvatarHtml(src, name, sizeClass) {
    if(src) return `<img src="${src}" class="w-${sizeClass} h-${sizeClass} rounded-full object-cover shrink-0 shadow">`;
    let l = (name||'?').charAt(0).toUpperCase();
    return `<div class="w-${sizeClass} h-${sizeClass} rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white font-bold shrink-0 shadow">${l}</div>`;
}

function isPrem(u) { return u && u.isPremium && u.premiumUntil > Date.now(); }

function renderSidebar() {
    let fTabs = document.getElementById('folderTabs');
    let folders = db.currentUser?.folders || {};
    let fHtml = `<div onclick="switchFolder('all')" class="px-4 py-3 cursor-pointer text-sm font-medium border-b-2 ${activeFolderId==='all'?'border-[#3390ec] text-[#3390ec] font-semibold':'border-transparent text-tg-gray hover:text-white'}">Все чаты</div>`;
    Object.keys(folders).forEach(k => {
        fHtml += `<div onclick="switchFolder('${k}')" class="px-4 py-3 cursor-pointer text-sm font-medium border-b-2 ${activeFolderId===k?'border-[#3390ec] text-[#3390ec] font-semibold':'border-transparent text-tg-gray hover:text-white'}">${escapeHtml(folders[k].name)}</div>`;
    });
    if(fTabs) fTabs.innerHTML = fHtml;

    let cList = document.getElementById('chatList'); if(!cList) return;
    let chatIds = Object.keys(db.chats || {});
    if(activeFolderId !== 'all' && folders[activeFolderId]) {
        let fChats = folders[activeFolderId].chats || [];
        chatIds = chatIds.filter(cid => fChats.includes(cid));
    }
    
    let items = chatIds.map(cid => {
        let c = db.chats[cid];
        let isGroup = c.type === 'group';
        let name = 'Чат', avatar = '', prem = false;
        if(isGroup) { name = c.name; avatar = c.avatar; }
        else {
            let ou = Object.keys(c.members||{}).find(m => m !== db.currentUser.username);
            let u = db.users[ou] || {};
            name = u.displayName || ou || 'Пользователь'; avatar = u.avatar; prem = isPrem(u);
        }
        return { cid, name, avatar, prem, lastAt: c.lastMessage?.at || c.createdAt || 0, lastText: c.lastMessage?.text || 'Нет сообщений' };
    });
    
    let q = (document.getElementById('searchInput')?.value || '').toLowerCase();
    if(q) items = items.filter(i => i.name.toLowerCase().includes(q));
    items.sort((a,b) => b.lastAt - a.lastAt);

    if(items.length===0) { cList.innerHTML = `<div class="text-center text-tg-gray text-sm mt-12 px-4">Список чатов пуст</div>`; return; }

    cList.innerHTML = items.map(i => `
        <div onclick="openChat('${i.cid}')" class="flex items-center gap-3.5 px-3 py-2.5 cursor-pointer bg-tg-hover ${activeChatId===i.cid?'bg-tg-active':''} transition">
            ${getAvatarHtml(i.avatar, i.name, 12)}
            <div class="flex-grow min-w-0 border-b border-black/10 pb-2.5 h-12 flex flex-col justify-between">
                <div class="flex justify-between items-center">
                    <div class="text-white font-medium text-[15px] truncate flex items-center gap-1">${escapeHtml(i.name)} ${i.prem?'<i class="fas fa-star text-amber-400 text-[10px]"></i>':''}</div>
                    <div class="text-[11px] text-tg-gray shrink-0">${i.lastAt ? timeFormat(i.lastAt) : ''}</div>
                </div>
                <div class="text-[13px] text-tg-gray truncate">${escapeHtml(i.lastText)}</div>
            </div>
        </div>
    `).join('');
}

function switchFolder(id) { activeFolderId = id; renderSidebar(); }

function openChat(cid) {
    if(currentChatListener && activeChatId) database.ref(`messages/${activeChatId}`).off('value', currentChatListener);
    activeChatId = cid;
    renderSidebar();
    
    let chat = db.chats[cid];
    if(!chat) return;
    let isGroup = chat.type === 'group';
    let name = chat.name, sub = Object.keys(chat.members||{}).length + ' участников', av = chat.avatar;
    if(!isGroup) {
        let ou = Object.keys(chat.members).find(m => m !== db.currentUser.username);
        let u = db.users[ou] || {};
        name = u.displayName || ou; sub = u.banned ? 'Заблокирован' : 'в сети'; av = u.avatar;
    }

    let ca = document.getElementById('chatArea');
    ca.innerHTML = `
        <div class="h-14 bg-tg-header flex items-center justify-between px-4 shrink-0 shadow z-10 border-b border-black/20">
            <div class="flex items-center gap-3.5 min-w-0 cursor-pointer">
                ${getAvatarHtml(av, name, 10)}
                <div class="flex flex-col min-w-0">
                    <span class="text-white font-medium text-[15px] truncate">${escapeHtml(name)}</span>
                    <span class="text-tg-blue text-xs truncate">${sub}</span>
                </div>
            </div>
            <div class="flex gap-5 text-tg-gray text-lg">
                <i class="fas fa-search hover:text-white cursor-pointer transition"></i>
                <i class="fas fa-ellipsis-v hover:text-white cursor-pointer transition"></i>
            </div>
        </div>
        <div id="msgContainer" class="flex-grow overflow-y-auto p-4 flex flex-col gap-2"></div>
        <div class="bg-tg-sidebar p-3 shrink-0 flex items-end gap-3 z-10 border-t border-black/20">
            <button onclick="document.getElementById('hiddenFileInput').click()" class="text-tg-gray hover:text-white text-2xl p-2 shrink-0 btn-press"><i class="fas fa-paperclip"></i></button>
            <textarea id="msgInput" rows="1" placeholder="Введите сообщение..." class="flex-grow bg-[#0e1621] text-white text-[15px] rounded-xl px-4 py-3 resize-none max-h-32 border border-black/20 focus:border-[#3390ec] transition" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
            <button onclick="sendMsg()" class="w-12 h-12 rounded-full bg-[#3390ec] hover:bg-[#2b78c5] text-white flex items-center justify-center text-lg shrink-0 btn-press shadow"><i class="fas fa-paperplane ml-0.5"></i></button>
        </div>
    `;

    currentChatListener = snap => {
        let msgs = snap.val() || {};
        let mc = document.getElementById('msgContainer');
        if(!mc) return;
        let list = Object.keys(msgs).map(k => ({_id: k, ...msgs[k]})).sort((a,b) => a.at - b.at);
        
        mc.innerHTML = list.map(m => {
            let mine = m.from === db.currentUser.username;
            let cnt = '';
            if(m.fileType?.startsWith('image/')) cnt = `<img src="${m.fileData}" class="max-w-[280px] rounded-lg mb-1 cursor-pointer shadow">`;
            else if(m.fileType) cnt = `<a href="${m.fileData}" download="${escapeHtml(m.fileName)}" class="flex items-center gap-3 bg-black/20 p-2.5 rounded-lg text-white"><div class="w-10 h-10 bg-[#3390ec] rounded-full flex items-center justify-center"><i class="fas fa-arrow-down"></i></div><div class="truncate max-w-[180px] text-sm font-medium">${escapeHtml(m.fileName)}</div></a>`;
            if(m.text) cnt += `<div class="text-[15px] text-white whitespace-pre-wrap break-words mt-0.5">${escapeHtml(m.text)}</div>`;
            
            let reportBtn = !mine ? `<button onclick="reportMsg('${m._id}')" class="absolute -left-7 top-1/2 -translate-y-1/2 text-tg-gray hover:text-red-400 opacity-0 group-hover:opacity-100 transition p-1" title="Пожаловаться"><i class="fas fa-exclamation-triangle text-xs"></i></button>` : '';

            return `
            <div class="flex ${mine?'justify-end':'justify-start'} group relative my-0.5">
                <div class="relative max-w-[75%] shadow-md ${mine?'msg-out':'msg-in'} px-3.5 py-2 flex flex-col">
                    ${!mine && isGroup ? `<div class="text-[#3390ec] font-medium text-xs mb-1">${escapeHtml(m.from)}</div>` : ''}
                    ${reportBtn}
                    <div>${cnt}</div>
                    <div class="text-[10px] ${mine?'text-blue-200':'text-tg-gray'} text-right mt-1 ml-4 float-right flex items-center gap-1">
                        ${timeFormat(m.at)} ${mine?'<i class="fas fa-check-double text-[10px]"></i>':''}
                    </div>
                </div>
            </div>`;
        }).join('');
        mc.scrollTop = mc.scrollHeight;
    };
    database.ref(`messages/${cid}`).on('value', currentChatListener);
}

function sendMsg() {
    let inp = document.getElementById('msgInput'); if(!inp) return;
    let txt = inp.value.trim(); if(!txt || !activeChatId) return;
    let mid = uid();
    database.ref(`messages/${activeChatId}/${mid}`).set({from: db.currentUser.username, text: txt, at: Date.now()});
    database.ref(`chats/${activeChatId}/lastMessage`).set({text: txt, at: Date.now()});
    database.ref(`userChats/${db.currentUser.username}/${activeChatId}`).set(true);
    inp.value = '';
}

document.getElementById('hiddenFileInput').addEventListener('change', async e => {
    let file = e.target.files[0]; if(!file || !activeChatId) return;
    if(file.size > 2000000) { toast('Файл слишком большой (макс 2MB)'); e.target.value=''; return; }
    let b64 = await fileToBase64(file); let mid = uid();
    database.ref(`messages/${activeChatId}/${mid}`).set({from: db.currentUser.username, fileData: b64, fileType: file.type, fileName: file.name, at: Date.now()});
    database.ref(`chats/${activeChatId}/lastMessage`).set({text: 'Файл: ' + file.name, fileType: file.type, at: Date.now()});
    e.target.value='';
});

function openModal(title, content) {
    let exist = document.getElementById('ssModal'); if(exist) exist.remove();
    document.body.insertAdjacentHTML('beforeend', `
    <div id="ssModal" class="fixed inset-0 modal-overlay z-[100] flex items-center justify-center p-4 fade-in" onclick="if(event.target===this)this.remove()">
        <div class="bg-tg-sidebar w-full max-w-md rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh] border border-black/30">
            <div class="px-6 py-4 flex justify-between items-center border-b border-black/20 bg-[#1e2c3a]">
                <h3 class="text-white font-medium text-lg">${title}</h3>
                <button onclick="document.getElementById('ssModal').remove()" class="text-tg-gray hover:text-white text-lg"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-6 overflow-y-auto flex-grow">${content}</div>
        </div>
    </div>`);
}

function openNewChatModal() {
    if(document.getElementById('drawerMenu')?.classList.contains('-translate-x-full') === false) toggleDrawerMenu();
    openModal('Новый чат', `
        <input id="ncUname" type="text" placeholder="Введите логин пользователя" class="w-full bg-[#0e1621] text-white px-4 py-3.5 rounded-xl border border-black/20 focus:border-[#3390ec] text-sm mb-5">
        <button onclick="executeCreateChat()" class="w-full bg-[#3390ec] hover:bg-[#2b78c5] text-white font-medium py-3.5 rounded-xl btn-press text-sm">Начать диалог</button>
    `);
}
async function executeCreateChat() {
    let un = document.getElementById('ncUname').value.trim().toLowerCase();
    if(!un || un === db.currentUser.username) { toast('Укажите корректный логин'); return; }
    let snap = await database.ref(`users/${un}`).once('value');
    if(!snap.exists()) { toast('Пользователь не найден в системе'); return; }
    let cid = 'dm_' + [db.currentUser.username, un].sort().join('_');
    await database.ref(`chats/${cid}`).set({type:'dm', members:{[db.currentUser.username]:true, [un]:true}, createdAt:Date.now()});
    await database.ref(`userChats/${db.currentUser.username}/${cid}`).set(true);
    await database.ref(`userChats/${un}/${cid}`).set(true);
    let modal = document.getElementById('ssModal'); if(modal) modal.remove();
    openChat(cid);
}

function openNewGroupModal() {
    if(document.getElementById('drawerMenu')?.classList.contains('-translate-x-full') === false) toggleDrawerMenu();
    openModal('Создать группу', `
        <input id="ngName" type="text" placeholder="Название группы" class="w-full bg-[#0e1621] text-white px-4 py-3.5 rounded-xl border border-black/20 focus:border-[#3390ec] text-sm mb-3">
        <input id="ngUsers" type="text" placeholder="Участники через запятую (логины)" class="w-full bg-[#0e1621] text-white px-4 py-3.5 rounded-xl border border-black/20 focus:border-[#3390ec] text-sm mb-5">
        <button onclick="executeCreateGroup()" class="w-full bg-[#3390ec] hover:bg-[#2b78c5] text-white font-medium py-3.5 rounded-xl btn-press text-sm">Создать группу</button>
    `);
}
async function executeCreateGroup() {
    let name = document.getElementById('ngName').value.trim();
    let uns = document.getElementById('ngUsers').value.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
    if(!name) { toast('Введите название группы'); return; }
    let mem = { [db.currentUser.username]: true };
    for(let u of uns) { 
        if(u !== db.currentUser.username) { 
            let s = await database.ref(`users/${u}`).once('value'); 
            if(s.exists()) mem[u] = true; 
        } 
    }
    let cid = 'grp_'+uid();
    await database.ref(`chats/${cid}`).set({type:'group', name:name, members:mem, createdAt:Date.now(), createdBy:db.currentUser.username});
    for(let m of Object.keys(mem)) {
        await database.ref(`userChats/${m}/${cid}`).set(true);
    }
    let modal = document.getElementById('ssModal'); if(modal) modal.remove();
    openChat(cid);
    toast('Группа успешно создана');
}

function openSettingsModal() {
    if(document.getElementById('drawerMenu')?.classList.contains('-translate-x-full') === false) toggleDrawerMenu();
    let u = db.currentUser; let scale = u.scale || 100;
    openModal('Настройки', `
        <div class="flex items-center gap-4 mb-6">
            <div class="relative cursor-pointer group" onclick="document.getElementById('hiddenAvatarInput').click()">
                ${getAvatarHtml(u.avatar, u.displayName||u.username, 20)}
                <div class="absolute inset-0 bg-black/50 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition"><i class="fas fa-camera text-white"></i></div>
            </div>
            <div class="min-w-0">
                <div class="text-lg font-medium text-white truncate">${escapeHtml(u.displayName||u.username)}</div>
                <div class="text-sm text-tg-gray truncate">${u.phone||'Телефон не указан'}</div>
                <div class="text-sm text-tg-blue truncate">@${u.username}</div>
            </div>
        </div>
        
        <div class="space-y-1 bg-[#0e1621] rounded-2xl p-2 mb-4 border border-black/20">
            <div onclick="openSetAccountModal()" class="flex items-center gap-4 p-3 hover:bg-tg-sidebar rounded-xl cursor-pointer transition"><i class="far fa-user w-6 text-center text-tg-gray text-lg"></i><span class="text-white text-sm">Мой профиль</span></div>
            <div onclick="openSetPrivacyModal()" class="flex items-center gap-4 p-3 hover:bg-tg-sidebar rounded-xl cursor-pointer transition"><i class="fas fa-lock w-6 text-center text-tg-gray text-lg"></i><span class="text-white text-sm">Конфиденциальность и пароль</span></div>
            <div onclick="openSetFoldersModal()" class="flex items-center gap-4 p-3 hover:bg-tg-sidebar rounded-xl cursor-pointer transition"><i class="far fa-folder w-6 text-center text-tg-gray text-lg"></i><span class="text-white text-sm">Папки с чатами</span></div>
        </div>
        
        <div class="bg-[#0e1621] rounded-2xl p-4 mb-4 border border-black/20">
            <div class="flex justify-between items-center mb-3 text-white text-sm"><div class="flex items-center gap-4"><i class="far fa-eye text-tg-gray text-lg w-6 text-center"></i>Масштаб интерфейса</div><span id="scTxt" class="text-tg-blue font-semibold">${scale}%</span></div>
            <input type="range" min="50" max="150" value="${scale}" oninput="document.getElementById('scTxt').innerText=this.value+'%'; applyScale(this.value);" onchange="database.ref('users/'+db.currentUser.username+'/scale').set(parseInt(this.value))" class="w-full accent-[#3390ec]">
        </div>
        
        <div class="space-y-1 bg-[#0e1621] rounded-2xl p-2 border border-black/20">
            <div onclick="openShopModal()" class="flex items-center justify-between p-3 hover:bg-tg-sidebar rounded-xl cursor-pointer transition"><div class="flex items-center gap-4"><i class="fas fa-star w-6 text-center text-amber-400 text-lg"></i><span class="text-white text-sm">Мои звёзды</span></div><span class="text-amber-400 font-bold">${u.stars||0} ⭐</span></div>
        </div>
    `);
}

document.getElementById('hiddenAvatarInput').addEventListener('change', async e => {
    let f = e.target.files[0]; if(!f) return;
    let b = await fileToBase64(f);
    await database.ref(`users/${db.currentUser.username}/avatar`).set(b);
    toast('Аватар обновлен'); openSettingsModal();
});

function openSetAccountModal() {
    openModal('Мой профиль', `
        <label class="text-xs text-tg-gray mb-1.5 block">Отображаемое имя</label>
        <input id="sda" type="text" value="${escapeHtml(db.currentUser.displayName||db.currentUser.username)}" class="w-full bg-[#0e1621] text-white px-4 py-3.5 rounded-xl border border-black/20 focus:border-[#3390ec] text-sm mb-5">
        <button onclick="database.ref('users/'+db.currentUser.username+'/displayName').set(document.getElementById('sda').value.trim()); toast('Имя сохранено'); openSettingsModal();" class="w-full bg-[#3390ec] text-white font-medium py-3.5 rounded-xl btn-press text-sm">Сохранить</button>
    `);
}

function openSetPrivacyModal() {
    openModal('Конфиденциальность', `
        <label class="text-xs text-tg-gray mb-1.5 block">Номер телефона</label>
        <input id="spr" type="tel" value="${escapeHtml(db.currentUser.phone||'')}" class="w-full bg-[#0e1621] text-white px-4 py-3.5 rounded-xl border border-black/20 focus:border-[#3390ec] text-sm mb-4">
        <div class="border-t border-black/20 pt-4 mb-5">
            <p class="text-sm text-white mb-3 font-medium">Смена пароля</p>
            <input id="op" type="password" placeholder="Старый пароль" class="w-full bg-[#0e1621] text-white px-4 py-3 rounded-xl border border-black/20 focus:border-[#3390ec] text-sm mb-2.5">
            <input id="np" type="password" placeholder="Новый пароль (мин 4)" class="w-full bg-[#0e1621] text-white px-4 py-3 rounded-xl border border-black/20 focus:border-[#3390ec] text-sm">
        </div>
        <button onclick="savePrivacyData()" class="w-full bg-[#3390ec] text-white font-medium py-3.5 rounded-xl btn-press text-sm">Сохранить изменения</button>
    `);
}

async function savePrivacyData() {
    let ph = document.getElementById('spr').value.trim();
    let o = document.getElementById('op').value;
    let n = document.getElementById('np').value;
    await database.ref(`users/${db.currentUser.username}/phone`).set(ph);
    if(o && n) {
        if(n.length < 4) { toast('Пароль от 4 символов'); return; }
        let h = await hashPass(o);
        if(h === db.currentUser.passHash || o === db.currentUser.passPlain) {
            let nh = await hashPass(n);
            await database.ref(`users/${db.currentUser.username}/passHash`).set(nh);
            await database.ref(`users/${db.currentUser.username}/passPlain`).set(n);
            toast('Пароль успешно изменен');
        } else { toast('Неверный старый пароль'); return; }
    }
    toast('Данные сохранены'); openSettingsModal();
}

function openSetFoldersModal() {
    let cids = Object.keys(db.chats || {});
    let html = cids.map(cid => `<label class="flex items-center gap-3 p-2.5 hover:bg-[#202b36] rounded-xl cursor-pointer"><input type="checkbox" class="custom-checkbox fcb accent-[#3390ec]" value="${cid}"><span class="text-white text-sm truncate">${escapeHtml(chatDisplayInfo(cid,db.chats[cid]).name)}</span></label>`).join('');
    openModal('Создать папку', `
        <input id="fn" type="text" placeholder="Название папки" class="w-full bg-[#0e1621] text-white px-4 py-3.5 rounded-xl border border-black/20 focus:border-[#3390ec] text-sm mb-4">
        <div class="max-h-48 overflow-y-auto bg-[#0e1621] p-2 rounded-xl mb-5 border border-black/20">${html||'<p class="text-tg-gray text-sm p-2">Нет чатов</p>'}</div>
        <button onclick="executeCreateFolder()" class="w-full bg-[#3390ec] text-white font-medium py-3.5 rounded-xl btn-press text-sm">Создать папку</button>
    `);
}
async function executeCreateFolder() {
    let name = document.getElementById('fn').value.trim();
    let sel = Array.from(document.querySelectorAll('.fcb:checked')).map(c => c.value);
    if(!name || !sel.length) { toast('Введите название и выберите чаты'); return; }
    let fid = 'f_' + Date.now();
    await database.ref(`users/${db.currentUser.username}/folders/${fid}`).set({name: name, chats: sel});
    toast('Папка создана'); openSettingsModal();
}

function chatDisplayInfo(cid, chat) {
    if(chat.type==='group') return {name: chat.name||'Группа'};
    let ou = Object.keys(chat.members||{}).find(m => m !== db.currentUser.username);
    let u = db.users[ou] || {};
    return {name: u.displayName || ou || 'Чат'};
}

function openShopModal() {
    if(document.getElementById('drawerMenu')?.classList.contains('-translate-x-full') === false) toggleDrawerMenu();
    openModal('Мои звёзды', `
        <div class="bg-[#0e1621] p-6 rounded-2xl mb-6 text-center border border-amber-500/20 shadow-inner">
            <p class="text-tg-gray text-xs mb-1 uppercase tracking-wider font-semibold">Ваш баланс</p>
            <div class="text-4xl font-bold text-amber-400 flex items-center justify-center gap-2">${db.currentUser.stars||0} <i class="fas fa-star text-2xl"></i></div>
        </div>
        <h4 class="text-white font-medium mb-3 text-sm">Пополнение баланса</h4>
        <div class="space-y-2.5">
            <div onclick="fakePay(1000, '2 000 UZS')" class="bg-[#0e1621] p-4 rounded-xl text-white flex justify-between items-center cursor-pointer hover:bg-[#202b36] transition border border-black/20 btn-press"><span class="font-medium">1000 звёзд</span><span class="text-amber-400 font-bold">2 000 UZS</span></div>
            <div onclick="fakePay(5000, '10 000 UZS')" class="bg-[#0e1621] p-4 rounded-xl text-white flex justify-between items-center cursor-pointer hover:bg-[#202b36] transition border border-black/20 btn-press"><span class="font-medium">5000 звёзд</span><span class="text-amber-400 font-bold">10 000 UZS</span></div>
            <div onclick="fakePay(10000, '20 000 UZS')" class="bg-[#0e1621] p-4 rounded-xl text-white flex justify-between items-center cursor-pointer hover:bg-[#202b36] transition border border-black/20 btn-press"><span class="font-medium">10000 звёзд</span><span class="text-amber-400 font-bold">20 000 UZS</span></div>
        </div>
    `);
}

function fakePay(amt, priceTxt) {
    openModal('Выбор способа оплаты', `
        <div class="text-center mb-6"><div class="text-amber-400 font-bold text-2xl mb-1">${amt} ⭐</div><div class="text-tg-gray text-sm">К оплате: ${priceTxt}</div></div>
        <div class="space-y-2.5">
            <button onclick="processPayment(${amt})" class="w-full bg-[#3390ec] text-white font-medium py-3.5 rounded-xl btn-press text-sm flex items-center justify-center gap-2"><i class="fas fa-credit-card"></i> UzCard / Humo</button>
            <button onclick="processPayment(${amt})" class="w-full bg-teal-600 text-white font-medium py-3.5 rounded-xl btn-press text-sm flex items-center justify-center gap-2"><i class="fab fa-bitcoin"></i> Crypto (USDT)</button>
            <button onclick="processPayment(${amt})" class="w-full bg-[#2b5278] text-blue-200 font-medium py-3.5 rounded-xl btn-press text-sm flex items-center justify-center gap-2 border border-blue-400/20"><i class="fas fa-star"></i> Telegram Stars</button>
        </div>
    `);
}

async function processPayment(amt) {
    let modal = document.getElementById('ssModal'); if(modal) modal.remove();
    toast('Обработка платежа...');
    setTimeout(async () => {
        let cur = db.currentUser.stars || 0;
        await database.ref(`users/${db.currentUser.username}/stars`).set(cur + amt);
        toast(`Успешно! +${amt} ⭐ зачислено`);
    }, 1200);
}

async function reportMsg(mid) {
    if(!confirm('Отправить жалобу на это сообщение администратору?')) return;
    let snap = await database.ref(`messages/${activeChatId}/${mid}`).once('value');
    let m = snap.val(); if(!m) return;
    await database.ref(`reports/${mid}`).set({ 
        chatId: activeChatId, msgId: mid, from: m.from, 
        text: m.text || '[Файл/Медиа]', reportedBy: db.currentUser.username, at: Date.now() 
    });
    toast('Жалоба отправлена модераторам');
}

function openAdminModal() {
    if(document.getElementById('drawerMenu')?.classList.contains('-translate-x-full') === false) toggleDrawerMenu();
    let reports = db.reports || {};
    let rHtml = Object.keys(reports).map(rid => {
        let r = reports[rid];
        return `<div class="bg-[#0e1621] p-3.5 rounded-xl mb-3 text-sm border border-red-900/40">
            <div class="flex justify-between items-start mb-1"><span class="text-red-400 font-bold">На @${escapeHtml(r.from)}</span><span class="text-tg-gray text-[10px]">${timeFormat(r.at)}</span></div>
            <div class="text-white my-1.5 break-words">"${escapeHtml(r.text)}"</div>
            <div class="flex gap-2 mt-2">
                <button onclick="database.ref('users/${r.from}/banned').set(true); database.ref('reports/${rid}').remove(); toast('Пользователь забанен'); openAdminModal();" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded-lg text-xs btn-press">Бан</button>
                <button onclick="database.ref('reports/${rid}').remove(); toast('Жалоба скрыта'); openAdminModal();" class="bg-[#2b5278] hover:bg-[#203e5c] text-white px-3 py-1 rounded-lg text-xs btn-press">Скрыть</button>
            </div>
        </div>`;
    }).join('') || '<p class="text-tg-gray text-sm text-center py-4">Активных жалоб нет</p>';

    openModal('Админ Панель', `
        <h4 class="text-red-400 font-medium mb-2.5 text-sm flex items-center gap-2"><i class="fas fa-flag"></i> Жалобы пользователей</h4>
        <div class="max-h-60 overflow-y-auto mb-6 pr-1">${rHtml}</div>
        
        <h4 class="text-white font-medium mb-2.5 text-sm flex items-center gap-2"><i class="fas fa-users"></i> Управление пользователями</h4>
        <div class="max-h-60 overflow-y-auto bg-[#0e1621] rounded-xl p-2 pr-1 border border-black/20">
            ${Object.keys(db.users || {}).map(un => {
                let u = db.users[un];
                return `<div class="flex justify-between items-center border-b border-black/10 py-2.5 px-2 last:border-0">
                    <div class="min-w-0 pr-2">
                        <div class="text-white text-sm font-medium truncate">@${un} ${u.banned?'<span class="text-red-400 text-xs font-bold">(БАН)</span>':''}</div>
                        <div class="text-tg-gray text-xs truncate">Звёзд: ${u.stars||0} ⭐</div>
                    </div>
                    <button onclick="database.ref('users/${un}/banned').set(${!u.banned}); openAdminModal();" class="${u.banned?'bg-emerald-600 hover:bg-emerald-700':'bg-red-600 hover:bg-red-700'} text-white px-3 py-1.5 rounded-lg text-xs shrink-0 btn-press">${u.banned?'Разбан':'Бан'}</button>
                </div>`;
            }).join('')}
        </div>
    `);
}

function applyScale(val) {
    let wrap = document.getElementById('appScaleWrapper');
    if(wrap) wrap.style.transform = `scale(${val/100})`;
}
</script>
</body>
</html>
