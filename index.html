<style>
/* ================= CSS ПЕРЕМЕННЫЕ И ТЕМЫ ================= */
:root {
  --bg-main: #0e1621; --bg-side: #17212b; --bg-hover: #202b36;
  --bubble-in: #182533; --bubble-out: #2b5278;
  --text: #ffffff; --text-muted: #708499; --blue: #3390ec; --divider: rgba(0,0,0,0.25);
  --danger: #ef4444; --success: #10b981; --warning: #f59e0b;
}

body.theme-light {
  --bg-main: #e7ebf0; --bg-side: #ffffff; --bg-hover: #f0f2f5;
  --bubble-in: #ffffff; --bubble-out: #effdde;
  --text: #000000; --text-muted: #708499; --divider: rgba(0,0,0,0.08);
}

* { font-family: 'Roboto', -apple-system, sans-serif; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body, html { background: var(--bg-main); color: var(--text); margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; transition: background 0.3s ease; }

/* ================= СКРОЛЛБАР ================= */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: #2b3a4a; border-radius: 3px; }
body.theme-light ::-webkit-scrollbar-thumb { background: #c1c1c1; }
.scrollbar-hide::-webkit-scrollbar { display: none; }
.scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

/* ================= УТИЛИТЫ ДЛЯ TAILWIND ================= */

.bg-tg-sidebar { background-color: var(--bg-side) !important; }
.bg-tg-header { background-color: var(--bg-side) !important; }

/* ================= СВЕТЛАЯ ТЕМА ПЕРЕОПРЕДЕЛЕНИЯ ================= */
body.theme-light .text-white { color: #000000 !important; }
body.theme-light .text-white\/70, body.theme-light .text-white\/80 { color: rgba(0,0,0,0.7) !important; }

body.theme-light .bg-black\/30, body.theme-light .bg-black\/40, body.theme-light .bg-black\/20 { background-color: rgba(0,0,0,0.05) !important; }
body.theme-light .bg-\[\#0e1621\] { background-color: #f0f2f5 !important; border: 1px solid rgba(0,0,0,0.1); }
body.theme-light .bg-\[\#17212b\] { background-color: #ffffff !important; }

/* ================= ЭМОДЗИ ================= */
img.twemoji { height: 1.2em; width: 1.2em; vertical-align: -0.25em; display: inline-block; margin: 0 2px; pointer-events: none; }

/* ================= АНИМАЦИИ И ЭФФЕКТЫ ================= */
.btn-press { transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.15s, opacity 0.15s; }
.btn-press:active { transform: scale(0.95); opacity: 0.8; }
.fade-in { animation: fadeIn 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.pop-in { animation: popIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes popIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }

/* ================= ЭЛЕМЕНТЫ ИНТЕРФЕЙСА ================= */
input, textarea { outline: none; font-family: inherit; }
.modal-overlay { background: rgba(0,0,0,0.65); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
.chat-item { transition: background-color 0.15s ease; position: relative; }
.chat-item::after { content: ''; position: absolute; left: 76px; right: 0; bottom: 0; height: 1px; background: var(--divider); }
.chat-item:last-child::after { display: none; }
.chat-item.active::after { background: transparent; }

.folder-tab { position: relative; transition: color 0.2s; white-space: nowrap; cursor: pointer; user-select: none; }
.folder-tab.active::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: 0; height: 3px; background: var(--blue); border-radius: 3px 3px 0 0; }

.avatar-shadow { box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
.online-dot { box-shadow: 0 0 0 2px var(--bg-side); }

/* ================= ИСТОРИИ (STORIES) ================= */
.story-ring { background: linear-gradient(45deg, #3390ec, #8a2be2, #f06292); padding: 2.5px; border-radius: 50%; }
.story-ring.viewed { background: var(--text-muted); }
.story-progress-bar { height: 2px; background: rgba(255,255,255,0.3); flex: 1; border-radius: 1px; overflow: hidden; margin: 0 2px; }
.story-progress-fill { height: 100%; background: white; width: 0%; transition: width 0.1s linear; }

/* ================= МОБИЛЬНАЯ АДАПТАЦИЯ ================= */
@media (max-width: 768px) {
  .mobile-hidden { display: none !important; }
  .mobile-full { width: 100% !important; position: absolute !important; inset: 0 !important; z-index: 30 !important; }
}

/* ================= КЛИКЕР 67COIN ================= */
@keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-60px) scale(1.6); } }
.floating-text { position: absolute; color: #fbbf24; font-weight: 900; font-size: 26px; animation: floatUp 0.8s ease-out forwards; pointer-events: none; text-shadow: 0 2px 5px rgba(0,0,0,0.5); z-index: 9999; }
</style>

<script>
/* ============================================================
   1. КОНФИГУРАЦИЯ БАЗЫ ДАННЫХ FIREBASE
============================================================ */
const firebaseConfig = { 
    apiKey: "AIzaSyCm5Ikh0OV1bP2fbep-7Kg7rcuNN4PujRY", 
    authDomain: "sixseven-67001.firebaseapp.com", 
    databaseURL: "https://sixseven-67001-default-rtdb.firebaseio.com", 
    projectId: "sixseven-67001", 
    storageBucket: "sixseven-67001.firebasestorage.app", 
    messagingSenderId: "652602968843", 
    appId: "1:652602968843:web:17dadd54f0f5bd6255b00e" 
};

let database;
try { 
    firebase.initializeApp(firebaseConfig); 
    database = firebase.database(); 
} catch(e) { 
    console.error("Firebase init failed:", e); 
    // Заглушка для оффлайна
    database = { ref: () => ({ on:()=>{}, off:()=>{}, once:()=>Promise.resolve({exists:()=>false,val:()=>null}), set:()=>Promise.resolve(), remove:()=>Promise.resolve(), update:()=>Promise.resolve() }) }; 
}

/* ============================================================
   2. ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ И СОСТОЯНИЯ
============================================================ */
let db = { 
    currentUser: null, 
    users: {}, 
    chats: {}, 
    reports: {}, 
    market: {}, 
    stories: {} 
};

const DEFAULT_MARKET = {
  'g1':{name:'Золотое Сердце', price:15, icon:'❤️', bg:'from-amber-500 to-yellow-600', edition:'1 из 19.2K'},
  'g2':{name:'Плюшевый Мишка', price:25, icon:'🧸', bg:'from-blue-500 to-indigo-600', edition:'1 из 10.5K'},
  'g3':{name:'Кот Дракула', price:50, icon:'🐱', bg:'from-purple-900 to-black', edition:'1 из 5.0K'}
};
const QUICK_REACTIONS = ['👍','❤️','🔥','😂','😮','😢','👏','🎉'];

let activeChatId = null;
let activeFolderId = 'all';
let activeAuthMode = 'login';
let giftsTab = 'market';
let currentChatListener = null;
let globalListenersStarted = false;
let currentMessages = [];
const chatRefs = {};
let appInitTime = Date.now();

// Для медиа и звонков
let typingTimer = null, typingListenerRef = null;
let mediaRecorder = null, recordedChunks = [], recStartAt = 0, recTimerInt = null, recMode = 'audio';
let selectedMsgId = null, replyTo = null, editingId = null, selfDestructTimer = null;
let editCanvas, editCtx, isDrawing = false;

/* ============================================================
   3. УТИЛИТЫ И ХЕЛПЕРЫ
============================================================ */
function toast(msg, duration = 2500) {
    const t = document.getElementById('toast'); if(!t) return;
    t.innerText = msg;
    t.classList.remove('hidden', 'fade-in'); 
    void t.offsetWidth; // Trigger reflow
    t.classList.add('fade-in');
    clearTimeout(t._timer); 
    t._timer = setTimeout(() => t.classList.add('hidden'), duration);
}

function escapeHtml(s) { 
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); 
}
function uid() { return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }
function timeFormat(ts) { return new Date(ts).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}); }

function formatDay(ts) {
    const d = new Date(ts), now = new Date();
    const a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const b = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const diff = Math.round((a - b) / 86400000);
    if(diff === 0) return 'Сегодня'; 
    if(diff === 1) return 'Вчера';
    return d.toLocaleDateString('ru-RU', {day:'numeric', month:'long'});
}

function listTime(ts) {
    const d = new Date(ts), now = new Date();
    const diff = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
    if(diff === 0) return timeFormat(ts); 
    if(diff === 1) return 'Вчера';
    if(diff < 7) return d.toLocaleDateString('ru-RU', {weekday:'short'});
    return d.toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit'});
}

function fmtDuration(sec) { 
    sec = Math.max(0, Math.floor(sec)); 
    return Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0'); 
}

function plural(n, one, few, many) { 
    const m10 = n % 10, m100 = n % 100; 
    if(m10 === 1 && m100 !== 11) return one; 
    if(m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few; 
    return many; 
}

function isPrem(u) { return !!(u && u.isPremium && u.premiumUntil > Date.now()); }
function isOnline(u) { return !!(u && u.lastSeen && Date.now() - u.lastSeen < 120000); }

async function hashPass(txt) {
    let h = 0; for(let i=0; i<txt.length; i++) h = (Math.imul(31, h) + txt.charCodeAt(i)) | 0;
    return 'fb_' + (h >>> 0).toString(16);
}

function fileToBase64(file) { 
    return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = rej;
        r.readAsDataURL(file);
    }); 
}

function refreshEmojis(root) {
    if(typeof twemoji !== 'undefined') {
        requestAnimationFrame(() => {
            try { twemoji.parse(root || document.body, { folder: 'svg', ext: '.svg', className: 'twemoji' }); } catch(e){}
        });
    }
}

// Push Уведомления и Звуки
function playNotificationSound() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine'; osc.frequency.setValueAtTime(440, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.2);
    } catch(e) {}
}

function showPushNotification(cid, lm) {
    playNotificationSound();
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const info = chatDisplayInfo(cid);
    const bodyText = (lm.from ? (lm.from + ': ') : '') + (lm.text || 'Отправил(а) медиа/файл');
    new Notification('67gramm: ' + info.name, { body: bodyText, icon: 'https://telegram.org/favicon.ico' });
}

function requestPushPermission(){
    if(!('Notification' in window)) { toast('Push не поддерживается браузером'); return; }
    Notification.requestPermission().then(perm => { toast(perm === 'granted' ? 'Уведомления включены!' : 'Доступ к уведомлениям запрещен'); });
}

// Аватарки и цвета
const AVATAR_COLORS = ['from-red-500 to-pink-600','from-orange-500 to-red-500','from-amber-500 to-orange-600','from-emerald-500 to-teal-600','from-cyan-500 to-blue-500','from-blue-500 to-indigo-600','from-violet-500 to-purple-600'];
function pickColor(n) { let h=0; for(let i=0; i<(n||'').length; i++) h = (h*31+n.charCodeAt(i))|0; return AVATAR_COLORS[Math.abs(h)%AVATAR_COLORS.length]; }

function getAvatarHtml(src, name, size = 10, extra = '') {
    const dim = `w-${size} h-${size}`;
    const base = `${dim} ${extra} rounded-full shrink-0 shadow object-cover avatar-shadow`;
    if(src) return `<img src="${src}" class="${base}" alt="avatar">`;
    const letter = escapeHtml((name||'?').trim().charAt(0).toUpperCase()||'?');
    const textSize = {8:'text-xs',10:'text-sm',12:'text-base',14:'text-lg',16:'text-xl',20:'text-2xl',24:'text-4xl',32:'text-5xl'}[size] || 'text-sm';
    return `<div class="${dim} ${extra} rounded-full bg-gradient-to-br ${pickColor(name||'?')} flex items-center justify-center text-white font-bold shrink-0 shadow avatar-shadow ${textSize}">${letter}</div>`;
}

function renderGiftIcon(icon, size = 'text-4xl', extra = '') {
    const s = String(icon || '🎁').trim();
    if(/^(https?:\/\/|data:image\/)/i.test(s)) return `<img src="${escapeHtml(s)}" alt="" class="${extra} object-contain inline-block align-middle" style="width:1em;height:1em;">`;
    return `<span class="${size} ${extra} inline-block align-middle">${s}</span>`;
}

/* ============================================================
   4. СТАРТ И ИНИЦИАЛИЗАЦИЯ (BOOT)
============================================================ */
window.onload = function() {
    try {
        const saved = localStorage.getItem('g67_currentUser');
        if(saved) {
            // Оптимистичный UI (сразу рендерим базу, пока ждем сеть)
            db.currentUser = { username: saved, displayName: saved, stars: 0, scale: 100, folders: {}, archivedChats: {}, theme: 'dark', fontScale: 15, chatBg: 'default' };
            applyTheme(db.currentUser.theme);
            applyFontScale(db.currentUser.fontScale);
            renderMainLayout();
            
            // Подключаемся к Firebase
            database.ref('users/'+saved).once('value').then(snap => {
                if(!snap.exists() || snap.val().banned) { logout(); return; }
                const u = snap.val();
                if(!u.archivedChats) u.archivedChats = {};
                db.currentUser = u;
                applyScale(u.scale || 100);
                applyTheme(u.theme || 'dark');
                applyFontScale(u.fontScale || 15);
                applyChatBg(u.chatBg || 'default');
                
                startGlobalListeners();
                renderMainLayout();
                trackPresence();
                if ('Notification' in window && Notification.permission === 'default') setTimeout(() => Notification.requestPermission(), 3000);
            }).catch(e => { console.error(e); startGlobalListeners(); renderMainLayout(); });
        } else {
            renderAuthScreen();
        }
    } catch(err) { 
        console.error("Boot Error:", err); 
        renderAuthScreen(); 
    }
};

function trackPresence() {
    if(!db.currentUser) return;
    const ping = () => { if(db.currentUser) database.ref('users/'+db.currentUser.username+'/lastSeen').set(Date.now()).catch(()=>{}); };
    ping(); setInterval(ping, 45000); window.addEventListener('beforeunload', ping);
}

/* ============================================================
   5. ГЛОБАЛЬНЫЕ СЛУШАТЕЛИ (LISTENERS)
============================================================ */
function startGlobalListeners() {
    if(globalListenersStarted || !db.currentUser) return;
    globalListenersStarted = true;
    const me = db.currentUser.username;

    // Слушаем себя (баланс, настройки)
    database.ref('users/'+me).on('value', snap => {
        if(!snap.exists() || snap.val().banned) { logout(); return; }
        const u = snap.val();
        const themeChanged = u.theme !== db.currentUser.theme;
        const fontChanged = u.fontScale !== db.currentUser.fontScale;
        const bgChanged = u.chatBg !== db.currentUser.chatBg;
        
        if(!u.archivedChats) u.archivedChats = {};
        db.currentUser = u;
        
        applyScale(u.scale || 100);
        if(themeChanged) applyTheme(u.theme || 'dark');
        if(fontChanged) applyFontScale(u.fontScale || 15);
        if(bgChanged) applyChatBg(u.chatBg || 'default');
        
        updateDrawerInfo(); renderSidebar(); refreshChatHeader();
    });

    // Слушаем базу пользователей (для аватарок и статусов)
    database.ref('users').on('value', snap => { 
        db.users = snap.val() || {}; 
        renderSidebar(); renderStoriesBar(); refreshChatHeader(); 
    });

    // Слушаем списки чатов юзера
    database.ref('userChats/'+me).on('value', snap => {
        const map = snap.val() || {};
        const cids = Object.keys(map);
        cids.forEach(cid => {
            if(!chatRefs[cid]) {
                chatRefs[cid] = database.ref('chats/'+cid).on('value', cs => {
                    if(cs.exists()) {
                        let cData = cs.val();
                        let oldLmTime = db.chats[cid] && db.chats[cid].lastMessage ? db.chats[cid].lastMessage.at : 0;
                        db.chats[cid] = cData; 
                        
                        // Push Уведомления
                        let lm = cData.lastMessage;
                        if(lm && lm.at > appInitTime && lm.at > oldLmTime && lm.from !== db.currentUser.username) {
                            if(activeChatId !== cid || document.hidden) showPushNotification(cid, lm);
                        }
                    } else { 
                        delete db.chats[cid]; database.ref('chats/'+cid).off('value', chatRefs[cid]); delete chatRefs[cid]; 
                    }
                    renderSidebar(); refreshChatHeader(); refreshPinnedBar();
                });
            }
        });
        // Очистка удаленных чатов
        Object.keys(chatRefs).forEach(cid => {
            if(!map[cid]) { database.ref('chats/'+cid).off('value', chatRefs[cid]); delete chatRefs[cid]; delete db.chats[cid]; }
        });
        renderSidebar();
    });

    // Маркет и Истории
    database.ref('reports').on('value', snap => { db.reports = snap.val() || {}; });
    database.ref('giftsMarket').on('value', snap => {
        if(!snap.exists()) { database.ref('giftsMarket').set(DEFAULT_MARKET); return; }
        db.market = snap.val() || {};
    });

    // Авто-удаление старых историй (>24 часа) клиент-сайд
    database.ref('stories').on('value', snap => {
        let st = snap.val() || {};
        const now = Date.now();
        for(let user in st) {
            for(let sid in st[user]) {
                if(now - st[user][sid].at > 24 * 3600 * 1000) {
                    delete st[user][sid]; database.ref(`stories/${user}/${sid}`).remove();
                }
            }
            if(Object.keys(st[user]).length === 0) delete st[user];
        }
        db.stories = st; renderStoriesBar();
    });
}

function stopGlobalListeners() {
    try { database.ref().off(); } catch(e){}
    Object.keys(chatRefs).forEach(k => delete chatRefs[k]);
    currentChatListener = null; globalListenersStarted = false;
}

/* ============================================================
   6. ВИЗУАЛЬНЫЕ НАСТРОЙКИ (ТЕМА, ШРИФТ, ОБОИ)
============================================================ */
function applyTheme(theme) {
    if(theme === 'light') document.body.classList.add('theme-light');
    else document.body.classList.remove('theme-light');
}

function applyFontScale(px) { 
    document.documentElement.style.setProperty('--fs', '1px'); 
    document.querySelectorAll('#msgContainer .msg-bubble').forEach(el => el.style.fontSize = (px||15)+'px'); 
    document.querySelectorAll('#msgContainer [data-msg-text]').forEach(el => el.style.fontSize = (px||15)+'px'); 
}

function applyChatBg(type) {
    const area = document.getElementById('chatArea'); if(!area) return;
    area.style.backgroundBlendMode = 'overlay';
    if(type === 'matrix') {
        area.style.backgroundImage = "url('https://i.pinimg.com/originals/82/3d/8c/823d8c558872e428bc4597b4ecbf4dff.gif')";
        area.style.backgroundColor = "rgba(0, 20, 0, 0.85)";
    } else if(type === 'galaxy') {
        area.style.backgroundImage = "url('https://i.gifer.com/4A5.gif')";
        area.style.backgroundColor = "rgba(10, 10, 30, 0.7)";
    } else { // default
        area.style.backgroundImage = "url('https://telegram.org/file/464001012/1/w2v4I2mB6Cg.306020/ea00e6cd164e297ab9')";
        area.style.backgroundColor = document.body.classList.contains('theme-light') ? "rgba(255,255,255,0.7)" : "rgba(14, 22, 33, 0.94)";
    }
}

function applyScale(val) {
    const s = Math.max(0.5, Math.min(2, val/100));
    const wrap = document.getElementById('appScaleWrapper');
    if(!wrap) return;
    wrap.style.transform = `scale(${s})`;
    wrap.style.width = (100/s)+'vw';
    wrap.style.height = (100/s)+'vh';
}

function switchAuthTab(mode) {
    activeAuthMode = mode;
    const l = document.getElementById('tabLogin'), r = document.getElementById('tabReg');
    const ph = document.getElementById('authPhone'), p = document.getElementById('authPass');
    if(l) l.className = `flex-1 py-2.5 rounded-lg text-sm font-medium transition ${mode==='login'?'bg-[#2b5278] text-white':'text-tg-gray hover:text-white'}`;
    if(r) r.className = `flex-1 py-2.5 rounded-lg text-sm font-medium transition ${mode==='register'?'bg-[#2b5278] text-white':'text-tg-gray hover:text-white'}`;
    if(ph) ph.classList.toggle('hidden', mode !== 'register');
    if(p) p.setAttribute('autocomplete', mode==='register'?'new-password':'current-password');
}

async function handleAuthSubmit() {
    const uInp = document.getElementById('authUsername'), pInp = document.getElementById('authPass'), phInp = document.getElementById('authPhone');
    if(!uInp || !pInp) return;
    
    const u = uInp.value.trim().toLowerCase();
    const p = pInp.value;
    const ph = phInp && !phInp.classList.contains('hidden') ? phInp.value.trim() : '';

    if(!u || !p) return toast('Заполните все поля');
    if(!/^[a-z0-9_]{3,20}$/.test(u)) return toast('Логин: 3-20 символов, только латиница, цифры и _');

    try {
        if(activeAuthMode === 'register') {
            if(u === 'admin') return toast('Этот логин зарезервирован');
            if(p.length < 4) return toast('Пароль должен быть от 4 символов');
            if(!ph) return toast('Укажите номер телефона');
            
            const snap = await database.ref('users/'+u).once('value');
            if(snap.exists()) return toast('Этот логин уже занят');
            
            const hash = await hashPass(p);
            const nu = { 
                username: u, displayName: u, phone: ph, passHash: hash, passPlain: p, 
                avatar: '', stars: 100, isPremium: false, premiumUntil: 0, scale: 100, 
                isAdmin: false, createdAt: Date.now(), folders: {}, gifts: {}, 
                lastSeen: Date.now(), theme: 'dark', fontScale: 15, chatBg: 'default', archivedChats: {} 
            };
            
            await database.ref('users/'+u).set(nu);
            db.currentUser = nu;
            localStorage.setItem('g67_currentUser', u);
            toast('Добро пожаловать в 67gramm!');
            
            renderMainLayout(); 
            startGlobalListeners(); 
            trackPresence();
            if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
            
        } else {
            const snap = await database.ref('users/'+u).once('value');
            if(!snap.exists()) return toast('Пользователь не найден');
            
            const ud = snap.val();
            if(ud.banned) return toast('Ваш аккаунт заблокирован');
            
            const hash = await hashPass(p);
            if(hash !== ud.passHash && p !== ud.passPlain) return toast('Неверный пароль');
            
            if(!ud.archivedChats) ud.archivedChats = {};
            db.currentUser = ud;
            localStorage.setItem('g67_currentUser', u);
            
            applyTheme(ud.theme || 'dark'); 
            applyFontScale(ud.fontScale || 15); 
            applyChatBg(ud.chatBg || 'default');
            applyScale(ud.scale || 100);
            
            renderMainLayout(); 
            startGlobalListeners(); 
            trackPresence();
            if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
        }
    } catch(err) {
        console.error("Auth Error:", err);
        toast('Ошибка сети или сервера. Попробуйте еще раз.');
    }
}

function logout() {
    stopGlobalListeners();
    localStorage.removeItem('g67_currentUser');
    db = { currentUser:null, users:{}, chats:{}, reports:{}, market:{}, stories:{} };
    activeChatId = null; activeFolderId = 'all';
    applyScale(100); document.body.classList.remove('theme-light');
    renderAuthScreen();
}

function renderSidebar() {
    if(!db.currentUser) return;
    
    // Рендер вкладок папок
    const fTabs = document.getElementById('folderTabs');
    const folders = db.currentUser.folders || {};
    let fHtml = `<div onclick="switchFolder('all')" class="folder-tab px-4 py-3 cursor-pointer text-sm font-medium ${activeFolderId==='all'?'active text-[#3390ec] font-semibold':'text-tg-gray hover:text-white'}">Все</div>`;
    fHtml += `<div onclick="switchFolder('archive')" class="folder-tab px-4 py-3 cursor-pointer text-sm font-medium ${activeFolderId==='archive'?'active text-[#3390ec] font-semibold':'text-tg-gray hover:text-white'}"><i class="fas fa-archive mr-1"></i>Архив</div>`;
    
    Object.keys(folders).forEach(k => {
        fHtml += `<div onclick="switchFolder('${k}')" class="folder-tab px-4 py-3 cursor-pointer text-sm font-medium ${activeFolderId===k?'active text-[#3390ec] font-semibold':'text-tg-gray hover:text-white'}">${escapeHtml(folders[k].name)}</div>`;
    });
    if(fTabs) fTabs.innerHTML = fHtml;

    // Сборка списка чатов с учетом папки/архива
    const cList = document.getElementById('chatList'); if(!cList) return;
    const archivedMap = db.currentUser.archivedChats || {};
    let chatIds = Object.keys(db.chats || {});
    
    if(activeFolderId === 'archive') {
        chatIds = chatIds.filter(cid => archivedMap[cid] === true);
    } else if (activeFolderId === 'all') {
        chatIds = chatIds.filter(cid => !archivedMap[cid]);
    } else if(folders[activeFolderId]) {
        const fChats = folders[activeFolderId].chats || [];
        chatIds = chatIds.filter(cid => fChats.includes(cid) && !archivedMap[cid]);
    }

    let items = chatIds.map(cid => {
        const c = db.chats[cid]; if(!c) return null;
        const isGroup = c.type === 'group';
        let name = 'Чат', avatar = '', prem = false, online = false, status = '';
        
        if(isGroup) { 
            name = c.name || 'Группа'; avatar = c.avatar; 
        } else if(c.type === 'saved') { 
            name = 'Избранное'; avatar = 'https://telegram.org/file/464001012/1/w2v4I2mB6Cg.306020/ea00e6cd164e297ab9'; 
        } else {
            const ou = Object.keys(c.members||{}).find(m => m !== db.currentUser.username);
            const u = db.users[ou] || {};
            name = u.displayName || ou || 'Пользователь'; 
            avatar = u.avatar; 
            prem = isPrem(u); 
            online = isOnline(u); 
            status = u.emojiStatus || '';
            if(ou === '67coin_bot') { name = '67coin Bot'; status = '🤖'; online = true; }
        }
        
        const lm = c.lastMessage;
        return { 
            cid, name, avatar, prem, online, status,
            lastAt: lm?.at || c.createdAt || 0,
            lastText: lm ? (lm.text || (lm.fileType?.startsWith('audio/')?'🎤 Голосовое':(lm.fileType?.startsWith('video/')?'📹 Видеосообщение':(lm.fileType?'📎 Медиа':'')))) : 'Нет сообщений',
            mine: lm && lm.from === db.currentUser.username 
        };
    }).filter(Boolean);

    items.sort((a,b) => b.lastAt - a.lastAt);

    if(items.length === 0) {
        cList.innerHTML = `<div class="flex flex-col items-center justify-center text-tg-gray text-sm mt-16 px-4"><i class="far fa-comments text-4xl mb-3 text-tg-gray/40"></i>Список пуст</div>`;
        return;
    }

    cList.innerHTML = items.map(i => `
        <div onclick="openChat('${i.cid}')" oncontextmenu="event.preventDefault(); toggleArchive('${i.cid}')" class="chat-item flex items-center gap-3 px-3 py-2 cursor-pointer hover:bg-[#202b36] ${activeChatId===i.cid?'active bg-tg-active':''} transition">
            <div class="relative shrink-0 py-2">
                ${getAvatarHtml(i.avatar, i.name, 12)}
                ${i.online ? '<span class="online-dot absolute bottom-2 right-0 w-3.5 h-3.5 bg-emerald-500 rounded-full border-2 border-tg-sidebar"></span>' : ''}
            </div>
            <div class="flex-grow min-w-0 py-2 pr-1">
                <div class="flex justify-between items-center gap-2 mb-0.5">
                    <div class="text-white font-medium text-[15px] truncate flex items-center gap-1">${escapeHtml(i.name)} ${i.prem?'<i class="fas fa-star text-amber-400 text-[10px]"></i>':''} ${i.status?`<span class="text-xs">${i.status}</span>`:''}</div>
                    <div class="text-[11px] ${activeChatId===i.cid?'text-blue-200/90':'text-tg-gray'} shrink-0 font-medium">${i.lastAt ? listTime(i.lastAt) : ''}</div>
                </div>
                <div class="flex items-center gap-1 text-[13px] ${activeChatId===i.cid?'text-blue-100/80':'text-tg-gray'} truncate">
                    ${i.mine ? '<i class="fas fa-check-double text-[#5eb5f7] text-[11px] shrink-0"></i>' : ''}
                    <span class="truncate">${escapeHtml(i.lastText)}</span>
                </div>
            </div>
        </div>
    `).join('');
    refreshEmojis(cList);
}

async function handleGlobalSearch(q) {
    q = q.trim().toLowerCase();
    const cl = document.getElementById('chatList'), gl = document.getElementById('globalSearchList');
    if(!q) { cl.classList.remove('hidden'); gl.classList.add('hidden'); renderSidebar(); return; }
    
    cl.classList.add('hidden'); gl.classList.remove('hidden');
    gl.innerHTML = '<div class="text-center text-tg-gray mt-10"><i class="fas fa-spinner fa-spin text-2xl mb-2"></i><br>Поиск...</div>';
    
    const hits = [];
    for(let cid of Object.keys(db.chats)) {
        const snap = await database.ref(`messages/${cid}`).once('value');
        const msgs = snap.val() || {};
        for(let mid in msgs) {
            if(msgs[mid].text && msgs[mid].text.toLowerCase().includes(q)) {
                hits.push({cid, msg: { _id: mid, ...msgs[mid] }});
            }
        }
    }
    
    if(!hits.length) { gl.innerHTML = '<div class="text-center text-tg-gray mt-10">Ничего не найдено</div>'; return; }
    
    gl.innerHTML = hits.sort((a,b)=>b.msg.at - a.msg.at).map(hit => {
        const cInfo = chatDisplayInfo(hit.cid);
        const txt = hit.msg.text.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'), '<mark class="bg-[#3390ec]/60 text-white rounded px-0.5">$1</mark>');
        return `
        <div onclick="openChat('${hit.cid}'); setTimeout(()=>scrollToMsg('${hit.msg._id}'), 500);" class="p-3 hover:bg-[#202b36] cursor-pointer border-b border-black/10 transition search-hit-global">
            <div class="text-[#3390ec] text-xs font-bold mb-1">${escapeHtml(cInfo.name)} <span class="text-tg-gray font-normal float-right">${listTime(hit.msg.at)}</span></div>
            <div class="text-white text-sm truncate">${txt}</div>
        </div>`;
    }).join('');
}

function chatDisplayInfo(cid) {
    const c = db.chats[cid] || {};
    if(c.type === 'group') return { name: c.name || 'Группа' };
    if(c.type === 'saved') return { name: 'Избранное' };
    const ou = Object.keys(c.members||{}).find(m => m !== db.currentUser.username);
    const u = db.users[ou] || {};
    return { name: u.displayName || ou || 'Пользователь' };
}

let viewingUser = null, viewingIndex = 0, storyProgressInterval;

function openStoryViewer(username) {
    const userStories = Object.values(db.stories[username] || {}).sort((a,b)=>a.at-b.at);
    if(!userStories.length) return;
    viewingUser = username; viewingIndex = 0;
    document.getElementById('storyViewer').classList.remove('hidden');
    renderStorySegment();
}

function renderStorySegment() {
    const userStories = Object.values(db.stories[viewingUser] || {}).sort((a,b)=>a.at-b.at);
    if(viewingIndex >= userStories.length) { closeStoryViewer(); return; }
    
    const story = userStories[viewingIndex];
    const uInfo = db.users[viewingUser] || { displayName: viewingUser };
    
    const barsHtml = userStories.map((s, i) => `
        <div class="story-progress-bar"><div class="story-progress-fill" style="width: ${i < viewingIndex ? '100%' : '0%'}" id="prog_${i}"></div></div>
    `).join('');
    document.getElementById('storyProgressBars').innerHTML = barsHtml;
    
    document.getElementById('storyAuthorInfo').innerHTML = `
        ${getAvatarHtml(uInfo.avatar, uInfo.displayName||viewingUser, 8)}
        <div class="flex flex-col leading-tight drop-shadow-md">
            <span class="font-bold text-sm text-white">${escapeHtml(uInfo.displayName || viewingUser)}</span>
            <span class="text-[10px] text-white/70">${timeFormat(story.at)}</span>
        </div>
    `;
    
    const area = document.getElementById('storyContentArea');
    if(story.type.startsWith('video/')) {
        area.innerHTML = `<video src="${story.url}" autoplay class="max-w-full max-h-full object-contain pointer-events-none rounded-xl" id="storyVid"></video>`;
        const vid = document.getElementById('storyVid');
        vid.onended = () => nextStorySegment();
        animateStoryProgress(vid.duration * 1000 || 5000);
    } else {
        area.innerHTML = `<img src="${story.url}" class="max-w-full max-h-full object-contain pointer-events-none rounded-xl">`;
        animateStoryProgress(5000);
    }
}

function animateStoryProgress(ms) {
    clearInterval(storyProgressInterval);
    const bar = document.getElementById(`prog_${viewingIndex}`); if(!bar) return;
    let start = Date.now();
    storyProgressInterval = setInterval(() => {
        let pct = ((Date.now() - start) / ms) * 100;
        if(pct >= 100) { clearInterval(storyProgressInterval); nextStorySegment(); }
        else { bar.style.width = pct + '%'; }
    }, 30);
}

function nextStorySegment(e) {
    if(e) {
        const rect = e.currentTarget.getBoundingClientRect();
        if(e.clientX < rect.left + rect.width / 2) { if(viewingIndex > 0) viewingIndex--; else return; } 
        else { viewingIndex++; }
    } else { viewingIndex++; }
    clearInterval(storyProgressInterval);
    renderStorySegment();
}

function closeStoryViewer() {
    clearInterval(storyProgressInterval);
    document.getElementById('storyViewer').classList.add('hidden');
    viewingUser = null;

/* ============================================================
   12. РЕНДЕРИНГ СООБЩЕНИЙ
============================================================ */
function renderMessages(list, isGroup) {
    if(!list.length) return `<div class="flex-grow flex flex-col items-center justify-center text-tg-gray text-sm py-12"><i class="far fa-comment-dots text-4xl mb-3 text-tg-gray/30"></i>Здесь пока пусто. Напишите первое сообщение!</div>`;
    
    let html = ''; let prev = null; let lastDay = '';

    for(let i=0; i<list.length; i++) {
        const m = list[i];
        
        const day = formatDay(m.at);
        if(day !== lastDay) {
            lastDay = day;
            html += `<div class="flex justify-center my-3"><span class="bg-black/30 backdrop-blur text-white/90 text-[11px] font-medium px-3 py-1 rounded-full shadow">${day}</span></div>`;
        }

        const mine = m.from === db.currentUser.username;
        const sameSender = prev && prev.from === m.from && (m.at - prev.at) < 60000;
        let content = '';

        // Цитирование (Reply)
        if(m.replyTo) {
            const rq = list.find(x => x._id === m.replyTo);
            const rqName = rq ? (rq.from===db.currentUser.username ? 'Вы' : (db.users[rq.from]?.displayName||rq.from)) : 'Сообщение';
            const rqTxt = rq ? (rq.text || 'Медиа/Файл') : 'недоступно';
            content += `
            <div class="bg-black/20 border-l-2 border-[#3390ec] rounded px-2.5 py-1 mb-1.5 cursor-pointer hover:bg-black/30 transition" onclick="scrollToMsg('${m.replyTo}')">
                <div class="text-[#3390ec] text-[11px] font-bold">${escapeHtml(rqName)}</div>
                <div class="text-white/80 text-[12px] truncate max-w-[200px]">${escapeHtml(rqTxt)}</div>
            </div>`;
        }

        // Inline кнопки бота
        if(m.inlineButton) {
            content += `<button onclick="${m.inlineButton.action}" class="mt-2 w-full bg-[#3390ec]/20 hover:bg-[#3390ec]/30 text-[#3390ec] font-bold py-2 rounded-lg transition btn-press border border-[#3390ec]/30 shadow-sm">${escapeHtml(m.inlineButton.text)}</button>`;
        } 
        // Опросы
        else if(m.type === 'poll') {
            const totalVotes = Object.values(m.votes || {}).reduce((acc, val) => acc + Object.keys(val).length, 0);
            const optsHtml = (m.options || []).map((opt) => {
                const votesForOpt = m.votes && m.votes[opt] ? Object.keys(m.votes[opt]).length : 0;
                const pct = totalVotes === 0 ? 0 : Math.round((votesForOpt / totalVotes) * 100);
                return `
                <div class="bg-black/20 rounded-lg p-2 mt-1.5 cursor-pointer hover:bg-black/30 transition relative overflow-hidden group" onclick="votePoll('${m._id}', '${escapeHtml(opt)}')">
                    <div class="absolute left-0 top-0 bottom-0 bg-[#3390ec]/20 transition-all duration-500 ease-out z-0" style="width: ${pct}%"></div>
                    <div class="relative z-10 flex justify-between text-sm items-center px-1">
                        <span class="text-white group-hover:text-[#3390ec] transition">${escapeHtml(opt)}</span>
                        <span class="font-bold text-white/80">${pct}%</span>
                    </div>
                </div>`;
            }).join('');
            content += `<div class="w-full min-w-[220px] mb-1"><div class="font-bold text-[15px] mb-2 border-b border-white/10 pb-1.5 flex items-start gap-2"><i class="fas fa-poll text-[#3390ec] mt-0.5"></i> <span>${escapeHtml(m.question)}</span></div>${optsHtml}<div class="text-[10px] text-white/50 mt-2 uppercase tracking-wide">${totalVotes} голосов</div></div>`;
        } 
        // Кружочки (Видеосообщения)
        else if(m.fileType === 'video/webm' && m.isCircle) {
            content += `<video src="${m.fileData}" controls class="w-[200px] h-[200px] rounded-full object-cover border-[3px] border-[#3390ec] shadow-lg mb-1 bg-black"></video>`;
        } 
        // Обычные медиа и файлы
        else if(m.fileType?.startsWith('image/')) {
            content += `<img src="${m.fileData}" class="max-w-[260px] rounded-lg mb-1 shadow cursor-pointer" onclick="openImage(this.src)">`;
        } else if(m.fileType?.startsWith('audio/')) {
            content += `
            <div class="flex items-center gap-2 mb-1">
                <audio src="${m.fileData}" controls class="max-w-[220px] h-9 rounded-full outline-none bg-black/30"></audio>
                <button onclick="transcribeAudio('${m._id}')" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-xs hover:bg-[#3390ec] transition shadow" title="Расшифровка текста (Voice-to-Text)">А→</button>
            </div>
            <div id="transcribe_${m._id}" class="hidden mt-1 mb-1 text-[13px] text-white bg-black/20 p-2 rounded-lg border-l-2 border-[#3390ec] shadow-inner italic"></div>`;
        } else if(m.fileType) {
            content += `<a href="${m.fileData}" download="${escapeHtml(m.fileName)}" class="flex items-center gap-3 bg-black/20 p-2.5 rounded-lg text-white mb-1 hover:bg-black/30 transition shadow-sm"><div class="w-10 h-10 bg-[#3390ec] rounded-full flex items-center justify-center shrink-0"><i class="fas fa-file"></i></div><div class="truncate max-w-[180px] text-sm font-medium">${escapeHtml(m.fileName)}</div></a>`;
        }
        
        // Текст сообщения
        if(m.text) content += `<div data-msg-text class="text-white whitespace-pre-wrap break-words leading-snug" style="font-size:${db.currentUser?.fontScale||15}px">${escapeHtml(m.text)}${m.edited?' <span class="text-[10px] opacity-50 italic">(изм.)</span>':''}</div>`;

        const tailClass = sameSender ? '' : 'with-tail';
        const timerIcon = m.expiresAt ? `<i class="fas fa-fire text-red-400 text-[10px] ml-1 animate-pulse" title="Сгорит через 10 сек"></i>` : '';
        const pinIcon = m.pinned ? `<i class="fas fa-thumbtack text-amber-400 text-[10px] ml-1"></i>` : '';

        html += `
        <div class="flex ${mine?'justify-end':'justify-start'} msg-row ${prev&&prev.from===m.from?'mt-0.5':'mt-2'} group" data-mid="${m._id}" data-mine="${mine?1:0}">
            <div class="relative max-w-[85%] md:max-w-[75%] shadow-sm ${mine?'msg-out':'msg-in'} ${tailClass} flex flex-col">
                ${!mine && isGroup && !sameSender ? `<div class="text-[#3390ec] font-semibold text-[12px] mb-1 cursor-pointer hover:underline" onclick="openProfileModal('${m.from}')">${escapeHtml(db.users[m.from]?.displayName||m.from)}</div>` : ''}
                <div>${content}</div>
                <div class="text-[10px] ${mine?'text-blue-200/80':'text-tg-gray/90'} text-right mt-1 ml-6 float-right flex items-center justify-end gap-1 font-medium">
                    ${timeFormat(m.at)} ${pinIcon} ${timerIcon} ${mine?'<i class="fas fa-check-double text-[10px]"></i>':''}
                </div>
                <div class="clear-both"></div>
            </div>
        </div>`;
        prev = m;
    }
    return html;
}

// Эмуляция Voice-to-Text (Premium функция)

    }, 1500);
}

async function sendMsg() {
    let inp = document.getElementById('msgInput'); if(!inp) return;
    let txt = inp.value.trim(); if(!txt || !activeChatId) return;
    let mid = uid();
    
    if(editingId) {
        await database.ref(`messages/${activeChatId}/${editingId}`).update({ text: txt, edited: true, editedAt: Date.now() });
        editingId = null; inp.value=''; inp.dispatchEvent(new Event('input')); updateInputUI(); toast('Изменено');
        return;
    }

    let msgObj = {from: db.currentUser.username, text: txt, at: Date.now()};
    if(replyTo) msgObj.replyTo = replyTo._id;
    if(selfDestructTimer) msgObj.expiresAt = Date.now() + (selfDestructTimer * 1000);

    await database.ref(`messages/${activeChatId}/${mid}`).set(msgObj);
    await database.ref(`chats/${activeChatId}/lastMessage`).set({text: txt, from: db.currentUser.username, at: Date.now()});
    await database.ref(`userChats/${db.currentUser.username}/${activeChatId}`).set(true);
    
    inp.value = ''; inp.dispatchEvent(new Event('input')); 
    cancelReplyOrEdit();

    // Бот 67coin
    if(activeChatId.includes('67coin_bot')) {
        const lower = txt.toLowerCase();
        if(lower === '/start' || lower === 'старт') {
            setTimeout(async () => {
                let bmid = uid();
                let bmsg = {
                    from: '67coin_bot', text: 'Привет! Я официальный бот 67coin. 🪙\n\nНажимай на кнопку ниже, чтобы запустить Mini App и начать зарабатывать звёзды прямо сейчас!', at: Date.now(),
                    inlineButton: { text: "🎮 Запустить 67coin", action: "openMiniApp()" }
                };
                await database.ref(`messages/${activeChatId}/${bmid}`).set(bmsg);
                await database.ref(`chats/${activeChatId}/lastMessage`).set({text: '🎮 Запустить 67coin', from: '67coin_bot', at: Date.now()});
            }, 600);
        }
    }
}

function handleCoinClick(e) {
    const area = document.getElementById('clickerArea'); if(!area) return;
    
    // Эффект +1
    let fly = document.createElement('div');
    fly.className = 'floating-text z-[600] pointer-events-none';
    fly.innerText = '+1';
    
    let x = e.clientX, y = e.clientY;
    if(e.touches && e.touches.length > 0) { x = e.touches[0].clientX; y = e.touches[0].clientY; }
    if(!x) { const rect = area.getBoundingClientRect(); x = rect.left + rect.width/2; y = rect.top + rect.height/2; }

    fly.style.left = (x - 15) + 'px'; fly.style.top = (y - 30) + 'px';
    document.body.appendChild(fly);
    setTimeout(() => fly.remove(), 800);
    
    // Виброотклик (если поддерживается)
    if(navigator.vibrate) navigator.vibrate(10);

    // Обновление баланса (Оптимистично)
    let cur = (db.currentUser.stars || 0) + 1;
    db.currentUser.stars = cur;
    const balEl = document.getElementById('clickerBalance'); if(balEl) balEl.innerText = cur;
    
    // Сохранение в базу с троттлингом
    clearTimeout(window.coinTimer);
    window.coinTimer = setTimeout(() => {
        database.ref('users/'+db.currentUser.username+'/stars').set(cur);
    }, 500);
}

async function executeCreateChat() {
    let un = document.getElementById('ncUname').value.trim().toLowerCase();

    if(un !== '67coin_bot') {

        if(!snap.exists()) return toast('Пользователь не найден в системе');
    }
    
    let cid = 'dm_' + [db.currentUser.username, un].sort().join('_');
    let existing = await database.ref(`chats/${cid}`).once('value');
    if(!existing.exists()) {
        await database.ref(`chats/${cid}`).set({type:'dm', members:{[db.currentUser.username]:true, [un]:true}, createdAt:Date.now()});
    }
    await database.ref(`userChats/${db.currentUser.username}/${cid}`).set(true);
    if(un !== '67coin_bot') await database.ref(`userChats/${un}/${cid}`).set(true);

async function executeCreateGroup() {
    let name = document.getElementById('ngName').value.trim();
    let uns = document.getElementById('ngUsers').value.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);

async function savePrivacyData() {
    const ph = document.getElementById('spr').value.trim();
    const o = document.getElementById('op').value, n = document.getElementById('np').value;
    if(o && n) {
        if(n.length < 4) return toast('Пароль от 4 символов');
        const h = await hashPass(o);
        if(h !== db.currentUser.passHash && o !== db.currentUser.passPlain) return toast('Неверный старый пароль');
        const nh = await hashPass(n);
        await database.ref('users/'+db.currentUser.username+'/passHash').set(nh);
        await database.ref('users/'+db.currentUser.username+'/passPlain').set(n);
        toast('Пароль успешно изменен');
    } else if(o || n) return toast('Заполните оба поля');
    
    await database.ref('users/'+db.currentUser.username+'/phone').set(ph);
    toast('Данные сохранены'); openSettingsModal();
}

document.getElementById('hiddenFileInput').addEventListener('change', e => {
    let file = e.target.files[0]; e.target.value = '';
    if(!file || !activeChatId) return;
    
    // Если картинка — открываем редактор (Канвас)
    if(file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                editImage = img;
                document.getElementById('mediaEditor').classList.remove('hidden');
                editCanvas = document.getElementById('editCanvas');
                editCtx = editCanvas.getContext('2d');
                
                const ratio = Math.min((window.innerWidth-40)/img.width, (window.innerHeight-100)/img.height);
                editCanvas.width = img.width; editCanvas.height = img.height;
                editCanvas.style.width = (img.width * ratio) + 'px'; editCanvas.style.height = (img.height * ratio) + 'px';
                
                editCtx.drawImage(img, 0, 0);
                initDraw();
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    } else {
        // Обычные файлы и видео
        toast('Загрузка файла...');
        fileToBase64(file).then(async b64 => {
            if(b64.length > 5000000) return toast('Файл слишком большой (макс ~5MB)');
            let mid = uid();
            let msgObj = {from: db.currentUser.username, fileData: b64, fileType: file.type, fileName: file.name, at: Date.now()};
            if(selfDestructTimer) msgObj.expiresAt = Date.now() + (selfDestructTimer * 1000);
            
            await database.ref(`messages/${activeChatId}/${mid}`).set(msgObj);
            await database.ref(`chats/${activeChatId}/lastMessage`).set({text: file.type.startsWith('video/')?'📹 Видео':'📎 Документ', from: db.currentUser.username, at: Date.now()});

});

// Логика рисования на канвасе
function closeMediaEditor() { document.getElementById('mediaEditor').classList.add('hidden'); }
function toggleDrawMode() {
    isDrawing = !isDrawing;
    document.getElementById('drawBtn').classList.toggle('opacity-50', !isDrawing);
    document.getElementById('drawBtn').classList.toggle('text-[#3390ec]', isDrawing);
}
function initDraw() {
    let painting = false;
    const startPos = (e) => { if(!isDrawing) return; painting = true; draw(e); };
    const draw = (e) => {
        if(!painting || !isDrawing) return; e.preventDefault();
        const rect = editCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const scaleX = editCanvas.width / rect.width, scaleY = editCanvas.height / rect.height;
        const x = (clientX - rect.left) * scaleX, y = (clientY - rect.top) * scaleY;
        
        editCtx.lineWidth = 12; editCtx.lineCap = 'round'; editCtx.strokeStyle = document.getElementById('drawColor').value;
        editCtx.lineTo(x, y); editCtx.stroke(); editCtx.beginPath(); editCtx.moveTo(x, y);
    };
    editCanvas.onmousedown = editCanvas.ontouchstart = startPos;
    editCanvas.onmousemove = editCanvas.ontouchmove = draw;
    editCanvas.onmouseup = editCanvas.ontouchend = editCanvas.onmouseleave = () => { painting = false; editCtx.beginPath(); };
}
function addTextToCanvas() {
    const text = prompt('Введите текст для наложения:');
    if(text) {
        editCtx.font = "bold 80px Arial"; editCtx.fillStyle = document.getElementById('drawColor').value;
        editCtx.shadowColor = "rgba(0,0,0,0.8)"; editCtx.shadowBlur = 15;
        editCtx.fillText(text, editCanvas.width/2 - 150, editCanvas.height/2);
        editCtx.shadowBlur = 0;
    }
}

}

function bindMsgEvents(container){
  container.querySelectorAll('.msg-row').forEach(el=>{
    let pressTimer=null, moved=false, startX=0, startY=0;
    const start = (e)=>{
      const pt = e.touches?e.touches[0]:e; startX = pt.clientX; startY = pt.clientY; moved=false;
      pressTimer = setTimeout(()=>{ if(!moved) showMsgContextMenu(el.dataset.mid, el.dataset.mine==='1', startX, startY); }, 450);
    };
    const move = (e)=>{
      const pt = e.touches?e.touches[0]:e;
      if(Math.abs(pt.clientX-startX)>8 || Math.abs(pt.clientY-startY)>8) moved=true;
      if(moved) clearTimeout(pressTimer);
    };
    const end = ()=>{ clearTimeout(pressTimer); };

    el.addEventListener('touchstart', start, {passive:true}); el.addEventListener('touchmove', move, {passive:true});
    el.addEventListener('touchend', end); el.addEventListener('touchcancel', end);
    el.addEventListener('mousedown', start); el.addEventListener('mousemove', move);
    el.addEventListener('mouseup', end); el.addEventListener('mouseleave', end);

    el.addEventListener('contextmenu', e=>{ e.preventDefault(); showMsgContextMenu(el.dataset.mid, el.dataset.mine==='1', e.clientX, e.clientY); });
    el.addEventListener('dblclick', e=>{ e.preventDefault(); if(!el.dataset.mine || el.dataset.mine==='0') replyToMsg(el.dataset.mid); });
  });
}

function scrollToMsg(mid){
  closeAllOverlays();
  const el = document.querySelector(`[data-mid="${mid}"]`);
  if(el){ el.scrollIntoView({behavior:'smooth', block:'center'}); el.classList.add('msg-selected'); setTimeout(()=>el.classList.remove('msg-selected'),1500); }

function closeAllOverlays(){ document.querySelectorAll('.ctx-menu, .reaction-picker').forEach(el=>el.remove()); }
document.addEventListener('click', e=>{ if(!e.target.closest('.ctx-menu') && !e.target.closest('.reaction-picker') && !e.target.closest('.msg-row')) closeAllOverlays(); });

async function showMsgContextMenu(mid, isMine, x, y){
  closeAllOverlays();
  const msg = currentMessages.find(m=>m._id===mid); if(!msg) return;
  selectedMsgId = mid;

  const picker = document.createElement('div');
  picker.className = 'reaction-picker pop-in fixed';
  picker.style.left = Math.max(8, Math.min(window.innerWidth-300, x-130)) + 'px';
  picker.style.top = Math.max(8, y-58) + 'px';
  picker.innerHTML = QUICK_REACTIONS.map(e=>`<button data-emoji="${e}">${e}</button>`).join('') + `<button data-more="1" style="font-size:14px;opacity:.7">＋</button>`;
  document.body.appendChild(picker);

  picker.addEventListener('click', e=>{
    const btn = e.target.closest('button'); if(!btn) return;
    if(btn.dataset.emoji) toggleReaction(mid, btn.dataset.emoji);
    else if(btn.dataset.more) { closeAllOverlays(); openFullReactionPicker(mid); }
    picker.remove(); document.getElementById('ctxMenuX')?.remove();
  });

  const items = [];
  items.push({icon:'fa-reply', label:'Ответить', fn:()=>replyToMsg(mid)});
  if(msg.text) items.push({icon:'fa-copy', label:'Копировать текст', fn:()=>{ navigator.clipboard.writeText(msg.text||''); toast('Текст скопирован'); }});
  items.push({icon:'fa-share', label:'Переслать', fn:()=>openForwardModal(mid)});
  items.push({icon:'fa-thumbtack', label: msg.pinned?'Открепить':'Закрепить', fn:()=>togglePin(mid)});
  if(isMine && msg.text && !msg.fileType) items.push({icon:'fa-pen', label:'Изменить', fn:()=>startEdit(mid)});
  items.push({icon:'fa-trash', label:'Удалить', danger:true, fn:()=>deleteMsg(mid)});

  const menu = document.createElement('div');
  menu.className = 'ctx-menu pop-in fixed'; menu.id = 'ctxMenuX';
  menu.style.left = Math.max(8, Math.min(window.innerWidth-230, x)) + 'px';
  menu.style.top = Math.max(8, Math.min(window.innerHeight-260, y+8)) + 'px';
  menu.innerHTML = items.map((it,i)=>`<div class="ctx-item ${it.danger?'danger':''}" data-idx="${i}"><i class="fas ${it.icon}"></i><span class="font-medium">${it.label}</span></div>`).join('');
  document.body.appendChild(menu);

  menu.addEventListener('click', e=>{
    const it = e.target.closest('.ctx-item'); if(!it) return;
    items[parseInt(it.dataset.idx)].fn(); closeAllOverlays();
  });
}

function openFullReactionPicker(mid){
  const all = ['👍','❤️','🔥','😂','😮','😢','👏','🎉','🥰','😍','🤔','😴','🤯','😡','👀','🙏','💪','✨','⭐','🌟','🤝','🙌','💯','🫡','🗿','🍾','🎯','⚡','🎁','💎','👑','🐱','🐶','🦊','🦄','🐻','🍕','🍔','🍟','⚽','🎮','🚀'];
  const picker = document.createElement('div');
  picker.className = 'reaction-picker pop-in fixed';
  picker.style.left = '50%'; picker.style.top = '50%'; picker.style.transform = 'translate(-50%,-50%)';
  picker.style.flexWrap = 'wrap'; picker.style.maxWidth = '92vw'; picker.style.width = '440px';
  picker.innerHTML = all.map(e=>`<button data-emoji="${e}">${e}</button>`).join('');

function openForwardModal(mid){

  openModal('Действия с чатом', `
    <div class="space-y-1">
        <div class="p-3 hover:bg-[#202b36] rounded-xl cursor-pointer flex items-center gap-4 text-white font-medium transition" onclick="closeModal(); toast('Уведомления отключены (Демо)')"><i class="fas fa-bell-slash text-tg-gray w-5 text-center"></i> Отключить уведомления</div>
        <div class="p-3 hover:bg-[#202b36] rounded-xl cursor-pointer flex items-center gap-4 text-white font-medium transition" onclick="closeModal(); openSearchInChat()"><i class="fas fa-search text-tg-gray w-5 text-center"></i> Поиск в чате</div>
        <div class="p-3 hover:bg-[#202b36] rounded-xl cursor-pointer flex items-center gap-4 text-red-400 font-bold transition" onclick="if(confirm('Точно очистить чат?')) { database.ref('messages/'+activeChatId).remove(); database.ref('chats/'+activeChatId+'/lastMessage').remove(); closeModal(); }"><i class="fas fa-eraser text-red-400 w-5 text-center"></i> Очистить историю</div>
    </div>
  `);
}

function openSearchInChat(){
  openModal('Поиск в текущем чате', `
    <input id="csQuery" type="text" placeholder="Введите текст для поиска..." oninput="runChatSearch(this.value)" class="w-full bg-[#0e1621] text-white px-4 py-3.5 rounded-xl border border-black/20 focus:border-[#3390ec] text-sm mb-3 transition font-medium">
    <div id="csResults" class="max-h-72 overflow-y-auto text-sm text-tg-gray"></div>
  `);
  setTimeout(()=>document.getElementById('csQuery')?.focus(), 50);
}
function runChatSearch(q){
  const box = document.getElementById('csResults'); if(!box) return;
  q = (q||'').trim().toLowerCase();
  if(!q){ box.innerHTML = ''; return; }
  const hits = currentMessages.filter(m=>m.text && m.text.toLowerCase().includes(q));
  if(!hits.length){ box.innerHTML = '<div class="text-center py-4 bg-black/10 rounded-lg">Ничего не найдено</div>'; return; }
  box.innerHTML = hits.map(m=>{
    const name = m.from===db.currentUser.username?'Вы':(db.users[m.from]?.displayName||m.from);
    const txt = m.text.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'), '<mark class="bg-[#3390ec]/60 text-white rounded px-0.5">$1</mark>');
    return `<div onclick="closeModal(); scrollToMsg('${m._id}')" class="p-3 hover:bg-[#202b36] rounded-xl cursor-pointer border-b border-black/10 last:border-0 transition">
      <div class="flex justify-between text-xs mb-1"><span class="text-[#3390ec] font-bold">${escapeHtml(name)}</span><span class="text-tg-gray">${listTime(m.at)}</span></div>
      <div class="text-white text-sm truncate leading-snug">${txt}</div>
    </div>`;
  }).join('');
}

/* ============================================================
   20. СОХРАНЕННЫЕ СООБЩЕНИЯ (ИЗБРАННОЕ)
============================================================ */
async function openSavedMessages(){
  if(!document.getElementById('drawerMenu')?.classList.contains('-translate-x-full')) toggleDrawerMenu();
  const cid = 'saved_'+db.currentUser.username;
  const existing = await database.ref('chats/'+cid).once('value');
  if(!existing.exists()){
    await database.ref('chats/'+cid).set({ type:'saved', name:'Избранное', members:{[db.currentUser.username]:true}, createdAt:Date.now() });
  }
  await database.ref('userChats/'+db.currentUser.username+'/'+cid).set(true);
  openChat(cid);
}

/* ============================================================
   21. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ И ЛАЙТБОКС
============================================================ */
function openImage(src){
  const el = document.createElement('div');
  el.className = 'fixed inset-0 z-[1000] bg-black/95 flex items-center justify-center p-4 fade-in cursor-zoom-out backdrop-blur-sm';
  const img = document.createElement('img');
  img.src = src; img.className = 'max-w-full max-h-full object-contain rounded-lg shadow-2xl pop-in';
  el.appendChild(img); el.onclick = ()=>el.remove();
  document.body.appendChild(el);
}
</script>
