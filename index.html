/* Switch Toggle Styling */
.switch {
  position: relative;
  display: inline-block;
  width: 36px;
  height: 20px;
}
.switch input { 
  opacity: 0;
  width: 0;
  height: 0;
}
.slider-toggle {
  position: absolute;
  cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: #374151;
  transition: .4s;
  border-radius: 20px;
}
.slider-toggle:before {
  position: absolute;
  content: "";
  height: 14px;
  width: 14px;
  left: 3px;
  bottom: 3px;
  background-color: white;
  transition: .4s;
  border-radius: 50%;
}
input:checked + .slider-toggle {
  background-color: #7c3aed;
}
input:checked + .slider-toggle:before {
  transform: translateX(16px);
}
</style>

async function sha256(text){const enc=new TextEncoder().encode(text);const buf=await crypto.subtle.digest('SHA-256',enc);return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');}
function fileToBase64(file){return new Promise(function(res,rej){let r=new FileReader();r.onload=function(){res(r.result);};r.onerror=rej;r.readAsDataURL(file);});}

async function submitAuth(){
let username=document.getElementById('authUsername').value.trim().toLowerCase();
let password=document.getElementById('authPassword').value;
if(!username||!password){toast('Username va parolni kiriting');return;}
if(!/^[a-z0-9_]{3,20}$/.test(username)){toast('Username faqat lotin harflar, raqam va _ (3-20 belgi)');return;}

if(password.length<4){toast('Parol kamida 4 ta belgi');return;}

let nu={username:username, passHash:hash, passPlain:password, avatar:'', stars:0, isAdmin:username===ADMIN_LOGIN, createdAt:Date.now()};
await database.ref('users/'+username).set(nu);
db.currentUser=nu;
localStorage.setItem('ss_currentUser',username);
toast('Xush kelibsiz, '+username+'!');
enterApp();

let snap=await database.ref('users/'+username).once('value');

if(hash!==u.passHash && password!==u.passPlain){toast('Parol noto\'g\'ri');return;}
db.currentUser=u;
localStorage.setItem('ss_currentUser',username);
enterApp();
}
}

function chatDisplayInfo(cid,chat){
if(chat.type==='group'){
return {name:chat.name||'Guruh',avatar:chat.avatar||'','sub':(Object.keys(chat.members||{}).length)+' a\'zo'};
}else{
let otherUsername=Object.keys(chat.members||{}).find(function(m){return m!==db.currentUser.username;});
let otherUser=db.users[otherUsername]||{username:otherUsername};
return {name:otherUser.username||'?',avatar:otherUser.avatar||'','sub':''};
}
}
function avatarHtml(avatar,name,size){
size=size||10;
if(avatar)return '<img src="'+avatar+'" class="w-'+size+' h-'+size+' rounded-full object-cover shrink-0">';
let letter=(name||'?').charAt(0).toUpperCase();
return '<div class="w-'+size+' h-'+size+' rounded-full bg-gradient-to-br from-violet-600 to-purple-800 flex items-center justify-center text-white font-bold shrink-0" style="font-size:'+(size*1.4)+'px">'+letter+'</div>';
}
function renderSidebarChatList(){
let el=document.getElementById('sidebarChatList');
if(!el)return;
let chatIds=Object.keys(db.chats);
if(chatIds.length===0){
el.innerHTML='<div class="text-center text-slate-600 text-xs py-10">Hali chatlar yo\'q.<br>Yangi chat yoki guruh boshlang.</div>';
return;
}
let items=chatIds.map(function(cid){
let chat=db.chats[cid];
let info=chatDisplayInfo(cid,chat);
let lastMsg=chat.lastMessage;
return {cid:cid,info:info,lastAt:lastMsg?lastMsg.at:(chat.createdAt||0),lastText:lastMsg?(lastMsg.fileType?'📎 Fayl':lastMsg.text):'Xabar yo\'q'};
});
items.sort(function(a,b){return b.lastAt-a.lastAt;});
el.innerHTML=items.map(function(it){
let active=it.cid===activeChatId;
return '<div onclick="openChat(\''+it.cid+'\')" class="flex items-center gap-3 p-3 rounded-xl cursor-pointer mb-1 '+(active?'bg-violet-600/20 border border-violet-600/40':'hover:bg-slate-800/60')+'">'+
avatarHtml(it.info.avatar,it.info.name,10)+
'<div class="flex-grow min-w-0"><p class="text-sm font-bold text-white truncate">'+escapeHtml(it.info.name)+'</p><p class="text-xs text-slate-500 truncate">'+escapeHtml(it.lastText)+'</p></div>'+
'</div>';
}).join('');
}

if(!uname){toast('Username kiriting');return;}
if(uname===db.currentUser.username){toast('O\'zingizga yoza olmaysiz');return;}
let snap=await database.ref('users/'+uname).once('value');
if(!snap.exists()){toast('Bunday foydalanuvchi topilmadi');return;}
let cid='dm_'+[db.currentUser.username,uname].sort().join('_');
let existing=await database.ref('chats/'+cid).once('value');
if(!existing.exists()){
await database.ref('chats/'+cid).set({type:'dm',members:{[db.currentUser.username]:true,[uname]:true},createdAt:Date.now()});
await database.ref('userChats/'+db.currentUser.username+'/'+cid).set(true);
await database.ref('userChats/'+uname+'/'+cid).set(true);
}
closeGenericModal();
openChat(cid);
}

async function createGroup(){
let name=document.getElementById('newGroupName').value.trim();
let membersRaw=document.getElementById('newGroupMembers').value.trim();
if(!name){toast('Guruh nomini kiriting');return;}
let usernames=membersRaw.split(',').map(function(s){return s.trim().toLowerCase();}).filter(Boolean);
let members={};
members[db.currentUser.username]=true;
for(let uname of usernames){
if(uname===db.currentUser.username)continue;
let snap=await database.ref('users/'+uname).once('value');
if(snap.exists())members[uname]=true;
}
let cid='grp_'+uid();
await database.ref('chats/'+cid).set({type:'group',name:name,avatar:'',members:members,createdAt:Date.now(),createdBy:db.currentUser.username});
for(let m of Object.keys(members)){
await database.ref('userChats/'+m+'/'+cid).set(true);
}
closeGenericModal();
openChat(cid);
toast('Guruh yaratildi!');
}

// ===================== CHAT WINDOW =====================
function openChat(cid){
view='chats';
if(activeChatId&&_msgListeners[activeChatId]){
database.ref('messages/'+activeChatId).off('value',_msgListeners[activeChatId]);
delete _msgListeners[activeChatId];
}
activeChatId=cid;
render();
let listener=function(snap){
renderMessages(snap.val()||{});
};
database.ref('messages/'+cid).on('value',listener);
_msgListeners[cid]=listener;
}

function renderMessages(msgs){
let el=document.getElementById('messagesArea');
if(!el)return;
let list=Object.keys(msgs).map(function(k){let m=msgs[k];m._id=k;return m;});
list.sort(function(a,b){return a.at-b.at;});
el.innerHTML=list.map(function(m){
let mine=m.from===db.currentUser.username;
let bubble=mine?'msg-bubble-out':'msg-bubble-in';
let content='';
if(m.fileType&&m.fileType.startsWith('image/')){
content='<img src="'+m.fileData+'" class="max-w-[240px] rounded-lg mb-1">';
}else if(m.fileType){
content='<a href="'+m.fileData+'" download="'+escapeHtml(m.fileName||'file')+'" class="flex items-center gap-2 text-white underline"><i class="fas fa-file"></i> '+escapeHtml(m.fileName||'Fayl')+'</a>';
}
if(m.text)content+='<p class="text-sm text-white break-words">'+escapeHtml(m.text)+'</p>';
return '<div class="flex '+(mine?'justify-end':'justify-start')+'">'+
(!mine&&db.chats[activeChatId].type==='group'?'<div class="flex flex-col items-start max-w-[70%]"><p class="text-[10px] text-violet-400 font-bold ml-1 mb-0.5">'+escapeHtml(m.from)+'</p><div class="'+bubble+' rounded-2xl px-3 py-2">'+content+'<p class="text-[9px] text-slate-400 text-right mt-1">'+timeAgo(m.at)+'</p></div></div>'
:'<div class="'+bubble+' rounded-2xl px-3 py-2 max-w-[70%]">'+content+'<p class="text-[9px] text-slate-300 text-right mt-1">'+timeAgo(m.at)+'</p></div>')+
'</div>';
}).join('');
el.scrollTop=el.scrollHeight;
let chat=db.chats[activeChatId];
chat.lastMessage=list.length?{text:list[list.length-1].text||'',fileType:list[list.length-1].fileType||null,at:list[list.length-1].at}:null;
renderSidebarChatList();
}
function sendTextMessage(){

async function upgradeItem(itemId){
let u=db.currentUser;
let item=(u.items||{})[itemId];
if(!item)return;
if((u.stars||0)<UPGRADE_COST){toast('Yulduzlar yetarli emas');return;}
let pool=(db.upgradePools||{})[item.templateId];
if(!pool||pool.length===0){toast('Yaxshilash sozlanmagan');return;}
let totalWeight=pool.reduce(function(s,p){return s+(p.weight||1);},0);
let roll=Math.random()*totalWeight;
let acc=0,result=pool[0];
for(let p of pool){acc+=(p.weight||1);if(roll<=acc){result=p;break;}}
await database.ref('users/'+u.username+'/stars').set((u.stars||0)-UPGRADE_COST);
await database.ref('users/'+u.username+'/items/'+itemId+'/rarity').set(result.rarity);
await database.ref('users/'+u.username+'/items/'+itemId+'/background').set(result.background||'');
closeGenericModal();
setTimeout(function(){
document.body.insertAdjacentHTML('beforeend',modalShell('Natija!',
'<div class="rarity-'+result.rarity+' spin-reveal rounded-2xl p-8 flex flex-col items-center">'+
'<div class="text-6xl mb-3">'+(result.rarity==='mythic'?'🌌':result.rarity==='legendary'?'👑':result.rarity==='epic'?'💜':result.rarity==='rare'?'💎':'⭐')+'</div>'+
'<p class="text-lg font-black text-white uppercase">'+result.rarity+'</p>'+
'<p class="text-xs text-white/70 mt-1">'+(result.background?escapeHtml(result.background):'')+'</p>'+
'</div>'
));
},200);
}

async function buyFromShop(tid){
let t = db.templates[tid];
if(!t)return;
let u = db.currentUser;
let price = t.price || 0;
if((u.stars||0) < price){ toast('Yulduzlar yetarli emas!'); return; }

let itemId = 'item_'+uid();

    templateId: tid, rarity: t.baseRarity||'common', background: '', obtainedAt: Date.now()
});
toast('Muvaffaqiyatli xarid qilindi!');
}

async function adminGrantStars(){

if(!snap.exists()){toast('Foydalanuvchi topilmadi');return;}

await database.ref('users/'+uname+'/stars').set(cur+amount);
toast(amount+' yulduz berildi @'+uname);

document.getElementById('grantStarsAmount').value='';
}
let _pendingTplImg='';
document.getElementById('hiddenTemplateImgInput').addEventListener('change',async function(e){
let file=e.target.files[0];
if(!file)return;
_pendingTplImg=await fileToBase64(file);
let img=document.getElementById('tplImgPreview');
img.src=_pendingTplImg;img.classList.remove('hidden');
e.target.value='';
});
async function adminCreateTemplate(){
let name=document.getElementById('tplName').value.trim();
let price=parseInt(document.getElementById('tplPrice').value) || 0;
let rarity=document.getElementById('tplBaseRarity').value;
if(!name){toast('Nomini kiriting');return;}
let tid='tpl_'+uid();
await database.ref('templates/'+tid).set({name:name, price:price, modelImage:_pendingTplImg||'', baseRarity:rarity, createdAt:Date.now()});
_pendingTplImg='';
toast('Predmet turi yaratildi!');
document.getElementById('tplName').value='';
document.getElementById('tplPrice').value='';
document.getElementById('tplImgPreview').classList.add('hidden');
}
async function adminGrantItem(templateId){
let uname=document.getElementById('grantItemUser_'+templateId).value.trim().toLowerCase();
if(!uname){toast('Username kiriting');return;}
let snap=await database.ref('users/'+uname).once('value');
if(!snap.exists()){toast('Foydalanuvchi topilmadi');return;}
let tpl=db.templates[templateId];
let itemId='item_'+uid();
await database.ref('users/'+uname+'/items/'+itemId).set({templateId:templateId,rarity:tpl.baseRarity||'common',background:'',obtainedAt:Date.now()});
toast('Predmet berildi @'+uname);
}
function openUpgradePoolModal(templateId){
let pool=(db.upgradePools||{})[templateId]||[];
document.body.insertAdjacentHTML('beforeend',modalShell('Yaxshilash puli',
'<div id="poolRows" class="space-y-2 mb-3">'+pool.map(function(p,i){return poolRowHtml(i,p);}).join('')+'</div>'+
'<button onclick="addPoolRow()" class="w-full bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold py-2 rounded-lg btn-press mb-2">+ Qator qo\'shish</button>'+
'<button onclick="saveUpgradePool(\''+templateId+'\')" class="w-full bg-violet-600 hover:bg-violet-700 text-white font-bold py-2.5 rounded-xl btn-press">Saqlash</button>'
));
}
function poolRowHtml(i,p){
p=p||{rarity:'common',background:'',weight:1};
return '<div class="flex gap-1 pool-row">'+
'<select class="pr-rarity flex-1 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white">'+
['common','rare','epic','legendary','mythic'].map(function(r){return '<option value="'+r+'" '+(p.rarity===r?'selected':'')+'>'+r+'</option>';}).join('')+
'</select>'+
'<input class="pr-bg w-24 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white" placeholder="Fon nomi" value="'+escapeHtml(p.background||'')+'">'+
'<input class="pr-weight w-14 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white" type="number" placeholder="Vazn" value="'+(p.weight||1)+'">'+
'</div>';
}
function addPoolRow(){
document.getElementById('poolRows').insertAdjacentHTML('beforeend',poolRowHtml(0,{}));
}
async function saveUpgradePool(templateId){
let rows=document.querySelectorAll('#poolRows .pool-row');
let pool=Array.from(rows).map(function(r){
return {rarity:r.querySelector('.pr-rarity').value,background:r.querySelector('.pr-bg').value.trim(),weight:parseFloat(r.querySelector('.pr-weight').value)||1};
});
await database.ref('upgradePools/'+templateId).set(pool);
toast('Pool saqlandi!');
closeGenericModal();
}

// ===================== BOOTSTRAP =====================
window.onload=async function(){
let saved=localStorage.getItem('ss_currentUser');
if(saved){
let snap=await database.ref('users/'+saved).once('value');
if(snap.exists()){
db.currentUser=snap.val();
enterApp();
return;
}
}
renderAuth();
};
</script>
