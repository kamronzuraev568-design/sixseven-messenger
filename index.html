function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function formatDay(ts){const d=new Date(ts),now=new Date();const a=new Date(now.getFullYear(),now.getMonth(),now.getDate());const b=new Date(d.getFullYear(),d.getMonth(),d.getDate());const diff=Math.round((a-b)/86400000);if(diff===0)return'Сегодня';if(diff===1)return'Вчера';if(diff<7)return d.toLocaleDateString('ru-RU',{weekday:'long'});return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});}
function listTime(ts){const d=new Date(ts),now=new Date();const a=new Date(now.getFullYear(),now.getMonth(),now.getDate());const b=new Date(d.getFullYear(),d.getMonth(),d.getDate());const diff=Math.round((a-b)/86400000);if(diff===0)return timeFormat(ts);if(diff===1)return'Вчера';if(diff<7)return d.toLocaleDateString('ru-RU',{weekday:'short'});return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'});}
function fmtDuration(sec){sec=Math.max(0,Math.floor(sec));const m=Math.floor(sec/60),s=sec%60;return m+':'+String(s).padStart(2,'0');}
function plural(n,one,few,many){const m10=n%10,m100=n%100;if(m10===1&&m100!==11)return one;if(m10>=2&&m10<=4&&(m100<10||m100>=20))return few;return many;}

async function hashPass(txt){if(window.crypto&&crypto.subtle&&crypto.subtle.digest){try{const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}catch(e){}}let h=0;for(let i=0;i<txt.length;i++)h=(Math.imul(31,h)+txt.charCodeAt(i))|0;return'fb_'+(h>>>0).toString(16);}

const _emojiCache = new Map();
const EMOJI_REGEX = /(\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic}|\p{Emoji_Modifier})*|\p{Regional_Indicator}{2})/gu;
function _emojiToCodepoint(str){const points=[];for(const char of str){const cp=char.codePointAt(0);if(cp===0xFE0F)continue;if(cp===0x200D){points.push('200d');continue;}points.push(cp.toString(16));}return points.join('-');}
function _getEmojiHtml(emoji,size){const key=emoji+'|'+(size||64);if(_emojiCache.has(key))return _emojiCache.get(key);const cp=_emojiToCodepoint(emoji);const url=`https://cdn.jsdelivr.net/npm/emoji-datasource-apple@15.1.2/img/apple/${size||64}/${cp}.png`;const html=`<img src="${url}" alt="${escapeHtml(emoji)}" class="apple-emoji" loading="lazy" onerror="this.replaceWith(document.createTextNode('${escapeHtml(emoji)}'))">`;_emojiCache.set(key,html);return html;}
function _emojifyNode(root){
  if(!root)return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:node=>{const p=node.parentElement;if(!p)return NodeFilter.FILTER_REJECT;if(p.classList?.contains('no-emoji'))return NodeFilter.FILTER_REJECT;const tag=p.tagName;if(tag==='SCRIPT'||tag==='STYLE'||tag==='TEXTAREA'||tag==='INPUT')return NodeFilter.FILTER_REJECT;if(p.classList?.contains('apple-emoji'))return NodeFilter.FILTER_REJECT;if(/[\p{Extended_Pictographic}]/u.test(node.nodeValue))return NodeFilter.FILTER_ACCEPT;return NodeFilter.FILTER_REJECT;}});
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(node=>{const text=node.nodeValue;if(!text||!/[\p{Extended_Pictographic}]/u.test(text))return;const html=escapeHtml(text).replace(EMOJI_REGEX,m=>_getEmojiHtml(m));const span=document.createElement('span');span.className='no-emoji-wrap';span.innerHTML=html;node.parentNode.replaceChild(span,node);});
}
function refreshEmojis(root){requestAnimationFrame(()=>{try{_emojifyNode(root||document.body);}catch(e){console.warn('emoji:',e);}});}
function emojiPickerBtn(e,size){const sz=size||26;return `<img src="https://cdn.jsdelivr.net/npm/emoji-datasource-apple@15.1.2/img/apple/64/${_emojiToCodepoint(e)}.png" class="apple-emoji" style="width:${sz}px;height:${sz}px;vertical-align:middle" onerror="this.replaceWith(document.createTextNode('${e}'))">`;}
function updateEmojiPreview(text){const bar=document.getElementById('emojiPreviewBar');const box=document.getElementById('emojiPreviewContent');if(!bar||!box)return;if(!text||!/[\p{Extended_Pictographic}]/u.test(text)){bar.classList.add('hidden');box.innerHTML='';return;}bar.classList.remove('hidden');box.innerHTML=escapeHtml(text).replace(EMOJI_REGEX,m=>_getEmojiHtml(m));}

/* ===== SERVICE WORKER ===== */
async function registerServiceWorker(){
  if(!('serviceWorker' in navigator)) return null;
  try {
    const swCode = `
      self.addEventListener('install', e => self.skipWaiting());
      self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
      self.addEventListener('push', event => {
        let data = {};
        try { data = event.data ? event.data.json() : {}; } catch(e) { data = { title: 'Новое сообщение', body: event.data ? event.data.text() : '' }; }
        event.waitUntil(self.registration.showNotification(data.title || '67gramm', {
          body: data.body || '',
          icon: data.icon || 'https://cdn-icons-png.flaticon.com/512/2111/2111646.png',
          badge: data.badge || 'https://cdn-icons-png.flaticon.com/512/2111/2111646.png',
          tag: data.tag || 'msg-' + Date.now(),
          vibrate: [200, 100, 200],
          data: { url: data.url || self.location.origin }
        }));
      });
      self.addEventListener('notificationclick', event => {
        event.notification.close();
        event.waitUntil(clients.matchAll({ type: 'window' }).then(list => {
          for(const c of list){ if(c.url.includes(self.location.origin) && 'focus' in c) return c.focus(); }
          if(clients.openWindow) return clients.openWindow(event.notification.data?.url || '/');
        }));
      });
    `;
    const blob = new Blob([swCode], {type:'application/javascript'});
    const url = URL.createObjectURL(blob);
    return await navigator.serviceWorker.register(url);
  } catch(e){ console.warn('SW reg fail:', e); return null; }
}

function startGlobalListeners(){
  if(globalListenersStarted||!db.currentUser)return;
  globalListenersStarted=true;
  const me=db.currentUser.username;

  database.ref('users/'+me).on('value',snap=>{
    if(!snap.exists())return;
    const u=snap.val();
    if(u.banned){logout();toast('Аккаунт заблокирован');return;}
    const t=u.theme!==db.currentUser.theme;
    const f=u.fontScale!==db.currentUser.fontScale;
    db.currentUser=u;
    applyScale(u.scale||100);
    if(t)applyTheme(u.theme||'dark');
    if(f)applyFontScale(u.fontScale||15);
    updateDrawerInfo();renderSidebar();refreshChatHeader();
  });

  database.ref('users').on('value',snap=>{db.users=snap.val()||{};renderSidebar();refreshChatHeader();renderStories();});

  database.ref('userChats/'+me).on('value',snap=>{
    const map=snap.val()||{};
    const cids=Object.keys(map);
    cids.forEach(cid=>{
      if(chatRefs[cid])return;
      const cb=cs=>{
        if(cs.exists()){
          const newChat = cs.val();
          const oldChat = db.chats[cid]||{};
          db.chats[cid] = newChat;
          const oldLM = oldChat.lastMessage;
          const newLM = newChat.lastMessage;
          if(newLM && (!oldLM || newLM.at > (oldLM.at||0)) && newLM.from !== me){
            let chatName = 'Чат';
            if(newChat.type === 'group'){ chatName = newChat.name || 'Группа'; }
            else if(newChat.type === 'saved'){ chatName = 'Избранное'; }
            else { const ou=Object.keys(newChat.members||{}).find(m=>m!==me); const u=db.users[ou]||{}; chatName = u.displayName || ou; }
            const text = newLM.text || (newLM.fileType ? '📎 Вложение' : 'Новое сообщение');
            notifyNewMessage(chatName, text, newLM.from);
          }
        } else {
          delete db.chats[cid];
          database.ref('chats/'+cid).off('value',cb);
          delete chatRefs[cid];
        }
        renderSidebar();refreshChatHeader();refreshPinnedBar();
      };
      database.ref('chats/'+cid).on('value',cb);
      chatRefs[cid]=cb;
    });
    Object.keys(chatRefs).forEach(cid=>{
      if(!map[cid]){database.ref('chats/'+cid).off('value',chatRefs[cid]);delete chatRefs[cid];delete db.chats[cid];}
    });
    renderSidebar();
  });

  database.ref('reports').on('value',snap=>{db.reports=snap.val()||{};});
  rebuildMarket();
  database.ref('giftsMarket').on('value',snap=>{db._giftsRaw=snap.val()||{};rebuildMarket();});
  database.ref('giftConfig').on('value',snap=>{db.giftConfig=snap.val()||{};rebuildMarket();});
  database.ref('usernames').on('value',snap=>{db.usernames=snap.val()||{};if((document.getElementById('searchInput')?.value||'').trim())renderSidebar();});
  database.ref('stories').on('value',snap=>{db.stories=snap.val()||{};renderStories();cleanupMyStories();});
  database.ref('listings').on('value',snap=>{db.listings=snap.val()||{};});
  database.ref('auctions').on('value',snap=>{db.auctions=snap.val()||{};});

  database.ref('users/'+me+'/payment_notifications').on('child_added', snap => {
    const n = snap.val();
    if(!n || !n.at) return;
    if(Date.now() - n.at < 180000){
      toast(n.text, 6000);
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = 880;
        g.gain.setValueAtTime(.15, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .3);
        o.start(); o.stop(ctx.currentTime + .3);
        setTimeout(() => {
          const o2 = ctx.createOscillator(), g2 = ctx.createGain();
          o2.connect(g2); g2.connect(ctx.destination);
          o2.frequency.value = 1200;
          g2.gain.setValueAtTime(.15, ctx.currentTime);
          g2.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .3);
          o2.start(); o2.stop(ctx.currentTime + .3);
        }, 150);
      } catch(e){}
      if(navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
    }
    setTimeout(() => snap.remove(), 10000);
  });

  listenIncomingCalls();
  listenIncomingGroupCalls();
}

/* ===== TON CONNECT ===== */
function initTonConnect(){
  if(typeof TON_CONNECT_UI === 'undefined') return;
  try {
    tonConnectUI = new TON_CONNECT_UI.TonConnectUI({ manifestUrl: location.origin + '/sixseven-messenger/tonconnect-manifest.json', buttonRootId: 'tonConnectBtn' });
    tonConnectUI.onStatusChange(wallet => {
      if(wallet){
        const addr = wallet.account.address;
        database.ref('users/'+db.currentUser.username+'/tonWallet').set({ address: addr, chain: wallet.account.chain, walletName: wallet.device.appName || 'TON Wallet', connectedAt: Date.now() });
        toast('✅ Кошелёк: ' + shortAddr(addr));
      }
    });
  } catch(e){ console.warn('TON Connect init:', e); }
}
async function sendTonToWallet(amount){
  if(!tonConnectUI){ toast('TON Connect не загружен'); return; }
  if(!tonConnectUI.connected){ toast('Подключите кошелёк'); await tonConnectUI.openModal(); return; }
  const address = db.currentUser.tonWallet?.address;
  if(!address){ toast('Нет кошелька'); return; }
  const nanoAmount = Math.floor(amount * 1e9).toString();
  try { await tonConnectUI.sendTransaction({ validUntil: Math.floor(Date.now() / 1000) + 600, messages: [{ address, amount: nanoAmount }] }); toast('✅ Отправлено!'); }
  catch(e){ console.error(e); toast('Ошибка отправки'); }
}
function openTonConnectModal(){
  const u = db.currentUser; const wallet = u.tonWallet;
  openModal('TON Connect', `
    <div class="bg-gradient-to-br from-cyan-500 to-blue-600 rounded-2xl p-5 mb-4 text-white shadow-xl text-center"><i class="fas fa-wallet text-4xl mb-2"></i><div class="text-2xl font-black mb-1">${fmtTon(u.ton||0)} TON</div><p class="text-xs opacity-90">≈ $${((u.ton||0)*TON_USD).toFixed(2)}</p></div>

/* ===== AI ПЕРЕВОДЧИК ===== */
async function translateMsg(mid, targetLang = 'ru'){
  const m = currentMessages.find(x => x._id === mid);
  if(!m || !m.text){ toast('Нет текста'); return; }
  const cacheKey = 'tr_' + mid + '_' + targetLang;
  const cached = sessionStorage.getItem(cacheKey);
  if(cached){ showTranslation(mid, cached); return; }
  if(!AI_API_KEY || AI_API_KEY.includes('ТВОЙ_КЛЮЧ')){ toast('AI не настроен'); return; }
  toast('🌐 Переводим...');
  try {
    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + AI_API_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: AI_MODEL, messages: [{ role: 'system', content: `Ты переводчик. Переведи текст на ${targetLang === 'ru' ? 'русский' : targetLang === 'en' ? 'английский' : targetLang}. Отвечай ТОЛЬКО переводом.` }, { role: 'user', content: m.text }], max_tokens: 500 })
    });
    const data = await res.json();
    const translation = data.choices?.[0]?.message?.content?.trim();
    if(!translation){ toast('Ошибка перевода'); return; }
    sessionStorage.setItem(cacheKey, translation);
    showTranslation(mid, translation);
  } catch(e){ console.error(e); toast('Ошибка AI'); }
}
function showTranslation(mid, text){
  const row = document.querySelector(`[data-mid="${mid}"]`); if(!row) return;
  row.querySelector('.translation-box')?.remove();
  const box = document.createElement('div');
  box.className = 'translation-box mt-2 pt-2 border-t border-white/10 text-[13px] text-blue-200/90 italic';
  box.innerHTML = `<i class="fas fa-language mr-1"></i>${escapeHtml(text)}`;
  row.querySelector('.msg-bubble')?.appendChild(box);
  refreshEmojis(box);
}

/* ===== STORIES ===== */
const STORY_TTL=86400000,STORY_MS=5000;
const _storyCache={};
function storyItemsOf(un){const s=db.stories&&db.stories[un];if(!s||!s.items)return[];return Object.entries(s.items).filter(([id,it])=>it&&it.at&&Date.now()-it.at<STORY_TTL).sort((a,b)=>a[1].at-b[1].at);}
function storyLastAt(un){const it=storyItemsOf(un);return it.length?it[it.length-1][1].at:0;}
function storyUnseen(un){const me=db.currentUser.username;if(un===me)return false;const seen=db.stories[un]&&db.stories[un].seen&&db.stories[un].seen[me];if(!seen)return true;return typeof seen==='number'&&seen<storyLastAt(un);}
function renderStories(){
  const bar=document.getElementById('storiesBar');if(!bar||!db.currentUser)return;
  const me=db.currentUser.username;
  const users=Object.keys(db.stories||{}).filter(un=>storyItemsOf(un).length).sort((a,b)=>{if(a===me)return-1;if(b===me)return 1;const ua=storyUnseen(a),ub=storyUnseen(b);if(ua!==ub)return ua?-1:1;return storyLastAt(b)-storyLastAt(a);});
  const add=`<div onclick="document.getElementById('hiddenStoryInput').click()" class="flex flex-col items-center gap-1 shrink-0 cursor-pointer"><div class="w-14 h-14 rounded-full border-2 border-dashed border-[#3390ec] flex items-center justify-center text-[#3390ec] text-xl"><i class="fas fa-plus"></i></div><span class="text-[10px] text-tg-gray">Сторис</span></div>`;
  const cells=users.map(un=>{
    const u=(db.users&&db.users[un])||{};
    const ring=(un===me||storyUnseen(un))?'story-ring':'story-ring-seen';
    const label=un===me?'Вы':(u.displayName||un).slice(0,8);
    return `<div onclick="openStories('${un}')" class="flex flex-col items-center gap-1 shrink-0 cursor-pointer"><div class="${ring}"><div class="bg-tg-sidebar rounded-full p-0.5">${getAvatarHtml(u.avatar,u.displayName||un,12)}</div></div><span class="text-[10px] text-tg-gray truncate max-w-[56px]">${escapeHtml(label)}</span></div>`;
  }).join('');
  bar.innerHTML=add+cells;
}
function cleanupMyStories(){
  const me=db.currentUser&&db.currentUser.username;if(!me)return;
  const s=db.stories&&db.stories[me];if(!s||!s.items)return;
  Object.entries(s.items).forEach(([id,it])=>{
    if(it&&it.at&&Date.now()-it.at>=STORY_TTL){
      database.ref(`stories/${me}/items/${id}`).remove();
      try{database.ref('storyData/'+id).remove().catch(()=>{});}catch(e){}
    }
  });
}
document.getElementById('hiddenStoryInput')?.addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f)return;
  const isVid=f.type.startsWith('video/');
  if(!isVid&&!f.type.startsWith('image/')){toast('Нужно фото или видео');return;}
  if(isVid&&f.size>5000000){toast('Видео для сторис — до 5 МБ');return;}
  try{
    toast('⏳ Публикация...');
    const b64=isVid?await fileToBase64(f):await fileToImageData(f,{max:1080,q:.85});
    const type=(b64.startsWith('data:')?b64.slice(5,b64.indexOf(';')):'')||f.type;
    const sid=uid(),me=db.currentUser.username;
    const meta={type,at:Date.now()};
    try{await database.ref('storyData/'+sid).set(b64);meta.ext=1;}catch(err){meta.data=b64;}
    await database.ref(`stories/${me}/items/${sid}`).set(meta);
    toast('📸 Сторис опубликована');
  }catch(err){console.error(err);toast('Не удалось опубликовать');}
});
function openStories(un){
  const items=storyItemsOf(un);if(!items.length)return;
  closeStory();
  window._storyCtx={un,items,idx:0,timer:null,t0:0,left:STORY_MS,paused:false,holdAt:0};
  showStory();
  try{database.ref(`stories/${un}/seen/${db.currentUser.username}`).set(Date.now());}catch(e){}
}
async function showStory(){
  const c=window._storyCtx;if(!c)return;
  const [iid,item]=c.items[c.idx];
  const u=(db.users&&db.users[c.un])||{};
  clearTimeout(c.timer);c.left=STORY_MS;c.paused=false;
  const isMine=c.un===db.currentUser.username;
  const bars=c.items.map((_,i)=>`<div class="flex-1 h-[3px] bg-white/30 rounded-full overflow-hidden"><div class="story-bar-fill" ${i===c.idx?'id="storyFill"':''} style="width:${i<c.idx?'100%':'0'}"></div></div>`).join('');
  const mins=Math.max(1,Math.floor((Date.now()-item.at)/60000));
  const ago=mins<60?mins+' мин назад':Math.floor(mins/60)+' ч назад';
  document.getElementById('storyOverlay')?.remove();
  document.body.insertAdjacentHTML('beforeend',`<div id="storyOverlay" class="fixed inset-0 z-[600] bg-black flex flex-col fade-in select-none"><div class="flex gap-1 px-2" style="padding-top:max(8px,env(safe-area-inset-top))">${bars}</div><div class="flex items-center gap-3 px-3 py-2">${getAvatarHtml(u.avatar,u.displayName||c.un,10)}<div class="flex-grow min-w-0"><div class="text-white text-sm font-medium truncate">${escapeHtml(u.displayName||c.un)}</div><div class="text-white/60 text-xs">${ago}</div></div>${isMine?`<button onclick="deleteStory()" class="text-white/80 text-lg p-2"><i class="far fa-trash-alt"></i></button>`:''}<button onclick="closeStory()" class="text-white text-xl p-2"><i class="fas fa-times"></i></button></div><div id="storyBody" class="flex-grow relative flex items-center justify-center overflow-hidden"><div id="storySpin" class="w-8 h-8 rounded-full border-2 border-white/30 border-t-white animate-spin absolute"></div></div><div id="storyTap" class="absolute left-0 right-0 bottom-0" style="top:96px"></div></div>`);
  const tap=document.getElementById('storyTap');
  tap.addEventListener('click',ev=>{const cc=window._storyCtx;if(!cc)return;if(Date.now()-cc.holdAt>350&&cc.holdAt)return;const r=tap.getBoundingClientRect();(ev.clientX-r.left<r.width/3)?prevStory():nextStory();});
  tap.addEventListener('pointerdown',pauseStory);
  ['pointerup','pointerleave','pointercancel'].forEach(t=>tap.addEventListener(t,resumeStory));
  let data=item.data;
  if(!data){
    try{data=_storyCache[iid]||(_storyCache[iid]=(await database.ref('storyData/'+iid).once('value')).val());}catch(e){}
  }
  if(window._storyCtx!==c||c.items[c.idx][0]!==iid)return;
  document.getElementById('storySpin')?.remove();
  const body=document.getElementById('storyBody');if(!body)return;
  if(!data){body.innerHTML='<div class="text-white/60 text-sm">Не удалось загрузить</div>';c.timer=setTimeout(nextStory,2500);return;}
  if(item.type&&item.type.startsWith('video/')){
    body.innerHTML=`<video id="storyVid" src="${data}" playsinline class="max-w-full max-h-full"></video>`;
    const v=document.getElementById('storyVid');
    v.onended=nextStory;
    v.onloadedmetadata=()=>{const fl=document.getElementById('storyFill');if(fl&&v.duration)fl.style.animation=`storyFill ${v.duration}s linear forwards`;};
    v.play().catch(()=>{v.muted=true;v.play().catch(()=>{});});
  }else{
    body.innerHTML=`<img src="${data}" class="max-w-full max-h-full object-contain">`;
    startStoryTimer();
  }
}
function startStoryTimer(){const c=window._storyCtx;if(!c)return;const fl=document.getElementById('storyFill');if(fl)fl.style.animation=`storyFill ${c.left}ms linear forwards`;c.t0=Date.now();c.timer=setTimeout(nextStory,c.left);}
function pauseStory(){const c=window._storyCtx;if(!c||c.paused)return;c.paused=true;c.holdAt=Date.now();const v=document.getElementById('storyVid');if(v){v.pause();}else{clearTimeout(c.timer);if(c.t0)c.left=Math.max(200,c.left-(Date.now()-c.t0));}const fl=document.getElementById('storyFill');if(fl)fl.style.animationPlayState='paused';}
function resumeStory(){const c=window._storyCtx;if(!c||!c.paused)return;c.paused=false;const fl=document.getElementById('storyFill');if(fl)fl.style.animationPlayState='running';const v=document.getElementById('storyVid');if(v){v.play().catch(()=>{});}else if(c.t0){c.t0=Date.now();c.timer=setTimeout(nextStory,c.left);}}
function nextStory(){const c=window._storyCtx;if(!c)return;clearTimeout(c.timer);c.idx++;if(c.idx>=c.items.length){closeStory();return;}showStory();}
function prevStory(){const c=window._storyCtx;if(!c)return;clearTimeout(c.timer);c.idx=Math.max(0,c.idx-1);showStory();}
function closeStory(){const c=window._storyCtx;if(c)clearTimeout(c.timer);document.getElementById('storyOverlay')?.remove();window._storyCtx=null;if(db.currentUser)renderStories();}
async function deleteStory(){
  const c=window._storyCtx;if(!c||c.un!==db.currentUser.username)return;
  const iid=c.items[c.idx][0];
  if(!confirm('Удалить эту историю?'))return;
  clearTimeout(c.timer);
  try{await database.ref(`stories/${c.un}/items/${iid}`).remove();database.ref('storyData/'+iid).remove().catch(()=>{});}catch(e){}
  closeStory();toast('Удалено');
}

/* ===== RENDER MESSAGES ===== */
function parseFormatted(text){
  if(!text) return '';
  let html = escapeHtml(text);
  html = html.replace(/`([^`]+)`/g, '<span class="tg-format-code">$1</span>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<span class="tg-format-bold">$1</span>');
  html = html.replace(/__([^_]+)__/g, '<span class="tg-format-italic">$1</span>');
  html = html.replace(/\|\|([^|]+)\|\|/g, '<span class="tg-format-spoiler" onclick="this.classList.toggle(\'revealed\')">$1</span>');
  html = html.replace(/@([a-z0-9_]{3,20})/gi, '<span class="tg-mention" onclick="openProfileModal(\'$1\')">@$1</span>');
  html = html.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" class="tg-link">$1</a>');
  return html;
}
function renderMessages(list,isGroup){
  if(!list.length)return `<div class="flex-grow flex flex-col items-center justify-center text-tg-gray text-sm py-12"><i class="far fa-comment-dots text-4xl mb-3 text-tg-gray/30"></i>Нет сообщений. Начните первым!</div>`;
  let html='';let lastDay='';let prev=null;let prevSame=false;
  for(let i=0;i<list.length;i++){
    const m=list[i];
    if(m.deletedFor&&m.deletedFor[db.currentUser.username]&&!m.deletedForAll)continue;
    const day=formatDay(m.at);
    if(day!==lastDay){lastDay=day;html+=`<div class="flex justify-center my-3"><span class="bg-black/40 backdrop-blur text-white/80 text-[11px] px-3 py-1 rounded-full shadow">${day}</span></div>`;prevSame=false;}
    const mine=m.from===db.currentUser.username;
    const sameSender=prev&&prev.from===m.from&&(m.at-prev.at)<5*60000&&day===lastDay;
    let content='';
    if(m.deletedForAll&&!mine){content=`<div class="italic opacity-60 text-[14px]"><i class="fas fa-ban mr-1"></i>Сообщение удалено</div>`;}
    else{
      if(m.replyTo){const rq=list.find(x=>x._id===m.replyTo);const rqName=rq?(rq.from===db.currentUser.username?'Вы':(db.users[rq.from]?.displayName||rq.from)):'Сообщение';const rqTxt=rq?(rq.text||(rq.fileType?.startsWith('audio/')?'🎤 Голосовое':(rq.fileType?.startsWith('image/')?'📷 Фото':(rq.fileType?'📎 Вложение':'')))):'недоступно';content+=`<div class="reply-quote" onclick="event.stopPropagation();scrollToMsg('${m.replyTo}')"><div class="rq-from">${escapeHtml(rqName)}</div><div class="rq-text">${escapeHtml(rqTxt)}</div></div>`;}
      if(m.forwardedFrom)content+=`<div class="text-[12px] opacity-70 italic mb-1"><i class="fas fa-share mr-1"></i>Переслано от ${escapeHtml(m.forwardedFrom)}</div>`;
      if(m.gifUrl) content += `<img src="${m.gifUrl}" onclick="event.stopPropagation();openImage(this.src)" class="rounded-xl mb-1 cursor-pointer max-w-[280px]">`;
      if(m.stickerUrl) content += `<img src="${m.stickerUrl}" class="w-32 h-32 object-contain" onclick="event.stopPropagation()">`;
      if(m.pollId) content += renderPoll(m.pollId, m._id);
      if(m.fileType?.startsWith('video/') && m.isCircle){content += `<div class="relative w-[200px] h-[200px]"><video src="${m.fileData}" class="w-full h-full rounded-full object-cover cursor-pointer" onclick="event.stopPropagation();openCircleView('${m.fileData}')" loop></video></div>`;}
      else if(m.fileType?.startsWith('video/')){content+=`<video src="${m.fileData}" controls class="rounded-xl mb-1 cursor-pointer max-w-[280px] max-h-[320px]" onclick="event.stopPropagation()"></video>`;}
      else if(m.fileType?.startsWith('image/')){content+=`<img src="${m.fileData}" onclick="event.stopPropagation();openImage(this.src)" class="rounded-xl mb-1 cursor-pointer max-w-[280px] max-h-[320px] object-cover">`;}
      else if(m.fileType?.startsWith('audio/')){const dur=m.duration||0;const bars=Array.from({length:24},()=>2+Math.floor(Math.random()*10));content+=`<div class="voice-bubble"><audio id="aud_${m._id}" src="${m.fileData}" preload="metadata" ontimeupdate="voiceTime(this)"></audio><div class="voice-play" onclick="event.stopPropagation();toggleAudio('${m._id}')"><i class="fas fa-play" id="vp_${m._id}"></i></div><div class="voice-wave">${bars.map(h=>`<i style="height:${h}px"></i>`).join('')}</div><div class="voice-time" id="vt_${m._id}">${fmtDuration(dur)}</div></div>`;}

    }

    const reportBtn=!mine?`<button onclick="event.stopPropagation();reportMsg('${m._id}')" class="report-btn absolute -left-8 top-1/2 -translate-y-1/2 text-tg-gray hover:text-red-400 p-1 transition"><i class="fas fa-exclamation-triangle text-xs"></i></button>`:'';
    const tailClass=sameSender?'':'with-tail';
    html+=`<div class="flex ${mine?'justify-end':'justify-start'} msg-row ${prevSame?'mt-0.5':'mt-2'}" data-mid="${m._id}" data-mine="${mine?1:0}"><div class="relative msg-bubble ${mine?'msg-out':'msg-in'} ${tailClass}">${!mine&&isGroup&&!sameSender?`<div class="text-[#5eb5f7] font-semibold text-[13px] mb-0.5">${escapeHtml(db.users[m.from]?.displayName||m.from)}</div>`:''}${reportBtn}${content}${reactHtml}<div class="text-[11px] ${mine?'text-blue-200/80':'text-tg-gray/90'} float-right ml-2 mt-1 select-none flex items-center gap-1 leading-none">${m.pinned?'<i class="fas fa-thumbtack text-[9px]"></i>':''}${timeFormat(m.at)}${mine?'<i class="fas fa-check-double text-[10px]"></i>':''}</div><div class="clear-both"></div></div></div>`;
    prev=m;prevSame=sameSender;
  }
  return html;
}
function renderPoll(pollId, msgId){
  const p = db.polls?.[pollId]; if(!p) return '<div class="text-tg-gray text-xs italic">Опрос недоступен</div>';
  const totalVotes = Object.values(p.votes||{}).reduce((s,v) => s + Object.keys(v).length, 0);
  const opts = (p.options||[]).map((o, idx) => {const cnt = p.votes?.[idx] ? Object.keys(p.votes[idx]).length : 0;const pct = totalVotes ? Math.round(cnt/totalVotes*100) : 0;return `<div onclick="votePoll('${pollId}',${idx})" class="bg-black/20 hover:bg-black/30 rounded-lg p-2.5 cursor-pointer mb-1.5 transition"><div class="flex justify-between text-sm mb-1"><span class="text-white">${escapeHtml(o)}</span><span class="text-white/70 text-xs">${cnt} · ${pct}%</span></div><div class="poll-bar"><div class="poll-bar-fill" style="width:${pct}%"></div></div></div>`;}).join('');
  return `<div class="min-w-[240px]"><div class="text-white font-medium text-sm mb-2">📊 ${escapeHtml(p.question)}</div>${opts}<div class="text-white/60 text-xs mt-2">${totalVotes} ${plural(totalVotes,'голос','голоса','голосов')}</div></div>`;
}
async function votePoll(pollId, optIdx){

  await database.ref(`polls/${pollId}/votes/${optIdx}/${me}`).set(true);
}

function bindMsgEvents(container){
  container.querySelectorAll('.msg-row').forEach(el=>{
    let pressTimer=null,moved=false,startX=0,startY=0;
    const start=e=>{const pt=e.touches?e.touches[0]:e;startX=pt.clientX;startY=pt.clientY;moved=false;pressTimer=setTimeout(()=>{if(!moved)showMsgContextMenu(el.dataset.mid,el.dataset.mine==='1',startX,startY);},450);};
    const move=e=>{const pt=e.touches?e.touches[0]:e;if(Math.abs(pt.clientX-startX)>8||Math.abs(pt.clientY-startY)>8)moved=true;if(moved)clearTimeout(pressTimer);};
    const end=()=>{clearTimeout(pressTimer);};
    el.addEventListener('touchstart',start,{passive:true});el.addEventListener('touchmove',move,{passive:true});el.addEventListener('touchend',end);el.addEventListener('touchcancel',end);
    el.addEventListener('mousedown',start);el.addEventListener('mousemove',move);el.addEventListener('mouseup',end);el.addEventListener('mouseleave',end);
    el.addEventListener('contextmenu',e=>{e.preventDefault();showMsgContextMenu(el.dataset.mid,el.dataset.mine==='1',e.clientX,e.clientY);});
    el.addEventListener('dblclick',e=>{e.preventDefault();if(el.dataset.mine==='0')replyToMsg(el.dataset.mid);});
  });
}

function handleMsgKeydown(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}
  if(e.key==='Escape')cancelReplyOrEdit();
  if(e.key==='Tab'&&e.shiftKey){e.preventDefault();const bar=document.getElementById('formatBar');if(bar)bar.classList.toggle('hidden');}
}
function toggleFormat(type){
  const inp=document.getElementById('msgInput');if(!inp)return;
  const start=inp.selectionStart,end=inp.selectionEnd;const sel=inp.value.slice(start,end);
  let wrap='';
  if(type==='bold')wrap='**';else if(type==='italic')wrap='__';else if(type==='code')wrap='`';else if(type==='spoiler')wrap='||';
  if(!wrap)return;
  const text=wrap+(sel||'')+wrap;
  inp.value=inp.value.slice(0,start)+text+inp.value.slice(end);
  inp.focus();inp.setSelectionRange(start+wrap.length,start+wrap.length+sel.length);
  const btn=document.getElementById('fmt_'+type);if(btn)btn.classList.toggle('text-[#3390ec]');
}
function handleMentionInput(inp){
  const val=inp.value;const pos=inp.selectionStart;const last=val.lastIndexOf('@',pos-1);
  if(last>=0){const query=val.slice(last+1,pos);if(query.length>=1&&!query.includes(' ')&&query.length<=20){showMentionDropdown(query,last);return;}}
  document.querySelector('.mention-dropdown')?.remove();
}
function showMentionDropdown(query,startPos){
  document.querySelector('.mention-dropdown')?.remove();
  const matches=Object.keys(db.users||{}).filter(u=>u.toLowerCase().startsWith(query.toLowerCase())&&u!==db.currentUser.username).slice(0,5);
  if(!matches.length)return;
  const dropdown=document.createElement('div');
  dropdown.className='mention-dropdown ctx-menu pop-in fixed';
  const inp=document.getElementById('msgInput');
  const rect=inp.getBoundingClientRect();
  dropdown.style.left=rect.left+'px';dropdown.style.top=(rect.top-10)+'px';dropdown.style.transform='translateY(-100%)';
  dropdown.innerHTML=matches.map(u=>{const user=db.users[u]||{};return `<div onclick="insertMention('${u}',${startPos})" class="ctx-item"><div class="w-8 h-8">${getAvatarHtml(user.avatar,user.displayName||u,8)}</div><span class="text-sm">${escapeHtml(user.displayName||u)}</span><span class="text-tg-gray text-xs ml-auto">@${escapeHtml(u)}</span></div>`;}).join('');
  document.body.appendChild(dropdown);
}
function insertMention(uname,startPos){
  const inp=document.getElementById('msgInput');const pos=inp.selectionStart;const val=inp.value;
  inp.value=val.slice(0,startPos)+'@'+uname+' '+val.slice(pos);
  inp.focus();inp.setSelectionRange(startPos+uname.length+2,startPos+uname.length+2);
  document.querySelector('.mention-dropdown')?.remove();autoGrow(inp);
}
async function sendMsg(){
  const inp=document.getElementById('msgInput');if(!inp||!activeChatId)return;
  const txt=inp.value.trim();if(!txt)return;
  const now=Date.now();
  if(editingId){await database.ref(`messages/${activeChatId}/${editingId}`).update({text:txt,edited:true,editedAt:now});editingId=null;inp.value='';autoGrow(inp);updateInputUI();toast('Изменено');return;}
  const mid=uid();
  const payload={from:db.currentUser.username,text:txt,at:now};
  if(replyTo)payload.replyTo=replyTo._id;
  await database.ref(`messages/${activeChatId}/${mid}`).set(payload);
  await database.ref(`chats/${activeChatId}/lastMessage`).set({text:txt,from:db.currentUser.username,at:now});
  inp.value='';autoGrow(inp);updateEmojiPreview('');
  replyTo=null;updateInputUI();
  if(db.currentUser)database.ref(`typing/${activeChatId}/${db.currentUser.username}`).remove().catch(()=>{});
  setTimeout(()=>scrollToBottom(false),50);
}

/* ===== ГОЛОСОВЫЕ / КРУЖКИ ===== */
async function toggleRecording(){
  if(recording()){mediaRecorder.stop();return;}
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('Не поддерживается');return;}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder=new MediaRecorder(stream);recordedChunks=[];
    mediaRecorder.ondataavailable=e=>{if(e.data.size)recordedChunks.push(e.data);};
    mediaRecorder.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(recordedChunks,{type:'audio/webm'});
      const duration=Math.floor((Date.now()-recStartAt)/1000);
      if(duration<1){micBtnReset();return;}
      const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob);});
      const mid=uid();const now=Date.now();
      const payload={from:db.currentUser.username,fileData:b64,fileType:'audio/webm',fileName:'voice.webm',duration,at:now};
      if(replyTo)payload.replyTo=replyTo._id;
      await database.ref(`messages/${activeChatId}/${mid}`).set(payload);
      await database.ref(`chats/${activeChatId}/lastMessage`).set({text:'🎤 Голосовое',from:db.currentUser.username,fileType:'audio/webm',at:now});
      replyTo=null;updateInputUI();micBtnReset();
      setTimeout(()=>scrollToBottom(false),50);
    };
    mediaRecorder.start();recStartAt=Date.now();startRecUI();
  }catch(err){console.error(err);toast('Нет доступа к микрофону');}
}
function startRecUI(){
  const mic=document.getElementById('micBtn');if(!mic)return;
  mic.classList.remove('hidden');mic.innerHTML='<i class="fas fa-stop text-red-500"></i>';
  const send=document.getElementById('sendBtn');if(send)send.classList.add('hidden');
  const inp=document.getElementById('msgInput');if(inp){inp.disabled=true;inp.placeholder='Запись...';}
  const parent=mic.parentElement;let counter=document.createElement('div');
  counter.id='recTimer';counter.className='text-red-400 text-sm font-mono flex items-center gap-2';
  counter.innerHTML='<span class="rec-dot"></span><span id="recSecs">0:00</span>';
  parent.insertBefore(counter,mic);
  recTimerInt=setInterval(()=>{const s=Math.floor((Date.now()-recStartAt)/1000);const el=document.getElementById('recSecs');if(el)el.textContent=fmtDuration(s);if(s>=60)mediaRecorder.stop();},250);
}
function micBtnReset(){
  clearInterval(recTimerInt);recTimerInt=null;document.getElementById('recTimer')?.remove();
  const mic=document.getElementById('micBtn');if(mic)mic.innerHTML='<i class="fas fa-microphone"></i>';
  const inp=document.getElementById('msgInput');if(inp){inp.disabled=false;inp.placeholder='Написать сообщение...';}
  updateMicSendButtonsForce();
}

function validateNewUsername(val){
  const err=document.getElementById('newUsernameError');if(!err)return;
  err.classList.add('hidden');if(!val)return;
  const lower=val.toLowerCase();
  if(lower.length<USERNAME_MIN){err.textContent='Минимум '+USERNAME_MIN+' символов';err.classList.remove('hidden');return;}
  if(!/^[a-z0-9_]+$/i.test(lower)){err.textContent='Только латиница, цифры и _';err.classList.remove('hidden');return;}
  if(/^[0-9]/.test(lower)){err.textContent='Не может начинаться с цифры';err.classList.remove('hidden');return;}
  database.ref('usernames/'+lower).once('value').then(s=>{if(s.exists()){err.textContent='Занят';err.classList.remove('hidden');}});
}
async function doBuyUsername(){
  const inp=document.getElementById('newUsernameInput');if(!inp)return;
  const un=inp.value.trim().toLowerCase();
  const u=db.currentUser;
  if(un.length<USERNAME_MIN){toast('Минимум '+USERNAME_MIN);return;}
  if(!/^[a-z0-9_]+$/.test(un)){toast('Только латиница, цифры и _');return;}
  if(/^[0-9]/.test(un)){toast('Не может начинаться с цифры');return;}
  if(u.usernames?.[un]){toast('У вас уже есть');return;}
  const myCount=Object.keys(u.usernames||{}).length;
  if(myCount>=USERNAME_MAX){toast('Максимум '+USERNAME_MAX);return;}
  const stars=u.stars||0;
  if(stars<USERNAME_PRICE){toast('Недостаточно звёзд');return;}
  const exists=await database.ref('usernames/'+un).once('value');
  if(exists.exists()){toast('Занят');return;}
  await database.ref('users/'+u.username+'/stars').set(stars-USERNAME_PRICE);
  await database.ref('users/'+u.username+'/usernames/'+un).set({at:Date.now(),isPrimary:false,isAdminGranted:false});
  await database.ref('usernames/'+un).set({owner:u.username,createdAt:Date.now()});
  await logTransaction(-USERNAME_PRICE,'stars','Покупка @'+un,'out');
  toast('✅ @'+un);
  closeModal();openBuyUsernameModal();
}
async function removeUsername(un){
  const u=db.currentUser;

  await database.ref('usernames/'+un).remove();
  toast('Удалено');

}

async function buyGift(gid){
  const g=(db.market||GIFT_CATALOG)[gid];if(!g)return;
  const cfg=getGiftConfig(gid);const stars=db.currentUser.stars||0;
  if(stars<cfg.price){toast('Мало звёзд');return;}
  if(cfg.totalSupply<1000000 && cfg.minted>=cfg.totalSupply){toast('Распродано');return;}
  const res=await database.ref('giftConfig/'+gid+'/minted').transaction(v=>(v||0)+1);
  if(!res.committed){toast('Ошибка');return;}
  const serial=(res.snapshot.val())||1;
  const newStars=stars-cfg.price;
  const giftId='gift_'+Date.now();
  const giftWithKey={...g,giftKey:gid,mintSerial:serial,emoji:g.emoji||''};
  await database.ref('users/'+db.currentUser.username+'/stars').set(newStars);
  await database.ref('users/'+db.currentUser.username+'/gifts/'+giftId).set(giftWithKey);
  await logTransaction(-cfg.price,'stars','Покупка '+g.name,'out');
  toast('🎁 Куплено! №'+serial);
  giftsTab='my';openGiftsModal();
}

async function doUpgradeGift(giftId){
  const g=db.currentUser.gifts?.[giftId];if(!g)return;
  if(!isNft(g.giftKey)){toast('Только NFT');return;}
  const cost=getUpgradeCost(g.giftKey||'default');const stars=db.currentUser.stars||0;
  if(stars<cost){toast('Мало звёзд');return;}
  closeModal();toast('🎲 Генерация...');
  setTimeout(async()=>{

  toast('✅ '+amt+' TON');openWalletModal();
}

  const needAmount = currency === 'ton' ? starsToTon(amount) : amount;
  const myBalance = currency === 'ton' ? (db.currentUser.ton||0) : (db.currentUser.stars||0);
  if(myBalance < needAmount){ toast('Недостаточно средств'); return; }
  if(a.leader){
    const prevLeader = a.leader;
    const prevAmount = a.currentPrice;
    if(currency === 'ton'){
      const s = await database.ref('users/'+prevLeader+'/ton').once('value');
      await database.ref('users/'+prevLeader+'/ton').set((s.val()||0) + starsToTon(prevAmount));
    } else {
      const s = await database.ref('users/'+prevLeader+'/stars').once('value');
      await database.ref('users/'+prevLeader+'/stars').set((s.val()||0) + prevAmount);
    }
    await database.ref('users/'+prevLeader+'/payment_notifications/'+'bid_out_'+Date.now()).set({ text: `❌ Ваша ставка на ${a.giftData.name} перебита`, at: Date.now() });
  }
  if(currency === 'ton'){
    const s = await database.ref('users/'+me+'/ton').once('value');
    await database.ref('users/'+me+'/ton').set((s.val()||0) - starsToTon(amount));
  } else {
    const s = await database.ref('users/'+me+'/stars').once('value');
    await database.ref('users/'+me+'/stars').set((s.val()||0) - amount);
  }
  await database.ref('auctions/'+aid).update({ currentPrice: amount, leader: me, lastBidAt: Date.now() });
  await database.ref('auctions/'+aid+'/bids/'+Date.now()).set({ bidder: me, amount, at: Date.now() });
  toast('✅ Ставка ' + amount + ' ' + (currency==='ton'?'💎':'⭐'));
  closeModal(); openAuctionsModal();
}
async function cancelAuction(aid){
  const a = db.auctions?.[aid]; if(!a) return;
  if(a.seller !== db.currentUser.username){ toast('Не ваш аукцион'); return; }
  if(!confirm('Отменить аукцион?')) return;
  if(a.leader){
    const currency = a.currency || 'stars';
    if(currency === 'ton'){
      const s = await database.ref('users/'+a.leader+'/ton').once('value');
      await database.ref('users/'+a.leader+'/ton').set((s.val()||0) + starsToTon(a.currentPrice));
    } else {
      const s = await database.ref('users/'+a.leader+'/stars').once('value');
      await database.ref('users/'+a.leader+'/stars').set((s.val()||0) + a.currentPrice);
    }
  }
  await database.ref('users/'+db.currentUser.username+'/gifts/gift_'+Date.now()).set(a.giftData);
  await database.ref('auctions/'+aid).remove();
  toast('Аукцион отменён');
  closeModal();
}
setInterval(async () => {
  const snap = await database.ref('auctions').once('value');
  const auctions = snap.val() || {};
  for(const [aid, a] of Object.entries(auctions)){
    if(a.endsAt < Date.now()){
      if(a.leader){
        await database.ref('users/'+a.leader+'/gifts/gift_'+Date.now()).set(a.giftData);
        const fee = Math.ceil(a.currentPrice * MARKET_FEE);
        const sellerGets = a.currentPrice - fee;
        const currency = a.currency || 'stars';
        if(currency === 'ton'){
          const s = await database.ref('users/'+a.seller+'/ton').once('value');
          await database.ref('users/'+a.seller+'/ton').set((s.val()||0) + starsToTon(sellerGets));
        } else {
          const s = await database.ref('users/'+a.seller+'/stars').once('value');
          await database.ref('users/'+a.seller+'/stars').set((s.val()||0) + sellerGets);
        }
        await database.ref('users/'+a.leader+'/payment_notifications/'+'won_'+Date.now()).set({ text: `🏆 Вы выиграли аукцион: ${a.giftData.name} за ${a.currentPrice}`, at: Date.now() });
      } else {
        await database.ref('users/'+a.seller+'/gifts/gift_'+Date.now()).set(a.giftData);
      }
      await database.ref('auctions/'+aid).remove();
    }
  }
}, 60000);

function selectSellType(type){
  document.getElementById('sellType').value = type;
  const s = document.getElementById('sellTypeSell');const a = document.getElementById('sellTypeAuction');
  if(s) s.className = 'flex-1 py-2.5 rounded-lg text-sm font-medium ' + (type==='sell'?'bg-[#2b5278] text-white':'text-tg-gray');
  if(a) a.className = 'flex-1 py-2.5 rounded-lg text-sm font-medium ' + (type==='auction'?'bg-[#2b5278] text-white':'text-tg-gray');
  document.getElementById('auctionDurationBox').classList.toggle('hidden', type !== 'auction');
}
function setDuration(h){
  document.getElementById('auctionDuration').value = h;
  document.querySelectorAll('.duration-btn').forEach(b => {
    const txt = b.textContent.trim();
    const isActive = (h===1 && txt==='1ч') || (h===6 && txt==='6ч') || (h===24 && txt==='24ч') || (h===72 && txt==='3 дня');
    b.className = 'duration-btn py-2 rounded-lg text-xs font-medium border ' + (isActive ? 'bg-[#2b5278] text-white border-[#2b5278]' : 'border-black/30 text-tg-gray');

function selectSellCurrency(cur){
  const hidden=document.getElementById('sellCurrency');if(hidden)hidden.value=cur;

  if(btnS)btnS.className='flex-1 py-2.5 rounded-lg text-sm font-medium transition '+(cur==='stars'?'bg-[#2b5278] text-white':'text-tg-gray hover:text-white');

async function doSellOrAuction(giftId){
  const g = db.currentUser.gifts?.[giftId];if(!g) return;
  const type = document.getElementById('sellType').value;
  const inp = document.getElementById('sellPriceInput');
  const floor = floorPrice(g.giftKey||'default');
  const price = Math.max(floor, parseInt(inp.value)||floor);
  const currency = document.getElementById('sellCurrency').value;
  if(type === 'auction'){
    const durationH = parseInt(document.getElementById('auctionDuration').value) || 24;
    const aid = 'auc_' + Date.now();
    const auction = { giftId, seller: db.currentUser.username, startPrice: price, currentPrice: price, currency, giftData: g, endsAt: Date.now() + durationH * 3600000, createdAt: Date.now(), bids: {} };
    await database.ref('users/' + db.currentUser.username + '/gifts/' + giftId).remove();
    await database.ref('auctions/' + aid).set(auction);
    toast('🔨 Аукцион создан на ' + durationH + 'ч');
    closeModal();return;
  }
  const exists = Object.entries(db.listings||{}).find(([lid,l]) => l.seller===db.currentUser.username && l.giftId===giftId);
  if(exists){ toast('Уже выставлен'); return; }
  const listingId = 'lst_' + Date.now();
  await database.ref('users/' + db.currentUser.username + '/gifts/' + giftId).remove();
  await database.ref('listings/' + listingId).set({giftId, seller: db.currentUser.username, price, currency, giftData: g, createdAt: Date.now()});
  toast('🎁 Лот выставлен');
  closeModal();
}
async function cancelListing(listingId){
  const l=db.listings?.[listingId];if(!l){toast('Не найден');return;}
  if(l.seller!==db.currentUser.username){toast('Это не ваш лот');return;}
  await database.ref('users/'+db.currentUser.username+'/gifts/gift_'+Date.now()).set(l.giftData);
  await database.ref('listings/'+listingId).remove();
  toast('Снято');
}

  }).join('');
  openModal('Маркетплейс · '+listings.length,`<div class="text-xs text-tg-gray mb-3 flex justify-between"><span>⭐ ${fmtStars(myStars)} · 💎 ${fmtTon(myTon)}</span><span>Комиссия: 5%</span></div><div class="max-h-[60vh] overflow-y-auto">${html}</div>`);

async function buyListing(listingId){
  const l=db.listings?.[listingId];if(!l){toast('Не найден');return;}
  if(l.seller===db.currentUser.username){toast('Это ваш лот');return;}
  const currency=l.currency||'stars';
  if(currency==='ton'){
    const priceTon=starsToTon(l.price);
    const buyerTon=db.currentUser.ton||0;
    if(buyerTon<priceTon){toast('Мало TON');return;}
    if(!confirm('Купить за '+fmtTon(priceTon)+' 💎?'))return;
    const fee=priceTon*MARKET_FEE;const sellerGets=priceTon-fee;
    await database.ref('users/'+db.currentUser.username+'/ton').set(buyerTon-priceTon);
    const sellerSnap=await database.ref('users/'+l.seller+'/ton').once('value');
    await database.ref('users/'+l.seller+'/ton').set((sellerSnap.val()||0)+sellerGets);
    const adminSnap=await database.ref('users/admin/ton').once('value');
    if(adminSnap.exists()){await database.ref('users/admin/ton').set((adminSnap.val()||0)+fee);}
    await logTransaction(-priceTon,'ton','Покупка '+l.giftData.name,'out');
  } else {
    const myStars=db.currentUser.stars||0;
    if(myStars<l.price){toast('Мало звёзд');return;}
    if(!confirm('Купить за '+l.price+' ⭐?'))return;
    const fee=Math.ceil(l.price*MARKET_FEE);const sellerGets=l.price-fee;
    await database.ref('users/'+db.currentUser.username+'/stars').set(myStars-l.price);
    const sellerSnap=await database.ref('users/'+l.seller+'/stars').once('value');
    await database.ref('users/'+l.seller+'/stars').set((sellerSnap.val()||0)+sellerGets);
    const adminSnap=await database.ref('users/admin/stars').once('value');
    if(adminSnap.exists()){await database.ref('users/admin/stars').set((adminSnap.val()||0)+fee);}
    await logTransaction(-l.price,'stars','Покупка '+l.giftData.name,'out');
  }
  await database.ref('users/'+db.currentUser.username+'/gifts/gift_'+Date.now()).set(l.giftData);
  await database.ref('listings/'+listingId).remove();
  const chatId='dm_'+[db.currentUser.username,l.seller].sort().join('_');
  const existing=await database.ref('chats/'+chatId).once('value');
  if(!existing.exists())await database.ref('chats/'+chatId).set({type:'dm',members:{[db.currentUser.username]:true,[l.seller]:true},createdAt:Date.now()});
  await database.ref('userChats/'+db.currentUser.username+'/'+chatId).set(true);
  await database.ref('userChats/'+l.seller+'/'+chatId).set(true);
  const notifId=uid();
  const sellerPays=currency==='ton'?fmtTon(starsToTon(l.price*(1-MARKET_FEE)))+' 💎':(l.price-Math.ceil(l.price*MARKET_FEE))+' ⭐';
  await database.ref('messages/'+chatId+'/'+notifId).set({from:db.currentUser.username,text:`💸 Продано: ${l.giftData.name} — вы получили ${sellerPays}`,at:Date.now()});
  await database.ref('chats/'+chatId+'/lastMessage').set({text:`💸 Продано`,from:db.currentUser.username,at:Date.now()});
  toast('✅ Куплено!');closeModal();
}
function openMyListingsModal(){

  const myListings=Object.entries(db.listings||{}).filter(([lid,l])=>l.seller===db.currentUser.username);

  myAuctions.forEach(([aid,a])=>{const g=a.giftData||{};const priceText=(a.currency==='ton'?fmtTon(starsToTon(a.currentPrice))+' 💎':a.currentPrice+' ⭐');const tl = Math.max(0, a.endsAt - Date.now());const hh = Math.floor(tl/3600000), mm = Math.floor((tl%3600000)/60000);html += `<div class="bg-[#0e1621] rounded-2xl border border-amber-500/30 flex items-center gap-3 p-3 mb-2"><div class="w-14 h-14 rounded-xl bg-gradient-to-tr ${g.traits?.backdropBg||g.bg} flex items-center justify-center shrink-0">${renderGiftIcon(g.icon,'text-2xl','',g.emoji)}</div><div class="flex-grow min-w-0"><div class="text-white text-sm font-medium truncate">${escapeHtml(g.name||'Подарок')}</div><div class="text-amber-400 text-xs font-bold">${priceText} · ${hh}ч ${mm}м</div></div><button onclick="cancelAuction('${aid}');closeModal();openMyListingsModal();" class="bg-red-600 hover:bg-red-500 text-white text-xs px-3 py-1.5 rounded-lg btn-press transition">Отменить</button></div>`;});
  openModal('Мои лоты · '+(myListings.length + myAuctions.length),`<div class="max-h-[60vh] overflow-y-auto">${html}</div>`);
}

const RTC_CONFIG = {iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun2.l.google.com:19302'},{urls:'stun:stun3.l.google.com:19302'}]};
function makeCallId(a,b){return 'call_'+[a,b].sort().join('_')+'_'+Date.now();}
async function startCall(targetUser,type='audio'){
  if(callState.active){toast('Уже активен звонок');return;}
  if(!db.currentUser)return;
  if(!targetUser||targetUser===db.currentUser.username){toast('Нельзя себе');return;}
  if(!navigator.mediaDevices){toast('Не поддерживается');return;}
  const callId=makeCallId(db.currentUser.username,targetUser);
  callState={active:true,callId,peer:null,localStream:null,remoteStream:null,remoteUser:targetUser,isCaller:true,callType:type,listeners:[]};
  try{const stream=await navigator.mediaDevices.getUserMedia({audio:true,video:type==='video'});callState.localStream=stream;}
  catch(err){console.error(err);toast('Нет доступа к микрофону/камере');callState.active=false;return;}
  await database.ref('calls/'+callId).set({from:db.currentUser.username,to:targetUser,type,status:'ringing',createdAt:Date.now()});
  showCallUI('Звонок...');
  const statusRef=database.ref('calls/'+callId+'/status');
  const handler=statusRef.on('value',async snap=>{const st=snap.val();if(st==='accepted'){statusRef.off('value',handler);await setupPeer(true,callId);setCallStatus('Соединение...');}else if(st==='declined'){toast('Отклонён');endCall();}else if(st==='ended'){endCall();}});
  callState.listeners.push(()=>statusRef.off('value',handler));
  setTimeout(()=>{if(callState.callId===callId && callState.active && !callState.peer){toast('Нет ответа');endCall();}},60000);
}
async function setupPeer(isCaller,callId){
  const peer=new RTCPeerConnection(RTC_CONFIG);
  callState.peer=peer;
  callState.localStream.getTracks().forEach(t=>peer.addTrack(t,callState.localStream));
  peer.ontrack=e=>{callState.remoteStream=e.streams[0];const rv=document.getElementById('callRemoteVideo');const ra=document.getElementById('callRemoteAudio');if(callState.callType==='video' && rv){rv.srcObject=e.streams[0];rv.play().catch(()=>{});}else if(ra){ra.srcObject=e.streams[0];ra.play().catch(()=>{});}setCallStatus('Разговор');};
  peer.onicecandidate=e=>{if(e.candidate)database.ref('calls/'+callId+'/ice/'+(isCaller?'caller':'callee')).push(e.candidate.toJSON());};
  peer.onconnectionstatechange=()=>{if(peer.connectionState==='disconnected'||peer.connectionState==='failed'){toast('Связь потеряна');endCall();}};
  const remoteIce=database.ref('calls/'+callId+'/ice/'+(isCaller?'callee':'caller'));
  const ih=remoteIce.on('child_added',s=>{const c=s.val();if(c)peer.addIceCandidate(new RTCIceCandidate(c)).catch(()=>{});});
  callState.listeners.push(()=>remoteIce.off('child_added',ih));
  if(isCaller){const offer=await peer.createOffer();await peer.setLocalDescription(offer);await database.ref('calls/'+callId+'/offer').set({type:offer.type,sdp:offer.sdp});const ansRef=database.ref('calls/'+callId+'/answer');const ah=ansRef.on('value',async s=>{const a=s.val();if(a && !peer.currentRemoteDescription){await peer.setRemoteDescription(new RTCSessionDescription(a));ansRef.off('value',ah);}});callState.listeners.push(()=>ansRef.off('value',ah));}
}
async function acceptCall(callId,remoteUser,type){
  document.getElementById('incomingCallOverlay')?.remove();
  if(callState.active)return;
  if(!navigator.mediaDevices){toast('Не поддерживается');return;}
  callState={active:true,callId,peer:null,localStream:null,remoteStream:null,remoteUser,isCaller:false,callType:type,listeners:[]};
  try{const stream=await navigator.mediaDevices.getUserMedia({audio:true,video:type==='video'});callState.localStream=stream;}
  catch(err){console.error(err);toast('Нет доступа');await database.ref('calls/'+callId+'/status').set('declined');callState.active=false;return;}
  await database.ref('calls/'+callId+'/status').set('accepted');
  showCallUI('Соединение...');
  const peer=new RTCPeerConnection(RTC_CONFIG);
  callState.peer=peer;
  stream.getTracks().forEach(t=>peer.addTrack(t,stream));
  peer.ontrack=e=>{callState.remoteStream=e.streams[0];const rv=document.getElementById('callRemoteVideo');const ra=document.getElementById('callRemoteAudio');if(type==='video' && rv){rv.srcObject=e.streams[0];rv.play().catch(()=>{});}else if(ra){ra.srcObject=e.streams[0];ra.play().catch(()=>{});}setCallStatus('Разговор');};
  peer.onicecandidate=e=>{if(e.candidate)database.ref('calls/'+callId+'/ice/callee').push(e.candidate.toJSON());};
  peer.onconnectionstatechange=()=>{if(peer.connectionState==='disconnected'||peer.connectionState==='failed'){toast('Связь потеряна');endCall();}};
  const callerIce=database.ref('calls/'+callId+'/ice/caller');
  const ih=callerIce.on('child_added',s=>{const c=s.val();if(c)peer.addIceCandidate(new RTCIceCandidate(c)).catch(()=>{});});
  callState.listeners.push(()=>callerIce.off('child_added',ih));
  const offerSnap=await database.ref('calls/'+callId+'/offer').once('value');
  const offer=offerSnap.val();
  if(offer){await peer.setRemoteDescription(new RTCSessionDescription(offer));const answer=await peer.createAnswer();await peer.setLocalDescription(answer);await database.ref('calls/'+callId+'/answer').set({type:answer.type,sdp:answer.sdp});}
}
function endCall(){
  if(callState.callId){database.ref('calls/'+callState.callId+'/status').set('ended').catch(()=>{});}
  callState.listeners.forEach(fn=>{try{fn();}catch(e){}});callState.listeners=[];
  if(callState.peer){try{callState.peer.close();}catch(e){}callState.peer=null;}
  if(callState.localStream){callState.localStream.getTracks().forEach(t=>t.stop());callState.localStream=null;}
  callState.remoteStream=null;
  const cid=callState.callId;callState.active=false;callState.callId=null;
  hideCallUI();
  if(cid)setTimeout(()=>{database.ref('calls/'+cid).remove().catch(()=>{});},3000);
}

async function startGroupCall(chatId){
  if(groupCallState.active){toast('Уже активен групповой звонок');return;}
  if(!navigator.mediaDevices){toast('Не поддерживается');return;}

  const roomId = 'room_'+chatId;const me = db.currentUser.username;
  const participants = Object.keys(chat.members||{}).filter(u=>u!==me);
  if(!participants.length){toast('Нет участников');return;}
  try{const stream = await navigator.mediaDevices.getUserMedia({audio:true, video:false});groupCallState.localStream = stream;}catch(err){toast('Нет доступа к микрофону');return;}
  groupCallState.active = true;groupCallState.roomId = roomId;groupCallState.peers = {};groupCallState.participants = {};groupCallState.listeners = [];

  await database.ref('rooms/'+roomId+'/participants/'+me).set({joinedAt:Date.now(), online:true});
  const partRef = database.ref('rooms/'+roomId+'/participants');
  const partHandler = partRef.on('value', snap => {const parts = snap.val()||{};groupCallState.participants = parts;Object.keys(parts).forEach(user => {if(user === me) return;if(groupCallState.peers[user]) return;if(!parts[user].online) return;if(me < user){ createPeerConnection(user, roomId, true); } else { createPeerConnection(user, roomId, false); }});});
  groupCallState.listeners.push(()=>partRef.off('value', partHandler));
  showGroupCallUI();
  await database.ref('chats/'+chatId).update({activeCall: roomId, callStartedAt: Date.now()});
}
async function createPeerConnection(remoteUser, roomId, isInitiator){
  if(groupCallState.peers[remoteUser]) return;
  const me = db.currentUser.username;
  const peer = new RTCPeerConnection(RTC_CONFIG);
  groupCallState.peers[remoteUser] = {pc: peer, stream: null};
  groupCallState.localStream.getTracks().forEach(t => peer.addTrack(t, groupCallState.localStream));
  peer.ontrack = e => {groupCallState.peers[remoteUser].stream = e.streams[0];const audioEl = document.getElementById('gcAudio_'+remoteUser);if(audioEl){ audioEl.srcObject = e.streams[0]; audioEl.play().catch(()=>{}); }else { const a = document.createElement('audio'); a.id='gcAudio_'+remoteUser; a.autoplay=true; a.srcObject=e.streams[0]; document.body.appendChild(a); }updateGroupCallGrid();};
  peer.onicecandidate = e => { if(e.candidate) database.ref(`rooms/${roomId}/signals/${me}_to_${remoteUser}/ice`).push(e.candidate.toJSON()); };
  peer.onconnectionstatechange = () => { if(peer.connectionState === 'disconnected' || peer.connectionState === 'failed'){ removePeerFromCall(remoteUser); } };
  const remoteIceRef = database.ref(`rooms/${roomId}/signals/${remoteUser}_to_${me}/ice`);
  const iceHandler = remoteIceRef.on('child_added', s => { const c = s.val(); if(c) peer.addIceCandidate(new RTCIceCandidate(c)).catch(()=>{}); });
  groupCallState.listeners.push(() => remoteIceRef.off('child_added', iceHandler));
  if(isInitiator){const offer = await peer.createOffer();await peer.setLocalDescription(offer);await database.ref(`rooms/${roomId}/signals/${me}_to_${remoteUser}/offer`).set({type:offer.type, sdp:offer.sdp});const ansRef = database.ref(`rooms/${roomId}/signals/${remoteUser}_to_${me}/answer`);const ah = ansRef.on('value', async s => { const a = s.val(); if(a && !peer.currentRemoteDescription){ await peer.setRemoteDescription(new RTCSessionDescription(a)); ansRef.off('value', ah); } });groupCallState.listeners.push(() => ansRef.off('value', ah));}
  else {const offerRef = database.ref(`rooms/${roomId}/signals/${remoteUser}_to_${me}/offer`);const oh = offerRef.on('value', async s => { const o = s.val(); if(o && !peer.currentRemoteDescription){ await peer.setRemoteDescription(new RTCSessionDescription(o)); const answer = await peer.createAnswer(); await peer.setLocalDescription(answer); await database.ref(`rooms/${roomId}/signals/${me}_to_${remoteUser}/answer`).set({type:answer.type, sdp:answer.sdp}); offerRef.off('value', oh); }});groupCallState.listeners.push(() => offerRef.off('value', oh));}
}
function removePeerFromCall(remoteUser){const p = groupCallState.peers[remoteUser];if(p){ try{p.pc.close();}catch(e){} delete groupCallState.peers[remoteUser]; }document.getElementById('gcAudio_'+remoteUser)?.remove();updateGroupCallGrid();}
async function leaveGroupCall(){
  const me = db.currentUser.username;const roomId = groupCallState.roomId;
  if(roomId){await database.ref(`rooms/${roomId}/participants/${me}`).remove().catch(()=>{});await database.ref(`rooms/${roomId}/signals`).remove().catch(()=>{});const roomSnap = await database.ref(`rooms/${roomId}/participants`).once('value');if(!roomSnap.exists()) await database.ref('rooms/'+roomId).remove().catch(()=>{});}
  Object.keys(groupCallState.peers).forEach(u => removePeerFromCall(u));
  groupCallState.listeners.forEach(fn => { try{fn();}catch(e){} });groupCallState.listeners = [];
  if(groupCallState.localStream){ groupCallState.localStream.getTracks().forEach(t=>t.stop()); groupCallState.localStream = null; }
  groupCallState.active = false;groupCallState.roomId = null;

function showGroupCallUI(){
  document.getElementById('groupCallOverlay')?.remove();
  document.body.insertAdjacentHTML('beforeend', `<div id="groupCallOverlay" class="fixed inset-0 z-[500] bg-black flex flex-col fade-in"><div class="p-4 flex items-center justify-between border-b border-white/10"><div class="text-white font-medium"><i class="fas fa-phone-volume mr-2"></i>Групповой звонок</div><div class="text-white/60 text-sm" id="gcCount">Участники: 1</div></div><div id="groupCallGrid" class="flex-grow grid grid-cols-2 gap-3 p-4 overflow-y-auto auto-rows-max"><div class="group-call-tile" data-user="${db.currentUser.username}">${getAvatarHtml(db.currentUser.avatar, db.currentUser.displayName, 20)}<div class="absolute bottom-2 left-2 text-white text-xs bg-black/50 px-2 py-1 rounded">Вы</div></div></div><div class="p-4 flex justify-center gap-4 border-t border-white/10"><button onclick="toggleGroupMute()" id="gcBtnMute" class="w-14 h-14 rounded-full bg-white/15 text-white flex items-center justify-center text-lg"><i class="fas fa-microphone"></i></button><button onclick="leaveGroupCall()" class="w-16 h-16 rounded-full bg-red-500 text-white flex items-center justify-center text-xl"><i class="fas fa-phone-slash"></i></button></div></div>`);
  updateGroupCallGrid();
}
function updateGroupCallGrid(){
  const grid = document.getElementById('groupCallGrid');if(!grid) return;
  const participants = groupCallState.participants || {};const me = db.currentUser.username;
  const others = Object.keys(participants).filter(u => u !== me);
  const cEl = document.getElementById('gcCount');if(cEl) cEl.textContent = 'Участники: ' + (1 + others.length);
  const myTile = grid.querySelector('[data-user="'+me+'"]');
  let html = myTile ? myTile.outerHTML : '';
  others.forEach(u => {if(grid.querySelector('[data-user="'+u+'"]')) return;const user = db.users[u] || {};html += `<div class="group-call-tile" data-user="${u}">${getAvatarHtml(user.avatar, user.displayName||u, 20)}<div class="absolute bottom-2 left-2 text-white text-xs bg-black/50 px-2 py-1 rounded">${escapeHtml(user.displayName||u)}</div></div>`;});
  grid.innerHTML = html;
}
function toggleGroupMute(){if(!groupCallState.localStream) return;const t = groupCallState.localStream.getAudioTracks()[0];if(!t) return;t.enabled = !t.enabled;const b = document.getElementById('gcBtnMute');if(b) b.innerHTML = t.enabled ? '<i class="fas fa-microphone"></i>' : '<i class="fas fa-microphone-slash text-red-400"></i>';}
function listenIncomingGroupCalls(){
  if(!db.currentUser) return;
  const me = db.currentUser.username;
  database.ref('rooms').on('value', snap => {const rooms = snap.val()||{};let inviteRoom = null;Object.entries(rooms).forEach(([rid, r]) => {if(!r.info || !r.participants) return;const chatId = r.info.chatId;const myChats = db.chats[chatId];if(!myChats) return;if(r.participants[me]) return;if(r.info.startedBy === me) return;if(r.declined && r.declined[me]) return;inviteRoom = {roomId: rid, info: r.info, from: r.info.startedBy};});if(inviteRoom && !groupCallState.active){ showIncomingGroupCall(inviteRoom.roomId, inviteRoom.info, inviteRoom.from); }else { document.getElementById('incomingGroupCallOverlay')?.remove(); }});
}
function showIncomingGroupCall(roomId, info, from){
  if(document.getElementById('incomingGroupCallOverlay')) return;
  const user = db.users[from]||{};
  document.body.insertAdjacentHTML('beforeend', `<div id="incomingGroupCallOverlay" class="fixed inset-0 z-[500] bg-black/95 flex flex-col items-center justify-center gap-6 fade-in"><div class="animate-pulse">${getAvatarHtml(user.avatar, user.displayName||from, 32)}</div><div class="text-center"><div class="text-white text-3xl font-bold mb-2">${escapeHtml(user.displayName||from)}</div><div class="text-white/70 text-sm">📞 Групповой звонок</div></div><div class="flex gap-8 mt-8"><button onclick="declineGroupCall('${roomId}')" class="w-20 h-20 rounded-full bg-red-500 text-white flex items-center justify-center text-2xl"><i class="fas fa-phone-slash"></i></button><button onclick="joinGroupCall('${roomId}')" class="w-20 h-20 rounded-full bg-emerald-500 text-white flex items-center justify-center text-2xl animate-bounce"><i class="fas fa-phone"></i></button></div></div>`);
  try{const ctx=new (window.AudioContext||window.webkitAudioContext)();const beep=()=>{if(!document.getElementById('incomingGroupCallOverlay'))return;const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=800;g.gain.setValueAtTime(.15,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.4);o.start();o.stop(ctx.currentTime+.4);setTimeout(beep,1200);};beep();}catch(e){}
}
async function declineGroupCall(roomId){await database.ref(`rooms/${roomId}/declined/${db.currentUser.username}`).set(true);document.getElementById('incomingGroupCallOverlay')?.remove();}
async function joinGroupCall(roomId){
  document.getElementById('incomingGroupCallOverlay')?.remove();
  if(groupCallState.active){ toast('Уже в звонке'); return; }
  if(!navigator.mediaDevices){ toast('Не поддерживается'); return; }
  const me = db.currentUser.username;
  try{const stream = await navigator.mediaDevices.getUserMedia({audio:true, video:false});groupCallState.localStream = stream;}catch(err){ toast('Нет доступа'); return; }
  groupCallState.active = true;groupCallState.roomId = roomId;groupCallState.peers = {};groupCallState.listeners = [];
  await database.ref(`rooms/${roomId}/participants/${me}`).set({joinedAt:Date.now(), online:true});
  const partRef = database.ref(`rooms/${roomId}/participants`);
  const partHandler = partRef.on('value', snap => {const parts = snap.val()||{};groupCallState.participants = parts;Object.keys(parts).forEach(user => {if(user === me || groupCallState.peers[user]) return;if(!parts[user].online) return;if(me < user) createPeerConnection(user, roomId, true);else createPeerConnection(user, roomId, false);});updateGroupCallGrid();});
  groupCallState.listeners.push(()=>partRef.off('value', partHandler));
  showGroupCallUI();
}

function openTwoFAModal(){
  const enabled = !!db.currentUser.twoFA?.secret;
  if(enabled){openModal('2FA', `<div class="text-center mb-5"><i class="fas fa-shield-alt text-emerald-400 text-5xl mb-3"></i><p class="text-white font-medium mb-1">2FA включена</p></div><button onclick="disable2FATOTP()" class="w-full bg-red-600 hover:bg-red-500 text-white font-medium py-3.5 rounded-xl btn-press text-sm">Отключить</button>`);return;}
  const secret = new OTPAuth.Secret({ size: 20 });
  const secretB32 = secret.base32;
  const totp = new OTPAuth.TOTP({ issuer: '67gramm', label: db.currentUser.username, algorithm: 'SHA1', digits: 6, period: 30, secret: secret });
  const uri = totp.toString();
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(uri)}`;
  window._pending2FASecret = secretB32;
  openModal('Включить 2FA', `<p class="text-white text-sm mb-3 text-center">Открой Google Authenticator и отсканируй QR</p><div class="bg-white p-3 rounded-2xl mx-auto mb-4 w-fit"><img src="${qrUrl}" class="w-48 h-48"></div><p class="text-tg-gray text-xs text-center mb-2">Или код вручную:</p><div class="bg-[#0e1621] p-3 rounded-xl mb-4 text-center"><span class="text-amber-400 font-mono text-sm select-all">${secretB32}</span></div><p class="text-white text-sm mb-2">Введи 6-значный код:</p><input id="totpCode" type="tel" maxlength="6" inputmode="numeric" placeholder="000000" class="w-full bg-[#0e1621] text-white px-4 py-4 rounded-xl border border-black/30 focus:border-[#3390ec] text-2xl text-center tracking-[0.5rem] mb-5 font-mono"><button onclick="enable2FATOTP()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3.5 rounded-xl btn-press text-sm">Включить</button>`);
  setTimeout(() => document.getElementById('totpCode')?.focus(), 100);
}
async function enable2FATOTP(){
  const code = document.getElementById('totpCode').value.trim();
  if(code.length !== 6){ toast('Введите 6 цифр'); return; }
  const totp = new OTPAuth.TOTP({ issuer: '67gramm', label: db.currentUser.username, algorithm: 'SHA1', digits: 6, period: 30, secret: OTPAuth.Secret.fromBase32(window._pending2FASecret) });
  const delta = totp.validate({ token: code, window: 1 });
  if(delta === null){ toast('❌ Неверный код'); return; }
  await database.ref('users/'+db.currentUser.username+'/twoFA').set({ enabled: true, secret: window._pending2FASecret, enabledAt: Date.now() });
  window._pending2FASecret = null;
  toast('✅ 2FA включена');
  openSettingsModal();
}

async function adminGrant4CharUsername(ownerUsername){
  const un=prompt('4-значный юзернейм:','');if(!un)return;
  const lower=un.trim().toLowerCase();
  if(lower.length!==4){toast('Ровно 4');return;}
  if(!/^[a-z]+$/.test(lower)){toast('Только латинские буквы');return;}
  const exists=await database.ref('usernames/'+lower).once('value');
  if(exists.exists()){toast('Занято');return;}
  const uSnap=await database.ref('users/'+ownerUsername).once('value');
  const user=uSnap.val();if(!user){toast('Не найден');return;}
  const count=Object.keys(user.usernames||{}).length;
  if(count>=USERNAME_MAX){toast('Уже 40');return;}
  await database.ref('users/'+ownerUsername+'/usernames/'+lower).set({at:Date.now(),isPrimary:false,isAdminGranted:true});
  await database.ref('usernames/'+lower).set({owner:ownerUsername,createdAt:Date.now(),grantedBy:db.currentUser.username});
  toast('✅ @'+lower);
  openAdminModal();adminTab('users');
}

async function adminResetExecute(){

  closeModal();toast('⏳ Сброс...');

async function adminViewUserChats(targetUser){
  if(!db.currentUser.isAdmin){toast('Запрещено');return;}
  toast('Загрузка...');
  const chatIdsSnap=await database.ref('userChats/'+targetUser).once('value');
  const chatIds=Object.keys(chatIdsSnap.val()||{});
  if(!chatIds.length){toast('Нет чатов');return;}
  let html='';
  for(const cid of chatIds){
    const chatSnap=await database.ref('chats/'+cid).once('value');
    const chat=chatSnap.val();if(!chat)continue;
    let chatName='Чат';
    if(chat.type==='group')chatName='👥 '+(chat.name||'Группа');
    else if(chat.type==='saved')chatName='⭐ Избранное';
    else{const other=Object.keys(chat.members||{}).find(m=>m!==targetUser);const ou=db.users[other]||{};chatName='💬 '+(ou.displayName||other);}
    const msgsSnap=await database.ref('messages/'+cid).once('value');
    const msgs=msgsSnap.val()||{};
    const sorted=Object.values(msgs).sort((a,b)=>(a.at||0)-(b.at||0));
    const msgList=sorted.map(m=>{let text=m.text||'';if(!text){if(m.fileType?.startsWith('image/'))text='[📷]';else if(m.fileType?.startsWith('video/'))text='[📹]';else if(m.fileType?.startsWith('audio/'))text='[🎤]';else if(m.pollId)text='[📊]';else if(m.gifUrl)text='[GIF]';else if(m.stickerUrl)text='[🎨]';else if(m.fileType)text='[📎]';}const time=m.at?new Date(m.at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';return `<div class="bg-black/30 rounded-lg p-2 mb-1 text-[11px]"><div class="flex justify-between text-tg-gray mb-0.5"><b class="text-[#3390ec]">${escapeHtml(m.from||'?')}</b><span>${time}</span></div><div class="text-white break-words">${escapeHtml(text)}</div></div>`;}).join('');
    const count=sorted.length;
    html+=`<div class="bg-[#0e1621] rounded-xl border border-black/30 mb-3 overflow-hidden"><div class="p-2.5 bg-black/30 flex justify-between"><span class="text-white text-xs font-bold truncate">${escapeHtml(chatName)}</span><span class="text-tg-gray text-[10px]">${count}</span></div><div class="max-h-48 overflow-y-auto p-2">${msgList||'<p class="text-tg-gray text-[11px] text-center py-2">Пусто</p>'}</div></div>`;
  }
  openModal('💬 Чаты @'+targetUser,`<div class="max-h-[70vh] overflow-y-auto">${html}</div>`);
}

async function adminCreateNewGift(){
  const key=document.getElementById('newGiftKey').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
  const name=document.getElementById('newGiftName').value.trim();
  const icon=document.getElementById('newGiftIcon').value.trim();
  const category=document.getElementById('newGiftCategory').value;
  const price=parseInt(document.getElementById('newGiftPrice').value)||100;
  const supply=parseInt(document.getElementById('newGiftSupply').value)||1000000;
  if(!key || key.length < 2){ toast('Ключ минимум 2 символа'); return; }
  if(!name){ toast('Введите название'); return; }
  if(!icon){ toast('Введите картинку'); return; }
  if(GIFT_CATALOG[key]){ toast('Ключ занят'); return; }
  const bgPresets = ['from-red-500 to-pink-600','from-blue-500 to-indigo-600','from-emerald-500 to-teal-600','from-amber-500 to-orange-600','from-purple-600 to-indigo-900','from-cyan-400 to-blue-700','from-fuchsia-400 to-purple-600','from-zinc-600 to-zinc-900'];
  const bg = bgPresets[Math.floor(Math.random()*bgPresets.length)];
  const emoji = /^[^a-zA-Z0-9]{1,4}$/.test(icon) ? icon : '';
  await database.ref('giftsMarket/'+key).set({name, icon, emoji, bg, category, price, totalSupply: supply, custom: true, createdBy: db.currentUser.username});
  GIFT_CATALOG[key] = { name, icon, emoji, bg, category, price, totalSupply: supply };
  toast('✅ Создан: '+name);
  closeModal();openAdminModal();adminTab('gifts');

const PHOTO_SAVED_LABEL='📷 фото загружено';
function isImageFile(f){return !!(f&&f.type&&f.type.startsWith('image/'));}
async function fileToImageData(file,opt){
  const max=(opt&&opt.max)||1024,q=(opt&&opt.q)||.85;
  if(!isImageFile(file))return fileToBase64(file);
  if(file.type==='image/gif'&&file.size<5000000)return fileToBase64(file);
  if(file.type==='image/svg+xml'&&file.size<1000000)return fileToBase64(file);
  let url;
  try{
    url=URL.createObjectURL(file);
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('img'));i.src=url;});
    const w0=img.naturalWidth||img.width,h0=img.naturalHeight||img.height;
    const k=Math.min(1,max/Math.max(w0,h0));
    if(k===1&&file.size<250000)return await fileToBase64(file);
    const w=Math.max(1,Math.round(w0*k)),h=Math.max(1,Math.round(h0*k));
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    let out=c.toDataURL('image/webp',q);
    if(!out.startsWith('data:image/webp'))out=c.toDataURL(file.type==='image/jpeg'?'image/jpeg':'image/png',q);
    return out;
  }catch(e){
    console.warn('compress fail',e);
    if(file.size>6000000)throw e;
    return fileToBase64(file);
  }finally{if(url)URL.revokeObjectURL(url);}
}

/* --- drop-зоны --- */
function dzHtml(kind,arg,label,opts){
  opts=opts||{};
  const inner=opts.inner||`<div class="py-4 px-3 text-tg-gray text-xs"><i class="fas fa-cloud-upload-alt text-[#3390ec] text-xl block mb-1.5"></i>${label||'Перетащи фото сюда или нажми'}</div>`;
  return `<div class="drop-zone text-center ${opts.cls||''}" ${opts.style?`style="${opts.style}"`:''} data-kind="${kind}" data-arg="${escapeHtml(arg||'')}" onclick="if(event.target.tagName!=='INPUT')this.querySelector('input').click()"><input type="file" accept="image/*" ${opts.multi?'multiple':''} class="hidden">${inner}</div>`;
}
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('.drop-zone');if(z){e.preventDefault();z.classList.add('drag');}});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('.drop-zone');if(z&&!z.contains(e.relatedTarget))z.classList.remove('drag');});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('.drop-zone');if(!z)return;e.preventDefault();z.classList.remove('drag');if(e.dataTransfer&&e.dataTransfer.files.length)handleDropFiles(z,Array.from(e.dataTransfer.files));});
document.addEventListener('change',e=>{const t=e.target;if(t&&t.matches&&t.matches('.drop-zone input[type=file]')){const z=t.closest('.drop-zone');const files=Array.from(t.files||[]);t.value='';if(files.length)handleDropFiles(z,files);}});

async function handleDropFiles(z,files){
  const kind=z.dataset.kind,arg=z.dataset.arg;
  const imgs=files.filter(isImageFile);
  if(!imgs.length){toast('Нужна картинка');return;}
  try{
    if(kind==='gift-bulk'){await adminBulkGiftIcons(imgs);return;}
    if(kind==='sticker'){
      toast('⏳ Загрузка...');
      for(const f of imgs){window._newPackStickers=window._newPackStickers||[];window._newPackStickers.push(await fileToImageData(f,{max:512}));}
      renderStickerPreview();toast('Добавлено: '+imgs.length);return;
    }
    const f=imgs[0];
    if(kind==='gift-icon'){toast('⏳ Загрузка...');await adminSetGiftIcon(arg,await fileToImageData(f,{max:512,q:.82}));return;}
    if(kind==='gift-new'){
      const b=await fileToImageData(f,{max:512,q:.82});
      const inp=document.getElementById('newGiftIcon');if(inp)inp.value=b;
      const pv=document.getElementById('newGiftPreview');if(pv)pv.innerHTML=`<img src="${b}" class="w-full h-full object-contain">`;
      toast('Фото загружено');return;
    }
    if(kind==='avatar-me'){
      const b=await fileToImageData(f,{max:512,q:.85});
      await database.ref('users/'+db.currentUser.username+'/avatar').set(b);
      toast('Аватар обновлён');openSettingsModal();return;
    }
    if(kind==='user-avatar'){
      if(!db.currentUser.isAdmin)return;
      const b=await fileToImageData(f,{max:512,q:.85});
      await database.ref('users/'+arg+'/avatar').set(b);
      toast('Аватар @'+arg+' обновлён');openAdminModal();adminTab('users');return;
    }
    if(kind==='group-avatar'){
      const b=await fileToImageData(f,{max:512,q:.85});
      await database.ref('chats/'+arg+'/avatar').set(b);
      toast('Аватар группы обновлён');closeModal();return;
    }
  }catch(err){console.error(err);toast('Ошибка загрузки');}
}

  if(!quiet)toast('✅ Фото сохранено');

function _normKey(x){return String(x||'').toLowerCase().replace(/[^a-z0-9]/g,'');}
async function adminBulkGiftIcons(files){
  const byNorm={};
  Object.keys(GIFT_CATALOG).forEach(k=>{byNorm[_normKey(k)]=k;const nn=_normKey(GIFT_CATALOG[k].name);if(!byNorm[nn])byNorm[nn]=k;});
  let ok=0;const miss=[];
  toast('⏳ Загрузка '+files.length+' файл(ов)...',4000);
  for(const f of files){
    const base=f.name.replace(/\.[^.]+$/,'');
    const cands=[base,base.replace(/\.large$/i,''),base.replace(/[-_ ]?\d+(\.large)?$/i,'')].map(_normKey);
    const k=cands.map(c=>byNorm[c]).find(Boolean);
    if(!k){miss.push(f.name);continue;}
    try{await adminSetGiftIcon(k,await fileToImageData(f,{max:512,q:.82}),true);ok++;}catch(e){miss.push(f.name);}
  }
  const box=document.getElementById('bulkResult');
  if(box)box.innerHTML=`<div class="text-emerald-400 text-xs">Загружено: ${ok} из ${files.length}</div>`+(miss.length?`<div class="text-amber-400 text-xs mt-1 break-words">Не нашёл подарок для: ${miss.map(escapeHtml).join(', ')}</div><div class="text-tg-gray text-[10px] mt-1">Назови файл как ключ подарка, например plushpepe.png</div>`:'');
  toast('Готово: '+ok+'/'+files.length);
}

const GIFT_ORIG_ICON={};
Object.keys(GIFT_CATALOG).forEach(k=>{GIFT_ORIG_ICON[k]=GIFT_CATALOG[k].icon;});
window._iconRemap={};
function rebuildMarket(){
  const raw=db._giftsRaw||{};
  Object.keys(raw).forEach(k=>{
    if(GIFT_ORIG_ICON[k]===undefined)GIFT_ORIG_ICON[k]=raw[k].icon;
    GIFT_CATALOG[k]={...(GIFT_CATALOG[k]||{}),...raw[k]};
  });
  const market={},remap={};
  Object.keys(GIFT_CATALOG).forEach(k=>{
    const g={...GIFT_CATALOG[k]};
    const cfg=(db.giftConfig&&db.giftConfig[k])||{};
    if(cfg.icon){g.icon=cfg.icon;const o=GIFT_ORIG_ICON[k];if(o&&o!==cfg.icon)remap[o]=cfg.icon;}
    if(cfg.emoji)g.emoji=cfg.emoji;
    market[k]=g;
  });
  window._iconRemap=remap;
  db.market=market;
}

/* --- поиск людей --- */
function searchPeople(q){
  q=String(q||'').trim().toLowerCase().replace(/^@/,'');
  if(!q)return[];
  const me=db.currentUser.username,users=db.users||{},found={};
  Object.keys(users).forEach(un=>{
    if(un===me)return;
    const u=users[un]||{};if(u.banned)return;
    const dn=String(u.displayName||'').toLowerCase();
    const aliases=Object.keys(u.usernames||{});
    const al=aliases.find(a=>a.toLowerCase().includes(q));
    if(un.toLowerCase().includes(q))found[un]=un;
    else if(al)found[un]=al;
    else if(dn.includes(q))found[un]=un;
  });
  const map=db.usernames||{};
  Object.keys(map).forEach(a=>{
    if(!a.toLowerCase().includes(q))return;
    const o=map[a]&&map[a].owner;
    if(o&&o!==me&&users[o]&&!users[o].banned&&!found[o])found[o]=a;
  });
  return Object.keys(found).map(un=>{
    const u=users[un],hit=found[un];
    const exact=(un.toLowerCase()===q||hit.toLowerCase()===q)?0:1;
    return{un,u,hit,exact};
  }).sort((a,b)=>a.exact-b.exact||String(a.u.displayName||a.un).localeCompare(String(b.u.displayName||b.un))).slice(0,30);
}
