const firebaseConfig = { apiKey:"AIzaSyCm5Ikh0OV1bP2fbep-7Kg7rcuNN4PujRY", authDomain:"sixseven-67001.firebaseapp.com", databaseURL:"https://sixseven-67001-default-rtdb.firebaseio.com", projectId:"sixseven-67001", storageBucket:"sixseven-67001.firebasestorage.app", messagingSenderId:"652602968843", appId:"1:652602968843:web:17dadd54f0f5bd6255b00e" };

catch(e){ console.error(e); database={ref:()=>({on:()=>{},off:()=>{},once:()=>Promise.resolve({exists:()=>false,val:()=>null}),set:()=>Promise.resolve(),remove:()=>Promise.resolve(),update:()=>Promise.resolve()})}; }

const DEFAULT_MARKET = {

let db = { currentUser:null, users:{}, chats:{}, reports:{}, market:{} };

let activeFolderId = 'all';

/* ============================================================
   WEBRTC CALLS
============================================================ */
let localStream = null, pc = null, callState = null, currentCallTarget = null;
function initCallUI() {
    if(!document.getElementById('callOverlay')){
        document.body.insertAdjacentHTML('beforeend', `
        <div id="callOverlay" class="hidden fixed inset-0 z-[300] bg-[#1c242d] flex flex-col items-center justify-between py-12 text-white pop-in">
            <div class="text-center mt-8">
                <div id="callAvatar" class="mb-6 relative"></div>
                <div id="callName" class="text-2xl font-bold mb-2">Name</div>
                <div id="callStatus" class="text-tg-blue">Установка соединения...</div>
                <div id="callDuration" class="text-white hidden font-mono text-lg mt-2">00:00</div>
            </div>
            <div class="flex items-center gap-8 mb-8" id="callButtons"></div>
            <audio id="localAudioCall" autoplay muted class="hidden"></audio>
            <audio id="remoteAudioCall" autoplay class="hidden"></audio>
        </div>`);
    }
}
async function startAudioCall() {
    const chat = db.chats[activeChatId];
    if(!chat || chat.type === 'group' || chat.type === 'saved') { toast('Звонки доступны только в личных чатах'); return; }
    const target = Object.keys(chat.members).find(m => m !== db.currentUser.username);
    if(!target || !isOnline(db.users[target])) { toast('Пользователь не в сети'); return; }

    currentCallTarget = target; callState = 'calling';
    showCallScreen(target, 'Исходящий звонок...');
    
    try {
        localStream = await navigator.mediaDevices.getUserMedia({audio: true});
        document.getElementById('localAudioCall').srcObject = localStream;
        pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
        localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
        pc.ontrack = e => { document.getElementById('remoteAudioCall').srcObject = e.streams[0]; };
        pc.onicecandidate = e => { if(e.candidate) database.ref(`calls/${target}/candidates/caller`).push(e.candidate.toJSON()); };
        
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await database.ref(`calls/${target}`).set({ caller: db.currentUser.username, offer: { type: offer.type, sdp: offer.sdp }, status: 'ringing' });

        database.ref(`calls/${target}/answer`).on('value', snap => {
            if(snap.exists() && pc && pc.signalingState !== 'closed') {
                pc.setRemoteDescription(new RTCSessionDescription(snap.val()));
                document.getElementById('callStatus').innerText = 'Соединение установлено';
                startCallTimer();
            }
        });
        database.ref(`calls/${target}/candidates/callee`).on('child_added', snap => {
            if(snap.exists() && pc) pc.addIceCandidate(new RTCIceCandidate(snap.val()));
        });
        database.ref(`calls/${target}`).on('value', snap => { if(!snap.exists() && callState) endCallLocal(); });
    } catch(e) { console.error(e); toast('Ошибка доступа к микрофону'); endCallLocal(); }
}
function listenForCalls() {
    database.ref(`calls/${db.currentUser.username}`).on('value', snap => {
        const data = snap.val();
        if(!data) { if(callState) endCallLocal(); return; }
        if(data.offer && callState === null) {
            callState = 'receiving'; currentCallTarget = data.caller;
            showCallScreen(data.caller, 'Входящий звонок...', true);
        }
    });
}
async function acceptCall() {
    try {
        document.getElementById('callStatus').innerText = 'Соединение...';
        localStream = await navigator.mediaDevices.getUserMedia({audio: true});
        document.getElementById('localAudioCall').srcObject = localStream;
        pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
        localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
        pc.ontrack = e => { document.getElementById('remoteAudioCall').srcObject = e.streams[0]; };
        pc.onicecandidate = e => { if(e.candidate) database.ref(`calls/${db.currentUser.username}/candidates/callee`).push(e.candidate.toJSON()); };
        
        const callData = (await database.ref(`calls/${db.currentUser.username}`).once('value')).val();
        await pc.setRemoteDescription(new RTCSessionDescription(callData.offer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        await database.ref(`calls/${db.currentUser.username}/answer`).set({ type: answer.type, sdp: answer.sdp });
        await database.ref(`calls/${db.currentUser.username}/status`).set('connected');
        
        database.ref(`calls/${db.currentUser.username}/candidates/caller`).on('child_added', snap => {
            if(snap.exists() && pc) pc.addIceCandidate(new RTCIceCandidate(snap.val()));
        });
        document.getElementById('callStatus').innerText = 'Соединение установлено';
        showCallScreen(currentCallTarget, 'Соединение установлено', false);
        startCallTimer();
    } catch(e) { console.error(e); endCallLocal(); }
}
function endCallLocal() {
    if(pc) { pc.close(); pc = null; }
    if(localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
    if(callState === 'calling' && currentCallTarget) database.ref(`calls/${currentCallTarget}`).remove();
    if((callState === 'receiving' || callState === 'connected') && db.currentUser) database.ref(`calls/${db.currentUser.username}`).remove();
    callState = null; currentCallTarget = null; stopCallTimer();
    const ov = document.getElementById('callOverlay'); if(ov) ov.classList.add('hidden');
}
function showCallScreen(targetUsername, statusText, isIncoming=false) {
    initCallUI();
    const u = db.users[targetUsername] || { displayName: targetUsername };
    const ov = document.getElementById('callOverlay');
    ov.classList.remove('hidden');
    document.getElementById('callName').innerText = u.displayName || targetUsername;
    document.getElementById('callStatus').innerText = statusText;
    document.getElementById('callAvatar').innerHTML = getAvatarHtml(u.avatar, u.displayName || targetUsername, 32, 'shadow-[0_0_40px_rgba(51,144,236,0.4)]');
    
    const btns = document.getElementById('callButtons');
    if(isIncoming) {
        btns.innerHTML = `
            <button onclick="endCallLocal()" class="w-16 h-16 rounded-full bg-red-500 text-white text-2xl flex items-center justify-center btn-press shadow-lg shadow-red-500/30"><i class="fas fa-phone-slash"></i></button>
            <button onclick="acceptCall()" class="w-16 h-16 rounded-full bg-green-500 text-white text-2xl flex items-center justify-center btn-press shadow-lg shadow-green-500/30 animate-pulse"><i class="fas fa-phone"></i></button>
        `;
    } else {
        btns.innerHTML = `
            <button onclick="toggleMuteCall(this)" class="w-14 h-14 rounded-full bg-white/10 text-white text-xl flex items-center justify-center btn-press transition"><i class="fas fa-microphone"></i></button>
            <button onclick="endCallLocal()" class="w-16 h-16 rounded-full bg-red-500 text-white text-2xl flex items-center justify-center btn-press shadow-lg shadow-red-500/30"><i class="fas fa-phone-slash"></i></button>
            <button onclick="toast('Громкая связь отключена')" class="w-14 h-14 rounded-full bg-white/10 text-white text-xl flex items-center justify-center btn-press transition"><i class="fas fa-volume-up"></i></button>
        `;
    }
}
function toggleMuteCall(btn) {
    if(!localStream) return;
    const audioTrack = localStream.getAudioTracks()[0];
    if(audioTrack) {
        audioTrack.enabled = !audioTrack.enabled;
        btn.innerHTML = audioTrack.enabled ? '<i class="fas fa-microphone"></i>' : '<i class="fas fa-microphone-slash text-red-400"></i>';
        btn.classList.toggle('bg-white/10', audioTrack.enabled);
        btn.classList.toggle('bg-white/20', !audioTrack.enabled);
    }
}
let callTimerInt = null, callStartTs = 0;
function startCallTimer() {
    document.getElementById('callDuration').classList.remove('hidden');
    document.getElementById('callStatus').classList.add('hidden');
    callStartTs = Date.now(); clearInterval(callTimerInt);
    callTimerInt = setInterval(() => {
        const s = Math.floor((Date.now() - callStartTs)/1000);
        document.getElementById('callDuration').innerText = `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
    }, 1000);
}
function stopCallTimer() {
    clearInterval(callTimerInt);
    const cd = document.getElementById('callDuration'); if(cd) { cd.classList.add('hidden'); cd.innerText = '00:00'; }
    const cs = document.getElementById('callStatus'); if(cs) cs.classList.remove('hidden');
}

function playNotificationSound() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine'; osc.frequency.setValueAtTime(440, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.2);
    } catch(e) {}
}
function showPushNotification(cid, lm) {
    playNotificationSound();
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    let info = chatDisplayInfo(cid);
    let bodyText = (lm.from ? (lm.from + ': ') : '') + (lm.text || 'Отправил(а) медиа/файл');
    new Notification('67gramm: ' + info.name, {
        body: bodyText,
        icon: 'https://telegram.org/favicon.ico'
    });
}
function requestPushPermission(){
    if(!('Notification' in window)) { toast('Push не поддерживается'); return; }

/* ============================================================
   AVATARS & GIFT ICONS
============================================================ */
const AVATAR_TEXT = {8:'text-xs',10:'text-sm',12:'text-base',14:'text-lg',16:'text-xl',20:'text-2xl',24:'text-4xl',32:'text-5xl'};
const AVATAR_COLORS = ['from-red-500 to-pink-600','from-orange-500 to-red-500','from-amber-500 to-orange-600','from-emerald-500 to-teal-600','from-cyan-500 to-blue-500','from-blue-500 to-indigo-600','from-violet-500 to-purple-600','from-fuchsia-500 to-pink-600'];
function pickColor(n){ let h=0; for(let i=0;i<(n||'').length;i++) h=(h*31+n.charCodeAt(i))|0; return AVATAR_COLORS[Math.abs(h)%AVATAR_COLORS.length]; }
function getAvatarHtml(src,name,size=10,extra=''){
  const dim=`w-${size} h-${size}`;
  const base=`${dim} ${extra} rounded-full shrink-0 shadow object-cover avatar-shadow`;
  if(src) return `<img src="${src}" class="${base}" alt="">`;
  const letter=escapeHtml((name||'?').trim().charAt(0).toUpperCase()||'?');
  return `<div class="${dim} ${extra} rounded-full bg-gradient-to-br ${pickColor(name||'?')} flex items-center justify-center text-white font-bold shrink-0 shadow avatar-shadow ${AVATAR_TEXT[size]||'text-sm'}">${letter}</div>`;
}
function renderGiftIcon(icon,size='text-4xl',extra=''){
  const s=String(icon||'🎁').trim();
  if(/^(https?:\/\/|data:image\/)/i.test(s))
    return `<img src="${escapeHtml(s)}" alt="" class="${extra} object-contain inline-block align-middle" style="width:1em;height:1em;" onerror="this.outerHTML='<span class=\\'${size}\\'>🎁</span>'">`;
  return `<span class="${size} ${extra} inline-block align-middle">${s}</span>`;
}

window.onload = function(){
  try {
    const saved = localStorage.getItem('g67_currentUser');
    if(saved){
      db.currentUser = {username:saved, displayName:saved, stars:0, scale:100, folders:{}, gifts:{}, theme:'dark', fontScale:15};
      applyTheme(db.currentUser.theme); applyFontScale(db.currentUser.fontScale); renderMainLayout();
      database.ref('users/'+saved).once('value').then(snap=>{
        if(!snap.exists()){ logout(); return; }
        const u = snap.val();
        if(u.banned){ logout(); toast('Аккаунт заблокирован'); return; }
        db.currentUser = u;
        applyScale(u.scale||100); applyTheme(u.theme||'dark'); applyFontScale(u.fontScale||15);
        startGlobalListeners(); renderMainLayout(); trackPresence(); listenForCalls();
        if ('Notification' in window && Notification.permission === 'default') setTimeout(() => Notification.requestPermission(), 3000);
      }).catch(()=>{ renderMainLayout(); startGlobalListeners(); listenForCalls(); });
    } else {
      renderAuthScreen();
    }
  } catch(err){ console.error(err); renderAuthScreen(); }
};
function trackPresence(){
  if(!db.currentUser) return;
  const ping=()=>{ if(db.currentUser) database.ref('users/'+db.currentUser.username+'/lastSeen').set(Date.now()).catch(()=>{}); };
  ping(); setInterval(ping,45000); window.addEventListener('beforeunload',ping);
}

/* ============================================================
   GLOBAL LISTENERS
============================================================ */
function startGlobalListeners(){
  if(globalListenersStarted||!db.currentUser) return;
  globalListenersStarted = true;
  const me = db.currentUser.username;

  database.ref('users/'+me).on('value',snap=>{
    if(!snap.exists()) return;
    const u = snap.val();
    if(u.banned){ logout(); toast('Аккаунт заблокирован'); return; }
    const themeChanged = u.theme !== db.currentUser.theme;
    const fontChanged = u.fontScale !== db.currentUser.fontScale;
    db.currentUser = u;
    applyScale(u.scale||100);
    if(themeChanged) applyTheme(u.theme||'dark');
    if(fontChanged) applyFontScale(u.fontScale||15);
    updateDrawerInfo(); renderSidebar(); refreshChatHeader();
  });
  database.ref('users').on('value',snap=>{ db.users=snap.val()||{}; renderSidebar(); refreshChatHeader(); });

  database.ref('userChats/'+me).on('value',snap=>{
    const map = snap.val()||{};
    const cids = Object.keys(map);
    cids.forEach(cid=>{
      if(chatRefs[cid]) return;
      const cb = cs => {
        if(cs.exists()) {
            let cData = cs.val();
            let oldLmTime = db.chats[cid] && db.chats[cid].lastMessage ? db.chats[cid].lastMessage.at : 0;
            db.chats[cid] = cData;
            let lm = cData.lastMessage;
            if(lm && lm.at > appInitTime && lm.at > oldLmTime && lm.from !== db.currentUser.username) {
                if(activeChatId !== cid || document.hidden) showPushNotification(cid, lm);
            }
        } else { delete db.chats[cid]; database.ref('chats/'+cid).off('value',cb); delete chatRefs[cid]; }
        renderSidebar(); refreshChatHeader(); refreshPinnedBar();
      };
      database.ref('chats/'+cid).on('value',cb); chatRefs[cid]=cb;
    });
    Object.keys(chatRefs).forEach(cid=>{
      if(!map[cid]){ database.ref('chats/'+cid).off('value',chatRefs[cid]); delete chatRefs[cid]; delete db.chats[cid]; }
    });
    renderSidebar();
  });

  database.ref('reports').on('value',snap=>{ db.reports = snap.val()||{}; });
  database.ref('giftsMarket').on('value',snap=>{
    if(!snap.exists()){ database.ref('giftsMarket').set(DEFAULT_MARKET); return; }
    db.market = snap.val()||{};
  });
}
function stopGlobalListeners(){
  try{ database.ref().off(); }catch(e){}
  Object.keys(chatRefs).forEach(k=>delete chatRefs[k]);
  currentChatListener=null; globalListenersStarted=false;
}

============================================================ */
function applyTheme(theme){
  const t = theme||'dark';
  if(t==='light') document.body.classList.add('theme-light');
  else if(t==='system'){
    if(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) document.body.classList.add('theme-light');
    else document.body.classList.remove('theme-light');
  } else document.body.classList.remove('theme-light');
}
function applyFontScale(px){ document.documentElement.style.setProperty('--fs','1px'); document.querySelectorAll('#msgContainer .msg-bubble').forEach(el=>el.style.fontSize=(px||15)+'px'); document.querySelectorAll('#msgContainer [data-msg-text]').forEach(el=>el.style.fontSize=(px||15)+'px'); }

function switchAuthTab(mode){
  activeAuthMode = mode;
  const l=document.getElementById('tabLogin'), r=document.getElementById('tabReg');
  const ph=document.getElementById('authPhone'), p=document.getElementById('authPass');
  if(l) l.className=`flex-1 py-2.5 rounded-lg text-sm font-medium transition ${mode==='login'?'bg-[#2b5278] text-white':'text-tg-gray hover:text-white'}`;
  if(r) r.className=`flex-1 py-2.5 rounded-lg text-sm font-medium transition ${mode==='register'?'bg-[#2b5278] text-white':'text-tg-gray hover:text-white'}`;
  if(ph) ph.classList.toggle('hidden', mode!=='register');
  if(p) p.setAttribute('autocomplete', mode==='register'?'new-password':'current-password');
}
async function handleAuthSubmit(){
  const uInp=document.getElementById('authUsername'), pInp=document.getElementById('authPass'), phInp=document.getElementById('authPhone');
  if(!uInp||!pInp) return;
  const u=uInp.value.trim().toLowerCase(), p=pInp.value, ph=phInp?phInp.value.trim():'';
  if(!u||!p){ toast('Заполните все поля'); return; }
  if(!/^[a-z0-9_]{3,20}$/.test(u)){ toast('Логин: 3-20 символов, латиница/цифры/_'); return; }

  if(activeAuthMode==='register'){
    if(u==='admin'){ toast('Этот логин зарезервирован'); return; }
    if(p.length<4){ toast('Пароль от 4 символов'); return; }
    if(!ph){ toast('Укажите номер телефона'); return; }
    const snap = await database.ref('users/'+u).once('value');
    if(snap.exists()){ toast('Логин занят'); return; }
    const hash = await hashPass(p);
    const nu = { username:u, displayName:u, phone:ph, passHash:hash, avatar:'', stars:100,
      isPremium:false, premiumUntil:0, scale:100, isAdmin:false, createdAt:Date.now(),
      folders:{}, gifts:{}, lastSeen:Date.now(), theme:'dark', fontScale:15 };
    await database.ref('users/'+u).set(nu);
    db.currentUser = nu;
    localStorage.setItem('g67_currentUser', u);
    toast('Добро пожаловать в 67gramm!');
    renderMainLayout(); startGlobalListeners(); listenForCalls(); trackPresence();
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  } else {
    const snap = await database.ref('users/'+u).once('value');
    if(!snap.exists()){ toast('Пользователь не найден'); return; }
    const ud = snap.val();
    if(ud.banned){ toast('Аккаунт заблокирован'); return; }
    const hash = await hashPass(p);
    if(hash !== ud.passHash && p !== ud.passPlain){ toast('Неверный пароль'); return; }
    db.currentUser = ud;
    localStorage.setItem('g67_currentUser', u);
    applyTheme(ud.theme||'dark'); applyFontScale(ud.fontScale||15);
    renderMainLayout(); startGlobalListeners(); listenForCalls(); applyScale(ud.scale||100); trackPresence();
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  }
}

function renderSidebar(){

  let fHtml = `<div onclick="switchFolder('all')" class="folder-tab px-4 py-3 cursor-pointer text-sm font-medium ${activeFolderId==='all'?'active text-[#3390ec] font-semibold':'text-tg-gray hover:text-white'}">Все чаты</div>`;
  Object.keys(folders).forEach(k=>{
    fHtml += `<div onclick="switchFolder('${k}')" class="folder-tab px-4 py-3 cursor-pointer text-sm font-medium ${activeFolderId===k?'active text-[#3390ec] font-semibold':'text-tg-gray hover:text-white'}">${escapeHtml(folders[k].name)}</div>`;
  });
  if(fTabs) fTabs.innerHTML = fHtml;

  const cList = document.getElementById('chatList'); if(!cList) return;
  let chatIds = Object.keys(db.chats||{});
  if(activeFolderId!=='all' && folders[activeFolderId]){
    const fChats = folders[activeFolderId].chats||[];
    chatIds = chatIds.filter(cid=>fChats.includes(cid));
  }

  let items = chatIds.map(cid=>{
    const c = db.chats[cid]; if(!c) return null;
    const isGroup = c.type==='group';
    let name='Чат', avatar='', prem=false, online=false;
    if(isGroup){ name=c.name||'Группа'; avatar=c.avatar; }
    else {
      const ou = Object.keys(c.members||{}).find(m=>m!==db.currentUser.username);
      const u = db.users[ou]||{};
      name = u.displayName||ou||'Пользователь'; avatar = u.avatar;
      prem = isPrem(u); online = isOnline(u);
    }
    const lm = c.lastMessage;
    return { cid, name, avatar, prem, online,
      lastAt: lm?.at||c.createdAt||0,
      lastText: lm ? (lm.fileType && !lm.text ? (lm.fileType.startsWith('audio/')?'🎤 Голосовое':'📎 Вложение') : (lm.text||'Нет сообщений')) : 'Нет сообщений',
      mine: lm && lm.from===db.currentUser.username };
  }).filter(Boolean);

  const q=(document.getElementById('searchInput')?.value||'').toLowerCase();
  if(q) items = items.filter(i=>i.name.toLowerCase().includes(q));
  items.sort((a,b)=>b.lastAt-a.lastAt);

  if(items.length===0){
    cList.innerHTML = `<div class="flex flex-col items-center justify-center text-tg-gray text-sm mt-16 px-4">
      <i class="far fa-comments text-4xl mb-3 text-tg-gray/40"></i>
      ${q?'Ничего не найдено':'Список чатов пуст'}

    <div onclick="openChat('${i.cid}')" class="chat-item flex items-center gap-3 px-3 py-2 cursor-pointer hover:bg-[#202b36] ${activeChatId===i.cid?'active bg-tg-active':''} transition">

        ${getAvatarHtml(i.avatar, i.name, 12)}
        ${i.online?'<span class="online-dot absolute bottom-2 right-0 w-3 h-3 bg-emerald-500 rounded-full"></span>':''}
      </div>
      <div class="flex-grow min-w-0 py-2 pr-1">
        <div class="flex justify-between items-center gap-2 mb-0.5">
          <div class="text-white font-medium text-[15px] truncate flex items-center gap-1">${escapeHtml(i.name)} ${i.prem?'<i class="fas fa-star text-amber-400 text-[10px]"></i>':''}</div>
          <div class="text-[11px] ${activeChatId===i.cid?'text-blue-200/90':'text-tg-gray'} shrink-0">${i.lastAt?listTime(i.lastAt):''}</div>
        </div>
        <div class="flex items-center gap-1 text-[13px] ${activeChatId===i.cid?'text-blue-100/80':'text-tg-gray'} truncate">
          ${i.mine?'<i class="fas fa-check-double text-[#5eb5f7] text-[11px] shrink-0"></i>':''}
          <span class="truncate">${escapeHtml(i.lastText)}</span>
        </div>
      </div>

  `).join('');
  refreshEmojis(cList);
}

function refreshChatHeader(){
  if(!activeChatId) return;
  const chat = db.chats[activeChatId]; if(!chat) return;
  const isGroup = chat.type==='group';
  let name, sub, av;
  if(isGroup){
    name = chat.name||'Группа';
    const cnt = Object.keys(chat.members||{}).length;
    sub = `${cnt} ${plural(cnt,'участник','участника','участников')}`;
    av = chat.avatar;
  } else {
    const ou = Object.keys(chat.members||{}).find(m=>m!==db.currentUser.username);
    const targetUser = db.users[ou]||{};
    name = targetUser.displayName||ou||'Пользователь';
    sub = targetUser.banned ? 'Заблокирован' : (isOnline(targetUser)?'в сети':'был(а) недавно');
    av = targetUser.avatar;
  }
  const titleEl = document.getElementById('chatTitle'); if(titleEl) titleEl.textContent = name;
  const subEl = document.getElementById('chatSub'); if(subEl) subEl.textContent = sub;
}

function openChat(cid){
  if(currentChatListener && activeChatId){
    database.ref('messages/'+activeChatId).off('value', currentChatListener);
  }
  if(typingListenerRef && activeChatId){
    database.ref('typing/'+activeChatId).off('value', typingListenerRef);
    typingListenerRef = null;
  }
  activeChatId = cid;

    name = chat.name||'Группа';

    av = chat.avatar;
  } else {
    const ou = Object.keys(chat.members).find(m=>m!==db.currentUser.username);
    targetUser = db.users[ou]||{};

    sub = targetUser.banned ? 'Заблокирован' : (isOnline(targetUser)?'в сети':'был(а) недавно');

    <div class="flex items-center gap-3 min-w-0 flex-grow ${!isGroup?'cursor-pointer':''}"
         ${!isGroup && targetUser ? `onclick="openProfileModal('${Object.keys(chat.members).find(m=>m!==db.currentUser.username)}')"` : ''}>
      <button onclick="document.getElementById('chatArea').classList.add('mobile-hidden'); event.stopPropagation();" class="md:hidden text-tg-gray hover:text-white mr-1 text-lg p-1 btn-press"><i class="fas fa-arrow-left"></i></button>
      <div class="flex items-center gap-3 min-w-0 flex-grow py-1.5">
        ${getAvatarHtml(av, name, 10)}
        <div class="flex flex-col min-w-0">
          <span id="chatTitle" class="text-white font-medium text-[15px] truncate">${escapeHtml(name)}</span>
          <span id="chatSub" class="text-tg-blue text-xs truncate">${escapeHtml(sub)}</span>
        </div>
      </div>
    </div>
    <div class="flex gap-4 text-tg-gray text-lg shrink-0 pl-2">
      ${!isGroup ? `<button onclick="startAudioCall()" class="hover:text-white cursor-pointer transition p-1" title="Позвонить"><i class="fas fa-phone"></i></button>` : ''}
      <button onclick="openSearchInChat()" class="hover:text-white cursor-pointer transition p-1" title="Поиск"><i class="fas fa-search"></i></button>
      <button onclick="openChatMenu()" class="hover:text-white cursor-pointer transition p-1" title="Ещё"><i class="fas fa-ellipsis-v"></i></button>
    </div>
  </div>

  <div id="pinnedBarWrap"></div>
  <div id="msgContainer" class="flex-grow overflow-y-auto px-3 py-4 flex flex-col"></div>
  <div id="replyBarWrap"></div>

  <div class="bg-tg-sidebar px-3 py-2.5 shrink-0 flex items-end gap-1.5 z-10 border-t border-black/30 relative">
    <div id="emojiPanel" class="hidden absolute bottom-full left-3 mb-2 bg-[#17212b] border border-black/40 rounded-2xl p-3 shadow-2xl grid grid-cols-8 gap-1 w-[340px] max-w-[92vw] pop-in">
      ${['😀','😂','🥰','😎','🤔','😭','😡','👍','👎','🔥','❤️','💔','🎉','🎁','⭐','🌟','🙏','🤝','💪','✨','🥳','😴','🤯','🙄','👀','🤗','😅','🤣','😍','😘','🤔','🤫'].map(e=>`<button onclick="insertEmoji('${e}')" class="emoji-btn text-xl rounded-lg p-1.5 transition">${e}</button>`).join('')}
    </div>
    <button id="emojiBtn" onclick="toggleEmoji()" class="text-tg-gray hover:text-[#3390ec] text-xl p-2 shrink-0 transition" title="Эмодзи"><i class="far fa-smile"></i></button>
    <button id="attachBtn" onclick="document.getElementById('hiddenFileInput').click()" class="text-tg-gray hover:text-[#3390ec] text-xl p-2 shrink-0 transition" title="Прикрепить"><i class="fas fa-paperclip"></i></button>
    <textarea id="msgInput" rows="1" placeholder="Написать сообщение..."
      class="flex-grow bg-[#0e1621] text-white text-[15px] rounded-2xl px-4 py-2.5 resize-none max-h-32 border border-black/30 focus:border-[#3390ec]/60 transition leading-6"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();} if(event.key==='Escape'){cancelReplyOrEdit();}"
      oninput="autoGrow(this); onTypingLocal();"></textarea>

  updateInputUI();

    const data = snap.val()||{};
    const now = Date.now();
    const typers = Object.keys(data).filter(u=>u!==db.currentUser.username && (now - (data[u]||0)) < 5000);
    const subEl = document.getElementById('chatSub');
    if(!subEl) return;

      const unames = typers.map(u=> (db.users[u]?.displayName||u));

    mc.innerHTML = renderMessages(currentMessages, isGroup);
    if(nearBottom) mc.scrollTop = mc.scrollHeight;
    refreshEmojis(mc);
    bindMsgEvents(mc);
    applyFontScaleToBubbles();

  database.ref('messages/'+cid).on('value', currentChatListener);

function applyFontScaleToBubbles(){
  const px = (db.currentUser?.fontScale||15);
  document.querySelectorAll('#msgContainer [data-msg-text]').forEach(el=>el.style.fontSize=px+'px');
}

/* ============================================================
   RENDER MESSAGES
============================================================ */
function renderMessages(list, isGroup){
  if(!list.length) return `<div class="flex-grow flex flex-col items-center justify-center text-tg-gray text-sm py-12"><i class="far fa-comment-dots text-4xl mb-3 text-tg-gray/30"></i>Нет сообщений. Начните первым!</div>`;
  let html=''; let lastDay=''; let prev=null; let prevSame=false;

  for(let i=0;i<list.length;i++){
    const m = list[i];
    const day = formatDay(m.at);
    if(day!==lastDay){
      lastDay = day;
      html += `<div class="flex justify-center my-3"><span class="bg-black/40 backdrop-blur text-white/80 text-[11px] px-3 py-1 rounded-full shadow">${day}</span></div>`;
      prevSame = false;
    }
    const mine = m.from===db.currentUser.username;
    const sameSender = prev && prev.from===m.from && (m.at-prev.at)<5*60000 && day===lastDay;

    let content='';
    if(m.deleted && m.deletedForAll && !mine){
      content = `<div class="italic opacity-60 text-[14px]"><i class="fas fa-ban mr-1"></i>Сообщение удалено</div>`;
    } else {
      if(m.replyTo){
        const rq = list.find(x=>x._id===m.replyTo);
        const rqName = rq ? (rq.from===db.currentUser.username?'Вы':(db.users[rq.from]?.displayName||rq.from)) : 'Сообщение';
        const rqTxt = rq ? (rq.text||(rq.fileType?.startsWith('audio/')?'🎤 Голосовое':(rq.fileType?'📎 Вложение':''))) : 'недоступно';
        content += `<div class="reply-quote" onclick="scrollToMsg('${m.replyTo}')">
          <div class="rq-from">${escapeHtml(rqName)}</div>
          <div class="rq-text">${escapeHtml(rqTxt)}</div>
        </div>`;
      }
      if(m.forwardedFrom){
        content += `<div class="text-[12px] opacity-70 italic mb-1"><i class="fas fa-share mr-1"></i>Переслано от ${escapeHtml(m.forwardedFrom)}</div>`;
      }
      if(m.fileType?.startsWith('image/')){
        content += `<img src="${m.fileData}" onclick="openImage(this.src)" class="rounded-xl mb-1 cursor-pointer max-w-[280px] max-h-[320px] object-cover">`;
      } else if(m.fileType?.startsWith('audio/')){
        const dur = m.duration||0;
        const bars = Array.from({length:24},()=>2+Math.floor(Math.random()*10));
        content += `<div class="voice-bubble">
          <audio id="aud_${m._id}" src="${m.fileData}" preload="metadata" ontimeupdate="voiceTime(this)"></audio>
          <div class="voice-play" onclick="toggleAudio('${m._id}')"><i class="fas fa-play" id="vp_${m._id}"></i></div>
          <div class="voice-wave">${bars.map(h=>`<i style="height:${h}px"></i>`).join('')}</div>
          <div class="voice-time" id="vt_${m._id}">${fmtDuration(dur)}</div>
        </div>`;
      } else if(m.fileType){
        content += `<a href="${m.fileData}" download="${escapeHtml(m.fileName||'file')}" class="flex items-center gap-3 bg-black/25 hover:bg-black/35 p-2.5 rounded-xl text-white transition">
          <div class="w-10 h-10 bg-[#3390ec] rounded-full flex items-center justify-center shrink-0"><i class="fas fa-arrow-down"></i></div>
          <div class="truncate max-w-[180px] text-sm font-medium">${escapeHtml(m.fileName||'файл')}</div>
        </a>`;
      }
      if(m.text){
        content += `<div data-msg-text class="text-white whitespace-pre-wrap break-words leading-[1.35] ${m.fileType?'mt-1':''}" style="font-size:${db.currentUser?.fontScale||15}px">${escapeHtml(m.text)}${m.edited?' <span class="text-[10px] opacity-60 italic">(изм.)</span>':''}</div>`;
      }
    }

    let reactHtml = '';
    if(m.reactions && Object.keys(m.reactions).length){
      const pills = Object.keys(m.reactions).map(emo=>{
        const users = m.reactions[emo];
        const cnt = Object.keys(users).length;
        const mineR = !!users[db.currentUser.username];
        return `<div class="reaction-pill ${mineR?'mine':''}" onclick="toggleReaction('${m._id}','${emo}')"><span class="rc">${emo}</span><span>${cnt}</span></div>`;
      }).join('');
      reactHtml = `<div class="reactions-row">${pills}</div>`;
    }

    const reportBtn = !mine ? `<button onclick="event.stopPropagation();reportMsg('${m._id}')" class="report-btn absolute -left-8 top-1/2 -translate-y-1/2 text-tg-gray hover:text-red-400 p-1 transition" title="Жалоба"><i class="fas fa-exclamation-triangle text-xs"></i></button>` : '';
    const tailClass = sameSender?'':'with-tail';

    html += `<div class="flex ${mine?'justify-end':'justify-start'} msg-row ${prevSame?'mt-0.5':'mt-2'}" data-mid="${m._id}" data-mine="${mine?1:0}">
      <div class="relative msg-bubble ${mine?'msg-out':'msg-in'} ${tailClass}">
        ${!mine && isGroup && !sameSender ? `<div class="text-[#5eb5f7] font-semibold text-[13px] mb-0.5">${escapeHtml(db.users[m.from]?.displayName||m.from)}</div>` : ''}
        ${reportBtn}
        ${content}
        ${reactHtml}
        <div class="text-[11px] ${mine?'text-blue-200/80':'text-tg-gray/90'} float-right ml-2 mt-1 select-none flex items-center gap-1 leading-none">
          ${m.pinned?'<i class="fas fa-thumbtack text-[9px]"></i>':''}
          ${timeFormat(m.at)}
          ${mine?'<i class="fas fa-check-double text-[10px]"></i>':''}
        </div>
        <div class="clear-both"></div>
      </div>
    </div>`;
    prev = m; prevSame = sameSender;
  }
  return html;
}

/* ============================================================
   MSG EVENTS (LONG-PRESS / CONTEXT MENU)
============================================================ */
function bindMsgEvents(container){
  container.querySelectorAll('.msg-row').forEach(el=>{
    let pressTimer=null, moved=false, startX=0, startY=0;

    const start = (e)=>{
      const pt = e.touches?e.touches[0]:e;
      startX = pt.clientX; startY = pt.clientY; moved=false;
      pressTimer = setTimeout(()=>{ if(!moved) showMsgContextMenu(el.dataset.mid, el.dataset.mine==='1', startX, startY); }, 450);
    };
    const move = (e)=>{
      const pt = e.touches?e.touches[0]:e;
      if(Math.abs(pt.clientX-startX)>8 || Math.abs(pt.clientY-startY)>8) moved=true;
      if(moved) clearTimeout(pressTimer);
    };
    const end = ()=>{ clearTimeout(pressTimer); };

    el.addEventListener('touchstart', start, {passive:true});
    el.addEventListener('touchmove', move, {passive:true});
    el.addEventListener('touchend', end);
    el.addEventListener('touchcancel', end);
    el.addEventListener('mousedown', start);
    el.addEventListener('mousemove', move);
    el.addEventListener('mouseup', end);
    el.addEventListener('mouseleave', end);

    el.addEventListener('contextmenu', e=>{ e.preventDefault(); showMsgContextMenu(el.dataset.mid, el.dataset.mine==='1', e.clientX, e.clientY); });
    el.addEventListener('dblclick', e=>{ e.preventDefault(); if(!el.dataset.mine || el.dataset.mine==='0') replyToMsg(el.dataset.mid); });
  });
}

function scrollToMsg(mid){
  closeAllOverlays();
  const el = document.querySelector(`[data-mid="${mid}"]`);
  if(el){ el.scrollIntoView({behavior:'smooth', block:'center'}); el.classList.add('msg-selected'); setTimeout(()=>el.classList.remove('msg-selected'),1500); }
}
function closeAllOverlays(){
  document.querySelectorAll('.ctx-menu, .reaction-picker').forEach(el=>el.remove());
}
document.addEventListener('click', e=>{
  if(!e.target.closest('.ctx-menu') && !e.target.closest('.reaction-picker') && !e.target.closest('.msg-row')) closeAllOverlays();
});

async function showMsgContextMenu(mid, isMine, x, y){
  closeAllOverlays();
  const msg = currentMessages.find(m=>m._id===mid); if(!msg) return;
  selectedMsgId = mid;

  const picker = document.createElement('div');
  picker.className = 'reaction-picker pop-in fixed';
  picker.style.left = Math.max(8, Math.min(window.innerWidth-300, x-130)) + 'px';
  picker.style.top = Math.max(8, y-58) + 'px';
  picker.innerHTML = QUICK_REACTIONS.map(e=>`<button data-emoji="${e}">${e}</button>`).join('') + `<button data-more="1" style="font-size:14px;opacity:.7">＋</button>`;
  document.body.appendChild(picker);

  picker.addEventListener('click', e=>{
    const btn = e.target.closest('button'); if(!btn) return;
    if(btn.dataset.emoji){ toggleReaction(mid, btn.dataset.emoji); }
    else if(btn.dataset.more){ closeAllOverlays(); openFullReactionPicker(mid); }
    picker.remove();
    document.getElementById('ctxMenuX')?.remove();
  });

  const items = [];
  items.push({icon:'fa-reply', label:'Ответить', fn:()=>replyToMsg(mid)});
  if(msg.text) items.push({icon:'fa-copy', label:'Копировать', fn:()=>{ navigator.clipboard.writeText(msg.text||''); toast('Скопировано'); }});
  items.push({icon:'fa-share', label:'Переслать', fn:()=>openForwardModal(mid)});
  items.push({icon:'fa-thumbtack', label: msg.pinned?'Открепить':'Закрепить', fn:()=>togglePin(mid)});
  if(isMine){
    if(msg.text && !msg.fileType) items.push({icon:'fa-pen', label:'Изменить', fn:()=>startEdit(mid)});
    items.push({icon:'fa-trash', label:'Удалить', danger:true, fn:()=>deleteMsg(mid)});
  } else {
    items.push({icon:'fa-trash', label:'Удалить у себя', danger:true, fn:()=>deleteMsg(mid, false)});
  }

  const menu = document.createElement('div');
  menu.className = 'ctx-menu pop-in fixed';
  menu.id = 'ctxMenuX';
  menu.style.left = Math.max(8, Math.min(window.innerWidth-230, x)) + 'px';
  menu.style.top = Math.max(8, Math.min(window.innerHeight-260, y+8)) + 'px';
  menu.innerHTML = items.map((it,i)=>`<div class="ctx-item ${it.danger?'danger':''}" data-idx="${i}"><i class="fas ${it.icon}"></i><span>${it.label}</span></div>`).join('');
  document.body.appendChild(menu);

  menu.addEventListener('click', e=>{
    const it = e.target.closest('.ctx-item'); if(!it) return;
    const idx = parseInt(it.dataset.idx);
    items[idx].fn();
    closeAllOverlays();
  });
}
function openFullReactionPicker(mid){
  const all = ['👍','❤️','🔥','😂','😮','😢','👏','🎉','🥰','😍','🤔','😴','🤯','😡','👀','🙏','💪','✨','⭐','🌟','🤝','🙌','💯','🫡','🗿','🍾','🎯','⚡','🎁','💎','👑','🐱','🐶','🦊','🦄','🐻','🍕','🍔','🍟','⚽','🎮','🚀','✈️','🏆','🚨','💀','🎵','☕','🍀','🌈'];
  const picker = document.createElement('div');
  picker.className = 'reaction-picker pop-in fixed';
  picker.style.left = '50%'; picker.style.top = '50%';
  picker.style.transform = 'translate(-50%,-50%)';
  picker.style.flexWrap = 'wrap';
  picker.style.maxWidth = '92vw';
  picker.style.width = '440px';
  picker.innerHTML = all.map(e=>`<button data-emoji="${e}">${e}</button>`).join('');
  document.body.appendChild(picker);
  picker.addEventListener('click', e=>{
    const btn = e.target.closest('button'); if(!btn) return;
    toggleReaction(mid, btn.dataset.emoji);
    picker.remove();
  });
  setTimeout(()=>{
    document.addEventListener('click', function h(ev){
      if(!picker.contains(ev.target)){ picker.remove(); document.removeEventListener('click', h); }
    });
  }, 50);
}

/* ============================================================
   REACTIONS
============================================================ */
async function toggleReaction(mid, emoji){
  if(!activeChatId) return;
  const ref = database.ref(`messages/${activeChatId}/${mid}/reactions/${emoji}/${db.currentUser.username}`);
  const cur = await ref.once('value');
  if(cur.exists()) await ref.remove();
  else await ref.set(true);
}

/* ============================================================
   REPLY / EDIT / DELETE / FORWARD
============================================================ */
function replyToMsg(mid){
  const m = currentMessages.find(x=>x._id===mid); if(!m) return;
  replyTo = { _id: mid, from: m.from, text: m.text||(m.fileType?.startsWith('audio/')?'🎤 Голосовое':(m.fileType?'📎 Вложение':'')) };
  editingId = null;
  updateInputUI();
  document.getElementById('msgInput')?.focus();
}
function startEdit(mid){
  const m = currentMessages.find(x=>x._id===mid); if(!m || m.from!==db.currentUser.username) return;
  editingId = mid;
  replyTo = null;
  const inp = document.getElementById('msgInput');
  if(inp){ inp.value = m.text||''; autoGrow(inp); inp.focus(); }
  updateInputUI();
}
function cancelReplyOrEdit(){
  replyTo = null; editingId = null;
  const inp = document.getElementById('msgInput');
  if(inp){ inp.value=''; autoGrow(inp); }
  updateInputUI();
}
function updateInputUI(){
  const wrap = document.getElementById('replyBarWrap'); if(!wrap) return;
  if(!replyTo && !editingId){ wrap.innerHTML=''; }
  else if(editingId){
    const m = currentMessages.find(x=>x._id===editingId);
    wrap.innerHTML = `<div class="bg-tg-sidebar border-t border-black/20 px-3 py-2 flex items-center gap-3">
      <i class="fas fa-pen text-[#3390ec]"></i>
      <div class="flex-grow min-w-0"><div class="text-[#3390ec] text-xs font-medium">Редактирование</div><div class="truncate text-sm">${escapeHtml(m?.text||'')}</div></div>
      <button onclick="cancelReplyOrEdit()" class="text-tg-gray hover:text-white p-1"><i class="fas fa-times"></i></button>
    </div>`;
  } else {
    const fromName = replyTo.from===db.currentUser.username?'Вы':(db.users[replyTo.from]?.displayName||replyTo.from);
    wrap.innerHTML = `<div class="bg-tg-sidebar border-t border-black/20 px-3 py-2 flex items-center gap-3">
      <i class="fas fa-reply text-[#3390ec]"></i>
      <div class="flex-grow min-w-0"><div class="text-[#3390ec] text-xs font-medium">${escapeHtml(fromName)}</div><div class="truncate text-sm">${escapeHtml(replyTo.text)}</div></div>
      <button onclick="cancelReplyOrEdit()" class="text-tg-gray hover:text-white p-1"><i class="fas fa-times"></i></button>
    </div>`;
  }
  updateMicSendButtons();
}
function updateMicSendButtons(){
  const inp = document.getElementById('msgInput');
  const mic = document.getElementById('micBtn');
  const send = document.getElementById('sendBtn');
  if(!inp||!mic||!send) return;
  const empty = !inp.value.trim() && !editingId;
  if(empty && !recording()){ mic.classList.remove('hidden'); send.classList.add('hidden'); }
  else { mic.classList.add('hidden'); send.classList.remove('hidden'); }
}
function updateMicSendButtonsForce(){
  const inp = document.getElementById('msgInput');
  const mic = document.getElementById('micBtn');
  const send = document.getElementById('sendBtn');
  if(!inp||!mic||!send) return;
  if(recording()){ mic.classList.remove('hidden'); send.classList.add('hidden'); return; }
  const empty = !inp.value.trim() && !editingId;
  if(empty){ mic.classList.remove('hidden'); send.classList.add('hidden'); }
  else { mic.classList.add('hidden'); send.classList.remove('hidden'); }
}
function recording(){ return !!mediaRecorder && mediaRecorder.state==='recording'; }

async function deleteMsg(mid, forAll=true){
  if(!activeChatId) return;
  const m = currentMessages.find(x=>x._id===mid); if(!m) return;
  if(m.from === db.currentUser.username){
    const choice = confirm('Удалить сообщение у всех? OK = у всех, Отмена = только у себя');
    if(choice) await database.ref(`messages/${activeChatId}/${mid}`).remove();
    else await database.ref(`messages/${activeChatId}/${mid}/deletedFor/${db.currentUser.username}`).set(true);
  } else {
    await database.ref(`messages/${activeChatId}/${mid}/deletedFor/${db.currentUser.username}`).set(true);
  }
  toast('Удалено');
}

function openForwardModal(mid){
  const m = currentMessages.find(x=>x._id===mid); if(!m) return;
  const chatIds = Object.keys(db.chats);
  if(!chatIds.length){ toast('Нет чатов для пересылки'); return; }
  const html = chatIds.map(cid=>{
    const c = db.chats[cid];
    let name = 'Чат', av='';
    if(c.type==='group'){ name=c.name; av=c.avatar; }
    else { const ou=Object.keys(c.members||{}).find(x=>x!==db.currentUser.username); const u=db.users[ou]||{}; name=u.displayName||ou; av=u.avatar; }
    return `<div onclick="doForward('${mid}','${cid}')" class="flex items-center gap-3 p-2.5 hover:bg-[#202b36] rounded-xl cursor-pointer transition">

async function toggleRecording(){
  if(recording()){
    mediaRecorder.stop();
    return;
  }
  if(!navigator.mediaDevices || !window.MediaRecorder){ toast('Запись не поддерживается'); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder = new MediaRecorder(stream);
    recordedChunks = [];
    mediaRecorder.ondataavailable = e => { if(e.data.size) recordedChunks.push(e.data); };
    mediaRecorder.onstop = async ()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob = new Blob(recordedChunks, {type:'audio/webm'});
      const duration = Math.floor((Date.now()-recStartAt)/1000);
      const b64 = await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob);});
      const mid = uid(); const now = Date.now();
      const payload = { from: db.currentUser.username, fileData: b64, fileType:'audio/webm', fileName:'voice.webm', duration, at: now };
      if(replyTo) payload.replyTo = replyTo._id;
      await database.ref(`messages/${activeChatId}/${mid}`).set(payload);
      await database.ref(`chats/${activeChatId}/lastMessage`).set({ text:'🎤 Голосовое', from: db.currentUser.username, fileType:'audio/webm', at: now });
      replyTo = null; updateInputUI();
      micBtnReset();
    };
    mediaRecorder.start();
    recStartAt = Date.now();
    startRecUI();
  } catch(err){ console.error(err); toast('Нет доступа к микрофону'); }
}
function startRecUI(){
  const mic = document.getElementById('micBtn'); if(!mic) return;
  mic.classList.remove('hidden');
  mic.innerHTML = '<i class="fas fa-stop text-red-500"></i>';
  const send = document.getElementById('sendBtn'); if(send) send.classList.add('hidden');
  const inp = document.getElementById('msgInput'); if(inp){ inp.disabled = true; inp.placeholder='Идёт запись...'; }
  const parent = mic.parentElement;
  let counter = document.createElement('div');
  counter.id='recTimer'; counter.className='text-red-400 text-sm font-mono flex items-center gap-2';
  counter.innerHTML = '<span class="rec-dot"></span><span id="recSecs">0:00</span>';
  parent.insertBefore(counter, mic);
  recTimerInt = setInterval(()=>{
    const s = Math.floor((Date.now()-recStartAt)/1000);
    const el = document.getElementById('recSecs'); if(el) el.textContent = fmtDuration(s);
    if(s>=60){ mediaRecorder.stop(); }
  }, 250);
}
function micBtnReset(){
  clearInterval(recTimerInt); recTimerInt=null;
  document.getElementById('recTimer')?.remove();
  const mic = document.getElementById('micBtn'); if(mic){ mic.innerHTML = '<i class="fas fa-microphone"></i>'; }
  const inp = document.getElementById('msgInput'); if(inp){ inp.disabled = false; inp.placeholder='Написать сообщение...'; }
  updateMicSendButtonsForce();
}

function toggleAudio(id){
  const aud = document.getElementById('aud_'+id); if(!aud) return;

  if(aud.paused){
    aud.play();
    if(icon){ icon.classList.remove('fa-play'); icon.classList.add('fa-pause'); }
    aud.onended = ()=>{ if(icon){ icon.classList.remove('fa-pause'); icon.classList.add('fa-play'); } };
  } else {
    aud.pause();
    if(icon){ icon.classList.remove('fa-pause'); icon.classList.add('fa-play'); }
  }
}

async function savePrivacyData(){
  const ph = document.getElementById('spr').value.trim();

  if(o && n){

    const h = await hashPass(o);
    if(h!==db.currentUser.passHash && o!==db.currentUser.passPlain){ toast('Неверный старый пароль'); return; }
    const nh = await hashPass(n);
    await database.ref('users/'+db.currentUser.username+'/passHash').set(nh);

  if(!inp||!pv) return;
  const v = inp.value.trim();
  if(/^(https?:\/\/|data:image\/)/i.test(v)) pv.innerHTML = `<img src="${escapeHtml(v)}" class="w-full h-full object-contain rounded-xl" onerror="this.parentNode.innerHTML='<span class=\\'text-2xl\\'>⚠️</span>'">`;
  else pv.innerHTML = `<span class="text-2xl">${v||'🎁'}</span>`;
}
async function adminCreateNftGift(){
  const name = document.getElementById('admGiftName').value.trim();
  const icon = document.getElementById('admGiftIcon').value.trim()||'🎁';
  const price = parseInt(document.getElementById('admGiftPrice').value)||10;
  const edition = document.getElementById('admGiftEdition').value.trim()||'1 из 10.0K';
  if(!name){ toast('Введите название'); return; }
  const gid = 'nft_'+Date.now();
  await database.ref('giftsMarket/'+gid).set({ name, icon, price, edition, bg:'from-purple-900 to-indigo-900' });
  toast('NFT создан'); openAdminModal();
}
async function adminDeleteGift(gid){ if(!confirm('Удалить?'))return; await database.ref('giftsMarket/'+gid).remove(); toast('Удалено'); openAdminModal(); }
async function adminToggleBan(un, ban){ await database.ref('users/'+un+'/banned').set(ban); toast(ban?'Забанен':'Разбанен'); openAdminModal(); }
async function adminBanUser(un){ await database.ref('users/'+un+'/banned').set(true); toast('Забанен'); openAdminModal(); }
async function adminDismissReport(rid){ await database.ref('reports/'+rid).remove(); toast('Скрыто'); openAdminModal(); }
async function adminReadUserChats(targetUser){
  const snap = await database.ref('userChats/'+targetUser).once('value');
  const cids = Object.keys(snap.val()||{});
  if(!cids.length){ toast('Нет чатов'); return; }
  let html = '';
  for(const cid of cids){
    const cs = await database.ref('chats/'+cid).once('value');
    const chat = cs.val(); if(!chat) continue;
    const cName = chat.type==='group'?chat.name:(Object.keys(chat.members||{}).find(m=>m!==targetUser)||cid);
    const msgsSnap = await database.ref('messages/'+cid).once('value');
    const msgs = msgsSnap.val()||{};
    const mList = Object.values(msgs).sort((a,b)=>a.at-b.at).map(m=>`<div class="mb-1 bg-[#17212b] p-2 rounded text-xs"><b class="text-[#3390ec]">${escapeHtml(m.from)}:</b> <span class="text-white">${escapeHtml(m.text||'[Файл]')}</span></div>`).join('');
    html += `<div class="bg-[#0e1621] p-3 rounded-xl mb-3 border border-black/30"><div class="font-bold text-amber-400 mb-2 text-xs">Чат: ${escapeHtml(cName)}</div><div class="max-h-40 overflow-y-auto">${mList||'Пусто'}</div></div>`;
  }
  openModal(`Чаты @${escapeHtml(targetUser)}`, html);
}
function adminOpenGiftModal(targetUser){
  const market = db.market||{};
  const mHtml = Object.keys(market).map(gid=>{
    const g = market[gid];
    return `<div class="bg-[#0e1621] p-3 rounded-xl flex items-center justify-between text-xs border border-black/30 mb-2">
      <div class="flex items-center gap-2 min-w-0"><div class="w-9 h-9 flex items-center justify-center shrink-0">${renderGiftIcon(g.icon,'text-2xl')}</div>
      <div class="min-w-0"><div class="text-white font-bold truncate">${escapeHtml(g.name)}</div><div class="text-tg-gray">${escapeHtml(g.edition)}</div></div></div>
      <button onclick="adminGiveGiftToUser('${targetUser}','${gid}')" class="bg-purple-600 hover:bg-purple-500 text-white px-3 py-1.5 rounded-lg btn-press shrink-0 transition">Выдать</button>
    </div>`;
  }).join('');
  openModal(`Выдать @${escapeHtml(targetUser)}`, `<div class="space-y-2">${mHtml||'Магазин пуст'}</div>`);
}
async function adminGiveGiftToUser(targetUser, gid){
  const g = db.market[gid]; if(!g) return;
  await database.ref('users/'+targetUser+'/gifts/gift_'+Date.now()).set(g);
  toast(`Подарок выдан @${targetUser}`); openAdminModal();
}
</script>
