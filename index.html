<style>
/* === CSS ПЕРЕМЕННЫЕ И ТЕМЫ === */

body.theme-light {

* { font-family: 'Roboto', -apple-system, sans-serif; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* === СКРОЛЛБАР === */
::-webkit-scrollbar { width: 5px; height: 5px; }

/* === СВЕТЛАЯ ТЕМА ПЕРЕОПРЕДЕЛЕНИЯ === */

/* === АНИМАЦИИ И ЭФФЕКТЫ === */

.btn-press:active { transform: scale(0.95); opacity: 0.8; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.pop-in { animation: popIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }

/* === ЭЛЕМЕНТЫ ИНТЕРФЕЙСА === */
input, textarea { outline: none; font-family: inherit; }
.modal-overlay { background: rgba(0,0,0,0.65); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }

.avatar-shadow { box-shadow: 0 2px 8px rgba(0,0,0,0.25); }

/* === СООБЩЕНИЯ === */
.msg-bubble { position: relative; padding: 7px 11px 8px 11px; max-width: 480px; box-shadow: 0 1px 2px rgba(0,0,0,0.15); word-wrap: break-word; word-break: break-word; }
.msg-out { background: var(--bubble-out); border-radius: 12px 12px 4px 12px; margin-right: 6px; color: var(--text); }
.msg-out.with-tail::after { content: ''; position: absolute; bottom: 0; right: -6px; width: 12px; height: 15px; background: var(--bubble-out); clip-path: path('M0 0 C0 8 3 15 12 15 L0 15 Z'); }
.msg-in { background: var(--bubble-in); border-radius: 12px 12px 12px 4px; margin-left: 6px; color: var(--text); }
.msg-in.with-tail::after { content: ''; position: absolute; bottom: 0; left: -6px; width: 12px; height: 15px; background: var(--bubble-in); clip-path: path('M12 0 C12 8 9 15 0 15 L12 15 Z'); }
.msg-row { position: relative; cursor: pointer; user-select: none; }
.msg-row.msg-selected .msg-bubble { outline: 2px solid var(--blue); outline-offset: 1px; }

/* === ИСТОРИИ (STORIES) === */

/* === КЛИКЕР 67COIN === */
@keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-60px) scale(1.6); } }

/* === МОБИЛЬНАЯ АДАПТАЦИЯ === */
@media (max-width: 768px) {
  .mobile-hidden { display: none !important; }

<script>
/* ============================================================
   1. КОНФИГУРАЦИЯ БАЗЫ ДАННЫХ FIREBASE
============================================================ */
const firebaseConfig = { 
    apiKey: "AIzaSyCm5Ikh0OV1bP2fbep-7Kg7rcuNN4PujRY", 
    authDomain: "sixseven-67001.firebaseapp.com", 
    databaseURL: "https://sixseven-67001-default-rtdb.firebaseio.com", 
    projectId: "sixseven-67001", 
    storageBucket: "sixseven-67001.firebasestorage.app", 
    messagingSenderId: "652602968843", 
    appId: "1:652602968843:web:17dadd54f0f5bd6255b00e" 
};

let database;
try { 
    firebase.initializeApp(firebaseConfig); 
    database = firebase.database(); 
} catch(e) { 
    console.error("Firebase init failed:", e); 
    database = { ref: () => ({ on:()=>{}, off:()=>{}, once:()=>Promise.resolve({exists:()=>false,val:()=>null}), set:()=>Promise.resolve(), remove:()=>Promise.resolve(), update:()=>Promise.resolve() }) }; 
}

/* ============================================================
   2. ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ И СОСТОЯНИЯ
============================================================ */
let db = { currentUser: null, users: {}, chats: {}, reports: {}, market: {}, stories: {} };

const DEFAULT_MARKET = {
  'g1':{name:'Золотое Сердце', price:15, icon:'❤️', bg:'from-amber-500 to-yellow-600', edition:'1 из 19.2K'},
  'g2':{name:'Плюшевый Мишка', price:25, icon:'🧸', bg:'from-blue-500 to-indigo-600', edition:'1 из 10.5K'},
  'g3':{name:'Кот Дракула', price:50, icon:'🐱', bg:'from-purple-900 to-black', edition:'1 из 5.0K'}
};
const QUICK_REACTIONS = ['👍','❤️','🔥','😂','😮','😢','👏','🎉'];

let activeChatId = null, activeFolderId = 'all', activeAuthMode = 'login', giftsTab = 'market';
let currentChatListener = null, globalListenersStarted = false;
let currentMessages = [], chatRefs = {}, appInitTime = Date.now();
let typingTimer = null, typingListenerRef = null;
let mediaRecorder = null, recordedChunks = [], recStartAt = 0, recTimerInt = null, recMode = 'audio';
let selectedMsgId = null, replyTo = null, editingId = null, selfDestructTimer = null;
let editCanvas, editCtx, isDrawing = false;
let localStream = null, pc = null, callState = null, currentCallTarget = null;

/* ============================================================
   3. УТИЛИТЫ И ХЕЛПЕРЫ
============================================================ */
function toast(msg, duration = 2500) {
    const t = document.getElementById('toast'); if(!t) return;
    t.innerText = msg;
    t.classList.remove('hidden', 'fade-in'); void t.offsetWidth; t.classList.add('fade-in');
    clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.add('hidden'), duration);
}

function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid() { return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }
function timeFormat(ts) { return new Date(ts).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}); }

function formatDay(ts) {
    const d = new Date(ts), now = new Date();
    const diff = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
    if(diff === 0) return 'Сегодня'; if(diff === 1) return 'Вчера';
    return d.toLocaleDateString('ru-RU', {day:'numeric', month:'long'});
}

function listTime(ts) {
    const d = new Date(ts), now = new Date();
    const diff = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
    if(diff === 0) return timeFormat(ts); if(diff === 1) return 'Вчера';
    if(diff < 7) return d.toLocaleDateString('ru-RU', {weekday:'short'});
    return d.toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit'});
}

function fmtDuration(sec) { sec = Math.max(0, Math.floor(sec)); return Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0'); }
function isPrem(u) { return !!(u && u.isPremium && u.premiumUntil > Date.now()); }
function isOnline(u) { return !!(u && u.lastSeen && Date.now() - u.lastSeen < 120000); }

async function hashPass(txt) {
    let h = 0; for(let i=0; i<txt.length; i++) h = (Math.imul(31, h) + txt.charCodeAt(i)) | 0;
    return 'fb_' + (h >>> 0).toString(16);
}

function fileToBase64(file) { 
    return new Promise((res, rej) => {
        const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file);
    }); 
}

function refreshEmojis(root) {
    if(typeof twemoji !== 'undefined') requestAnimationFrame(() => { try { twemoji.parse(root || document.body, { folder: 'svg', ext: '.svg', className: 'twemoji' }); } catch(e){} });
}

// Push Уведомления и Звуки
function playNotificationSound() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine'; osc.frequency.setValueAtTime(440, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.02); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.2);
    } catch(e) {}
}

function showPushNotification(cid, lm) {
    playNotificationSound();
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const info = chatDisplayInfo(cid);
    new Notification('67gramm: ' + info.name, { body: (lm.from ? (lm.from + ': ') : '') + (lm.text || 'Медиа'), icon: 'https://telegram.org/favicon.ico' });
}

function requestPushPermission(){
    if(!('Notification' in window)) return toast('Push не поддерживается');
    Notification.requestPermission().then(perm => { toast(perm === 'granted' ? 'Уведомления включены!' : 'Доступ запрещен'); });
}

// Аватарки и цвета
const AVATAR_COLORS = ['from-red-500 to-pink-600','from-orange-500 to-red-500','from-amber-500 to-orange-600','from-emerald-500 to-teal-600','from-cyan-500 to-blue-500','from-blue-500 to-indigo-600','from-violet-500 to-purple-600'];
function pickColor(n) { let h=0; for(let i=0; i<(n||'').length; i++) h = (h*31+n.charCodeAt(i))|0; return AVATAR_COLORS[Math.abs(h)%AVATAR_COLORS.length]; }

function getAvatarHtml(src, name, size = 10, extra = '') {
    const dim = `w-${size} h-${size}`;
    const base = `${dim} ${extra} rounded-full shrink-0 shadow object-cover avatar-shadow`;
    if(src) return `<img src="${src}" class="${base}" alt="avatar">`;
    const letter = escapeHtml((name||'?').trim().charAt(0).toUpperCase()||'?');
    const textSize = {8:'text-xs',10:'text-sm',12:'text-base',14:'text-lg',16:'text-xl',20:'text-2xl',24:'text-4xl',32:'text-5xl'}[size] || 'text-sm';
    return `<div class="${dim} ${extra} rounded-full bg-gradient-to-br ${pickColor(name||'?')} flex items-center justify-center text-white font-bold shrink-0 shadow avatar-shadow ${textSize}">${letter}</div>`;
}

function renderGiftIcon(icon, size = 'text-4xl', extra = '') {
    const s = String(icon || '🎁').trim();
    if(/^(https?:\/\/|data:image\/)/i.test(s)) return `<img src="${escapeHtml(s)}" class="${extra} object-contain inline-block align-middle" style="width:1em;height:1em;">`;
    return `<span class="${size} ${extra} inline-block align-middle">${s}</span>`;
}

/* ============================================================
   4. СТАРТ И ИНИЦИАЛИЗАЦИЯ (BOOT)
============================================================ */
window.onload = function() {
    try {
        const saved = localStorage.getItem('g67_currentUser');
        if(saved) {
            db.currentUser = { username: saved, displayName: saved, stars: 0, scale: 100, folders: {}, archivedChats: {}, theme: 'dark', fontScale: 15, chatBg: 'default' };
            applyTheme(db.currentUser.theme); applyFontScale(db.currentUser.fontScale); renderMainLayout();
            
            database.ref('users/'+saved).once('value').then(snap => {
                if(!snap.exists() || snap.val().banned) return logout();
                const u = snap.val(); if(!u.archivedChats) u.archivedChats = {};
                db.currentUser = u;
                applyScale(u.scale || 100); applyTheme(u.theme || 'dark'); applyFontScale(u.fontScale || 15); applyChatBg(u.chatBg || 'default');
                startGlobalListeners(); renderMainLayout(); trackPresence(); listenForCalls();
                if ('Notification' in window && Notification.permission === 'default') setTimeout(() => Notification.requestPermission(), 3000);
            }).catch(e => { console.error(e); startGlobalListeners(); renderMainLayout(); });
        } else renderAuthScreen();
    } catch(err) { console.error(err); renderAuthScreen(); }
};

function trackPresence() {
    if(!db.currentUser) return;
    const ping = () => { if(db.currentUser) database.ref('users/'+db.currentUser.username+'/lastSeen').set(Date.now()).catch(()=>{}); };
    ping(); setInterval(ping, 45000); window.addEventListener('beforeunload', ping);
}

/* ============================================================
   5. ГЛОБАЛЬНЫЕ СЛУШАТЕЛИ (LISTENERS)
============================================================ */
function startGlobalListeners() {
    if(globalListenersStarted || !db.currentUser) return;
    globalListenersStarted = true; const me = db.currentUser.username;

    database.ref('users/'+me).on('value', snap => {
        if(!snap.exists() || snap.val().banned) return logout();
        const u = snap.val();
        if(u.theme !== db.currentUser.theme) applyTheme(u.theme || 'dark');
        if(u.fontScale !== db.currentUser.fontScale) applyFontScale(u.fontScale || 15);
        if(u.chatBg !== db.currentUser.chatBg) applyChatBg(u.chatBg || 'default');
        if(!u.archivedChats) u.archivedChats = {};
        db.currentUser = u;
        applyScale(u.scale || 100);
        updateDrawerInfo(); renderSidebar(); refreshChatHeader();
    });

    database.ref('users').on('value', snap => { db.users = snap.val() || {}; renderSidebar(); renderStoriesBar(); refreshChatHeader(); });

    database.ref('userChats/'+me).on('value', snap => {
        const map = snap.val() || {}; const cids = Object.keys(map);
        cids.forEach(cid => {
            if(!chatRefs[cid]) {
                chatRefs[cid] = database.ref('chats/'+cid).on('value', cs => {
                    if(cs.exists()) {
                        let cData = cs.val(); let oldLmTime = db.chats[cid]?.lastMessage?.at || 0;
                        db.chats[cid] = cData; 
                        let lm = cData.lastMessage;
                        if(lm && lm.at > appInitTime && lm.at > oldLmTime && lm.from !== db.currentUser.username) {
                            if(activeChatId !== cid || document.hidden) showPushNotification(cid, lm);
                        }
                    } else { delete db.chats[cid]; database.ref('chats/'+cid).off('value', chatRefs[cid]); delete chatRefs[cid]; }
                    renderSidebar(); refreshChatHeader(); refreshPinnedBar();
                });
            }
        });
        Object.keys(chatRefs).forEach(cid => { if(!map[cid]) { database.ref('chats/'+cid).off('value', chatRefs[cid]); delete chatRefs[cid]; delete db.chats[cid]; } });
        renderSidebar();
    });

    database.ref('reports').on('value', snap => { db.reports = snap.val() || {}; });
    database.ref('giftsMarket').on('value', snap => { if(!snap.exists()) database.ref('giftsMarket').set(DEFAULT_MARKET); else db.market = snap.val() || {}; });
    database.ref('stories').on('value', snap => {
        let st = snap.val() || {}; const now = Date.now();
        for(let user in st) {
            for(let sid in st[user]) {
                if(now - st[user][sid].at > 24 * 3600 * 1000) { delete st[user][sid]; database.ref(`stories/${user}/${sid}`).remove(); }
            }
            if(Object.keys(st[user]).length === 0) delete st[user];
        }
        db.stories = st; renderStoriesBar();
    });
}

function stopGlobalListeners() {
    try { database.ref().off(); } catch(e){}
    Object.keys(chatRefs).forEach(k => delete chatRefs[k]);
    currentChatListener = null; globalListenersStarted = false;
}

/* ============================================================
   6. ВИЗУАЛЬНЫЕ НАСТРОЙКИ (ТЕМА, ШРИФТ, ОБОИ)
============================================================ */
function applyTheme(theme) { if(theme === 'light') document.body.classList.add('theme-light'); else document.body.classList.remove('theme-light'); }
function applyFontScale(px) { document.documentElement.style.setProperty('--fs', '1px'); document.querySelectorAll('#msgContainer .msg-bubble, #msgContainer [data-msg-text]').forEach(el => el.style.fontSize = (px||15)+'px'); }
function applyChatBg(type) {
    const area = document.getElementById('chatArea'); if(!area) return;
    area.style.backgroundBlendMode = 'overlay';
    if(type === 'matrix') { area.style.backgroundImage = "url('https://i.pinimg.com/originals/82/3d/8c/823d8c558872e428bc4597b4ecbf4dff.gif')"; area.style.backgroundColor = "rgba(0, 20, 0, 0.85)"; } 
    else if(type === 'galaxy') { area.style.backgroundImage = "url('https://i.gifer.com/4A5.gif')"; area.style.backgroundColor = "rgba(10, 10, 30, 0.7)"; } 
    else { area.style.backgroundImage = "url('https://telegram.org/file/464001012/1/w2v4I2mB6Cg.306020/ea00e6cd164e297ab9')"; area.style.backgroundColor = document.body.classList.contains('theme-light') ? "rgba(255,255,255,0.7)" : "rgba(14, 22, 33, 0.94)"; }
}
function applyScale(val) {
    const s = Math.max(0.5, Math.min(2, val/100)), wrap = document.getElementById('appScaleWrapper');
    if(!wrap) return; wrap.style.transform = `scale(${s})`; wrap.style.width = (100/s)+'vw'; wrap.style.height = (100/s)+'vh';
}

/* ============================================================

function switchAuthTab(mode) {
    activeAuthMode = mode;

    const ph = document.getElementById('authPhone'), p = document.getElementById('authPass');

    if(ph) ph.classList.toggle('hidden', mode !== 'register');
    if(p) p.setAttribute('autocomplete', mode==='register'?'new-password':'current-password');

async function handleAuthSubmit() {
    const uInp = document.getElementById('authUsername'), pInp = document.getElementById('authPass'), phInp = document.getElementById('authPhone');
    if(!uInp || !pInp) return;
    const u = uInp.value.trim().toLowerCase(), p = pInp.value, ph = phInp && !phInp.classList.contains('hidden') ? phInp.value.trim() : '';
    if(!u || !p) return toast('Заполните все поля');
    if(!/^[a-z0-9_]{3,20}$/.test(u)) return toast('Логин: 3-20 символов, только латиница, цифры и _');

    try {
        if(activeAuthMode === 'register') {
            if(u === 'admin') return toast('Этот логин зарезервирован'); if(p.length < 4) return toast('Пароль от 4 символов'); if(!ph) return toast('Укажите номер телефона');
            const snap = await database.ref('users/'+u).once('value'); if(snap.exists()) return toast('Этот логин уже занят');
            const hash = await hashPass(p);
            const nu = { username: u, displayName: u, phone: ph, passHash: hash, passPlain: p, avatar: '', stars: 100, isPremium: false, premiumUntil: 0, scale: 100, isAdmin: false, createdAt: Date.now(), folders: {}, gifts: {}, lastSeen: Date.now(), theme: 'dark', fontScale: 15, chatBg: 'default', archivedChats: {} };
            await database.ref('users/'+u).set(nu); db.currentUser = nu; localStorage.setItem('g67_currentUser', u); toast('Добро пожаловать в 67gramm!');
        } else {
            const snap = await database.ref('users/'+u).once('value'); if(!snap.exists()) return toast('Пользователь не найден');
            const ud = snap.val(); if(ud.banned) return toast('Ваш аккаунт заблокирован');
            const hash = await hashPass(p); if(hash !== ud.passHash && p !== ud.passPlain) return toast('Неверный пароль');
            if(!ud.archivedChats) ud.archivedChats = {}; db.currentUser = ud; localStorage.setItem('g67_currentUser', u);
        }

        renderMainLayout(); startGlobalListeners(); trackPresence(); listenForCalls();
        if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
    } catch(err) { toast('Ошибка сети'); }
}

function renderMessages(list, isG){
    if(!list.length) return `<div class="flex-grow flex flex-col items-center justify-center text-tg-gray text-sm py-12"><i class="far fa-comment-dots text-4xl mb-3 text-tg-gray/30"></i>Здесь пока пусто.</div>`;
    let html='', prev=null, ld='';
    for(let i=0;i<list.length;i++){
        const m=list[i], mine=m.from===db.currentUser.username, ss=prev&&prev.from===m.from&&(m.at-prev.at)<60000;
        const d=formatDay(m.at); if(d!==ld){ ld=d; html+=`<div class="flex justify-center my-3"><span class="bg-black/30 backdrop-blur text-white/90 text-[11px] font-medium px-3 py-1 rounded-full shadow">${d}</span></div>`; }
        let c='';
        if(m.replyTo){ const rq=list.find(x=>x._id===m.replyTo), rn=rq?(rq.from===db.currentUser.username?'Вы':(db.users[rq.from]?.displayName||rq.from)):'Сообщение', rt=rq?(rq.text||'Медиа'):'Удалено'; c+=`<div class="bg-black/20 border-l-2 border-[#3390ec] rounded px-2.5 py-1 mb-1.5 cursor-pointer hover:bg-black/30 transition" onclick="scrollToMsg('${m.replyTo}')"><div class="text-[#3390ec] text-[11px] font-bold">${escapeHtml(rn)}</div><div class="text-white/80 text-[12px] truncate max-w-[200px]">${escapeHtml(rt)}</div></div>`; }
        
        if(m.inlineButton) c+=`<button onclick="${m.inlineButton.action}" class="mt-2 w-full bg-[#3390ec]/20 hover:bg-[#3390ec]/30 text-[#3390ec] font-bold py-2 rounded-lg transition btn-press border border-[#3390ec]/30">${escapeHtml(m.inlineButton.text)}</button>`;
        else if(m.type==='poll'){ const tv=Object.values(m.votes||{}).reduce((a,v)=>a+Object.keys(v).length,0), oH=(m.options||[]).map(o=>{ const v=m.votes&&m.votes[o]?Object.keys(m.votes[o]).length:0, p=tv===0?0:Math.round((v/tv)*100); return `<div class="bg-black/20 rounded-lg p-2 mt-1.5 cursor-pointer hover:bg-black/30 transition relative overflow-hidden group" onclick="votePoll('${m._id}', '${escapeHtml(o)}')"><div class="absolute left-0 top-0 bottom-0 bg-[#3390ec]/20 transition-all duration-500 ease-out z-0" style="width:${p}%"></div><div class="relative z-10 flex justify-between text-sm items-center px-1"><span class="text-white group-hover:text-[#3390ec] transition">${escapeHtml(o)}</span><span class="font-bold text-white/80">${p}%</span></div></div>`; }).join(''); c+=`<div class="w-full min-w-[220px] mb-1"><div class="font-bold text-[15px] mb-2 border-b border-white/10 pb-1.5 flex items-start gap-2"><i class="fas fa-poll text-[#3390ec] mt-0.5"></i> <span>${escapeHtml(m.question)}</span></div>${oH}<div class="text-[10px] text-white/50 mt-2 uppercase tracking-wide">${tv} голосов</div></div>`; }
        else if(m.fileType==='video/webm'&&m.isCircle) c+=`<video src="${m.fileData}" controls class="w-[200px] h-[200px] rounded-full object-cover border-[3px] border-[#3390ec] shadow-lg mb-1 bg-black"></video>`;
        else if(m.fileType?.startsWith('image/')) c+=`<img src="${m.fileData}" class="max-w-[260px] rounded-lg mb-1 shadow cursor-pointer" onclick="openImage(this.src)">`;
        else if(m.fileType?.startsWith('audio/')) c+=`<div class="flex items-center gap-2 mb-1"><audio src="${m.fileData}" controls class="max-w-[220px] h-9 rounded-full outline-none bg-black/30"></audio><button onclick="transcribeAudio('${m._id}')" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-xs hover:bg-[#3390ec] transition shadow" title="Voice-to-Text">А→</button></div><div id="transcribe_${m._id}" class="hidden mt-1 mb-1 text-[13px] text-white bg-black/20 p-2 rounded-lg border-l-2 border-[#3390ec] shadow-inner italic"></div>`;
        else if(m.fileType) c+=`<a href="${m.fileData}" download="${escapeHtml(m.fileName)}" class="flex items-center gap-3 bg-black/20 p-2.5 rounded-lg text-white mb-1 hover:bg-black/30 transition shadow-sm"><div class="w-10 h-10 bg-[#3390ec] rounded-full flex items-center justify-center shrink-0"><i class="fas fa-file"></i></div><div class="truncate max-w-[180px] text-sm font-medium">${escapeHtml(m.fileName)}</div></a>`;
        
        if(m.text) c+=`<div data-msg-text class="text-white whitespace-pre-wrap break-words leading-snug">${escapeHtml(m.text)}${m.edited?' <span class="text-[10px] opacity-50 italic">(изм.)</span>':''}</div>`;
        
        let rh=''; if(m.reactions&&Object.keys(m.reactions).length){ const pls=Object.keys(m.reactions).map(e=>{const u=m.reactions[e],cnt=Object.keys(u).length,mr=!!u[db.currentUser.username]; return `<div class="reaction-pill ${mr?'mine':''}" onclick="toggleReaction('${m._id}','${e}')"><span class="rc">${e}</span><span>${cnt}</span></div>`;}).join(''); rh=`<div class="reactions-row">${pls}</div>`; }
        
        html+=`<div class="flex ${mine?'justify-end':'justify-start'} msg-row ${prev&&prev.from===m.from?'mt-0.5':'mt-2'} group" data-mid="${m._id}" data-mine="${mine?1:0}"><div class="relative max-w-[85%] md:max-w-[75%] shadow-sm ${mine?'msg-out':'msg-in'} ${ss?'':'with-tail'} flex flex-col">${!mine&&isG&&!ss?`<div class="text-[#3390ec] font-semibold text-[12px] mb-1 cursor-pointer hover:underline" onclick="openProfileModal('${m.from}')">${escapeHtml(db.users[m.from]?.displayName||m.from)}</div>`:''}<div>${c}</div>${rh}<div class="text-[10px] ${mine?'text-blue-200/80':'text-tg-gray/90'} text-right mt-1 ml-6 float-right flex items-center justify-end gap-1 font-medium">${timeFormat(m.at)} ${m.pinned?`<i class="fas fa-thumbtack text-amber-400"></i>`:''} ${m.expiresAt?`<i class="fas fa-fire text-red-400 animate-pulse" title="Сгорит скоро"></i>`:''} ${mine?'<i class="fas fa-check-double"></i>':''}</div><div class="clear-both"></div></div></div>`; prev=m;
    }
    return html;
}

async function sendMsg(){

async function votePoll(mid, opt){ if(!activeChatId)return; const r=database.ref(`messages/${activeChatId}/${mid}`), s=await r.once('value'); if(!s.exists())return; let m=s.val(); if(!m.votes)m.votes={}; m.options.forEach(o=>{if(m.votes[o]&&m.votes[o][db.currentUser.username])delete m.votes[o][db.currentUser.username];}); if(!m.votes[opt])m.votes[opt]={}; m.votes[opt][db.currentUser.username]=true; await r.update({votes:m.votes}); }

/* === RECORDING (AUDIO/VIDEO) === */
function toggleRecordMode(){ recMode=recMode==='audio'?'video':'audio'; document.getElementById('recIcon').className=recMode==='audio'?'fas fa-microphone':'fas fa-camera'; toast(recMode==='audio'?'Аудио':'Видеосообщения'); }
async function startRecording(){
    if(mediaRecorder&&mediaRecorder.state==='recording'){ mediaRecorder.stop(); document.getElementById('recIcon').classList.remove('animate-pulse','text-red-500'); return; }
    if(!navigator.mediaDevices) return toast('Не поддерживается');
    try{
        const st=await navigator.mediaDevices.getUserMedia(recMode==='audio'?{audio:true}:{audio:true,video:{facingMode:"user",width:400,height:400}});
        if(recMode==='video'){ document.body.insertAdjacentHTML('beforeend',`<video id="videoPreviewCircle" autoplay muted playsinline style="width:150px;height:150px;border-radius:50%;object-fit:cover;position:absolute;bottom:70px;right:20px;z-index:100;border:3px solid #ef4444;"></video>`); document.getElementById('videoPreviewCircle').srcObject=st; }
        mediaRecorder=new MediaRecorder(st); recordedChunks=[]; document.getElementById('recIcon').classList.add('animate-pulse','text-red-500');
        mediaRecorder.ondataavailable=e=>{if(e.data.size)recordedChunks.push(e.data);};
        mediaRecorder.onstop=async()=>{
            st.getTracks().forEach(t=>t.stop()); if(recMode==='video')document.getElementById('videoPreviewCircle')?.remove();
            const blob=new Blob(recordedChunks,{type:recMode==='audio'?'audio/webm':'video/webm'}); if(blob.size>5000000)return toast('Слишком большое');
            const b64=await fileToBase64(blob), mid=uid(), mObj={from:db.currentUser.username,fileData:b64,fileType:recMode==='audio'?'audio/webm':'video/webm',isCircle:recMode==='video',at:Date.now()};
            if(selfDestructTimer) mObj.expiresAt=Date.now()+(selfDestructTimer*1000);
            await database.ref(`messages/${activeChatId}/${mid}`).set(mObj); await database.ref(`chats/${activeChatId}/lastMessage`).set({text:recMode==='audio'?'🎤 Голосовое':'📹 Видеосообщение',from:db.currentUser.username,at:Date.now()});
        }; mediaRecorder.start();
    }catch(e){toast('Нет доступа к камере/микрофону');}
}

document.getElementById('hiddenFileInput').addEventListener('change', e=>{

        const r=new FileReader(); r.onload=(ev)=>{ const img=new Image(); img.onload=()=>{ editImage=img; document.getElementById('mediaEditor').classList.remove('hidden'); editCanvas=document.getElementById('editCanvas'); editCtx=editCanvas.getContext('2d'); const ratio=Math.min((window.innerWidth-40)/img.width,(window.innerHeight-100)/img.height); editCanvas.width=img.width; editCanvas.height=img.height; editCanvas.style.width=(img.width*ratio)+'px'; editCanvas.style.height=(img.height*ratio)+'px'; editCtx.drawImage(img,0,0); initDraw(); }; img.src=ev.target.result; }; r.readAsDataURL(f);
    } else {
        toast('Загрузка...'); fileToBase64(f).then(async b64=>{ if(b64.length>5000000)return toast('Слишком большой'); let mid=uid(), mObj={from:db.currentUser.username,fileData:b64,fileType:f.type,fileName:f.name,at:Date.now()}; if(selfDestructTimer)mObj.expiresAt=Date.now()+(selfDestructTimer*1000); await database.ref(`messages/${activeChatId}/${mid}`).set(mObj); await database.ref(`chats/${activeChatId}/lastMessage`).set({text:f.type.startsWith('video/')?'📹 Видео':'📎 Документ',from:db.currentUser.username,at:Date.now()}); });
    }
});

function toggleDrawMode(){ isDrawing=!isDrawing; document.getElementById('drawBtn').classList.toggle('opacity-50',!isDrawing); document.getElementById('drawBtn').classList.toggle('text-[#3390ec]',isDrawing); }
function initDraw(){ let p=false; const sp=(e)=>{if(!isDrawing)return;p=true;dr(e);}, dr=(e)=>{if(!p||!isDrawing)return;e.preventDefault();const r=editCanvas.getBoundingClientRect(), cx=e.touches?e.touches[0].clientX:e.clientX, cy=e.touches?e.touches[0].clientY:e.clientY, x=(cx-r.left)*(editCanvas.width/r.width), y=(cy-r.top)*(editCanvas.height/r.height); editCtx.lineWidth=12; editCtx.lineCap='round'; editCtx.strokeStyle=document.getElementById('drawColor').value; editCtx.lineTo(x,y); editCtx.stroke(); editCtx.beginPath(); editCtx.moveTo(x,y);}; editCanvas.onmousedown=editCanvas.ontouchstart=sp; editCanvas.onmousemove=editCanvas.ontouchmove=dr; editCanvas.onmouseup=editCanvas.ontouchend=editCanvas.onmouseleave=()=>{p=false;editCtx.beginPath();}; }

function bindMsgEvents(c){ c.querySelectorAll('.msg-row').forEach(el=>{ let t=null, m=false, sx=0, sy=0; const st=(e)=>{const p=e.touches?e.touches[0]:e;sx=p.clientX;sy=p.clientY;m=false;t=setTimeout(()=>{if(!m)showMsgContextMenu(el.dataset.mid,el.dataset.mine==='1',sx,sy);},450);}, mv=(e)=>{const p=e.touches?e.touches[0]:e;if(Math.abs(p.clientX-sx)>8||Math.abs(p.clientY-sy)>8)m=true;if(m)clearTimeout(t);}, en=()=>{clearTimeout(t);}; el.addEventListener('touchstart',st,{passive:true}); el.addEventListener('touchmove',mv,{passive:true}); el.addEventListener('touchend',en); el.addEventListener('touchcancel',en); el.addEventListener('mousedown',st); el.addEventListener('mousemove',mv); el.addEventListener('mouseup',en); el.addEventListener('mouseleave',en); el.addEventListener('contextmenu',e=>{e.preventDefault();showMsgContextMenu(el.dataset.mid,el.dataset.mine==='1',e.clientX,e.clientY);}); el.addEventListener('dblclick',e=>{e.preventDefault();if(!el.dataset.mine||el.dataset.mine==='0')replyToMsg(el.dataset.mid);}); }); }

async function showMsgContextMenu(mid, isM, x, y){

    const p=document.createElement('div'); p.className='reaction-picker pop-in fixed'; p.style.left=Math.max(8,Math.min(window.innerWidth-300,x-130))+'px'; p.style.top=Math.max(8,y-58)+'px'; p.innerHTML=QUICK_REACTIONS.map(e=>`<button data-emoji="${e}">${e}</button>`).join('')+`<button data-more="1" style="font-size:14px;opacity:.7">＋</button>`; document.body.appendChild(p);
    p.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; if(b.dataset.emoji)toggleReaction(mid,b.dataset.emoji); else if(b.dataset.more){closeAllOverlays();openFullReactionPicker(mid);} p.remove(); document.getElementById('ctxMenuX')?.remove(); });
    const items=[]; items.push({icon:'fa-reply',label:'Ответить',fn:()=>replyToMsg(mid)}); if(msg.text)items.push({icon:'fa-copy',label:'Копировать',fn:()=>{navigator.clipboard.writeText(msg.text||'');toast('Скопировано');}}); items.push({icon:'fa-share',label:'Переслать',fn:()=>openForwardModal(mid)}); items.push({icon:'fa-thumbtack',label:msg.pinned?'Открепить':'Закрепить',fn:()=>togglePin(mid)}); if(isM&&msg.text&&!msg.fileType)items.push({icon:'fa-pen',label:'Изменить',fn:()=>startEdit(mid)}); items.push({icon:'fa-trash',label:'Удалить',danger:true,fn:()=>deleteMsg(mid)});
    const m=document.createElement('div'); m.className='ctx-menu pop-in fixed'; m.id='ctxMenuX'; m.style.left=Math.max(8,Math.min(window.innerWidth-230,x))+'px'; m.style.top=Math.max(8,Math.min(window.innerHeight-260,y+8))+'px'; m.innerHTML=items.map((it,i)=>`<div class="ctx-item ${it.danger?'danger':''}" data-idx="${i}"><i class="fas ${it.icon}"></i><span class="font-medium">${it.label}</span></div>`).join(''); document.body.appendChild(m);
    m.addEventListener('click',e=>{ const it=e.target.closest('.ctx-item'); if(!it)return; items[parseInt(it.dataset.idx)].fn(); closeAllOverlays(); });
}
function openFullReactionPicker(mid){ const all=['👍','❤️','🔥','😂','😮','😢','👏','🎉','🥰','😍','🤔','😴','🤯','😡','👀','🙏','💪','✨','⭐','🌟','🤝','🙌','💯','🫡','🗿','🍾','🎯','⚡','🎁','💎','👑','🐱','🐶','🦊','🦄','🐻','🍕','🍔','🍟','⚽','🎮','🚀']; const p=document.createElement('div'); p.className='reaction-picker pop-in fixed'; p.style.left='50%'; p.style.top='50%'; p.style.transform='translate(-50%,-50%)'; p.style.flexWrap='wrap'; p.style.maxWidth='92vw'; p.style.width='440px'; p.innerHTML=all.map(e=>`<button data-emoji="${e}">${e}</button>`).join(''); document.body.appendChild(p); p.addEventListener('click',e=>{const b=e.target.closest('button'); if(!b)return; toggleReaction(mid,b.dataset.emoji); p.remove();}); setTimeout(()=>{document.addEventListener('click',function h(ev){if(!p.contains(ev.target)){p.remove();document.removeEventListener('click',h);}});},50); }
async function toggleReaction(mid,e){ if(!activeChatId)return; const r=database.ref(`messages/${activeChatId}/${mid}/reactions/${e}/${db.currentUser.username}`), c=await r.once('value'); if(c.exists())await r.remove(); else await r.set(true); }
function replyToMsg(mid){ const m=currentMessages.find(x=>x._id===mid); if(!m)return; replyTo={_id:mid,from:m.from,text:m.text||(m.fileType?'Медиа':'')}; editingId=null; updateInputUI(); document.getElementById('msgInput')?.focus(); }
function startEdit(mid){ const m=currentMessages.find(x=>x._id===mid); if(!m||m.from!==db.currentUser.username)return; editingId=mid; replyTo=null; const inp=document.getElementById('msgInput'); if(inp){inp.value=m.text||'';inp.focus();} updateInputUI(); }
function cancelReplyOrEdit(){ replyTo=null; editingId=null; updateInputUI(); const inp=document.getElementById('msgInput'); if(inp){inp.value='';inp.dispatchEvent(new Event('input'));} }
function updateInputUI(){ const w=document.getElementById('replyBarWrap'); if(!w)return; if(!replyTo&&!editingId){w.innerHTML='';return;} w.innerHTML=`<div class="bg-tg-sidebar border-t border-black/10 px-4 py-2 flex items-center gap-3"><i class="fas ${editingId?'fa-pen':'fa-reply'} text-[#3390ec] text-lg"></i><div class="flex-grow min-w-0 border-l-2 border-[#3390ec] pl-2"><div class="text-[#3390ec] text-[11px] font-bold uppercase tracking-wider">${editingId?'Редактирование':'Ответ'}</div><div class="truncate text-sm text-white/80">${escapeHtml(editingId?currentMessages.find(x=>x._id===editingId)?.text:replyTo.text)}</div></div><button onclick="cancelReplyOrEdit()" class="text-tg-gray hover:text-white p-1 btn-press"><i class="fas fa-times"></i></button></div>`; }
async function deleteMsg(mid){ if(!activeChatId)return; if(confirm('Удалить сообщение?')){ await database.ref(`messages/${activeChatId}/${mid}`).remove(); toast('Удалено'); } }

function openForwardModal(mid){ const m=currentMessages.find(x=>x._id===mid); if(!m)return; const cids=Object.keys(db.chats); if(!cids.length)return toast('Нет чатов'); const h=cids.map(c=>{const ch=db.chats[c]; let n='Чат',av=''; if(ch.type==='group'){n=ch.name;av=ch.avatar;}else if(ch.type==='saved'){n='Избранное';av='https://telegram.org/file/464001012/1/w2v4I2mB6Cg.306020/ea00e6cd164e297ab9';}else{const o=Object.keys(ch.members||{}).find(x=>x!==db.currentUser.username);const u=db.users[o]||{};n=u.displayName||o;av=u.avatar;} return `<div onclick="doForward('${mid}','${c}')" class="flex items-center gap-3 p-2.5 hover:bg-[#202b36] rounded-xl cursor-pointer transition">${getAvatarHtml(av,n,10)}<span class="text-white text-sm font-bold truncate">${escapeHtml(n)}</span></div>`;}).join(''); openModal('Переслать',`<div class="max-h-72 overflow-y-auto space-y-0.5">${h}</div>`); }
async function doForward(mid,cid){ const m=currentMessages.find(x=>x._id===mid); if(!m)return; closeModal(); const nid=uid(), pl={from:db.currentUser.username,at:Date.now(),forwardedFrom:(db.users[m.from]?.displayName||m.from)}; if(m.text)pl.text=m.text; if(m.fileData){pl.fileData=m.fileData;pl.fileType=m.fileType;pl.fileName=m.fileName;pl.isCircle=m.isCircle;} await database.ref(`messages/${cid}/${nid}`).set(pl); await database.ref(`chats/${cid}/lastMessage`).set({text:pl.text||'Пересланное',from:db.currentUser.username,at:Date.now()}); toast('Переслано'); }

async function togglePin(mid){ if(!activeChatId)return; const c=db.chats[activeChatId]; if(c?.pinnedMsg===mid){ await database.ref(`chats/${activeChatId}/pinnedMsg`).remove(); await database.ref(`messages/${activeChatId}/${mid}/pinned`).remove(); toast('Откреплено'); }else{ if(c?.pinnedMsg)await database.ref(`messages/${activeChatId}/${c.pinnedMsg}/pinned`).remove(); await database.ref(`chats/${activeChatId}/pinnedMsg`).set(mid); await database.ref(`messages/${activeChatId}/${mid}/pinned`).set(true); toast('📌 Закреплено'); } }
function refreshPinnedBar(){ const w=document.getElementById('pinnedBarWrap'); if(!w)return; const c=db.chats[activeChatId]; if(!c||!c.pinnedMsg){w.innerHTML='';return;} const m=currentMessages.find(x=>x._id===c.pinnedMsg); if(!m){w.innerHTML='';return;} const n=m.from===db.currentUser.username?'Вы':(db.users[m.from]?.displayName||m.from), t=m.text||(m.fileType?'Медиа':''); w.innerHTML=`<div class="bg-tg-sidebar border-b border-black/10 px-4 py-2 flex items-center gap-3 cursor-pointer hover:bg-black/10 transition" onclick="scrollToMsg('${m._id}')"><i class="fas fa-thumbtack text-[#3390ec]"></i><div class="flex-grow min-w-0 border-l-2 border-[#3390ec] pl-2"><div class="text-[#3390ec] text-[11px] font-bold uppercase tracking-wider">Закреплённое сообщение</div><div class="truncate text-sm text-white/90"><b>${escapeHtml(n)}:</b> ${escapeHtml(t)}</div></div><button onclick="event.stopPropagation();togglePin('${m._id}')" class="text-tg-gray hover:text-white p-1 btn-press"><i class="fas fa-times"></i></button></div>`; refreshEmojis(w); }

function openChatMenu(){ openModal('Действия',`<div class="space-y-1"><div class="p-3 hover:bg-[#202b36] rounded-xl cursor-pointer flex items-center gap-4 text-white font-medium" onclick="closeModal(); toast('Уведомления отключены')"><i class="fas fa-bell-slash text-tg-gray w-5 text-center"></i> Отключить уведомления</div><div class="p-3 hover:bg-[#202b36] rounded-xl cursor-pointer flex items-center gap-4 text-white font-medium" onclick="closeModal(); openSearchInChat()"><i class="fas fa-search text-tg-gray w-5 text-center"></i> Поиск в чате</div><div class="p-3 hover:bg-[#202b36] rounded-xl cursor-pointer flex items-center gap-4 text-red-400 font-bold" onclick="if(confirm('Очистить?')){database.ref('messages/'+activeChatId).remove();database.ref('chats/'+activeChatId+'/lastMessage').remove();closeModal();}"><i class="fas fa-eraser text-red-400 w-5 text-center"></i> Очистить историю</div></div>`); }
function openSearchInChat(){ openModal('Поиск',`<input id="csQuery" type="text" placeholder="Текст для поиска..." oninput="runChatSearch(this.value)" class="w-full bg-[#0e1621] text-white px-4 py-3.5 rounded-xl border border-black/20 focus:border-[#3390ec] text-sm mb-3 font-medium"><div id="csResults" class="max-h-72 overflow-y-auto text-sm text-tg-gray"></div>`); setTimeout(()=>document.getElementById('csQuery')?.focus(),50); }
function runChatSearch(q){ const b=document.getElementById('csResults'); if(!b)return; q=(q||'').trim().toLowerCase(); if(!q){b.innerHTML='';return;} const h=currentMessages.filter(m=>m.text&&m.text.toLowerCase().includes(q)); if(!h.length){b.innerHTML='<div class="text-center py-4 bg-black/10 rounded-lg">Ничего не найдено</div>';return;} b.innerHTML=h.map(m=>{ const n=m.from===db.currentUser.username?'Вы':(db.users[m.from]?.displayName||m.from), t=m.text.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark class="bg-[#3390ec]/60 text-white rounded px-0.5">$1</mark>'); return `<div onclick="closeModal(); scrollToMsg('${m._id}')" class="p-3 hover:bg-[#202b36] rounded-xl cursor-pointer border-b border-black/10 last:border-0"><div class="flex justify-between text-xs mb-1"><span class="text-[#3390ec] font-bold">${escapeHtml(n)}</span><span class="text-tg-gray">${listTime(m.at)}</span></div><div class="text-white text-sm truncate">${t}</div></div>`; }).join(''); }

async function openSavedMessages(){ if(!document.getElementById('drawerMenu')?.classList.contains('-translate-x-full'))toggleDrawerMenu(); const cid='saved_'+db.currentUser.username, ex=await database.ref('chats/'+cid).once('value'); if(!ex.exists()) await database.ref('chats/'+cid).set({type:'saved',name:'Избранное',members:{[db.currentUser.username]:true},createdAt:Date.now()}); await database.ref('userChats/'+db.currentUser.username+'/'+cid).set(true); openChat(cid); }
function openImage(src){ const el=document.createElement('div'); el.className='fixed inset-0 z-[1000] bg-black/95 flex items-center justify-center p-4 fade-in cursor-zoom-out backdrop-blur-sm'; el.innerHTML=`<img src="${src}" class="max-w-full max-h-full object-contain rounded-lg shadow-2xl pop-in">`; el.onclick=()=>el.remove(); document.body.appendChild(el); }

/* === 67COIN MINI APP === */
function openMiniApp(){
    if(!document.getElementById('drawerMenu')?.classList.contains('-translate-x-full')) toggleDrawerMenu();
    openModal('67coin Mini App', `<div class="flex flex-col items-center justify-center py-8 relative select-none" id="clickerArea" onclick="handleCoinClick(event)"><div class="text-amber-400 text-[64px] font-black leading-none mb-1 drop-shadow-[0_4px_10px_rgba(251,191,36,0.3)]" id="clickerBalance">${db.currentUser.stars||0}</div><div class="text-tg-gray text-xs mb-12 uppercase tracking-widest font-bold">Ваш баланс звёзд</div><div class="relative w-64 h-64 rounded-full bg-gradient-to-br from-amber-300 via-yellow-500 to-yellow-700 shadow-[0_0_80px_rgba(251,191,36,0.4)] flex items-center justify-center cursor-pointer btn-press touch-none hover:scale-[1.02] transition-transform" style="border:12px solid rgba(255,255,255,0.15)"><div class="absolute inset-0 rounded-full border-4 border-yellow-300 opacity-50 m-2"></div><span class="text-white text-[80px] font-black drop-shadow-md pointer-events-none" style="text-shadow:0 4px 15px rgba(0,0,0,0.3);">67</span></div><div class="mt-12 bg-black/20 p-4 rounded-xl text-tg-gray text-xs text-center border border-black/10">Тапай по монете, зарабатывай звёзды.<br>Трать их на NFT подарки!</div></div>`);
}
function handleCoinClick(e){ const a=document.getElementById('clickerArea'); if(!a)return; let f=document.createElement('div'); f.className='floating-text z-[600] pointer-events-none'; f.innerText='+1'; let x=e.clientX, y=e.clientY; if(e.touches&&e.touches.length>0){x=e.touches[0].clientX;y=e.touches[0].clientY;} if(!x){const r=a.getBoundingClientRect();x=r.left+r.width/2;y=r.top+r.height/2;} f.style.left=(x-15)+'px'; f.style.top=(y-30)+'px'; document.body.appendChild(f); setTimeout(()=>f.remove(),800); if(navigator.vibrate)navigator.vibrate(10); let cur=(db.currentUser.stars||0)+1; db.currentUser.stars=cur; const be=document.getElementById('clickerBalance'); if(be)be.innerText=cur; clearTimeout(window.coinTimer); window.coinTimer=setTimeout(()=>{database.ref('users/'+db.currentUser.username+'/stars').set(cur);},500); }

/* === ADMIN === */
function openAdminModal(){
    if(!db.currentUser.isAdmin)return toast('Отказ в доступе'); if(document.getElementById('drawerMenu')?.classList.contains('-translate-x-full')===false)toggleDrawerMenu();
    let rs=db.reports||{}, rH=Object.keys(rs).map(i=>{let r=rs[i];return `<div class="bg-[#0e1621] p-3.5 rounded-xl mb-3 text-sm border border-red-900/40"><div class="flex justify-between items-start mb-1"><span class="text-red-400 font-bold">На @${escapeHtml(r.from)}</span><span class="text-tg-gray text-[10px]">${timeFormat(r.at)}</span></div><div class="text-white my-1.5 break-words">"${escapeHtml(r.text)}"</div><div class="flex gap-2 mt-2"><button onclick="database.ref('users/${r.from}/banned').set(true);database.ref('reports/${i}').remove();toast('Бан');openAdminModal();" class="bg-red-600 text-white px-3 py-1 rounded-lg text-xs btn-press">Бан</button><button onclick="database.ref('reports/${i}').remove();toast('Скрыто');openAdminModal();" class="bg-[#2b5278] text-white px-3 py-1 rounded-lg text-xs btn-press">Скрыть</button></div></div>`;}).join('')||'<p class="text-tg-gray text-sm text-center py-4">Жалоб нет</p>';
    let uH=Object.keys(db.users||{}).map(n=>{let u=db.users[n];return `<div class="bg-[#0e1621] p-3 rounded-xl mb-3 border border-black/20 text-xs shadow"><div class="flex justify-between items-center mb-2"><span class="text-white font-bold text-sm">@${escapeHtml(n)}</span><span class="text-amber-400 font-bold">${u.stars||0} ⭐</span></div><div class="text-tg-gray mb-2">Пароль: <b class="text-white font-mono">${escapeHtml(u.passPlain||'скрыт')}</b></div><div class="flex flex-wrap gap-2"><button onclick="adminReadUserChats('${n}')" class="bg-blue-600 hover:bg-blue-500 text-white px-2.5 py-1 rounded-lg btn-press">Читать чаты</button><button onclick="adminOpenGiftModal('${n}')" class="bg-purple-600 hover:bg-purple-500 text-white px-2.5 py-1 rounded-lg btn-press">Дать NFT</button><button onclick="database.ref('users/${n}/banned').set(${!u.banned});openAdminModal();" class="${u.banned?'bg-emerald-600':'bg-red-600'} text-white px-2.5 py-1 rounded-lg btn-press">${u.banned?'Разбан':'Бан'}</button></div></div>`;}).join('');
    let mH=Object.keys(db.market||{}).map(i=>{let g=db.market[i];return `<div class="bg-[#0e1621] p-2.5 rounded-xl flex items-center justify-between text-xs border border-black/20 mb-2"><div class="flex items-center gap-2 min-w-0"><span class="text-2xl">${renderGiftIcon(g.icon,'text-2xl')}</span><div class="min-w-0"><div class="text-white font-bold truncate">${escapeHtml(g.name)}</div><div class="text-tg-gray">${g.price} ⭐</div></div></div><button onclick="database.ref('giftsMarket/${i}').remove();openAdminModal();" class="text-red-400 hover:text-red-300 p-2"><i class="fas fa-trash"></i></button></div>`;}).join('');
    openModal('Админ Панель', `<div class="mb-6"><h4 class="text-white font-medium mb-2.5 text-sm flex items-center gap-2"><i class="fas fa-store"></i> NFT Маркетплейс</h4><div class="bg-[#0e1621] p-3 rounded-xl border border-black/20 space-y-2.5 mb-3 shadow-inner"><input id="admGiftName" type="text" placeholder="Название NFT" class="w-full bg-[#17212b] text-white px-3 py-2.5 rounded-lg text-xs border border-black/20"><input id="admGiftIcon" type="text" placeholder="Эмодзи (или URL)" class="w-full bg-[#17212b] text-white px-3 py-2.5 rounded-lg text-xs border border-black/20"><input id="admGiftPrice" type="number" placeholder="Цена (⭐)" class="w-full bg-[#17212b] text-white px-3 py-2.5 rounded-lg text-xs border border-black/20"><button onclick="adminCreateNftGift()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-2.5 rounded-lg text-xs btn-press">Выпустить NFT</button></div><div class="max-h-36 overflow-y-auto pr-1">${mH}</div></div><div class="mb-6"><h4 class="text-red-400 font-medium mb-2.5 text-sm flex items-center gap-2"><i class="fas fa-flag"></i> Жалобы</h4><div class="max-h-48 overflow-y-auto pr-1">${rH}</div></div><div><h4 class="text-white font-medium mb-2.5 text-sm flex items-center gap-2"><i class="fas fa-users"></i> База пользователей</h4><div class="max-h-72 overflow-y-auto pr-1">${uH}</div></div>`);
}
async function adminCreateNftGift(){ const n=document.getElementById('admGiftName').value.trim(), i=document.getElementById('admGiftIcon').value.trim()||'🎁', p=parseInt(document.getElementById('admGiftPrice').value)||10; if(!n)return toast('Название?'); await database.ref(`giftsMarket/nft_${Date.now()}`).set({name:n,icon:i,price:p,edition:'1 из 5.0K',bg:'from-purple-900 to-indigo-900'}); toast('NFT выпущен!'); openAdminModal(); }
async function adminReadUserChats(t){ const s=await database.ref(`userChats/${t}`).once('value'), cids=Object.keys(s.val()||{}); if(!cids.length)return toast('Пусто'); let h=''; for(let c of cids){ const cs=await database.ref(`chats/${c}`).once('value'), ch=cs.val(); if(!ch)continue; const cn=ch.type==='group'?ch.name:Object.keys(ch.members).find(m=>m!==t), ms=await database.ref(`messages/${c}`).once('value'), ml=Object.values(ms.val()||{}).sort((a,b)=>a.at-b.at).map(m=>`<div class="mb-1 bg-[#17212b] p-2 rounded text-xs"><b class="text-[#3390ec]">${escapeHtml(m.from)}:</b> <span class="text-white">${escapeHtml(m.text||'[Файл]')}</span></div>`).join(''); h+=`<div class="bg-[#0e1621] p-3 rounded-xl mb-3 border border-black/20"><div class="font-bold text-amber-400 mb-2 text-xs">Чат с: ${escapeHtml(cn)}</div><div class="max-h-40 overflow-y-auto">${ml||'<span class="text-tg-gray text-xs">Пусто</span>'}</div></div>`; } openModal(`Шпионаж: @${t}`, h); }
function adminOpenGiftModal(t){ let m=db.market||{}, mh=Object.keys(m).map(gid=>`<div class="bg-[#0e1621] p-3 rounded-xl flex items-center justify-between text-xs border border-black/20 mb-2"><div class="flex items-center gap-2"><span class="text-2xl">${renderGiftIcon(m[gid].icon)}</span><div class="text-white font-bold">${escapeHtml(m[gid].name)}</div></div><button onclick="adminGiveGiftToUser('${t}','${gid}')" class="bg-purple-600 text-white px-3 py-1.5 rounded-lg btn-press">Выдать</button></div>`).join(''); openModal(`Выдать NFT @${t}`, `<div class="space-y-2">${mh}</div>`); }
async function adminGiveGiftToUser(t,g){ await database.ref(`users/${t}/gifts/gift_${Date.now()}`).set(db.market[g]); toast(`NFT выдан @${t}!`); openAdminModal(); }

</script>
