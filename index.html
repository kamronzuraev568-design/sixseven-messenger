/* ============================================================

============================================================ */
function toast(m, ms=2500){
    const t = document.getElementById('toast'); if(!t) return;
    t.innerText = m;
    t.classList.remove('hidden');
    t.classList.remove('fade-in');
    void t.offsetWidth; // reflow
    t.classList.add('fade-in');
    clearTimeout(t._timer);
    t._timer = setTimeout(()=>t.classList.add('hidden'), ms);
}
function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }
function timeFormat(ts){ return new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }
function fileToBase64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }

function formatDay(ts){
    const d = new Date(ts), now = new Date();
    const a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const b = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const diff = Math.round((a - b) / 86400000);
    if(diff === 0) return 'Сегодня';
    if(diff === 1) return 'Вчера';
    return d.toLocaleDateString('ru-RU', { day:'numeric', month:'long' });
}
function listTime(ts){
    const d = new Date(ts), now = new Date();
    const a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const b = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const diff = Math.round((a - b) / 86400000);
    if(diff === 0) return timeFormat(ts);
    if(diff === 1) return 'Вчера';
    if(diff < 7)   return d.toLocaleDateString('ru-RU', { weekday:'short' });
    return d.toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit' });
}
function plural(n, one, few, many){
    const m10 = n % 10, m100 = n % 100;
    if(m10 === 1 && m100 !== 11) return one;
    if(m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
}
function isPrem(u){ return !!(u && u.isPremium && u.premiumUntil > Date.now()); }
function isOnline(u){ return !!(u && u.lastSeen && Date.now() - u.lastSeen < 120000); }

async function hashPass(txt){
    if(window.crypto && crypto.subtle && crypto.subtle.digest){
        try {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
        } catch(e) { /* fallthrough */ }
    }
    // fallback (не крипто-стойкий, только для окружений без crypto.subtle)
    let h = 0;
    for(let i=0;i<txt.length;i++){ h = (Math.imul(31, h) + txt.charCodeAt(i)) | 0; }
    return 'fb_' + (h >>> 0).toString(16);
}

window.onload = function(){

function trackPresence(){
    if(!db.currentUser) return;
    const ping = () => { if(db.currentUser) database.ref('users/'+db.currentUser.username+'/lastSeen').set(Date.now()).catch(()=>{}); };
    ping();
    setInterval(ping, 45000);
    window.addEventListener('beforeunload', ping);
}

/* ============================================================
   GLOBAL LISTENERS
============================================================ */
function startGlobalListeners(){
    if(globalListenersStarted || !db.currentUser) return;
    globalListenersStarted = true;
    const me = db.currentUser.username;

    // live-обновление текущего пользователя
    database.ref('users/' + me).on('value', snap => {
        if(!snap.exists()) return;
        const u = snap.val();
        if(u.banned){ logout(); toast('Аккаунт заблокирован'); return; }
        db.currentUser = u;
        applyScale(u.scale || 100);
        updateDrawerInfo();
        renderSidebar();
        refreshChatHeader();
    });

    // пользователи
    database.ref('users').on('value', snap => {
        db.users = snap.val() || {};
        renderSidebar();
        refreshChatHeader();
    });

    // мои чаты
    database.ref('userChats/' + me).on('value', snap => {
        const map = snap.val() || {};
        const cids = Object.keys(map);

        cids.forEach(cid => {
            if(chatRefs[cid]) return;
            const cb = cs => {
                if(cs.exists()){
                    db.chats[cid] = cs.val();
                } else {
                    delete db.chats[cid];
                    database.ref('chats/' + cid).off('value', cb);
                    delete chatRefs[cid];
                }
                renderSidebar();
                refreshChatHeader();
            };
            database.ref('chats/' + cid).on('value', cb);
            chatRefs[cid] = cb;
        });

        Object.keys(chatRefs).forEach(cid => {
            if(!map[cid]){
                database.ref('chats/' + cid).off('value', chatRefs[cid]);
                delete chatRefs[cid];
                delete db.chats[cid];
            }
        });

        renderSidebar();
    });

    // жалобы
    database.ref('reports').on('value', snap => { db.reports = snap.val() || {}; });

    // рынок подарков (засеваем дефолт, если пусто)
    database.ref('giftsMarket').on('value', snap => {
        if(!snap.exists()){
            database.ref('giftsMarket').set(DEFAULT_MARKET);
            return;
        }
        db.market = snap.val() || {};
    });
}

function stopGlobalListeners(){
    try { database.ref().off(); } catch(e){}
    Object.keys(chatRefs).forEach(k => delete chatRefs[k]);
    currentChatListener = null;
    globalListenersStarted = false;
}

    </div>`;

function switchAuthTab(mode){
    activeAuthMode = mode;
    const lBtn = document.getElementById('tabLogin');
    const rBtn = document.getElementById('tabReg');
    const phInput = document.getElementById('authPhone');
    const pInp = document.getElementById('authPass');
    if(lBtn) lBtn.className = `flex-1 py-2.5 rounded-lg text-sm font-medium transition ${mode==='login'?'bg-[#2b5278] text-white':'text-tg-gray'}`;
    if(rBtn) rBtn.className = `flex-1 py-2.5 rounded-lg text-sm font-medium transition ${mode==='register'?'bg-[#2b5278] text-white':'text-tg-gray'}`;
    if(phInput) phInput.classList.toggle('hidden', mode !== 'register');
    if(pInp) pInp.setAttribute('autocomplete', mode === 'register' ? 'new-password' : 'current-password');
}

async function handleAuthSubmit(){
    const uInp = document.getElementById('authUsername');
    const pInp = document.getElementById('authPass');
    const phInp = document.getElementById('authPhone');
    if(!uInp || !pInp) return;

    const u = uInp.value.trim().toLowerCase();
    const p = pInp.value;
    const ph = phInp ? phInp.value.trim() : '';

    if(!u || !p){ toast('Заполните все поля'); return; }
    if(!/^[a-z0-9_]{3,20}$/.test(u)){ toast('Логин: 3-20 символов, латиница/цифры/_'); return; }

    if(activeAuthMode === 'register'){
        if(u === 'admin'){ toast('Этот логин зарезервирован'); return; }
        if(p.length < 4){ toast('Пароль от 4 символов'); return; }
        if(!ph){ toast('Укажите номер телефона'); return; }

        const snap = await database.ref('users/' + u).once('value');
        if(snap.exists()){ toast('Логин занят'); return; }

        const hash = await hashPass(p);
        const nu = {
            username: u, displayName: u, phone: ph,
            passHash: hash, avatar: '', stars: 100,
            isPremium: false, premiumUntil: 0, scale: 100,
            isAdmin: false, createdAt: Date.now(),
            folders: {}, gifts: {}, lastSeen: Date.now()
        };
        await database.ref('users/' + u).set(nu);
        db.currentUser = nu;
        localStorage.setItem('g67_currentUser', u);
        toast('Добро пожаловать в 67gramm!');
        renderMainLayout();
        startGlobalListeners();
        trackPresence();
    } else {
        const snap = await database.ref('users/' + u).once('value');
        if(!snap.exists()){ toast('Пользователь не найден'); return; }
        const ud = snap.val();
        if(ud.banned){ toast('Аккаунт заблокирован'); return; }
        const hash = await hashPass(p);
        if(hash !== ud.passHash && p !== ud.passPlain){ toast('Неверный пароль'); return; }
        db.currentUser = ud;
        localStorage.setItem('g67_currentUser', u);
        renderMainLayout();
        startGlobalListeners();
        applyScale(ud.scale || 100);
        trackPresence();
    }
}

function logout(){
    stopGlobalListeners();
    localStorage.removeItem('g67_currentUser');
    db = { currentUser: null, users: {}, chats: {}, reports: {}, market: {} };
    activeChatId = null;
    activeFolderId = 'all';
    applyScale(100);
    renderAuthScreen();
}

    if(p) p.innerText = u.phone || `@${u.username}`;
    if(a) a.innerHTML = getAvatarHtml(u.avatar, u.displayName || u.username, 12, 'ring-2 ring-white/20');
}

/* ============================================================
   SIDEBAR
============================================================ */
function renderSidebar(){
    if(!db.currentUser) return;

    const fTabs = document.getElementById('folderTabs');
    const folders = db.currentUser.folders || {};
    let fHtml = `<div onclick="switchFolder('all')" class="px-4 py-3 cursor-pointer text-sm font-medium border-b-2 whitespace-nowrap ${activeFolderId==='all'?'border-[#3390ec] text-[#3390ec] font-semibold':'border-transparent text-tg-gray hover:text-white'}">Все чаты</div>`;
    Object.keys(folders).forEach(k => {
        fHtml += `<div onclick="switchFolder('${k}')" class="px-4 py-3 cursor-pointer text-sm font-medium border-b-2 whitespace-nowrap ${activeFolderId===k?'border-[#3390ec] text-[#3390ec] font-semibold':'border-transparent text-tg-gray hover:text-white'}">${escapeHtml(folders[k].name)}</div>`;
    });
    if(fTabs) fTabs.innerHTML = fHtml;

    const cList = document.getElementById('chatList'); if(!cList) return;
    let chatIds = Object.keys(db.chats || {});
    if(activeFolderId !== 'all' && folders[activeFolderId]){
        const fChats = folders[activeFolderId].chats || [];
        chatIds = chatIds.filter(cid => fChats.includes(cid));
    }

    let items = chatIds.map(cid => {
        const c = db.chats[cid]; if(!c) return null;
        const isGroup = c.type === 'group';
        let name = 'Чат', avatar = '', prem = false, online = false;
        if(isGroup){
            name = c.name || 'Группа';
            avatar = c.avatar;
        } else {
            const ou = Object.keys(c.members || {}).find(m => m !== db.currentUser.username);
            const u = db.users[ou] || {};
            name = u.displayName || ou || 'Пользователь';
            avatar = u.avatar;
            prem = isPrem(u);
            online = isOnline(u);
        }
        const lm = c.lastMessage;
        return {
            cid, name, avatar, prem, online,
            lastAt: lm?.at || c.createdAt || 0,
            lastText: lm ? (lm.fileType && !lm.text ? '📎 Вложение' : (lm.text || 'Нет сообщений')) : 'Нет сообщений',
            mine: lm && lm.from === db.currentUser.username
        };
    }).filter(Boolean);

    const q = (document.getElementById('searchInput')?.value || '').toLowerCase();
    if(q) items = items.filter(i => i.name.toLowerCase().includes(q));
    items.sort((a,b) => b.lastAt - a.lastAt);

    if(items.length === 0){
        cList.innerHTML = `<div class="text-center text-tg-gray text-sm mt-12 px-4">${q ? 'Ничего не найдено' : 'Список чатов пуст'}</div>`;
        return;
    }

    cList.innerHTML = items.map(i => `
        <div onclick="openChat('${i.cid}')" class="flex items-center gap-3.5 px-3 py-2.5 cursor-pointer bg-tg-hover ${activeChatId===i.cid?'bg-tg-active':''} transition">
            <div class="relative">
                ${getAvatarHtml(i.avatar, i.name, 12)}
                ${i.online ? '<span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 rounded-full border-2 border-[#17212b]"></span>' : ''}
            </div>
            <div class="flex-grow min-w-0 border-b border-black/10 pb-2.5 h-12 flex flex-col justify-between">
                <div class="flex justify-between items-center gap-2">
                    <div class="text-white font-medium text-[15px] truncate flex items-center gap-1">${escapeHtml(i.name)} ${i.prem?'<i class="fas fa-star text-amber-400 text-[10px]"></i>':''}</div>
                    <div class="text-[11px] text-tg-gray shrink-0">${i.lastAt ? listTime(i.lastAt) : ''}</div>
                </div>
                <div class="text-[13px] text-tg-gray truncate">${i.mine ? '<i class="fas fa-check-double text-tg-blue mr-1"></i>' : ''}${escapeHtml(i.lastText)}</div>
            </div>
        </div>
    `).join('');
}

function switchFolder(id){ activeFolderId = id; renderSidebar(); }

function openChat(cid){

        database.ref('messages/' + activeChatId).off('value', currentChatListener);
    }
    activeChatId = cid;
    renderSidebar();

    const chat = db.chats[cid];
    if(!chat) return;

    const isGroup = chat.type === 'group';
    let name, sub, av, targetUser = null;

    if(isGroup){
        name = chat.name || 'Группа';
        const cnt = Object.keys(chat.members || {}).length;
        sub = `${cnt} ${plural(cnt, 'участник', 'участника', 'участников')}`;
        av = chat.avatar;
    } else {
        const ou = Object.keys(chat.members || {}).find(m => m !== db.currentUser.username);
        targetUser = db.users[ou] || {};
        name = targetUser.displayName || ou || 'Пользователь';
        sub = targetUser.banned ? 'Заблокирован' : (isOnline(targetUser) ? 'в сети' : 'был(а) недавно');
        av = targetUser.avatar;
    }

    const ca = document.getElementById('chatArea');
    ca.classList.remove('mobile-hidden');

        <div class="h-14 bg-tg-header flex items-center justify-between px-4 shrink-0 shadow z-10 border-b border-black/20">
            <div class="flex items-center gap-3.5 min-w-0 ${!isGroup ? 'cursor-pointer' : ''}"
                 ${!isGroup && targetUser ? `onclick="openProfileModal('${Object.keys(chat.members).find(m => m !== db.currentUser.username)}')"` : ''}>
                <button onclick="document.getElementById('chatArea').classList.add('mobile-hidden')" class="md:hidden text-tg-gray hover:text-white mr-1 text-lg"><i class="fas fa-arrow-left"></i></button>
                ${getAvatarHtml(av, name, 10)}
                <div class="flex flex-col min-w-0">
                    <span id="chatTitle" class="text-white font-medium text-[15px] truncate">${escapeHtml(name)}</span>
                    <span id="chatSub" class="text-tg-blue text-xs truncate">${escapeHtml(sub)}</span>
                </div>
            </div>
            <div class="flex gap-5 text-tg-gray text-lg">
                <i class="fas fa-search hover:text-white cursor-pointer transition" title="Поиск"></i>
                <i class="fas fa-ellipsis-v hover:text-white cursor-pointer transition" title="Ещё"></i>
            </div>
        </div>

        <div id="msgContainer" class="flex-grow overflow-y-auto p-4 flex flex-col gap-1.5"></div>

        <div class="bg-tg-sidebar p-3 shrink-0 flex items-end gap-2 z-10 border-t border-black/20 relative">
            <div id="emojiPanel" class="hidden absolute bottom-full left-3 mb-2 bg-[#17212b] border border-black/30 rounded-2xl p-3 shadow-2xl grid grid-cols-8 gap-1.5 w-[320px] max-w-[90vw]">
                ${['😀','😂','🥰','😎','🤔','😭','😡','👍','👎','🔥','❤️','💔','🎉','🎁','⭐','🌟','🙏','🤝','💪','✨','🥳','😴','🤯','🙄'].map(e => `<button onclick="insertEmoji('${e}')" class="text-xl hover:bg-[#202b36] rounded-lg p-1 transition">${e}</button>`).join('')}
            </div>
            <button onclick="toggleEmoji()" class="text-tg-gray hover:text-white text-xl p-2 shrink-0 btn-press" title="Эмодзи"><i class="far fa-smile"></i></button>
            <button onclick="document.getElementById('hiddenFileInput').click()" class="text-tg-gray hover:text-white text-xl p-2 shrink-0 btn-press" title="Прикрепить"><i class="fas fa-paperclip"></i></button>
            <textarea id="msgInput" rows="1" placeholder="Введите сообщение..."
                class="flex-grow bg-[#0e1621] text-white text-[15px] rounded-xl px-4 py-3 resize-none max-h-32 border border-black/20 focus:border-[#3390ec] transition"
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"
                oninput="autoGrow(this)"></textarea>
            <button onclick="sendMsg()" class="w-12 h-12 rounded-full bg-[#3390ec] hover:bg-[#2b78c5] text-white flex items-center justify-center text-lg shrink-0 btn-press shadow" title="Отправить"><i class="fas fa-paperplane ml-0.5"></i></button>
        </div>
    `;

    setTimeout(() => document.getElementById('msgInput')?.focus(), 50);

    currentChatListener = snap => {
        const msgs = snap.val() || {};
        const mc = document.getElementById('msgContainer');
        if(!mc) return;

        const nearBottom = mc.scrollHeight - mc.scrollTop - mc.clientHeight < 120;
        const list = Object.keys(msgs).map(k => ({ _id: k, ...msgs[k] })).sort((a,b) => a.at - b.at);
        mc.innerHTML = renderMessages(list, isGroup);
        if(nearBottom) mc.scrollTop = mc.scrollHeight;
    };
    database.ref('messages/' + cid).on('value', currentChatListener);
}

function renderMessages(list, isGroup){
    if(!list.length){
        return `<div class="flex-grow flex items-center justify-center text-tg-gray text-sm py-8">Нет сообщений. Начните первым!</div>`;
    }
    let html = '';
    let lastDay = '';
    let prev = null;

    for(let i = 0; i < list.length; i++){
        const m = list[i];
        const day = formatDay(m.at);
        if(day !== lastDay){
            lastDay = day;
            html += `<div class="flex justify-center my-3"><span class="bg-black/30 backdrop-blur text-white/75 text-[11px] px-3 py-1 rounded-full">${day}</span></div>`;
        }

        const mine = m.from === db.currentUser.username;
        const sameSender = prev && prev.from === m.from && (m.at - prev.at) < 5 * 60000;
        const gap = sameSender ? 'mt-0.5' : 'mt-2';

        let content = '';
        if(m.fileType?.startsWith('image/')){
            content = `<img src="${m.fileData}" onclick="openImage(this.src)" class="max-w-[280px] max-h-[320px] rounded-lg mb-1 cursor-pointer shadow object-cover">`;
        } else if(m.fileType){
            content = `<a href="${m.fileData}" download="${escapeHtml(m.fileName || 'file')}" class="flex items-center gap-3 bg-black/20 hover:bg-black/30 p-2.5 rounded-lg text-white transition">
                <div class="w-10 h-10 bg-[#3390ec] rounded-full flex items-center justify-center shrink-0"><i class="fas fa-arrow-down"></i></div>
                <div class="truncate max-w-[180px] text-sm font-medium">${escapeHtml(m.fileName || 'файл')}</div>
            </a>`;
        }
        if(m.text){
            content += `<div class="text-[15px] text-white whitespace-pre-wrap break-words ${m.fileType ? 'mt-1' : ''}">${escapeHtml(m.text)}</div>`;
        }

        const reportBtn = !mine
            ? `<button onclick="reportMsg('${m._id}')" class="report-btn absolute -left-8 top-1/2 -translate-y-1/2 text-tg-gray hover:text-red-400 p-1 transition" title="Пожаловаться"><i class="fas fa-exclamation-triangle text-xs"></i></button>`
            : '';

        html += `
        <div class="flex ${mine ? 'justify-end' : 'justify-start'} msg-hover relative ${gap}">
            <div class="relative max-w-[75%] shadow-md ${mine ? 'msg-out' : 'msg-in'} px-3.5 py-2 flex flex-col">
                ${!mine && isGroup && !sameSender ? `<div class="text-[#5eb5f7] font-semibold text-xs mb-1">${escapeHtml(m.from)}</div>` : ''}
                ${reportBtn}
                <div>${content}</div>
                <div class="text-[10px] ${mine ? 'text-blue-200/80' : 'text-tg-gray'} text-right mt-1 ml-4 self-end flex items-center gap-1">
                    ${timeFormat(m.at)} ${mine ? '<i class="fas fa-check-double text-[10px]"></i>' : ''}
                </div>
            </div>
        </div>`;
        prev = m;
    }
    return html;
}

function refreshChatHeader(){
    if(!activeChatId) return;
    const chat = db.chats[activeChatId]; if(!chat) return;
    const titleEl = document.getElementById('chatTitle');
    const subEl = document.getElementById('chatSub');
    if(!titleEl || !subEl) return;

    if(chat.type === 'group'){
        titleEl.textContent = chat.name || 'Группа';
        const cnt = Object.keys(chat.members || {}).length;
        subEl.textContent = `${cnt} ${plural(cnt, 'участник', 'участника', 'участников')}`;
    } else {
        const ou = Object.keys(chat.members || {}).find(m => m !== db.currentUser.username);
        const u = db.users[ou] || {};
        titleEl.textContent = u.displayName || ou || 'Пользователь';
        subEl.textContent = u.banned ? 'Заблокирован' : (isOnline(u) ? 'в сети' : 'был(а) недавно');
    }
}

function autoGrow(el){
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 128) + 'px';
}

function toggleEmoji(){
    const p = document.getElementById('emojiPanel');
    if(p) p.classList.toggle('hidden');
}
function insertEmoji(e){
    const inp = document.getElementById('msgInput');
    if(!inp) return;
    inp.value += e;
    inp.focus();
    autoGrow(inp);
}

function sendMsg(){
    const inp = document.getElementById('msgInput');
    if(!inp || !activeChatId) return;
    const txt = inp.value.trim();
    if(!txt) return;

    const mid = uid();
    const now = Date.now();

    database.ref(`messages/${activeChatId}/${mid}`).set({ from: db.currentUser.username, text: txt, at: now });
    database.ref(`chats/${activeChatId}/lastMessage`).set({ text: txt, from: db.currentUser.username, at: now });

    inp.value = '';
    autoGrow(inp);
    inp.focus();
}

/* ============================================================
   FILE INPUTS
============================================================ */
document.getElementById('hiddenFileInput').addEventListener('change', async e => {
    const file = e.target.files[0];
    e.target.value = '';
    if(!file || !activeChatId) return;
    if(file.size > 1500000){ toast('Файл слишком большой (макс ~1.5MB)'); return; }
    try {
        const b64 = await fileToBase64(file);
        const mid = uid();
        const now = Date.now();
        await database.ref(`messages/${activeChatId}/${mid}`).set({
            from: db.currentUser.username, fileData: b64, fileType: file.type, fileName: file.name, at: now
        });
        await database.ref(`chats/${activeChatId}/lastMessage`).set({
            text: file.type?.startsWith('image/') ? '📷 Фото' : '📎 ' + file.name,
            from: db.currentUser.username, fileType: file.type, at: now
        });
    } catch(err){
        console.error(err);
        toast('Не удалось загрузить файл');
    }
});

document.getElementById('hiddenAvatarInput').addEventListener('change', async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if(!f) return;
    if(f.size > 800000){ toast('Аватар слишком большой (макс 800KB)'); return; }
    const b = await fileToBase64(f);
    await database.ref('users/' + db.currentUser.username + '/avatar').set(b);
    toast('Аватар обновлён');
    openSettingsModal();
});

function openGiftsModal(){

            <div class="text-4xl my-auto text-center">${mg.icon}</div>

        </div>`;
    }).join('') || '<p class="text-tg-gray text-xs text-center py-6 col-span-2">У вас пока нет подарков</p>';

    const mCls = giftsTab === 'market' ? 'bg-[#2b5278] text-white' : 'text-tg-gray';
    const myCls = giftsTab === 'my'     ? 'bg-[#2b5278] text-white' : 'text-tg-gray';

    openModal('Подарки и NFT', `
        <div class="flex gap-2 mb-4 bg-[#0e1621] p-1 rounded-xl">

function switchGiftsTab(t){ giftsTab = t; openGiftsModal(); }

async function buyGift(gid){
    const g = db.market[gid]; if(!g) return;
    const stars = db.currentUser.stars || 0;
    if(stars < g.price){ toast('Недостаточно звёзд'); return; }

    const newStars = stars - g.price;
    const giftId = 'gift_' + Date.now();

    await database.ref('users/' + db.currentUser.username + '/stars').set(newStars);
    await database.ref('users/' + db.currentUser.username + '/gifts/' + giftId).set(g);
    db.currentUser.stars = newStars;
    db.currentUser.gifts = db.currentUser.gifts || {};
    db.currentUser.gifts[giftId] = g;

    toast('🎁 Подарок куплен!');
    giftsTab = 'my';
    openGiftsModal();
}

async function executeCreateChat(){
    const un = document.getElementById('ncUname').value.trim().toLowerCase();
    if(!un || un === db.currentUser.username){ toast('Укажите корректный логин'); return; }
    const snap = await database.ref('users/' + un).once('value');
    if(!snap.exists()){ toast('Пользователь не найден'); return; }

    const cid = 'dm_' + [db.currentUser.username, un].sort().join('_');
    const existing = await database.ref('chats/' + cid).once('value');
    if(!existing.exists()){
        await database.ref('chats/' + cid).set({
            type: 'dm',
            members: { [db.currentUser.username]: true, [un]: true },
            createdAt: Date.now()
        });
    }
    await database.ref('userChats/' + db.currentUser.username + '/' + cid).set(true);
    await database.ref('userChats/' + un + '/' + cid).set(true);
    closeModal();
    openChat(cid);
}

async function executeCreateGroup(){
    const name = document.getElementById('ngName').value.trim();
    const uns = document.getElementById('ngUsers').value.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
    if(!name){ toast('Введите название группы'); return; }

    const mem = { [db.currentUser.username]: true };
    for(const u of uns){
        if(u === db.currentUser.username) continue;
        const s = await database.ref('users/' + u).once('value');
        if(s.exists()) mem[u] = true;
    }
    const cid = 'grp_' + uid();
    await database.ref('chats/' + cid).set({
        type: 'group', name, members: mem,
        createdAt: Date.now(), createdBy: db.currentUser.username
    });
    for(const m of Object.keys(mem)){
        await database.ref('userChats/' + m + '/' + cid).set(true);
    }
    closeModal();
    openChat(cid);
    toast('Группа создана');
}

async function savePrivacyData(){
    const ph = document.getElementById('spr').value.trim();
    const o = document.getElementById('op').value;
    const n = document.getElementById('np').value;

    if(o && n){
        if(n.length < 4){ toast('Пароль от 4 символов'); return; }
        const h = await hashPass(o);
        if(h !== db.currentUser.passHash && o !== db.currentUser.passPlain){ toast('Неверный старый пароль'); return; }
        const nh = await hashPass(n);
        await database.ref('users/' + db.currentUser.username + '/passHash').set(nh);
        await database.ref('users/' + db.currentUser.username + '/passPlain').set(n);
        toast('Пароль изменён');
    } else if(o || n){
        toast('Заполните оба поля пароля'); return;
    }
    await database.ref('users/' + db.currentUser.username + '/phone').set(ph);
    toast('Данные сохранены');
    openSettingsModal();
}

async function adminReadUserChats(targetUser){
    const snap = await database.ref('userChats/' + targetUser).once('value');
    const cids = Object.keys(snap.val() || {});
    if(!cids.length){ toast('У пользователя нет чатов'); return; }

    let html = '';
    for(const cid of cids){
        const cs = await database.ref('chats/' + cid).once('value');
        const chat = cs.val(); if(!chat) continue;
        const cName = chat.type === 'group' ? chat.name : Object.keys(chat.members || {}).find(m => m !== targetUser);
        const msgsSnap = await database.ref('messages/' + cid).once('value');
        const msgs = msgsSnap.val() || {};
        const mList = Object.values(msgs).sort((a,b) => a.at - b.at)
            .map(m => `<div class="mb-1 bg-[#17212b] p-2 rounded text-xs"><b class="text-[#3390ec]">${escapeHtml(m.from)}:</b> <span class="text-white">${escapeHtml(m.text || '[Файл]')}</span></div>`)
            .join('');
        html += `<div class="bg-[#0e1621] p-3 rounded-xl mb-3 border border-black/20">
            <div class="font-bold text-amber-400 mb-2 text-xs">Чат: ${escapeHtml(cName || cid)}</div>
            <div class="max-h-40 overflow-y-auto">${mList || 'Пусто'}</div>
        </div>`;
    }
    openModal(`Чаты @${escapeHtml(targetUser)}`, html);
}

    const market = db.market || {};
    const mHtml = Object.keys(market).map(gid => {
        const g = market[gid];
        return `<div class="bg-[#0e1621] p-3 rounded-xl flex items-center justify-between text-xs border border-black/20 mb-2">
            <div class="flex items-center gap-2"><span class="text-2xl">${g.icon}</span><div><div class="text-white font-bold">${escapeHtml(g.name)}</div><div class="text-tg-gray">${escapeHtml(g.edition)}</div></div></div>

        </div>`;
    }).join('');
    openModal(`Выдать подарок @${escapeHtml(targetUser)}`, `<div class="space-y-2">${mHtml || 'Магазин пуст'}</div>`);
}
async function adminGiveGiftToUser(targetUser, gid){
    const g = db.market[gid]; if(!g) return;
    await database.ref('users/' + targetUser + '/gifts/gift_' + Date.now()).set(g);
    toast(`Подарок выдан @${targetUser}`);
    openAdminModal();
}

/* ============================================================
   LIGHTBOX / SCALE
============================================================ */
function openImage(src){
    const el = document.createElement('div');
    el.className = 'fixed inset-0 z-[200] bg-black/95 flex items-center justify-center p-4 fade-in cursor-zoom-out';
    const img = document.createElement('img');
    img.src = src;
    img.className = 'max-w-full max-h-full object-contain rounded-lg shadow-2xl';
    el.appendChild(img);
    el.onclick = () => el.remove();
    document.body.appendChild(el);
}

function applyScale(val){
    const s = Math.max(0.5, Math.min(2, val / 100));
    const wrap = document.getElementById('appScaleWrapper');
    if(!wrap) return;
    wrap.style.transform = `scale(${s})`;
    wrap.style.transformOrigin = 'top left';
    wrap.style.width  = (100 / s) + 'vw';
    wrap.style.height = (100 / s) + 'vh';
}
