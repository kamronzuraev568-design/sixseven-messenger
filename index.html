function formatDay(ts){const d=new Date(ts),now=new Date();const a=new Date(now.getFullYear(),now.getMonth(),now.getDate());const b=new Date(d.getFullYear(),d.getMonth(),d.getDate());const diff=Math.round((a-b)/86400000);if(diff===0)return'Сегодня';if(diff===1)return'Вчера';if(diff<7)return d.toLocaleDateString('ru-RU',{weekday:'long'});return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});}
function listTime(ts){const d=new Date(ts),now=new Date();const a=new Date(now.getFullYear(),now.getMonth(),now.getDate());const b=new Date(d.getFullYear(),d.getMonth(),d.getDate());const diff=Math.round((a-b)/86400000);if(diff===0)return timeFormat(ts);if(diff===1)return'Вчера';if(diff<7)return d.toLocaleDateString('ru-RU',{weekday:'short'});return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'});}
function fmtDuration(sec){sec=Math.max(0,Math.floor(sec));const m=Math.floor(sec/60),s=sec%60;return m+':'+String(s).padStart(2,'0');}
function plural(n,one,few,many){const m10=n%10,m100=n%100;if(m10===1&&m100!==11)return one;if(m10>=2&&m10<=4&&(m100<10||m100>=20))return few;return many;}
function isPrem(u){return!!(u&&u.isPremium&&u.premiumUntil>Date.now());}
function isOnline(u){return!!(u&&u.lastSeen&&Date.now()-u.lastSeen<120000);}
function lastSeenText(u){if(!u)return'';if(u.banned)return'заблокирован';if(isOnline(u))return'в сети';const ls=u.lastSeen||0;if(!ls)return'был(а) недавно';const diff=Date.now()-ls;if(diff<60000)return'был(а) только что';if(diff<3600000)return'был(а) '+Math.floor(diff/60000)+' мин назад';if(diff<86400000)return'был(а) '+Math.floor(diff/3600000)+' ч назад';return'был(а) '+new Date(ls).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});}
async function hashPass(txt){if(window.crypto&&crypto.subtle&&crypto.subtle.digest){try{const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}catch(e){}}let h=0;for(let i=0;i<txt.length;i++)h=(Math.imul(31,h)+txt.charCodeAt(i))|0;return'fb_'+(h>>>0).toString(16);}
function refreshEmojis(root){if(typeof twemoji==='undefined')return;requestAnimationFrame(()=>{try{twemoji.parse(root||document.body,{folder:'svg',ext:'.svg',className:'twemoji'});}catch(e){}});}
function copyToClipboard(text){if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast('Скопировано')).catch(()=>fallbackCopy(text));else fallbackCopy(text);}
function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Скопировано');}

const AVATAR_TEXT={8:'text-xs',10:'text-sm',12:'text-base',14:'text-lg',16:'text-xl',20:'text-2xl',24:'text-4xl',28:'text-5xl',32:'text-5xl'};
const AVATAR_COLORS=['from-red-500 to-pink-600','from-orange-500 to-red-500','from-amber-500 to-orange-600','from-emerald-500 to-teal-600','from-cyan-500 to-blue-500','from-blue-500 to-indigo-600','from-violet-500 to-purple-600','from-fuchsia-500 to-pink-600'];
function pickColor(n){let h=0;for(let i=0;i<(n||'').length;i++)h=(h*31+n.charCodeAt(i))|0;return AVATAR_COLORS[Math.abs(h)%AVATAR_COLORS.length];}
function getAvatarHtml(src,name,size=10,extra=''){const dim=`w-${size} h-${size}`;const base=`${dim} ${extra} rounded-full shrink-0 shadow object-cover avatar-shadow`;if(src)return `<img src="${src}" class="${base}" alt="">`;const letter=escapeHtml((name||'?').trim().charAt(0).toUpperCase()||'?');return `<div class="${dim} ${extra} rounded-full bg-gradient-to-br ${pickColor(name||'?')} flex items-center justify-center text-white font-bold shrink-0 shadow avatar-shadow ${AVATAR_TEXT[size]||'text-sm'}">${letter}</div>`;}
function renderGiftIcon(icon,size='text-4xl',extra=''){const s=String(icon||'🎁').trim();if(/^(https?:\/\/|data:image\/)/i.test(s))return `<img src="${escapeHtml(s)}" alt="" class="${extra} object-contain inline-block align-middle" style="width:1em;height:1em;" onerror="this.outerHTML='<span class=\\'${size}\\'>🎁</span>'">`;return `<span class="${size} ${extra} inline-block align-middle">${s}</span>`;}

/* ===== GLOBAL LISTENERS ===== */
function startGlobalListeners(){
if(globalListenersStarted||!db.currentUser)return;
globalListenersStarted=true;
const me=db.currentUser.username;
database.ref('users/'+me).on('value',snap=>{
  if(!snap.exists())return;
  const u=snap.val();
  if(u.banned){logout();toast('Аккаунт заблокирован');return;}
  const themeChanged=u.theme!==db.currentUser.theme;
  const fontChanged=u.fontScale!==db.currentUser.fontScale;
  db.currentUser=u;
  applyScale(u.scale||100);
  if(themeChanged)applyTheme(u.theme||'dark');
  if(fontChanged)applyFontScale(u.fontScale||15);
  updateDrawerInfo();renderSidebar();refreshChatHeader();
});
database.ref('users').on('value',snap=>{db.users=snap.val()||{};renderSidebar();refreshChatHeader();});
database.ref('userChats/'+me).on('value',snap=>{
  const map=snap.val()||{};
  const cids=Object.keys(map);
  cids.forEach(cid=>{
    if(chatRefs[cid])return;
    const cb=cs=>{
      if(cs.exists())db.chats[cid]=cs.val();
      else{delete db.chats[cid];database.ref('chats/'+cid).off('value',cb);delete chatRefs[cid];}
      renderSidebar();refreshChatHeader();refreshPinnedBar();
    };
    database.ref('chats/'+cid).on('value',cb);chatRefs[cid]=cb;
  });
  Object.keys(chatRefs).forEach(cid=>{
    if(!map[cid]){database.ref('chats/'+cid).off('value',chatRefs[cid]);delete chatRefs[cid];delete db.chats[cid];}
  });
  renderSidebar();
});
database.ref('reports').on('value',snap=>{db.reports=snap.val()||{};});
database.ref('giftsMarket').on('value',snap=>{
  const custom=snap.val()||{};
  db.market={...GIFT_CATALOG,...custom};
});
}
function stopGlobalListeners(){try{database.ref().off();}catch(e){}Object.keys(chatRefs).forEach(k=>delete chatRefs[k]);currentChatListener=null;globalListenersStarted=false;}

function applyTheme(theme){const t=theme||'dark';if(t==='light')document.body.classList.add('theme-light');else if(t==='system'){if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)document.body.classList.add('theme-light');else document.body.classList.remove('theme-light');}else document.body.classList.remove('theme-light');applyChatBg();}
function applyFontScale(px){document.querySelectorAll('#msgContainer [data-msg-text]').forEach(el=>el.style.fontSize=(px||15)+'px');}
function applyChatBg(){const url=db.currentUser?.chatBg||THEMES_BG.default;const ca=document.getElementById('chatArea');if(ca)ca.style.backgroundImage=`url('${url}')`;}
function applyScale(val){const s=Math.max(0.5,Math.min(2,val/100));const wrap=document.getElementById('appScaleWrapper');if(!wrap)return;wrap.style.transform=`scale(${s})`;wrap.style.transformOrigin='top left';wrap.style.width=(100/s)+'vw';wrap.style.height=(100/s)+'vh';}

function switchAuthTab(mode){activeAuthMode=mode;const l=document.getElementById('tabLogin'),r=document.getElementById('tabReg');const ph=document.getElementById('authPhone'),p=document.getElementById('authPass');if(l)l.className=`flex-1 py-2.5 rounded-lg text-sm font-medium transition ${mode==='login'?'bg-[#2b5278] text-white':'text-tg-gray hover:text-white'}`;if(r)r.className=`flex-1 py-2.5 rounded-lg text-sm font-medium transition ${mode==='register'?'bg-[#2b5278] text-white':'text-tg-gray hover:text-white'}`;if(ph)ph.classList.toggle('hidden',mode!=='register');if(p)p.setAttribute('autocomplete',mode==='register'?'new-password':'current-password');}
async function handleAuthSubmit(){
const uInp=document.getElementById('authUsername'),pInp=document.getElementById('authPass'),phInp=document.getElementById('authPhone');
if(!uInp||!pInp)return;
const u=uInp.value.trim().toLowerCase(),p=pInp.value,ph=phInp?phInp.value.trim():'';
if(!u||!p){toast('Заполните все поля');return;}
if(!/^[a-z0-9_]{3,20}$/.test(u)){toast('Логин: 3-20 символов, латиница/цифры/_');return;}
if(activeAuthMode==='register'){
  if(u==='admin'){toast('Этот логин зарезервирован');return;}
  if(p.length<4){toast('Пароль от 4 символов');return;}
  if(!ph){toast('Укажите номер телефона');return;}
  const snap=await database.ref('users/'+u).once('value');
  if(snap.exists()){toast('Логин занят');return;}
  const hash=await hashPass(p);
  const nu={username:u,displayName:u,phone:ph,passHash:hash,avatar:'',stars:100,isPremium:false,premiumUntil:0,scale:100,isAdmin:false,createdAt:Date.now(),folders:{},gifts:{},lastSeen:Date.now(),theme:'dark',fontScale:15,bio:''};
  await database.ref('users/'+u).set(nu);
  db.currentUser=nu;
  localStorage.setItem('g67_currentUser',u);
  toast('Добро пожаловать!');
  renderMainLayout();startGlobalListeners();trackPresence();
}else{
  const snap=await database.ref('users/'+u).once('value');
  if(!snap.exists()){toast('Пользователь не найден');return;}
  const ud=snap.val();
  if(ud.banned){toast('Аккаунт заблокирован');return;}
  const hash=await hashPass(p);
  if(hash!==ud.passHash&&p!==ud.passPlain){toast('Неверный пароль');return;}
  db.currentUser=ud;
  localStorage.setItem('g67_currentUser',u);
  applyTheme(ud.theme||'dark');applyFontScale(ud.fontScale||15);
  renderMainLayout();startGlobalListeners();applyScale(ud.scale||100);trackPresence();
}
}

function applyFontScaleToBubbles(){const px=(db.currentUser?.fontScale||15);document.querySelectorAll('#msgContainer [data-msg-text]').forEach(el=>el.style.fontSize=px+'px');}
function scrollToBottom(smooth=true){const mc=document.getElementById('msgContainer');if(!mc)return;if(smooth)mc.scrollTo({top:mc.scrollHeight,behavior:'smooth'});else mc.scrollTop=mc.scrollHeight;newMessagesCount=0;const b=document.getElementById('newMsgBadge');if(b){b.classList.add('hidden');b.textContent='0';}const btn=document.getElementById('scrollBottomBtn');if(btn)btn.classList.add('hidden');}
function renderMessages(list,isGroup){
if(!list.length)return `<div class="flex-grow flex flex-col items-center justify-center text-tg-gray text-sm py-12"><i class="far fa-comment-dots text-4xl mb-3 text-tg-gray/30"></i>Нет сообщений. Начните первым!</div>`;
let html='';let lastDay='';let prev=null;let prevSame=false;
for(let i=0;i<list.length;i++){
  const m=list[i];
  if(m.deletedFor&&m.deletedFor[db.currentUser.username]&&!m.deletedForAll)continue;
  const day=formatDay(m.at);
  if(day!==lastDay){lastDay=day;html+=`<div class="flex justify-center my-3"><span class="bg-black/40 backdrop-blur text-white/80 text-[11px] px-3 py-1 rounded-full shadow">${day}</span></div>`;prevSame=false;}
  const mine=m.from===db.currentUser.username;
  const sameSender=prev&&prev.from===m.from&&(m.at-prev.at)<5*60000&&day===lastDay;
  let content='';
  if(m.deletedForAll&&!mine){content=`<div class="italic opacity-60 text-[14px]"><i class="fas fa-ban mr-1"></i>Сообщение удалено</div>`;}
  else{
    if(m.replyTo){const rq=list.find(x=>x._id===m.replyTo);const rqName=rq?(rq.from===db.currentUser.username?'Вы':(db.users[rq.from]?.displayName||rq.from)):'Сообщение';const rqTxt=rq?(rq.text||(rq.fileType?.startsWith('audio/')?'🎤 Голосовое':(rq.fileType?.startsWith('image/')?'📷 Фото':(rq.fileType?'📎 Вложение':'')))):'недоступно';content+=`<div class="reply-quote" onclick="event.stopPropagation();scrollToMsg('${m.replyTo}')"><div class="rq-from">${escapeHtml(rqName)}</div><div class="rq-text">${escapeHtml(rqTxt)}</div></div>`;}
    if(m.forwardedFrom)content+=`<div class="text-[12px] opacity-70 italic mb-1"><i class="fas fa-share mr-1"></i>Переслано от ${escapeHtml(m.forwardedFrom)}</div>`;
    if(m.fileType?.startsWith('image/'))content+=`<img src="${m.fileData}" onclick="event.stopPropagation();openImage(this.src)" class="rounded-xl mb-1 cursor-pointer max-w-[280px] max-h-[320px] object-cover">`;
    else if(m.fileType?.startsWith('audio/')){const dur=m.duration||0;const bars=Array.from({length:24},()=>2+Math.floor(Math.random()*10));content+=`<div class="voice-bubble"><audio id="aud_${m._id}" src="${m.fileData}" preload="metadata" ontimeupdate="voiceTime(this)"></audio><div class="voice-play" onclick="event.stopPropagation();toggleAudio('${m._id}')"><i class="fas fa-play" id="vp_${m._id}"></i></div><div class="voice-wave">${bars.map(h=>`<i style="height:${h}px"></i>`).join('')}</div><div class="voice-time" id="vt_${m._id}">${fmtDuration(dur)}</div></div>`;}
    else if(m.fileType)content+=`<a href="${m.fileData}" download="${escapeHtml(m.fileName||'file')}" onclick="event.stopPropagation()" class="flex items-center gap-3 bg-black/25 hover:bg-black/35 p-2.5 rounded-xl text-white transition"><div class="w-10 h-10 bg-[#3390ec] rounded-full flex items-center justify-center shrink-0"><i class="fas fa-arrow-down"></i></div><div class="truncate max-w-[180px] text-sm font-medium">${escapeHtml(m.fileName||'файл')}</div></a>`;
    if(m.text)content+=`<div data-msg-text class="text-white whitespace-pre-wrap break-words leading-[1.35] ${m.fileType?'mt-1':''}" style="font-size:${db.currentUser?.fontScale||15}px">${escapeHtml(m.text)}${m.edited?' <span class="text-[10px] opacity-60 italic">(изм.)</span>':''}</div>`;
  }
  let reactHtml='';
  if(m.reactions&&Object.keys(m.reactions).length){
    const pills=Object.keys(m.reactions).map(emo=>{const users=m.reactions[emo];const cnt=Object.keys(users).length;const mineR=!!users[db.currentUser.username];return `<div class="reaction-pill ${mineR?'mine':''}" onclick="event.stopPropagation();toggleReaction('${m._id}','${emo}')"><span class="rc">${emo}</span><span>${cnt}</span></div>`;}).join('');
    reactHtml=`<div class="reactions-row">${pills}</div>`;
  }
  const reportBtn=!mine?`<button onclick="event.stopPropagation();reportMsg('${m._id}')" class="report-btn absolute -left-8 top-1/2 -translate-y-1/2 text-tg-gray hover:text-red-400 p-1 transition" title="Жалоба"><i class="fas fa-exclamation-triangle text-xs"></i></button>`:'';
  const tailClass=sameSender?'':'with-tail';
  html+=`<div class="flex ${mine?'justify-end':'justify-start'} msg-row ${prevSame?'mt-0.5':'mt-2'}" data-mid="${m._id}" data-mine="${mine?1:0}"><div class="relative msg-bubble ${mine?'msg-out':'msg-in'} ${tailClass}">${!mine&&isGroup&&!sameSender?`<div class="text-[#5eb5f7] font-semibold text-[13px] mb-0.5">${escapeHtml(db.users[m.from]?.displayName||m.from)}</div>`:''}${reportBtn}${content}${reactHtml}<div class="text-[11px] ${mine?'text-blue-200/80':'text-tg-gray/90'} float-right ml-2 mt-1 select-none flex items-center gap-1 leading-none">${m.pinned?'<i class="fas fa-thumbtack text-[9px]"></i>':''}${timeFormat(m.at)}${mine?'<i class="fas fa-check-double text-[10px]"></i>':''}</div><div class="clear-both"></div></div></div>`;
  prev=m;prevSame=sameSender;
}
return html;
}
function bindMsgEvents(container){
container.querySelectorAll('.msg-row').forEach(el=>{
  let pressTimer=null,moved=false,startX=0,startY=0;
  const start=e=>{const pt=e.touches?e.touches[0]:e;startX=pt.clientX;startY=pt.clientY;moved=false;pressTimer=setTimeout(()=>{if(!moved)showMsgContextMenu(el.dataset.mid,el.dataset.mine==='1',startX,startY);},450);};
  const move=e=>{const pt=e.touches?e.touches[0]:e;if(Math.abs(pt.clientX-startX)>8||Math.abs(pt.clientY-startY)>8)moved=true;if(moved)clearTimeout(pressTimer);};
  const end=()=>{clearTimeout(pressTimer);};
  el.addEventListener('touchstart',start,{passive:true});
  el.addEventListener('touchmove',move,{passive:true});
  el.addEventListener('touchend',end);
  el.addEventListener('touchcancel',end);
  el.addEventListener('mousedown',start);
  el.addEventListener('mousemove',move);
  el.addEventListener('mouseup',end);
  el.addEventListener('mouseleave',end);
  el.addEventListener('contextmenu',e=>{e.preventDefault();showMsgContextMenu(el.dataset.mid,el.dataset.mine==='1',e.clientX,e.clientY);});
  el.addEventListener('dblclick',e=>{e.preventDefault();if(el.dataset.mine==='0')replyToMsg(el.dataset.mid);});
});
}

if(isMine){if(msg.text&&!msg.fileType)items.push({icon:'fa-pen',label:'Изменить',fn:()=>startEdit(mid)});items.push({icon:'fa-trash',label:'Удалить',danger:true,fn:()=>deleteMsg(mid)});}
else{items.push({icon:'fa-trash',label:'Удалить у себя',danger:true,fn:()=>deleteMsg(mid,false)});items.push({icon:'fa-flag',label:'Пожаловаться',danger:true,fn:()=>reportMsg(mid)});}
const menu=document.createElement('div');
menu.className='ctx-menu pop-in fixed';
menu.id='ctxMenuX';
menu.style.left=Math.max(8,Math.min(window.innerWidth-230,x))+'px';

menu.innerHTML=items.map((it,i)=>`<div class="ctx-item ${it.danger?'danger':''}" data-idx="${i}"><i class="fas ${it.icon}"></i><span>${it.label}</span></div>`).join('');
document.body.appendChild(menu);
menu.addEventListener('click',e=>{const it=e.target.closest('.ctx-item');if(!it)return;const idx=parseInt(it.dataset.idx);items[idx].fn();menu.remove();picker.remove();});
}
function openFullReactionPicker(mid){
const all=['👍','❤️','🔥','😂','😮','😢','👏','🎉','🥰','😍','🤔','😴','🤯','😡','👀','🙏','💪','✨','⭐','🌟','🤝','🙌','💯','🫡','🗿','🍾','🎯','⚡','🎁','💎','👑','🐱','🐶','🦊','🦄','🐻','🍕','🍔','🍟','⚽','🎮','🚀','✈️','🏆','🚨','💀','🎵','☕','🍀','🌈'];
const picker=document.createElement('div');

async function toggleReaction(mid,emoji){
if(!activeChatId)return;
const ref=database.ref(`messages/${activeChatId}/${mid}/reactions/${emoji}/${db.currentUser.username}`);
const cur=await ref.once('value');
if(cur.exists())await ref.remove();else await ref.set(true);
}
function replyToMsg(mid){const m=currentMessages.find(x=>x._id===mid);if(!m)return;replyTo={_id:mid,from:m.from,text:m.text||(m.fileType?.startsWith('audio/')?'🎤 Голосовое':(m.fileType?.startsWith('image/')?'📷 Фото':(m.fileType?'📎 Вложение':'')))};editingId=null;updateInputUI();document.getElementById('msgInput')?.focus();}
function startEdit(mid){const m=currentMessages.find(x=>x._id===mid);if(!m||m.from!==db.currentUser.username)return;editingId=mid;replyTo=null;const inp=document.getElementById('msgInput');if(inp){inp.value=m.text||'';autoGrow(inp);inp.focus();}updateInputUI();}
function cancelReplyOrEdit(){replyTo=null;editingId=null;const inp=document.getElementById('msgInput');if(inp){inp.value='';autoGrow(inp);}updateInputUI();}

function runChatSearch(q){
const box=document.getElementById('csResults');if(!box)return;
q=(q||'').trim().toLowerCase();

const hits=currentMessages.filter(m=>m.text&&m.text.toLowerCase().includes(q));
if(!hits.length){box.innerHTML='<div class="text-center py-4">Ничего не найдено</div>';return;}
box.innerHTML=hits.map(m=>{
  const name=m.from===db.currentUser.username?'Вы':(db.users[m.from]?.displayName||m.from);
  const txt=m.text.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark class="bg-yellow-400/40 text-white">$1</mark>');

}).join('');

async function toggleRecording(){
if(recording()){mediaRecorder.stop();return;}
if(!navigator.mediaDevices||!window.MediaRecorder){toast('Запись не поддерживается');return;}
try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  mediaRecorder=new MediaRecorder(stream);
  recordedChunks=[];
  mediaRecorder.ondataavailable=e=>{if(e.data.size)recordedChunks.push(e.data);};
  mediaRecorder.onstop=async()=>{
    stream.getTracks().forEach(t=>t.stop());
    const blob=new Blob(recordedChunks,{type:'audio/webm'});
    const duration=Math.floor((Date.now()-recStartAt)/1000);
    const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob);});
    const mid=uid();const now=Date.now();
    const payload={from:db.currentUser.username,fileData:b64,fileType:'audio/webm',fileName:'voice.webm',duration,at:now};
    if(replyTo)payload.replyTo=replyTo._id;
    await database.ref(`messages/${activeChatId}/${mid}`).set(payload);
    await database.ref(`chats/${activeChatId}/lastMessage`).set({text:'🎤 Голосовое',from:db.currentUser.username,fileType:'audio/webm',at:now});
    replyTo=null;updateInputUI();micBtnReset();
    setTimeout(()=>scrollToBottom(false),50);
  };
  mediaRecorder.start();recStartAt=Date.now();startRecUI();
}catch(err){console.error(err);toast('Нет доступа к микрофону');}
}
function startRecUI(){
const mic=document.getElementById('micBtn');if(!mic)return;
mic.classList.remove('hidden');
mic.innerHTML='<i class="fas fa-stop text-red-500"></i>';
const send=document.getElementById('sendBtn');if(send)send.classList.add('hidden');
const inp=document.getElementById('msgInput');if(inp){inp.disabled=true;inp.placeholder='Идёт запись...';}
const parent=mic.parentElement;
let counter=document.createElement('div');
counter.id='recTimer';counter.className='text-red-400 text-sm font-mono flex items-center gap-2';
counter.innerHTML='<span class="rec-dot"></span><span id="recSecs">0:00</span>';
parent.insertBefore(counter,mic);
recTimerInt=setInterval(()=>{
  const s=Math.floor((Date.now()-recStartAt)/1000);
  const el=document.getElementById('recSecs');if(el)el.textContent=fmtDuration(s);
  if(s>=60)mediaRecorder.stop();
},250);
}
function micBtnReset(){
clearInterval(recTimerInt);recTimerInt=null;
document.getElementById('recTimer')?.remove();
const mic=document.getElementById('micBtn');if(mic)mic.innerHTML='<i class="fas fa-microphone"></i>';
const inp=document.getElementById('msgInput');if(inp){inp.disabled=false;inp.placeholder='Написать сообщение...';}
updateMicSendButtonsForce();
}
function toggleAudio(id){
const aud=document.getElementById('aud_'+id);if(!aud)return;
const icon=document.getElementById('vp_'+id);
document.querySelectorAll('audio').forEach(a=>{if(a.id!=='aud_'+id&&!a.paused){a.pause();const i2=document.getElementById('vp_'+a.id.replace('aud_',''));if(i2){i2.classList.remove('fa-pause');i2.classList.add('fa-play');}}});
if(aud.paused){aud.play();if(icon){icon.classList.remove('fa-play');icon.classList.add('fa-pause');}aud.onended=()=>{if(icon){icon.classList.remove('fa-pause');icon.classList.add('fa-play');}};}
else{aud.pause();if(icon){icon.classList.remove('fa-pause');icon.classList.add('fa-play');}}
}

function renderProfileGiftsSection(u,isMe){
const gifts=u.gifts||{};

  const canUpg=g.canUpgrade!==false&&!g.traits;
  const rarity=g.traits?.rarity;
  const rarityInfo=rarity?RARITY_TIERS[rarity]:null;
  const badge=rarityInfo?`<div class="absolute top-1.5 left-1.5 bg-black/60 backdrop-blur px-1.5 py-0.5 rounded text-[9px] font-bold z-10" style="color:${rarityInfo.color}">${rarityInfo.name.toUpperCase()}</div>`:'';
  const serialBadge=g.traits?.serial?`<div class="absolute bottom-1.5 right-1.5 bg-black/60 backdrop-blur px-1.5 py-0.5 rounded text-[9px] font-mono z-10">#${g.traits.serial}</div>`:'';
  const symbol=g.traits?.symbol?`<div class="text-lg opacity-70">${g.traits.symbol}</div>`:'';
  const upgBtn=(isMe&&canUpg)?`<button onclick="event.stopPropagation();openUpgradeModal('${gid}')" class="absolute inset-0 bg-black/70 opacity-0 hover:opacity-100 transition flex flex-col items-center justify-center gap-1 z-20 rounded-2xl"><i class="fas fa-arrow-up text-amber-400"></i><span class="text-[10px] text-amber-400 font-semibold">Улучшить</span></button>`:'';

  return `<div onclick="showGiftDetail('${gid}','${u.username}')" class="relative bg-gradient-to-tr ${g.traits?.backdrop||g.bg} rounded-2xl shadow-lg overflow-hidden text-white aspect-square flex flex-col justify-between p-2.5 cursor-pointer">${badge}${serialBadge}${upgBtn}${craftBtn}<div class="flex-1 flex items-center justify-center">${renderGiftIcon(g.icon,'text-3xl')}</div><div>${symbol}<div class="text-[11px] font-semibold truncate leading-tight">${escapeHtml(g.name)}</div><div class="text-[9px] opacity-70">${escapeHtml(g.traits?.model||g.edition)}</div></div></div>`;

}

`);
}
function toggleCraftSelect(gid){const idx=craftSelection.indexOf(gid);if(idx>=0)craftSelection.splice(idx,1);else{if(craftSelection.length>=4){toast('Максимум 4 подарка');return;}craftSelection.push(gid);}renderCraftModal();}
async function doCraft(){
if(craftSelection.length<2)return;
const count=craftSelection.length;
const chance=count===2?45:count===3?69:92;
const roll=Math.random()*100;
closeModal();toast('Крафтинг...');
setTimeout(async()=>{
  const ids=[...craftSelection];
  craftSelection=[];
  if(roll<chance){
    const rarities=['uncommon','rare','epic','legendary'];
    const maxIdx=Math.min(rarities.length-1,count-1);
    const rarity=rarities[Math.floor(Math.random()*maxIdx)+1]||'rare';
    const traits=genTrait(rarity);
    traits.serial=genSerial();
    const template=db.currentUser.gifts[ids[0]];
    const newGift={name:`Crafted ${template.name}`,icon:template.icon,bg:traits.backdrop,edition:'1 из '+(Math.floor(Math.random()*9000)+1000),traits,craftedAt:Date.now(),canUpgrade:false};
    for(const gid of ids)await database.ref('users/'+db.currentUser.username+'/gifts/'+gid).remove();
    await database.ref('users/'+db.currentUser.username+'/gifts/crafted_'+Date.now()).set(newGift);
    toast(`✨ Успех! ${RARITY_TIERS[rarity].name} · ${traits.model}`,4000);
  }else{
    for(const gid of ids)await database.ref('users/'+db.currentUser.username+'/gifts/'+gid).remove();
    toast('💀 Крафт провалился — подарки сгорели',4000);
  }
},1200);
}
