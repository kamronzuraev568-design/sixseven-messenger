<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SixSeven</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%235288c1%22/><text x=%2250%22 y=%2266%22 font-size=%2242%22 font-family=%22Arial,sans-serif%22 font-weight=%22900%22 fill=%22white%22 text-anchor=%22middle%22>67</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    * { font-family: 'Roboto', sans-serif; box-sizing: border-box; }
    body { background-color: #0e1621; color: #f5f5f5; margin: 0; overflow: hidden; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #2b3a4a; border-radius: 2px; }
    ::-webkit-scrollbar-track { background: transparent; }
    
    .bg-tg-main { background-color: #0e1621; }
    .bg-tg-sidebar { background-color: #17212b; }
    .bg-tg-active { background-color: #2b5278; }
    .bg-tg-hover:hover { background-color: #202b36; }
    .text-tg-blue { color: #5288c1; }
    .text-tg-gray { color: #7fa1c3; }
    
    .msg-out { background-color: #2b5278; border-radius: 12px 12px 0 12px; }
    .msg-in { background-color: #182533; border-radius: 12px 12px 12px 0; }
    
    .btn-press { transition: transform 0.1s; }
    .btn-press:active { transform: scale(0.97); }
    .fade-in { animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
    input, textarea, select { outline: none; }
    .modal-overlay { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(2px); }
</style>
</head>
<body>

<div id="appScaleWrapper" style="transform-origin: top left; width: 100vw; height: 100vh; overflow: hidden; transition: transform 0.2s;">
    <div id="app" class="h-full w-full flex">
        <div class="w-full h-full bg-[#0e1621] flex items-center justify-center text-tg-gray text-sm">Загрузка SixSeven...</div>
    </div>
</div>

<div id="toast" class="hidden fixed bottom-10 left-1/2 -translate-x-1/2 bg-[#303e4d] text-white text-sm px-4 py-2 rounded-full shadow-lg z-[9999] fade-in"></div>

<input type="file" id="hiddenFileInput" class="hidden" accept="image/*,application/pdf,.zip,.rar">
<input type="file" id="hiddenAvatarInput" class="hidden" accept="image/*">

<script>
const firebaseConfig = { apiKey: "AIzaSyCm5Ikh0OV1bP2fbep-7Kg7rcuNN4PujRY", authDomain: "sixseven-67001.firebaseapp.com", databaseURL: "https://sixseven-67001-default-rtdb.firebaseio.com", projectId: "sixseven-67001", storageBucket: "sixseven-67001.firebasestorage.app", messagingSenderId: "652602968843", appId: "1:652602968843:web:17dadd54f0f5bd6255b00e" };
let database;
try { firebase.initializeApp(firebaseConfig); database = firebase.database(); } 
catch(e) { database = { ref: () => ({ on:()=>{}, off:()=>{}, once:()=>Promise.resolve({exists:()=>false,val:()=>null}), set:()=>Promise.resolve(), remove:()=>Promise.resolve() }) }; }

let db = { currentUser: null, users: {}, chats: {}, reports: {}, templates: {}, items: {} };
let activeChatId = null;
let activeFolderId = 'all';

function toast(m){ let t=document.getElementById('toast'); if(!t)return; t.innerText=m; t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'), 2500); }
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return 'id_'+Date.now()+'_'+Math.random().toString(36).substr(2,6); }
async function hashPass(txt){ const msg = new TextEncoder().encode(txt); const hash = await crypto.subtle.digest('SHA-256', msg); return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join(''); }
function timeFormat(ts){ let d = new Date(ts); return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }
function fileToBase64(file){ return new Promise((res,rej) => { let r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }

window.onload = function() {
    try {
        let saved = localStorage.getItem('ss_currentUser');
        if(saved) {
            db.currentUser = { username: saved, folders: {}, stars: 0, scale: 100 };
            renderApp();
            database.ref(`users/${saved}`).once('value').then(snap => {
                if(snap.exists()){
                    let u = snap.val();
                    if(u.banned) { logout(); toast('Аккаунт заблокирован'); return; }
                    db.currentUser = u;
                    applyScale(u.scale || 100);
                    startListeners();
                    renderApp();
                } else { logout(); }
            }).catch(() => { startListeners(); renderApp(); });
        } else {
            renderAuth();
        }
    } catch(err) {
        console.error(err);
        renderAuth();
    }
};

function startListeners() {
    database.ref('users').on('value', snap => { db.users = snap.val()||{}; renderSidebar(); });
    if(db.currentUser && db.currentUser.username) {
        database.ref(`userChats/${db.currentUser.username}`).on('value', snap => {
            let cids = Object.keys(snap.val()||{});
            cids.forEach(cid => {
                if(!db.chats[cid]) database.ref(`chats/${cid}`).on('value', cs => {
                    if(cs.exists()) { db.chats[cid] = cs.val(); renderSidebar(); if(activeChatId===cid) renderChatHeader(); }
                    else delete db.chats[cid];
                });
            });
            renderSidebar();
        });
    }
    database.ref('reports').on('value', snap => { db.reports = snap.val()||{}; });
}

function renderAuth() {
    document.getElementById('app').innerHTML = `
    <div class="w-full h-full bg-tg-main flex items-center justify-center p-4">
        <div class="bg-tg-sidebar w-full max-w-md p-8 rounded-xl shadow-2xl fade-in text-center">
            <div class="w-20 h-20 bg-blue-500 rounded-full mx-auto flex items-center justify-center mb-6 shadow-lg">
                <i class="fas fa-paper-plane text-white text-3xl ml-1 mt-1"></i>
            </div>
            <h1 class="text-2xl font-bold text-white mb-2">SixSeven</h1>
            <p class="text-tg-gray text-sm mb-6">Войдите или зарегистрируйтесь</p>
            
            <div class="flex bg-[#0e1621] rounded-lg p-1 mb-6">
                <button id="tabLogin" onclick="setAuth('login')" class="flex-1 py-2 rounded bg-[#2b5278] text-white text-sm font-bold transition">Вход</button>
                <button id="tabReg" onclick="setAuth('register')" class="flex-1 py-2 rounded text-tg-gray text-sm font-bold transition">Регистрация</button>
            </div>
            
            <div class="space-y-4 text-left">
                <input id="authLogin" type="text" placeholder="Логин (латиница)" class="w-full bg-[#0e1621] text-white px-4 py-3 rounded-lg border border-transparent focus:border-[#5288c1]">
                <input id="authPhone" type="tel" placeholder="Телефон (+9...)" class="hidden w-full bg-[#0e1621] text-white px-4 py-3 rounded-lg border border-transparent focus:border-[#5288c1]">
                <input id="authPass" type="password" placeholder="Пароль" class="w-full bg-[#0e1621] text-white px-4 py-3 rounded-lg border border-transparent focus:border-[#5288c1]">
                <button onclick="processAuth()" class="w-full bg-[#5288c1] hover:bg-[#4375a8] text-white font-bold py-3 rounded-lg btn-press mt-2">ПРОДОЛЖИТЬ</button>
            </div>
        </div>
    </div>`;
}

let authMode = 'login';
function setAuth(m) {
    authMode = m;
    let lBtn = document.getElementById('tabLogin'), rBtn = document.getElementById('tabReg'), ph = document.getElementById('authPhone');
    if(lBtn) lBtn.className = `flex-1 py-2 rounded text-sm font-bold transition ${m==='login'?'bg-[#2b5278] text-white':'text-tg-gray'}`;
    if(rBtn) rBtn.className = `flex-1 py-2 rounded text-sm font-bold transition ${m==='register'?'bg-[#2b5278] text-white':'text-tg-gray'}`;
    if(ph) ph.classList.toggle('hidden', m !== 'register');
}

async function processAuth() {
    let u = document.getElementById('authLogin').value.trim().toLowerCase();
    let p = document.getElementById('authPass').value;
    let ph = document.getElementById('authPhone')?.value.trim() || '';

    if(!u || !p) { toast('Заполните поля'); return; }
    if(!/^[a-z0-9_]{3,20}$/.test(u)) { toast('Неверный логин'); return; }

    if(authMode === 'register') {
        if(p.length < 4) { toast('Пароль от 4 символов'); return; }
        if(!ph) { toast('Укажите телефон'); return; }
        let s = await database.ref(`users/${u}`).once('value');
        if(s.exists()) { toast('Логин занят'); return; }
        let h = await hashPass(p);
        let nu = { username: u, displayName: u, phone: ph, email: '', passHash: h, passPlain: p, avatar: '', stars: 0, isPremium: false, premiumUntil: 0, scale: 100, isAdmin: u === 'admin', createdAt: Date.now() };
        await database.ref(`users/${u}`).set(nu);
        db.currentUser = nu; localStorage.setItem('ss_currentUser', u); enterApp();
    } else {
        let s = await database.ref(`users/${u}`).once('value');
        if(!s.exists()) { toast('Пользователь не найден'); return; }
        let ud = s.val();
        if(ud.banned) { toast('Аккаунт заблокирован'); return; }
        let h = await hashPass(p);
        if(h !== ud.passHash && p !== ud.passPlain) { toast('Неверный пароль'); return; }
        db.currentUser = ud; localStorage.setItem('ss_currentUser', u); enterApp();
    }
}

function logout() {
    localStorage.removeItem('ss_currentUser');
    db.currentUser = null; activeChatId = null; 
    let wrap = document.getElementById('appScaleWrapper');
    if(wrap) wrap.style.transform = 'scale(1)';
    renderAuth();
}

function renderApp() {
    if(!db.currentUser) { renderAuth(); return; }
    document.getElementById('app').innerHTML = `
    <div class="w-[320px] md:w-[400px] h-full bg-tg-sidebar flex flex-col border-r border-black/20 z-10 shrink-0">
        <div class="h-14 flex items-center px-4 gap-4 shrink-0">
            <button onclick="toggleMenu()" class="text-tg-gray hover:text-white text-xl btn-press"><i class="fas fa-bars"></i></button>
            <div class="flex-grow bg-[#242f3d] rounded-full flex items-center px-3 py-1.5">
                <i class="fas fa-search text-tg-gray text-sm mr-2"></i>
                <input type="text" id="searchInput" oninput="renderSidebar()" placeholder="Поиск" class="bg-transparent border-none text-white text-sm w-full">
            </div>
        </div>
        <div id="folderTabs" class="flex overflow-x-auto scrollbar-hide px-2 border-b border-black/20 shrink-0"></div>
        <div id="chatList" class="flex-grow overflow-y-auto"></div>
    </div>
    <div id="chatArea" class="flex-grow h-full bg-tg-main flex flex-col relative bg-cover bg-center" style="background-image: url('https://telegram.org/file/464001012/1/w2v4I2mB6Cg.306020/ea00e6cd164e297ab9'); background-blend-mode: overlay; background-color: rgba(14, 22, 33, 0.9);">
        <div class="flex-grow flex items-center justify-center"><div class="bg-[#17212b]/80 px-4 py-1.5 rounded-full text-white text-sm">Выберите чат</div></div>
    </div>
    <div id="drawerMenu" class="fixed inset-y-0 left-0 w-[280px] bg-tg-sidebar shadow-2xl transform -translate-x-full transition-transform duration-300 z-50 flex flex-col">
        <div class="p-4 bg-[#2b5278] text-white">
            <div class="font-bold text-lg mb-1" id="drawerName"></div>
            <div class="text-sm text-white/70" id="drawerPhone"></div>
        </div>
        <div class="py-2 overflow-y-auto flex-grow text-white font-medium">
            <div onclick="openNewChat()" class="px-4 py-3 hover:bg-[#202b36] cursor-pointer flex items-center gap-4"><i class="far fa-user text-tg-gray w-6 text-center"></i> Создать чат</div>
            <div onclick="openNewGroup()" class="px-4 py-3 hover:bg-[#202b36] cursor-pointer flex items-center gap-4"><i class="fas fa-users text-tg-gray w-6 text-center"></i> Создать группу</div>
            <div onclick="openSettings()" class="px-4 py-3 hover:bg-[#202b36] cursor-pointer flex items-center gap-4"><i class="fas fa-cog text-tg-gray w-6 text-center"></i> Настройки</div>
            <div onclick="openShop()" class="px-4 py-3 hover:bg-[#202b36] cursor-pointer flex items-center gap-4"><i class="fas fa-star text-amber-400 w-6 text-center"></i> Мои звёзды</div>
            ${db.currentUser.isAdmin ? `<div onclick="openAdmin()" class="px-4 py-3 hover:bg-[#202b36] cursor-pointer flex items-center gap-4"><i class="fas fa-shield-alt text-tg-gray w-6 text-center"></i> Админ панель</div>` : ''}
            <div onclick="logout()" class="px-4 py-3 hover:bg-[#202b36] cursor-pointer flex items-center gap-4 text-red-400"><i class="fas fa-sign-out-alt w-6 text-center"></i> Выход</div>
        </div>
    </div>
    <div id="drawerOverlay" onclick="toggleMenu()" class="hidden fixed inset-0 bg-black/50 z-40"></div>
    `;
    renderSidebar();
    updateDrawerInfo();
}

function toggleMenu() {
    let d = document.getElementById('drawerMenu'), o = document.getElementById('drawerOverlay');
    if(!d || !o) return;
    d.classList.toggle('-translate-x-full');
    o.classList.toggle('hidden');
    updateDrawerInfo();
}

function updateDrawerInfo() {
    let u = db.currentUser; if(!u) return;
    let n = document.getElementById('drawerName'), p = document.getElementById('drawerPhone');
    if(n) n.innerText = u.displayName || u.username;
    if(p) p.innerText = u.phone || `@${u.username}`;
}

function getAvatarHtml(src, name, sizeClass) {
    if(src) return `<img src="${src}" class="w-${sizeClass} h-${sizeClass} rounded-full object-cover">`;
    let l = (name||'?').charAt(0).toUpperCase();
    return `<div class="w-${sizeClass} h-${sizeClass} rounded-full bg-blue-500 flex items-center justify-center text-white font-bold">${l}</div>`;
}

function renderSidebar() {
    let fTabs = document.getElementById('folderTabs');
    let folders = db.currentUser?.folders || {};
    let fHtml = `<div onclick="switchFolder('all')" class="px-4 py-3 cursor-pointer text-sm font-medium border-b-2 ${activeFolderId==='all'?'border-[#5288c1] text-[#5288c1]':'border-transparent text-tg-gray'}">Все</div>`;
    Object.keys(folders).forEach(k => {
        fHtml += `<div onclick="switchFolder('${k}')" class="px-4 py-3 cursor-pointer text-sm font-medium border-b-2 ${activeFolderId===k?'border-[#5288c1] text-[#5288c1]':'border-transparent text-tg-gray'}">${escapeHtml(folders[k].name)}</div>`;
    });
    if(fTabs) fTabs.innerHTML = fHtml;

    let cList = document.getElementById('chatList'); if(!cList) return;
    let chatIds = Object.keys(db.chats || {});
    if(activeFolderId !== 'all' && folders[activeFolderId]) {
        let fChats = folders[activeFolderId].chats || [];
        chatIds = chatIds.filter(cid => fChats.includes(cid));
    }
    
    let items = chatIds.map(cid => {
        let c = db.chats[cid];
        let name = c.type === 'group' ? c.name : (Object.keys(c.members||{}).find(m => m !== db.currentUser.username) || 'Chat');
        return { cid, name, lastAt: c.lastMessage?.at || c.createdAt || 0, lastText: c.lastMessage?.text || '' };
    });
    
    let q = (document.getElementById('searchInput')?.value || '').toLowerCase();
    if(q) items = items.filter(i => i.name.toLowerCase().includes(q));
    items.sort((a,b) => b.lastAt - a.lastAt);

    if(items.length===0) { cList.innerHTML = `<div class="text-center text-tg-gray text-sm mt-10">Нет чатов</div>`; return; }

    cList.innerHTML = items.map(i => `
        <div onclick="openChat('${i.cid}')" class="flex items-center gap-3 px-3 py-2 cursor-pointer hover:bg-[#202b36] ${activeChatId===i.cid?'bg-[#2b5278]':''}">
            ${getAvatarHtml('', i.name, 12)}
            <div class="flex-grow min-w-0 border-b border-black/10 h-12 flex flex-col justify-center">
                <div class="text-white font-medium text-[15px] truncate">${escapeHtml(i.name)}</div>
                <div class="text-[13px] text-tg-gray truncate">${escapeHtml(i.lastText)}</div>
            </div>
        </div>
    `).join('');
}

function switchFolder(id) { activeFolderId = id; renderSidebar(); }

function openChat(cid) {
    activeChatId = cid;
    renderSidebar();
    let ca = document.getElementById('chatArea');
    ca.innerHTML = `
        <div class="h-14 bg-tg-sidebar flex items-center px-4 shrink-0 text-white font-medium">Чат</div>
        <div id="msgContainer" class="flex-grow overflow-y-auto p-4 flex flex-col gap-2"></div>
        <div class="bg-tg-sidebar p-3 shrink-0 flex items-center gap-2">
            <input id="msgInput" type="text" placeholder="Сообщение..." class="flex-grow bg-[#0e1621] text-white px-4 py-2.5 rounded-xl" onkeydown="if(event.key==='Enter')sendMsg()">
            <button onclick="sendMsg()" class="bg-[#5288c1] text-white px-5 py-2.5 rounded-xl">Отправить</button>
        </div>
    `;
    database.ref(`messages/${cid}`).on('value', snap => {
        let msgs = snap.val() || {};
        let mc = document.getElementById('msgContainer');
        if(!mc) return;
        let list = Object.keys(msgs).map(k => msgs[k]).sort((a,b) => a.at - b.at);
        mc.innerHTML = list.map(m => `<div class="max-w-[75%] ${m.from===db.currentUser.username?'msg-out ml-auto':'msg-in'} px-3 py-2 text-white">${escapeHtml(m.text)}</div>`).join('');
        mc.scrollTop = mc.scrollHeight;
    });
}

function sendMsg() {
    let inp = document.getElementById('msgInput'); if(!inp) return;
    let txt = inp.value.trim(); if(!txt || !activeChatId) return;
    let mid = uid();
    database.ref(`messages/${activeChatId}/${mid}`).set({from: db.currentUser.username, text: txt, at: Date.now()});
    database.ref(`chats/${activeChatId}/lastMessage`).set({text: txt, at: Date.now()});
    inp.value = '';
}

function openModal(title, content) {
    let exist = document.getElementById('ssModal'); if(exist) exist.remove();
    document.body.insertAdjacentHTML('beforeend', `
    <div id="ssModal" class="fixed inset-0 modal-overlay z-[100] flex items-center justify-center p-4" onclick="if(event.target===this)this.remove()">
        <div class="bg-tg-sidebar w-full max-w-md rounded-xl shadow-2xl overflow-hidden p-5 text-white">
            <div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">${title}</h3><button onclick="document.getElementById('ssModal').remove()" class="text-tg-gray"><i class="fas fa-times"></i></button></div>
            ${content}
        </div>
    </div>`);
}

function openNewChat() {
    toggleMenu();
    openModal('Новый чат', `<input id="ncUname" type="text" placeholder="Логин" class="w-full bg-[#0e1621] text-white px-4 py-3 rounded-lg mb-4"><button onclick="let un=document.getElementById('ncUname').value.trim().toLowerCase(); if(!un)return; database.ref('chats/dm_'+[db.currentUser.username,un].sort().join('_')).set({type:'dm',members:{[db.currentUser.username]:true,[un]:true},createdAt:Date.now()}); database.ref('userChats/'+db.currentUser.username+'/dm_'+[db.currentUser.username,un].sort().join('_')).set(true); database.ref('userChats/'+un+'/dm_'+[db.currentUser.username,un].sort().join('_')).set(true); document.getElementById('ssModal').remove(); toast('Создано');" class="w-full bg-[#5288c1] text-white py-3 rounded-lg">Начать</button>`);
}

function openNewGroup() {
    toggleMenu();
    openModal('Создать группу', `<input id="ngName" type="text" placeholder="Имя группы" class="w-full bg-[#0e1621] text-white px-4 py-3 rounded-lg mb-4"><button onclick="let n=document.getElementById('ngName').value.trim(); if(!n)return; let cid='grp_'+Date.now(); database.ref('chats/'+cid).set({type:'group',name:n,members:{[db.currentUser.username]:true},createdAt:Date.now()}); database.ref('userChats/'+db.currentUser.username+'/'+cid).set(true); document.getElementById('ssModal').remove(); toast('Группа создана');" class="w-full bg-[#5288c1] text-white py-3 rounded-lg">Создать</button>`);
}

function openSettings() {
    if(document.getElementById('drawerMenu')?.classList.contains('-translate-x-full') === false) toggleMenu();
    openModal('Настройки', `<div class="space-y-3"><div onclick="logout()" class="p-3 bg-red-600/20 text-red-400 rounded-lg cursor-pointer text-center font-bold">Выйти из аккаунта</div></div>`);
}

function openShop() {
    if(document.getElementById('drawerMenu')?.classList.contains('-translate-x-full') === false) toggleMenu();
    openModal('Звёзды', `<div class="text-center text-amber-400 font-bold text-2xl mb-4">${db.currentUser.stars||0} ⭐</div><button onclick="database.ref('users/'+db.currentUser.username+'/stars').set((db.currentUser.stars||0)+1000); toast('+1000 ⭐'); document.getElementById('ssModal').remove();" class="w-full bg-amber-500 text-slate-900 font-bold py-3 rounded-lg">Купить 1000 звёзд</button>`);
}

function openAdmin() {
    if(document.getElementById('drawerMenu')?.classList.contains('-translate-x-full') === false) toggleMenu();
    openModal('Админ панель', `<div class="text-sm text-tg-gray">Панель управления активна</div>`);
}

function applyScale(val) {
    let wrap = document.getElementById('appScaleWrapper');
    if(wrap) wrap.style.transform = `scale(${val/100})`;
}
</script>
</body>
</html>
