<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SixSeven</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%235288c1%22/><text x=%2250%22 y=%2266%22 font-size=%2242%22 font-family=%22Arial,sans-serif%22 font-weight=%22900%22 fill=%22white%22 text-anchor=%22middle%22>67</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    * { font-family: 'Roboto', sans-serif; box-sizing: border-box; }
    body { background-color: #0e1621; color: #f5f5f5; margin: 0; overflow: hidden; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #2b3a4a; border-radius: 2px; }
    ::-webkit-scrollbar-track { background: transparent; }
    
    .bg-tg-main { background-color: #0e1621; }
    .bg-tg-sidebar { background-color: #17212b; }
    .bg-tg-active { background-color: #2b5278; }
    .bg-tg-hover:hover { background-color: #202b36; }
    .text-tg-blue { color: #5288c1; }
    .text-tg-gray { color: #7fa1c3; }
    
    .msg-out { background-color: #2b5278; border-radius: 12px 12px 0 12px; }
    .msg-in { background-color: #182533; border-radius: 12px 12px 12px 0; }
    
    .btn-press { transition: transform 0.1s; }
    .btn-press:active { transform: scale(0.97); }
    .fade-in { animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
    input, textarea, select { outline: none; }
    
    .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider-toggle { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #0e1621; transition: .3s; border-radius: 20px; border: 2px solid #5288c1; }
    .slider-toggle:before { position: absolute; content: ""; height: 10px; width: 10px; left: 2px; bottom: 2px; background-color: #5288c1; transition: .3s; border-radius: 50%; }
    input:checked + .slider-toggle { background-color: #5288c1; }
    input:checked + .slider-toggle:before { background-color: #fff; transform: translateX(16px); }

    .modal-overlay { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(2px); }
</style>
</head>
<body>

<div id="appScaleWrapper" style="transform-origin: top left; width: 100vw; height: 100vh; overflow: hidden; transition: transform 0.2s;">
    <div id="app" class="h-full w-full flex"></div>
</div>

<div id="toast" class="hidden fixed bottom-10 left-1/2 -translate-x-1/2 bg-[#303e4d] text-white text-sm px-4 py-2 rounded-full shadow-lg z-[9999] fade-in"></div>

<input type="file" id="hiddenFileInput" class="hidden" accept="image/*,application/pdf,.zip,.rar">
<input type="file" id="hiddenAvatarInput" class="hidden" accept="image/*">

<script>
// Firebase Init
const firebaseConfig = { apiKey: "AIzaSyCm5Ikh0OV1bP2fbep-7Kg7rcuNN4PujRY", authDomain: "sixseven-67001.firebaseapp.com", databaseURL: "https://sixseven-67001-default-rtdb.firebaseio.com", projectId: "sixseven-67001", storageBucket: "sixseven-67001.firebasestorage.app", messagingSenderId: "652602968843", appId: "1:652602968843:web:17dadd54f0f5bd6255b00e" };
let database;
try { firebase.initializeApp(firebaseConfig); database = firebase.database(); } 
catch(e) { console.error(e); database = { ref: () => ({ on:()=>{}, off:()=>{}, once:()=>Promise.resolve({exists:()=>false,val:()=>null}), set:()=>Promise.resolve(), remove:()=>Promise.resolve() }) }; }

let db = { currentUser: null, users: {}, chats: {}, reports: {}, templates: {}, items: {} };
let activeChatId = null;
let activeFolderId = 'all';
let view = 'auth';

// Utility
function toast(m){ let t=document.getElementById('toast'); t.innerText=m; t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'), 2500); }
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return 'id_'+Date.now()+'_'+Math.random().toString(36).substr(2,6); }
async function hashPass(txt){ const msg = new TextEncoder().encode(txt); const hash = await crypto.subtle.digest('SHA-256', msg); return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join(''); }
function timeFormat(ts){ let d = new Date(ts); return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }
function fileToBase64(file){ return new Promise((res,rej) => { let r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }

// Bootstrap
window.onload = function() {
    let saved = localStorage.getItem('ss_currentUser');
    if(saved) {
        // Optimistic UI load
        db.currentUser = { username: saved };
        renderApp();
        database.ref(`users/${saved}`).once('value').then(snap => {
            if(snap.exists()){
                let u = snap.val();
                if(u.banned) { logout(); toast('Аккаунт заблокирован'); return; }
                db.currentUser = u;
                applyScale(u.scale || 100);
                startListeners();
                renderApp();
            } else logout();
        }).catch(() => { toast('Оффлайн режим'); startListeners(); renderApp(); });
    } else {
        renderAuth();
    }
};

function startListeners() {
    database.ref('users').on('value', snap => { db.users = snap.val()||{}; renderSidebar(); });
    database.ref(`userChats/${db.currentUser.username}`).on('value', snap => {
        let cids = Object.keys(snap.val()||{});
        cids.forEach(cid => {
            if(!db.chats[cid]) database.ref(`chats/${cid}`).on('value', cs => {
                if(cs.exists()) { db.chats[cid] = cs.val(); renderSidebar(); if(activeChatId===cid) renderChatHeader(); }
                else delete db.chats[cid];
            });
        });
        renderSidebar();
    });
    database.ref('reports').on('value', snap => { db.reports = snap.val()||{}; });
    database.ref('templates').on('value', snap => { db.templates = snap.val()||{}; });
}

// Render Authentication
function renderAuth() {
    view = 'auth';
    document.getElementById('app').innerHTML = `
    <div class="w-full h-full bg-tg-main flex items-center justify-center p-4">
        <div class="bg-tg-sidebar w-full max-w-md p-8 rounded-xl shadow-2xl fade-in text-center">
            <div class="w-20 h-20 bg-blue-500 rounded-full mx-auto flex items-center justify-center mb-6 shadow-lg">
                <i class="fas fa-paper-plane text-white text-3xl ml-1 mt-1"></i>
            </div>
            <h1 class="text-2xl font-bold text-white mb-2">SixSeven</h1>
            <p class="text-tg-gray text-sm mb-6">Пожалуйста, войдите или зарегистрируйтесь</p>
            
            <div class="flex bg-[#0e1621] rounded-lg p-1 mb-6">
                <button id="tabLogin" onclick="setAuth('login')" class="flex-1 py-2 rounded bg-[#2b5278] text-white text-sm font-bold transition">Вход</button>
                <button id="tabReg" onclick="setAuth('register')" class="flex-1 py-2 rounded text-tg-gray text-sm font-bold transition">Регистрация</button>
            </div>
            
            <div class="space-y-4 text-left">
                <input id="authLogin" type="text" placeholder="Имя пользователя (только латиница)" class="w-full bg-[#0e1621] text-white px-4 py-3 rounded-lg border border-transparent focus:border-[#5288c1]">
                <input id="authPhone" type="tel" placeholder="Номер телефона (+998...)" class="hidden w-full bg-[#0e1621] text-white px-4 py-3 rounded-lg border border-transparent focus:border-[#5288c1]">
                <input id="authPass" type="password" placeholder="Пароль" class="w-full bg-[#0e1621] text-white px-4 py-3 rounded-lg border border-transparent focus:border-[#5288c1]">
                <button onclick="processAuth()" class="w-full bg-[#5288c1] hover:bg-[#4375a8] text-white font-bold py-3 rounded-lg btn-press mt-2">ПРОДОЛЖИТЬ</button>
            </div>
        </div>
    </div>`;
}

let authMode = 'login';
function setAuth(m) {
    authMode = m;
    document.getElementById('tabLogin').className = `flex-1 py-2 rounded text-sm font-bold transition ${m==='login'?'bg-[#2b5278] text-white':'text-tg-gray'}`;
    document.getElementById('tabReg').className = `flex-1 py-2 rounded text-sm font-bold transition ${m==='register'?'bg-[#2b5278] text-white':'text-tg-gray'}`;
    document.getElementById('authPhone').classList.toggle('hidden', m !== 'register');
}

async function processAuth() {
    let u = document.getElementById('authLogin').value.trim().toLowerCase();
    let p = document.getElementById('authPass').value;
    let ph = document.getElementById('authPhone').value.trim();

    if(!u || !p) { toast('Заполните поля'); return; }
    if(!/^[a-z0-9_]{3,20}$/.test(u)) { toast('Неверный формат логина'); return; }

    if(authMode === 'register') {
        if(p.length < 4) { toast('Пароль от 4 символов'); return; }
        if(!ph) { toast('Укажите телефон'); return; }
        let s = await database.ref(`users/${u}`).once('value');
        if(s.exists()) { toast('Логин занят'); return; }
        let h = await hashPass(p);
        let nu = { username: u, displayName: u, phone: ph, passHash: h, passPlain: p, stars: 0, isPremium: false, premiumUntil: 0, scale: 100, isAdmin: u === ADMIN_LOGIN, createdAt: Date.now() };
        await database.ref(`users/${u}`).set(nu);
        db.currentUser = nu; localStorage.setItem('ss_currentUser', u); enterApp();
    } else {
        let s = await database.ref(`users/${u}`).once('value');
        if(!s.exists()) { toast('Пользователь не найден'); return; }
        let ud = s.val();
        if(ud.banned) { toast('Аккаунт заблокирован'); return; }
        let h = await hashPass(p);
        if(h !== ud.passHash && p !== ud.passPlain) { toast('Неверный пароль'); return; }
        db.currentUser = ud; localStorage.setItem('ss_currentUser', u); enterApp();
    }
}

function logout() {
    localStorage.removeItem('ss_currentUser');
    db.currentUser = null; activeChatId = null; 
    document.getElementById('appScaleWrapper').style.transform = 'scale(1)';
    renderAuth();
}

// ===================== APP SHELL (TG LAYOUT) =====================
function renderApp() {
    view = 'chats';
    document.getElementById('app').innerHTML = `
    <!-- Sidebar -->
    <div class="w-[320px] md:w-[400px] h-full bg-tg-sidebar flex flex-col border-r border-black/20 z-10 shrink-0">
        <!-- Header -->
        <div class="h-14 flex items-center px-4 gap-4 shrink-0">
            <button onclick="toggleMenu()" class="text-tg-gray hover:text-white text-xl btn-press"><i class="fas fa-bars"></i></button>
            <div class="flex-grow bg-[#242f3d] rounded-full flex items-center px-3 py-1.5">
                <i class="fas fa-search text-tg-gray text-sm mr-2"></i>
                <input type="text" id="searchInput" oninput="filterChats()" placeholder="Поиск" class="bg-transparent border-none text-white text-sm w-full">
            </div>
        </div>
        <!-- Folders -->
        <div id="folderTabs" class="flex overflow-x-auto scrollbar-hide px-2 border-b border-black/20 shrink-0"></div>
        <!-- Chat List -->
        <div id="chatList" class="flex-grow overflow-y-auto"></div>
    </div>
    
    <!-- Main Chat Area -->
    <div id="chatArea" class="flex-grow h-full bg-tg-main flex flex-col relative bg-cover bg-center" style="background-image: url('https://telegram.org/file/464001012/1/w2v4I2mB6Cg.306020/ea00e6cd164e297ab9'); background-blend-mode: overlay; background-color: rgba(14, 22, 33, 0.9);">
        <div class="flex-grow flex items-center justify-center"><div class="bg-[#17212b]/80 px-4 py-1.5 rounded-full text-white text-sm">Выберите чат</div></div>
    </div>
    
    <!-- Drawer Menu -->
    <div id="drawerMenu" class="fixed inset-y-0 left-0 w-[280px] bg-tg-sidebar shadow-2xl transform -translate-x-full transition-transform duration-300 z-50 flex flex-col">
        <div class="p-4 bg-[#2b5278] text-white cursor-pointer" onclick="openSettings()">
            <div class="flex justify-between items-start mb-4">
                <div id="drawerAvatar"></div>
                <button onclick="toggleMenu()" class="text-white/70 hover:text-white"><i class="fas fa-moon"></i></button>
            </div>
            <div class="font-bold" id="drawerName"></div>
            <div class="text-sm text-white/70" id="drawerPhone"></div>
        </div>
        <div class="py-2 overflow-y-auto flex-grow text-white font-medium">
            <div onclick="openNewChat()" class="px-4 py-3 hover:bg-[#202b36] cursor-pointer flex items-center gap-4 btn-press"><i class="far fa-user text-tg-gray text-lg w-6 text-center"></i> Создать чат</div>
            <div onclick="openNewGroup()" class="px-4 py-3 hover:bg-[#202b36] cursor-pointer flex items-center gap-4 btn-press"><i class="fas fa-users text-tg-gray text-lg w-6 text-center"></i> Создать группу</div>
            <div onclick="openSettings()" class="px-4 py-3 hover:bg-[#202b36] cursor-pointer flex items-center gap-4 btn-press"><i class="fas fa-cog text-tg-gray text-lg w-6 text-center"></i> Настройки</div>
            <div onclick="openShop()" class="px-4 py-3 hover:bg-[#202b36] cursor-pointer flex items-center gap-4 btn-press"><i class="fas fa-star text-amber-400 text-lg w-6 text-center"></i> Мои звёзды</div>
            ${db.currentUser.isAdmin ? `<div onclick="openAdmin()" class="px-4 py-3 hover:bg-[#202b36] cursor-pointer flex items-center gap-4 btn-press"><i class="fas fa-shield-alt text-tg-gray text-lg w-6 text-center"></i> Админ панель</div>` : ''}
            <div onclick="logout()" class="px-4 py-3 hover:bg-[#202b36] cursor-pointer flex items-center gap-4 btn-press text-red-400"><i class="fas fa-sign-out-alt text-red-400 text-lg w-6 text-center"></i> Выход</div>
        </div>
    </div>
    <div id="drawerOverlay" onclick="toggleMenu()" class="hidden fixed inset-0 bg-black/50 z-40"></div>
    `;
    renderSidebar();
    updateDrawerInfo();
}

function toggleMenu() {
    let d = document.getElementById('drawerMenu');
    let o = document.getElementById('drawerOverlay');
    if(d.classList.contains('-translate-x-full')) {
        d.classList.remove('-translate-x-full'); o.classList.remove('hidden'); updateDrawerInfo();
    } else {
        d.classList.add('-translate-x-full'); o.classList.add('hidden');
    }
}

function updateDrawerInfo() {
    let u = db.currentUser;
    if(!u) return;
    document.getElementById('drawerName').innerHTML = escapeHtml(u.displayName || u.username) + (isPrem(u)?' <i class="fas fa-star text-amber-400 text-[10px]"></i>':'');
    document.getElementById('drawerPhone').innerText = u.phone || `@${u.username}`;
    document.getElementById('drawerAvatar').innerHTML = getAvatarHtml(u.avatar, u.displayName||u.username, 12, 'text-xl');
}

function getAvatarHtml(src, name, sizeClass, textClass) {
    if(src) return `<img src="${src}" class="w-${sizeClass} h-${sizeClass} rounded-full object-cover">`;
    let l = (name||'?').charAt(0).toUpperCase();
    return `<div class="w-${sizeClass} h-${sizeClass} rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white font-bold ${textClass}">${l}</div>`;
}

function renderSidebar() {
    if(view !== 'chats') return;
    // Folders
    let fTabs = document.getElementById('folderTabs');
    let folders = db.currentUser.folders || {};
    let fHtml = `<div onclick="switchFolder('all')" class="px-4 py-3 cursor-pointer text-sm font-medium border-b-2 ${activeFolderId==='all'?'border-[#5288c1] text-[#5288c1]':'border-transparent text-tg-gray hover:bg-[#202b36]'}">Все чаты</div>`;
    Object.keys(folders).forEach(k => {
        fHtml += `<div onclick="switchFolder('${k}')" class="px-4 py-3 cursor-pointer text-sm font-medium border-b-2 ${activeFolderId===k?'border-[#5288c1] text-[#5288c1]':'border-transparent text-tg-gray hover:bg-[#202b36]'}">${escapeHtml(folders[k].name)}</div>`;
    });
    if(fTabs) fTabs.innerHTML = fHtml;

    // Chats
    let cList = document.getElementById('chatList');
    if(!cList) return;
    let chatIds = Object.keys(db.chats);
    if(activeFolderId !== 'all' && folders[activeFolderId]) {
        let fChats = folders[activeFolderId].chats || [];
        chatIds = chatIds.filter(cid => fChats.includes(cid));
    }
    
    let items = chatIds.map(cid => {
        let c = db.chats[cid];
        let isGroup = c.type === 'group';
        let name = 'Unknown'; let avatar = ''; let prem = false;
        if(isGroup) { name = c.name; avatar = c.avatar; }
        else {
            let ou = Object.keys(c.members).find(m => m !== db.currentUser.username);
            let u = db.users[ou] || {};
            name = u.displayName || ou || '?'; avatar = u.avatar; prem = isPrem(u);
        }
        let lm = c.lastMessage;
        return { cid, name, avatar, prem, lastAt: lm?lm.at:(c.createdAt||0), lastText: lm?(lm.fileType?'📎 Файл':lm.text):'' };
    });
    
    let q = (document.getElementById('searchInput')?.value || '').toLowerCase();
    if(q) items = items.filter(i => i.name.toLowerCase().includes(q));

    items.sort((a,b) => b.lastAt - a.lastAt);

    if(items.length===0) { cList.innerHTML = `<div class="text-center text-tg-gray text-sm mt-10">Ничего не найдено</div>`; return; }

    cList.innerHTML = items.map(i => `
        <div onclick="openChat('${i.cid}')" class="flex items-center gap-3 px-3 py-2 cursor-pointer btn-press ${activeChatId===i.cid?'bg-[#2b5278]':'hover:bg-[#202b36]'}">
            ${getAvatarHtml(i.avatar, i.name, 12, 'text-lg')}
            <div class="flex-grow min-w-0 flex flex-col justify-center h-12 border-b border-black/10">
                <div class="flex justify-between items-center">
                    <div class="text-white font-medium text-[15px] truncate flex items-center gap-1">${escapeHtml(i.name)} ${i.prem?'<i class="fas fa-star text-amber-400 text-[10px]"></i>':''}</div>
                    ${i.lastAt ? `<div class="text-[11px] ${activeChatId===i.cid?'text-white/70':'text-tg-gray'} shrink-0">${timeFormat(i.lastAt)}</div>` : ''}
                </div>
                <div class="text-[13px] ${activeChatId===i.cid?'text-white':'text-tg-gray'} truncate">${escapeHtml(i.lastText)}</div>
            </div>
        </div>
    `).join('');
}

function switchFolder(id) { activeFolderId = id; renderSidebar(); }
function filterChats() { renderSidebar(); }

// ===================== CHAT WINDOW =====================
let currentChatListener = null;
function openChat(cid) {
    if(currentChatListener && activeChatId) { database.ref(`messages/${activeChatId}`).off('value', currentChatListener); }
    activeChatId = cid;
    renderSidebar();
    renderChatHeader();
    
    currentChatListener = snap => { renderChatMessages(snap.val()||{}); };
    database.ref(`messages/${cid}`).on('value', currentChatListener);
}

function renderChatHeader() {
    let ca = document.getElementById('chatArea');
    if(!activeChatId || !db.chats[activeChatId]) return;
    let c = db.chats[activeChatId];
    let isG = c.type === 'group';
    let name = c.name; let sub = Object.keys(c.members).length + ' участников'; let av = c.avatar;
    if(!isG) {
        let ou = Object.keys(c.members).find(m => m !== db.currentUser.username);
        let u = db.users[ou] || {};
        name = u.displayName || ou; sub = u.banned ? 'Заблокирован' : 'был(а) недавно'; av = u.avatar;
    }
    
    ca.innerHTML = `
        <!-- Header -->
        <div class="h-14 bg-tg-sidebar flex items-center justify-between px-4 shrink-0 shadow-sm z-10 cursor-pointer" onclick="${isG?'openGroupInfo()':''}">
            <div class="flex items-center gap-3 min-w-0">
                ${getAvatarHtml(av, name, 10, 'text-sm')}
                <div class="flex flex-col">
                    <span class="text-white font-medium text-[15px] truncate">${escapeHtml(name)}</span>
                    <span class="text-tg-blue text-xs truncate">${sub}</span>
                </div>
            </div>
            <div class="flex gap-4 text-tg-gray text-lg">
                <i class="fas fa-search hover:text-white cursor-pointer transition"></i>
                <i class="fas fa-ellipsis-v hover:text-white cursor-pointer transition px-2"></i>
            </div>
        </div>
        <!-- Messages -->
        <div id="msgContainer" class="flex-grow overflow-y-auto p-4 flex flex-col gap-2"></div>
        <!-- Input -->
        <div class="bg-tg-sidebar p-3 shrink-0 flex items-end gap-3 z-10">
            <button onclick="document.getElementById('hiddenFileInput').click()" class="text-tg-gray hover:text-white text-2xl p-2 shrink-0 btn-press"><i class="fas fa-paperclip"></i></button>
            <textarea id="msgInput" rows="1" placeholder="Написать сообщение..." class="flex-grow bg-[#0e1621] text-white text-[15px] rounded-xl px-4 py-3 resize-none max-h-32 focus:ring-1 focus:ring-[#5288c1] transition" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
            <button onclick="sendMsg()" class="w-12 h-12 rounded-full bg-[#5288c1] hover:bg-[#4375a8] text-white flex items-center justify-center text-xl shrink-0 btn-press"><i class="fas fa-paper-plane mr-1"></i></button>
        </div>
    `;
}

function renderChatMessages(msgs) {
    let mc = document.getElementById('msgContainer');
    if(!mc) return;
    let list = Object.keys(msgs).map(k => ({_id:k, ...msgs[k]})).sort((a,b) => a.at - b.at);
    let isG = db.chats[activeChatId]?.type === 'group';
    
    mc.innerHTML = list.map(m => {
        let mine = m.from === db.currentUser.username;
        let cnt = '';
        if(m.fileType?.startsWith('image/')) cnt = `<img src="${m.fileData}" class="max-w-[260px] rounded-lg mb-1 cursor-pointer">`;
        else if(m.fileType) cnt = `<a href="${m.fileData}" download="${escapeHtml(m.fileName)}" class="flex items-center gap-3 bg-black/20 p-2 rounded-lg text-white"><div class="w-10 h-10 bg-[#5288c1] rounded-full flex items-center justify-center"><i class="fas fa-arrow-down"></i></div><div class="truncate max-w-[180px] text-sm">${escapeHtml(m.fileName)}</div></a>`;
        if(m.text) cnt += `<div class="text-[15px] text-white whitespace-pre-wrap break-words mt-1">${escapeHtml(m.text)}</div>`;
        
        let reportBtn = !mine ? `<button onclick="reportMsg('${m._id}')" class="absolute -left-6 top-1/2 -translate-y-1/2 text-tg-gray hover:text-red-400 opacity-0 group-hover:opacity-100 transition"><i class="fas fa-exclamation-triangle"></i></button>` : '';

        return `
        <div class="flex ${mine?'justify-end':'justify-start'} group relative">
            <div class="relative max-w-[75%] shadow-sm ${mine?'msg-out':'msg-in'} px-3 py-1.5 flex flex-col">
                ${!mine && isG ? `<div class="text-[#5288c1] font-medium text-xs mb-0.5 cursor-pointer">${escapeHtml(m.from)}</div>` : ''}
                ${reportBtn}
                <div>${cnt}</div>
                <div class="text-[10px] ${mine?'text-blue-200':'text-tg-gray'} text-right mt-1 ml-4 float-right flex items-center gap-1">
                    ${timeFormat(m.at)}
                    ${mine?'<i class="fas fa-check-double text-[10px]"></i>':''}
                </div>
            </div>
        </div>`;
    }).join('');
    mc.scrollTop = mc.scrollHeight;
}

function sendMsg() {
    let inp = document.getElementById('msgInput');
    let txt = inp.value.trim();
    if(!txt || !activeChatId) return;
    let mid = uid();
    database.ref(`messages/${activeChatId}/${mid}`).set({from: db.currentUser.username, text: txt, at: Date.now()});
    database.ref(`chats/${activeChatId}/lastMessage`).set({text: txt, at: Date.now()});
    inp.value = '';
}

document.getElementById('hiddenFileInput').addEventListener('change', async e => {
    let file = e.target.files[0]; if(!file || !activeChatId) return;
    if(file.size > MAX_FILE_SIZE) { toast('Файл больше 1.2MB'); e.target.value=''; return; }
    let b64 = await fileToBase64(file); let mid = uid();
    database.ref(`messages/${activeChatId}/${mid}`).set({from: db.currentUser.username, fileData: b64, fileType: file.type, fileName: file.name, at: Date.now()});
    database.ref(`chats/${activeChatId}/lastMessage`).set({text: 'Файл', fileType: file.type, at: Date.now()});
    e.target.value='';
});

// ===================== MODALS (CREATION) =====================
function openModal(title, content) {
    let exist = document.getElementById('ssModal'); if(exist) exist.remove();
    document.body.insertAdjacentHTML('beforeend', `
    <div id="ssModal" class="fixed inset-0 modal-overlay z-[100] flex items-center justify-center p-4 fade-in" onclick="if(event.target===this)this.remove()">
        <div class="bg-tg-sidebar w-full max-w-md rounded-xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="px-5 py-4 flex justify-between items-center border-b border-black/20">
                <h3 class="text-white font-medium text-lg">${title}</h3>
                <button onclick="document.getElementById('ssModal').remove()" class="text-tg-gray hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-5 overflow-y-auto flex-grow">${content}</div>
        </div>
    </div>`);
}
function closeModal() { let m = document.getElementById('ssModal'); if(m) m.remove(); }

function openNewChat() {
    toggleMenu();
    openModal('Новый чат', `
        <input id="ncUname" type="text" placeholder="Введите логин пользователя" class="w-full bg-[#0e1621] text-white px-4 py-3 rounded-lg border-b-2 border-transparent focus:border-[#5288c1] mb-4">
        <button onclick="createChat()" class="w-full bg-[#5288c1] hover:bg-[#4375a8] text-white font-medium py-3 rounded-lg btn-press">Начать</button>
    `);
}
async function createChat() {
    let un = document.getElementById('ncUname').value.trim().toLowerCase();
    if(!un || un === db.currentUser.username) { toast('Неверный логин'); return; }
    let s = await database.ref(`users/${un}`).once('value');
    if(!s.exists()) { toast('Пользователь не найден'); return; }
    let cid = 'dm_' + [db.currentUser.username, un].sort().join('_');
    let e = await database.ref(`chats/${cid}`).once('value');
    if(!e.exists()) {
        await database.ref(`chats/${cid}`).set({type:'dm', members:{[db.currentUser.username]:true, [un]:true}, createdAt:Date.now()});
        await database.ref(`userChats/${db.currentUser.username}/${cid}`).set(true);
        await database.ref(`userChats/${un}/${cid}`).set(true);
    }
    closeModal(); openChat(cid);
}

function openNewGroup() {
    toggleMenu();
    openModal('Создать группу', `
        <input id="ngName" type="text" placeholder="Имя группы" class="w-full bg-[#0e1621] text-white px-4 py-3 rounded-lg mb-3">
        <input id="ngUsers" type="text" placeholder="Логины участников (через запятую)" class="w-full bg-[#0e1621] text-white px-4 py-3 rounded-lg mb-4">
        <button onclick="createGrp()" class="w-full bg-[#5288c1] hover:bg-[#4375a8] text-white font-medium py-3 rounded-lg btn-press">Создать</button>
    `);
}
async function createGrp() {
    let name = document.getElementById('ngName').value.trim();
    let uns = document.getElementById('ngUsers').value.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
    if(!name) { toast('Введите имя'); return; }
    let mem = { [db.currentUser.username]: true };
    for(let u of uns) { if(u !== db.currentUser.username) { let s = await database.ref(`users/${u}`).once('value'); if(s.exists()) mem[u]=true; } }
    let cid = 'grp_'+uid();
    await database.ref(`chats/${cid}`).set({type:'group', name:name, members:mem, createdAt:Date.now(), createdBy:db.currentUser.username});
    for(let m of Object.keys(mem)) await database.ref(`userChats/${m}/${cid}`).set(true);
    closeModal(); openChat(cid); toast('Группа создана');
}

        </div>

        </div>

}

document.getElementById('hiddenAvatarInput').addEventListener('change', async e => {
    let f = e.target.files[0]; if(!f) return;
    if(f.size>MAX_FILE_SIZE){toast('Файл большой');return;}
    let b = await fileToBase64(f);
    await database.ref(`users/${db.currentUser.username}/avatar`).set(b);
    toast('Аватар обновлен'); e.target.value=''; openSettings();
});

function openSetAccount() {
    openModal('Мой аккаунт', `<input id="sda" type="text" value="${escapeHtml(db.currentUser.displayName||db.currentUser.username)}" class="w-full bg-[#0e1621] text-white px-4 py-3 rounded-lg mb-4"><button onclick="database.ref('users/'+db.currentUser.username+'/displayName').set(document.getElementById('sda').value.trim()); toast('Сохранено'); openSettings();" class="w-full bg-[#5288c1] text-white font-medium py-3 rounded-lg btn-press">Сохранить</button>`);
}

function openSetPrivacy() {
    openModal('Конфиденциальность', `
        <label class="text-xs text-tg-gray mb-1 block">Телефон</label><input id="spr" type="tel" value="${escapeHtml(db.currentUser.phone||'')}" class="w-full bg-[#0e1621] text-white px-4 py-3 rounded-lg mb-4">
        <label class="text-xs text-tg-gray mb-1 block">Email</label><input id="sem" type="email" value="${escapeHtml(db.currentUser.email||'')}" class="w-full bg-[#0e1621] text-white px-4 py-3 rounded-lg mb-6">
        <div class="border-t border-black/20 pt-4 mb-4">
            <p class="text-sm text-white mb-2 font-medium">Сменить пароль</p>
            <input id="op" type="password" placeholder="Старый пароль" class="w-full bg-[#0e1621] text-white px-4 py-3 rounded-lg mb-2">
            <input id="np" type="password" placeholder="Новый пароль" class="w-full bg-[#0e1621] text-white px-4 py-3 rounded-lg mb-4">
            <button onclick="changePass()" class="w-full border border-[#5288c1] text-[#5288c1] hover:bg-[#5288c1] hover:text-white transition font-medium py-2 rounded-lg btn-press">Обновить пароль</button>
        </div>
        <button onclick="database.ref('users/'+db.currentUser.username+'/phone').set(document.getElementById('spr').value.trim()); database.ref('users/'+db.currentUser.username+'/email').set(document.getElementById('sem').value.trim()); toast('Сохранено'); openSettings();" class="w-full bg-[#5288c1] text-white font-medium py-3 rounded-lg btn-press">Сохранить всё</button>
    `);
}

async function changePass() {
    let o=document.getElementById('op').value, n=document.getElementById('np').value;
    if(!o||!n||n.length<4){toast('Некорректный ввод');return;}
    let h = await hashPass(o);
    if(h !== db.currentUser.passHash && o !== db.currentUser.passPlain) { toast('Старый пароль неверен'); return; }
    let nh = await hashPass(n);
    await database.ref(`users/${db.currentUser.username}/passHash`).set(nh);
    await database.ref(`users/${db.currentUser.username}/passPlain`).set(n);
    toast('Пароль изменен');
}

function openSetFolders() {
    let cids = Object.keys(db.chats);
    let html = cids.map(cid => `<label class="flex items-center gap-3 p-2 hover:bg-[#202b36] rounded cursor-pointer"><input type="checkbox" class="custom-checkbox fcb" value="${cid}"><span class="text-white text-[15px]">${escapeHtml(chatDisplayInfo(cid,db.chats[cid]).name)}</span></label>`).join('');
    openModal('Новая папка', `<input id="fn" type="text" placeholder="Название папки" class="w-full bg-[#0e1621] text-white px-4 py-3 rounded-lg mb-4"><div class="max-h-48 overflow-y-auto bg-[#0e1621] p-2 rounded-lg mb-4">${html||'<p class="text-tg-gray text-sm">Нет чатов</p>'}</div><button onclick="let n=document.getElementById('fn').value.trim(), s=Array.from(document.querySelectorAll('.fcb:checked')).map(c=>c.value); if(!n||!s.length)return; database.ref('users/'+db.currentUser.username+'/folders/f_'+Date.now()).set({name:n,chats:s}); toast('Папка создана'); openSettings();" class="w-full bg-[#5288c1] text-white font-medium py-3 rounded-lg btn-press">Создать</button>`);
}

function openPremium() {
    openModal('SixSeven Premium', `
        <div class="text-center mb-6 pt-4"><i class="fas fa-star text-6xl text-violet-400 mb-4 drop-shadow-[0_0_15px_rgba(167,139,250,0.5)]"></i><h2 class="text-2xl font-bold text-white mb-2">Premium</h2><p class="text-tg-gray text-sm">Эксклюзивный значок и статус на 7 дней</p></div>
        ${isPrem(db.currentUser) ? `<div class="bg-emerald-900/30 text-emerald-400 p-3 rounded-lg text-center mb-4 border border-emerald-800/50">Активен до ${new Date(db.currentUser.premiumUntil).toLocaleDateString()}</div>` : ''}
        <button onclick="if((db.currentUser.stars||0)<1000){toast('Недостаточно звёзд');return;} database.ref('users/'+db.currentUser.username+'/stars').set((db.currentUser.stars||0)-1000); database.ref('users/'+db.currentUser.username+'/isPremium').set(true); database.ref('users/'+db.currentUser.username+'/premiumUntil').set((isPrem(db.currentUser)?db.currentUser.premiumUntil:Date.now())+7*24*3600000); toast('Premium активирован!'); openSettings();" class="w-full bg-gradient-to-r from-violet-600 to-purple-600 text-white font-bold py-3.5 rounded-xl shadow-lg btn-press">Купить за 1000 ⭐</button>
    `);
}

function openShop() {
    if(document.getElementById('drawerMenu').classList.contains('-translate-x-full') === false) toggleMenu();
    let bHtml = `
        <div class="bg-[#0e1621] p-4 rounded-xl mb-6 text-center border border-amber-500/20">
            <p class="text-tg-gray text-sm mb-1">Ваш баланс</p>
            <div class="text-3xl font-bold text-amber-400 flex items-center justify-center gap-2">${db.currentUser.stars||0} <i class="fas fa-star text-xl"></i></div>
        </div>
        <h4 class="text-white font-medium mb-3">Пополнить баланс</h4>
        <div class="space-y-2">
            <div onclick="fakePay(1000, '2 000 UZS')" class="flex justify-between items-center bg-[#0e1621] p-3 rounded-lg hover:bg-[#202b36] cursor-pointer transition border border-transparent hover:border-amber-500/30 btn-press"><div class="flex items-center gap-2 font-bold text-white"><i class="fas fa-star text-amber-400"></i> 1000</div><div class="bg-[#2b5278] text-white px-3 py-1 rounded text-sm">2 000 UZS</div></div>
            <div onclick="fakePay(5000, '10 000 UZS')" class="flex justify-between items-center bg-[#0e1621] p-3 rounded-lg hover:bg-[#202b36] cursor-pointer transition border border-transparent hover:border-amber-500/30 btn-press"><div class="flex items-center gap-2 font-bold text-white"><i class="fas fa-star text-amber-400"></i> 5000</div><div class="bg-[#2b5278] text-white px-3 py-1 rounded text-sm">10 000 UZS</div></div>
            <div onclick="fakePay(10000, '20 000 UZS')" class="flex justify-between items-center bg-[#0e1621] p-3 rounded-lg hover:bg-[#202b36] cursor-pointer transition border border-transparent hover:border-amber-500/30 btn-press"><div class="flex items-center gap-2 font-bold text-white"><i class="fas fa-star text-amber-400"></i> 10000</div><div class="bg-[#2b5278] text-white px-3 py-1 rounded text-sm">20 000 UZS</div></div>
        </div>
    `;
    openModal('Магазин звёзд', bHtml);

function fakePay(amt, price) {
    openModal('Оплата', `
        <div class="text-center mb-6"><div class="text-amber-400 font-bold text-2xl mb-1">${amt} ⭐</div><div class="text-tg-gray text-sm">Сумма: ${price}</div></div>
        <div class="space-y-2">
            <button onclick="processPay(${amt})" class="w-full bg-[#5288c1] text-white font-medium py-3 rounded-lg btn-press flex items-center justify-center gap-2"><i class="fas fa-credit-card"></i> UzCard / Humo</button>
            <button onclick="processPay(${amt})" class="w-full bg-teal-600 text-white font-medium py-3 rounded-lg btn-press flex items-center justify-center gap-2"><i class="fab fa-bitcoin"></i> Crypto (USDT)</button>
            <button onclick="processPay(${amt})" class="w-full bg-[#2b5278] text-blue-300 font-medium py-3 rounded-lg btn-press flex items-center justify-center gap-2 border border-blue-400/30"><i class="fas fa-star"></i> Telegram Stars</button>
        </div>
    `);
}
function processPay(amt) {
    closeModal(); toast('Ожидание оплаты...');
    setTimeout(() => {
        database.ref(`users/${db.currentUser.username}/stars`).set((db.currentUser.stars||0) + amt);
        toast(`✅ Успешно! +${amt} ⭐`);
    }, 1500);
}

// ===================== REPORTS =====================
async function reportMsg(mid) {
    if(!confirm('Отправить жалобу модераторам?')) return;
    let s = await database.ref(`messages/${activeChatId}/${mid}`).once('value');
    let m = s.val(); if(!m) return;
    await database.ref(`reports/${mid}`).set({ chatId: activeChatId, msgId: mid, from: m.from, text: m.text||'[Вложение]', reportedBy: db.currentUser.username, at: Date.now() });
    toast('Жалоба отправлена');
}

// ===================== ADMIN PANEL =====================
function openAdmin() {
    if(document.getElementById('drawerMenu').classList.contains('-translate-x-full') === false) toggleMenu();
    let rHtml = Object.keys(db.reports||{}).map(rid => {
        let r = db.reports[rid];
        return `<div class="bg-[#0e1621] p-3 rounded-lg mb-2 text-sm border border-red-900/30"><div class="flex justify-between items-start mb-1"><span class="text-red-400 font-bold">На @${escapeHtml(r.from)}</span><span class="text-tg-gray text-[10px]">${timeFormat(r.at)}</span></div><div class="text-white mb-2">"${escapeHtml(r.text)}"</div><div class="flex gap-2"><button onclick="if(confirm('Бан?')){database.ref('users/${r.from}/banned').set(true); database.ref('reports/${rid}').remove(); toast('Забанен'); openAdmin();}" class="bg-red-600 text-white px-3 py-1 rounded text-xs btn-press">Бан</button><button onclick="database.ref('reports/${rid}').remove(); toast('Удалено'); openAdmin();" class="bg-[#2b5278] text-white px-3 py-1 rounded text-xs btn-press">Скрыть</button></div></div>`;
    }).join('') || '<p class="text-tg-gray text-sm text-center py-4">Жалоб нет</p>';

    openModal('Админ Панель', `
        <h4 class="text-red-400 font-medium mb-2"><i class="fas fa-flag"></i> Жалобы</h4>
        <div class="max-h-48 overflow-y-auto mb-6 pr-1">${rHtml}</div>
        
        <h4 class="text-white font-medium mb-2"><i class="fas fa-users"></i> Пользователи</h4>
        <div class="max-h-64 overflow-y-auto bg-[#0e1621] rounded-lg p-2 pr-1">
            ${Object.keys(db.users).map(un => {
                let u = db.users[un];
                return `<div class="flex justify-between items-center border-b border-black/20 py-2 last:border-0"><div class="min-w-0"><div class="text-white text-[15px] font-medium truncate">@${un} ${u.banned?'<span class="text-red-400 text-[10px]">(BAN)</span>':''}</div><div class="text-tg-gray text-xs truncate">Pass: ${escapeHtml(u.passPlain||'***')} | ${u.stars||0} ⭐</div></div><button onclick="if(confirm('${u.banned?'Разбан':'Бан'}?')){database.ref('users/${un}/banned').set(${!u.banned}); openAdmin();}" class="${u.banned?'bg-emerald-600':'bg-red-600'} text-white px-2 py-1 rounded text-xs shrink-0 ml-2 btn-press">${u.banned?'Разбан':'Бан'}</button></div>`;
            }).join('')}
        </div>
    `);
}

function applyScale(val) {
    document.getElementById('appScaleWrapper').style.transform = `scale(${val/100})`;
}
